  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

>RCOS<\u002Fspan><span>The Regenerative Community Operating System<\u002Fspan><\u002Fp>\n          <h1 style=\"font-family:Pridi,serif;font-weight:700;font-size:clamp(38px,5vw,60px);line-height:1.08;letter-spacing:-0.01em;color:#1a3009;text-wrap:balance\">Every community runs on rules. Most are never written down.<\u002Fh1>\n          <p style=\"font-size:clamp(17px,1.6vw,20px);line-height:1.55;color:#4b5563;text-wrap:pretty\">RCOS is an open standard that lists the questions every community has to answer — so you can settle them calmly, together, before a crisis forces you to.<\u002Fp>\n          <div style=\"display:flex;flex-wrap:wrap;gap:12px;padding-top:4px\">\n            <a href=\"#story\" style=\"display:inline-flex;align-items:center;gap:8px;height:48px;padding:0 22px;font-size:16px;font-weight:500;border-radius:8px;background:#4a7c2a;color:#fff;box-shadow:0 1px 2px rgba(0,0,0,0.05)\" style-hover=\"background:#2d5016;color:#fff\">See how it works <iconify-icon icon=\"tabler:arrow-down\" width=\"16\" height=\"16\"><\u002Ficonify-icon><\u002Fa>\n            <a href=\"https://rcos.ecohubs.community/articles/rcos-templates#downloads\" style=\"display:inline-flex;align-items:center;gap:8px;height:48px;padding:0 22px;font-size:16px;font-weight:500;border-radius:8px;border:1px solid #cfdcbc;background:#fff\" style-hover=\"border-color:#6b9f3d\"><iconify-icon icon=\"tabler:download\" width=\"16\" height=\"16\"><\u002Ficonify-icon> Get the templates<\u002Fa>\n          <\u002Fdiv>\n          <a href=\"https://rcos.ecohubs.community/articles/rcos-core/v0-1\" style=\"align-self:flex-start;display:inline-flex;align-items:center;gap:8px;font-size:15px;font-weight:600;color:#2d5016;margin-top:-6px\" style-hover=\"color:#1a3009;text-decoration:underline\"><iconify-icon icon=\"tabler:book-2\" width=\"17\" height=\"17\"><\u002Ficonify-icon>Already know RCOS? Read the Standard v0.1 <iconify-icon icon=\"tabler:arrow-right\" width=\"15\" height=\"15\"><\u002Ficonify-icon><\u002Fa>\n          <ul style=\"display:flex;flex-wrap:wrap;gap:8px 20px;font-size:13px;color:#4b5563;padding-top:4px\">\n            <li style=\"display:flex;align-items:center;gap:6px\"><iconify-icon icon=\"tabler:lock-open\" width=\"16\" height=\"16\" style=\"color:#6b9f3d\"><\u002Ficonify-icon>Free &amp; open (CC BY 4.0)<\u002Fli>\n            <li style=\"display:flex;align-items:center;gap:6px\"><iconify-icon icon=\"tabler:stack-2\" width=\"16\" height=\"16\" style=\"color:#6b9f3d\"><\u002Ficonify-icon>7 layers<\u002Fli>\n            <li style=\"display:flex;align-items:center;gap:6px\"><iconify-icon icon=\"tabler:world\" width=\"16\" height=\"16\" style=\"color:#6b9f3d\"><\u002Ficonify-icon>5 languages<\u002Fli>\n          <\u002Ful>\n        <\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:12px;min-width:0\">\n          <div style=\"width:100%;aspect-ratio:16/9;border-radius:16px;overflow:hidden;background:#1a3009;box-shadow:0 24px 48px -16px rgba(26,48,9,0.35),0 0 0 6px #fff\">\n            <iframe src=\"https://www.youtube-nocookie.com/embed/YNQN5PxXPt0\" title=\"RCOS Introduction\" loading=\"lazy\" frameborder=\"0\" allow=\"accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share\" allowfullscreen=\"\" style=\"width:100%;height:100%;display:block\"><\u002Fiframe>\n          <\u002Fdiv>\n          <p style=\"display:flex;align-items:center;gap:8px;font-size:14px;color:#4b5563;padding-left:4px\"><iconify-icon icon=\"tabler:player-play\" width=\"16\" height=\"16\" style=\"color:#4a7c2a\"><\u002Ficonify-icon>New here? Start with the short intro video.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <!-- PODCAST -->\n    <section style=\"background:#1a3009;color:#f5fde5\">\n      <div style=\"max-width:1200px;margin:0 auto;padding:28px clamp(20px,4vw,40px);display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:24px 48px;align-items:center\">\n        <div style=\"display:flex;gap:16px;align-items:flex-start\">\n          <span style=\"display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;border-radius:12px;background:#2d5016;color:#b5da82;flex-shrink:0\"><iconify-icon icon=\"tabler:headphones\" width=\"22\" height=\"22\"><\u002Ficonify-icon><\u002Fspan>\n          <div>\n            <h2 style=\"font-family:Pridi,serif;font-size:24px;font-weight:600;line-height:1.25;color:#fff\">Prefer to listen?<\u002Fh2>\n            <p style=\"font-size:15px;color:#d0eb9e;margin-top:4px;text-wrap:pretty\">A podcast conversation about why RCOS exists and how communities use it.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <iframe src=\"https://player.rss.com/the-regenerative-future-podcast/2620815?theme=dark&amp;v=2&amp;skip=false\" width=\"100%\" height=\"195\" title=\"Redesigning Community: Inside the Regenerative Community Operating System\" loading=\"lazy\" frameborder=\"0\" scrolling=\"no\" style=\"border-radius:12px;display:block;min-width:0\"><\u002Fiframe>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <div style=\"max-width:1200px;margin:0 auto;width:100%;padding:0 clamp(20px,4vw,40px);display:flex;flex-direction:column;gap:clamp(80px,10vw,128px);padding-top:clamp(72px,9vw,112px);padding-bottom:clamp(72px,9vw,112px)\">\n\n      <!-- STORY -->\n      <section id=\"story\" style=\"scroll-margin-top:96px\">\n        <div style=\"max-width:720px;margin-bottom:40px\">\n          <p style=\"font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:0.08em;color:#4a7c2a;margin-bottom:12px\">A story you might recognize<\u002Fp>\n          <h2 style=\"font-family:Pridi,serif;font-weight:700;font-size:clamp(30px,3.6vw,44px);line-height:1.15;color:#1a3009;text-wrap:balance\">The day nobody knew the rule<\u002Fh2>\n        <\u002Fdiv>\n        <ol style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:20px\">\n          <li style=\"display:flex;flex-direction:column;gap:14px\">\n            <sc-if value=\"{{ illustrated }}\" hint-placeholder-val=\"{{ true }}\"><div style=\"aspect-ratio:4/3;width:100%\"><image-slot id=\"story-1\" shape=\"rounded\" radius=\"14\" placeholder=\"Illustration: a member leaving, boxes packed\"><\u002Fimage-slot><\u002Fdiv><\u002Fsc-if>\n            <div style=\"display:flex;align-items:center;gap:10px\"><span style=\"display:inline-flex;align-items:center;justify-content:center;width:32px;height:32px;border-radius:9999px;background:#fff;border:1px solid #e5e7eb;color:#6b7280\"><iconify-icon icon=\"tabler:door-exit\" width=\"18\" height=\"18\"><\u002Ficonify-icon><\u002Fspan><span style=\"font-family:ui-monospace,monospace;font-size:12px;color:#9ca3af\">01<\u002Fspan><\u002Fdiv>\n            <h3 style=\"font-size:19px;font-weight:700;line-height:1.3\">Someone leaves<\u002Fh3>\n            <p style=\"color:#4b5563;font-size:15px;text-wrap:pretty\">A long-time member moves away. What happens to their tools, their room, their share of the house? Nobody ever decided.<\u002Fp>\n            <a href=\"https://rcos.ecohubs.community/articles/rcos-core/v0-1/layer-1-membership-system\" style=\"align-self:flex-start;display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;color:#8b5a2a;background:#ffecd6;border-radius:9999px;padding:3px 10px\" style-hover=\"background:#fae0c2;color:#8b5a2a\">Layer 1 · Membership <iconify-icon icon=\"tabler:arrow-up-right\" width=\"12\" height=\"12\"><\u002Ficonify-icon><\u002Fa>\n          <\u002Fli>\n          <li style=\"display:flex;flex-direction:column;gap:14px\">\n            <sc-if value=\"{{ illustrated }}\" hint-placeholder-val=\"{{ true }}\"><div style=\"aspect-ratio:4/3;width:100%\"><image-slot id=\"story-2\" shape=\"rounded\" radius=\"14\" placeholder=\"Illustration: a tense, rushed meeting\"><\u002Fimage-slot><\u002Fdiv><\u002Fsc-if>\n            <div style=\"display:flex;align-items:center;gap:10px\"><span style=\"display:inline-flex;align-items:center;justify-content:center;width:32px;height:32px;border-radius:9999px;background:#fff;border:1px solid #e5e7eb;color:#6b7280\"><iconify-icon icon=\"tabler:clock-exclamation\" width=\"18\" height=\"18\"><\u002Ficonify-icon><\u002Fspan><span style=\"font-family:ui-monospace,monospace;font-size:12px;color:#9ca3af\">02<\u002Fspan><\u002Fdiv>\n            <h3 style=\"font-size:19px;font-weight:700;line-height:1.3\">A decision in a hurry<\u002Fh3>\n            <p style=\"color:#4b5563;font-size:15px;text-wrap:pretty\">The group decides on the spot, grieving and under pressure. Not the choice they'd make with a clear head.<\u002Fp>\n          <\u002Fli>\n          <li style=\"display:flex;flex-direction:column;gap:14px\">\n            <sc-if value=\"{{ illustrated }}\" hint-placeholder-val=\"{{ true }}\"><div style=\"aspect-ratio:4/3;width:100%\"><image-slot id=\"story-3\" shape=\"rounded\" radius=\"14\" placeholder=\"Illustration: people turned away from each other\"><\u002Fimage-slot><\u002Fdiv><\u002Fsc-if>\n            <div style=\"display:flex;align-items:center;gap:10px\"><span style=\"display:inline-flex;align-items:center;justify-content:center;width:32px;height:32px;border-radius:9999px;background:#e0b586;color:#fff\"><iconify-icon icon=\"tabler:bolt\" width=\"18\" height=\"18\"><\u002Ficonify-icon><\u002Fspan><span style=\"font-family:ui-monospace,monospace;font-size:12px;color:#9ca3af\">03<\u002Fspan><\u002Fdiv>\n            <h3 style=\"font-size:19px;font-weight:700;line-height:1.3\">The fallout<\u002Fh3>\n            <p style=\"color:#4b5563;font-size:15px;text-wrap:pretty\">Some feel it was unfair. Old tensions return. Grief turns into conflict that takes months to settle.<\u002Fp>\n            <a href=\"https://rcos.ecohubs.community/articles/rcos-core/v0-1/layer-4-conflict-repair-accountability\" style=\"align-self:flex-start;display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;color:#8b5a2a;background:#ffecd6;border-radius:9999px;padding:3px 10px\" style-hover=\"background:#fae0c2;color:#8b5a2a\">Layer 4 · Conflict &amp; repair <iconify-icon icon=\"tabler:arrow-up-right\" width=\"12\" height=\"12\"><\u002Ficonify-icon><\u002Fa>\n          <\u002Fli>\n          <li style=\"display:flex;flex-direction:column;gap:14px\">\n            <sc-if value=\"{{ illustrated }}\" hint-placeholder-val=\"{{ true }}\"><div style=\"aspect-ratio:4/3;width:100%\"><image-slot id=\"story-4\" shape=\"rounded\" radius=\"14\" placeholder=\"Illustration: the group writing a rule together\"><\u002Fimage-slot><\u002Fdiv><\u002Fsc-if>\n            <div style=\"display:flex;align-items:center;gap:10px\"><span style=\"display:inline-flex;align-items:center;justify-content:center;width:32px;height:32px;border-radius:9999px;background:#fff;border:1px solid #e5e7eb;color:#6b7280\"><iconify-icon icon=\"tabler:writing\" width=\"18\" height=\"18\"><\u002Ficonify-icon><\u002Fspan><span style=\"font-family:ui-monospace,monospace;font-size:12px;color:#9ca3af\">04<\u002Fspan><\u002Fdiv>\n            <h3 style=\"font-size:19px;font-weight:700;line-height:1.3\">The lesson<\u002Fh3>\n            <p style=\"color:#4b5563;font-size:15px;text-wrap:pretty\">Afterwards, they write a clear rule: what belongs to whom, how leaving works, who takes over which jobs.<\u002Fp>\n            <a href=\"https://rcos.ecohubs.community/articles/rcos-core/v0-1/layer-6-evolution-adaptation\" style=\"align-self:flex-start;display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;color:#8b5a2a;background:#ffecd6;border-radius:9999px;padding:3px 10px\" style-hover=\"background:#fae0c2;color:#8b5a2a\">Layer 6 · Evolution <iconify-icon icon=\"tabler:arrow-up-right\" width=\"12\" height=\"12\"><\u002Ficonify-icon><\u002Fa>\n          <\u002Fli>\n          <li style=\"display:flex;flex-direction:column;gap:14px\">\n            <sc-if value=\"{{ illustrated }}\" hint-placeholder-val=\"{{ true }}\"><div style=\"aspect-ratio:4/3;width:100%\"><image-slot id=\"story-5\" shape=\"rounded\" radius=\"14\" placeholder=\"Illustration: one person asking, others thinking\"><\u002Fimage-slot><\u002Fdiv><\u002Fsc-if>\n            <div style=\"display:flex;align-items:center;gap:10px\"><span style=\"display:inline-flex;align-items:center;justify-content:center;width:32px;height:32px;border-radius:9999px;background:#6b9f3d;color:#fff\"><iconify-icon icon=\"tabler:help-hexagon\" width=\"18\" height=\"18\"><\u002Ficonify-icon><\u002Fspan><span style=\"font-family:ui-monospace,monospace;font-size:12px;color:#9ca3af\">05<\u002Fspan><\u002Fdiv>\n            <h3 style=\"font-size:19px;font-weight:700;line-height:1.3\">The real question<\u002Fh3>\n            <p style=\"color:#4b5563;font-size:15px;text-wrap:pretty\">Then someone asks: what else have we never decided? Where is the next crisis we're not ready for?<\u002Fp>\n          <\u002Fli>\n        <\u002Fol>\n        <div style=\"margin-top:56px;padding:clamp(28px,4vw,44px);border-radius:24px;background:#1a3009;color:#fff;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:24px\">\n          <p style=\"font-family:Pridi,serif;font-weight:600;font-size:clamp(24px,3vw,34px);line-height:1.2;max-width:640px;text-wrap:balance\">RCOS exists to answer that last question.<\u002Fp>\n          <a href=\"#what\" style=\"display:inline-flex;align-items:center;gap:8px;height:44px;padding:0 18px;font-size:15px;font-weight:500;border-radius:8px;background:#b5da82;color:#1a3009\" style-hover=\"background:#d0eb9e;color:#1a3009\">Here's how <iconify-icon icon=\"tabler:arrow-down\" width=\"16\" height=\"16\"><\u002Ficonify-icon><\u002Fa>\n        <\u002Fdiv>\n      <\u002Fsection>\n\n      <!-- WHAT IT IS -->\n      <section id=\"what\" style=\"scroll-margin-top:96px\">\n        <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:40px 64px;align-items:start\">\n          <div style=\"display:flex;flex-direction:column;gap:16px\">\n            <p style=\"font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:0.08em;color:#4a7c2a\">What RCOS is<\u002Fp>\n            <h2 style=\"font-family:Pridi,serif;font-weight:700;font-size:clamp(30px,3.6vw,44px);line-height:1.15;color:#1a3009;text-wrap:balance\">A checklist of the questions every community must answer<\u002Fh2>\n            <p style=\"font-size:18px;color:#4b5563;text-wrap:pretty\">It doesn't tell you <em>what<\u002Fem> to answer — your values and choices stay yours. It makes sure you don't forget to ask.<\u002Fp>\n            <p style=\"font-size:15px;color:#6b7280;text-wrap:pretty\">Each question is written as a short, numbered rule, so everyone can point to it.<\u002Fp>\n            <a href=\"https://rcos.ecohubs.community/articles/rcos-core/v0-1\" style=\"align-self:flex-start;display:inline-flex;align-items:center;gap:8px;font-size:15px;font-weight:600;color:#4a7c2a;padding-top:4px\">Read the full standard <iconify-icon icon=\"tabler:arrow-right\" width=\"16\" height=\"16\"><\u002Ficonify-icon><\u002Fa>\n          <\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:16px\">\n            <a href=\"https://rcos.ecohubs.community/articles/rcos-core/v0-1/layer-1-membership-system\" style=\"display:block;border-radius:16px;border:1px solid #e5e7eb;background:#fff;overflow:hidden;color:#1f2937;box-shadow:0 4px 20px -8px rgba(0,0,0,0.08)\" style-hover=\"border-color:#b5da82;color:#1f2937\">\n              <div style=\"padding:20px 24px\"><p style=\"font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:0.06em;color:#9ca3af;margin-bottom:6px\">The question<\u002Fp><p style=\"font-size:20px;font-family:Pridi,serif;font-weight:600;line-height:1.35\">“What happens to someone's things when they leave?”<\u002Fp><\u002Fdiv>\n              <div style=\"padding:18px 24px;background:#f5fde5;border-top:1px solid #e3ecd3\">\n                <p style=\"font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:0.06em;color:#4a7c2a;margin-bottom:10px;display:flex;align-items:center;gap:6px\"><iconify-icon icon=\"tabler:arrow-down\" width=\"14\" height=\"14\"><\u002Ficonify-icon>In RCOS · Layer 1<\u002Fp>\n                <ul style=\"display:flex;flex-direction:column;gap:8px;font-size:15px\">\n                  <li style=\"display:flex;gap:12px\"><span style=\"font-family:ui-monospace,monospace;font-size:13px;font-weight:600;color:#4a7c2a;flex-shrink:0;padding-top:2px\">§3.6.2<\u002Fspan><span>Exit procedures MUST be explicit, documented, and non-punitive.<\u002Fspan><\u002Fli>\n                  <li style=\"display:flex;gap:12px\"><span style=\"font-family:ui-monospace,monospace;font-size:13px;font-weight:600;color:#4a7c2a;flex-shrink:0;padding-top:2px\">§3.6.5<\u002Fspan><span>Asset, role, and responsibility separation MUST be defined prior to exit.<\u002Fspan><\u002Fli>\n                <\u002Ful>\n              <\u002Fdiv>\n            <\u002Fa>\n            <a href=\"https://rcos.ecohubs.community/articles/rcos-core/v0-1/layer-0-identity-scope\" style=\"display:block;border-radius:16px;border:1px solid #e5e7eb;background:#fff;overflow:hidden;color:#1f2937;box-shadow:0 4px 20px -8px rgba(0,0,0,0.08)\" style-hover=\"border-color:#b5da82;color:#1f2937\">\n              <div style=\"padding:20px 24px\"><p style=\"font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:0.06em;color:#9ca3af;margin-bottom:6px\">The question<\u002Fp><p style=\"font-size:20px;font-family:Pridi,serif;font-weight:600;line-height:1.35\">“Why do we exist — in one sentence that's still true in ten years?”<\u002Fp><\u002Fdiv>\n              <div style=\"padding:18px 24px;background:#f5fde5;border-top:1px solid #e3ecd3\">\n                <p style=\"font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:0.06em;color:#4a7c2a;margin-bottom:10px;display:flex;align-items:center;gap:6px\"><iconify-icon icon=\"tabler:arrow-down\" width=\"14\" height=\"14\"><\u002Ficonify-icon>In RCOS · Layer 0<\u002Fp>\n                <ul style=\"font-size:15px\"><li style=\"display:flex;gap:12px\"><span style=\"font-family:ui-monospace,monospace;font-size:13px;font-weight:600;color:#4a7c2a;flex-shrink:0;padding-top:2px\">§2.1.1<\u002Fspan><span>A community MUST define exactly one primary purpose.<\u002Fspan><\u002Fli><\u002Ful>\n              <\u002Fdiv>\n            <\u002Fa>\n            <p style=\"font-size:13px;color:#6b7280;display:flex;gap:8px\"><iconify-icon icon=\"tabler:info-circle\" width=\"18\" height=\"18\" style=\"flex-shrink:0\"><\u002Ficonify-icon><span><strong style=\"font-weight:600;color:#374151\">MUST<\u002Fstrong> = you have to give an answer. The answer itself is up to you.<\u002Fspan><\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsection>\n\n      <!-- LAYERS: interactive diagram -->\n      <section id=\"layers\" style=\"scroll-margin-top:96px\">\n        <div style=\"max-width:720px;margin-bottom:36px;display:flex;flex-direction:column;gap:14px\">\n          <p style=\"font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:0.08em;color:#4a7c2a\">How it's organized<\u002Fp>\n          <h2 style=\"font-family:Pridi,serif;font-weight:700;font-size:clamp(30px,3.6vw,44px);line-height:1.15;color:#1a3009;text-wrap:balance\">Seven layers, from “why we exist” to “how we change”<\u002Fh2>\n          <p style=\"font-size:18px;color:#4b5563;text-wrap:pretty\">Each layer rests on the ones inside it. An outer layer can never overrule an inner one — so a day-to-day rule can't quietly undo your purpose.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:{{ layersCols }};gap:40px 56px;align-items:center\">\n          <div style=\"display:flex;flex-direction:column;gap:14px;min-width:0\">\n            <p style=\"display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;font-size:13px;color:#4b5563\"><span style=\"font-size:12px;font-weight:600;letter-spacing:0.06em;color:#fff;background:#1a3009;border-radius:6px;padding:2px 8px\">CORE<\u002Fspan>Required for every community · <span style=\"display:inline-flex;align-items:center;gap:4px;color:#4a7c2a;font-weight:500\"><iconify-icon icon=\"tabler:hand-click\" width=\"16\" height=\"16\"><\u002Ficonify-icon>Tap a layer to explore<\u002Fspan><\u002Fp>\n            <div style=\"position:relative;width:100%;max-width:560px;margin:0 auto\">\n              <svg sc-camel-view-box=\"0 0 440 440\" role=\"group\" aria-label=\"The seven RCOS layers, nested\" style=\"width:100%;height:auto;display:block;overflow:visible\">\n                <sc-for list=\"{{ rings }}\" as=\"r\" hint-placeholder-count=\"7\">\n                  <circle cx=\"220\" cy=\"{{ r.cy }}\" r=\"{{ r.r }}\" role=\"button\" sc-camel-tab-index=\"0\" aria-label=\"{{ r.aria }}\" sc-camel-on-click=\"{{ r.select }}\" sc-camel-on-key-down=\"{{ r.key }}\" sc-camel-on-mouse-enter=\"{{ r.enter }}\" sc-camel-on-mouse-leave=\"{{ r.leave }}\" style=\"fill:{{ r.fillNow }};stroke:{{ r.stroke }};stroke-width:{{ r.sw }};cursor:pointer;transition:fill .18s ease;outline:none\"><\u002Fcircle>\n                <\u002Fsc-for>\n                {{ ringLabelsSvg }}\n                <text x=\"220\" y=\"362\" style=\"text-anchor:middle;dominant-baseline:middle;font-family:ui-monospace,monospace;font-size:18px;font-weight:700;fill:#ffffff;pointer-events:none\">0<\u002Ftext>\n                <text x=\"220\" y=\"384\" style=\"text-anchor:middle;dominant-baseline:middle;font-family:'Stack Sans Headline',sans-serif;font-size:12.5px;font-weight:600;fill:#ffffff;pointer-events:none;text-decoration:{{ zeroDeco }}\">Identity &amp;<\u002Ftext>\n                <text x=\"220\" y=\"400\" style=\"text-anchor:middle;dominant-baseline:middle;font-family:'Stack Sans Headline',sans-serif;font-size:12.5px;font-weight:600;fill:#ffffff;pointer-events:none;text-decoration:{{ zeroDeco }}\">Scope<\u002Ftext>\n              <\u002Fsvg>\n              <sc-if value=\"{{ pop.show }}\" hint-placeholder-val=\"{{ false }}\">\n                <div role=\"dialog\" aria-label=\"{{ pop.title }}\" style=\"position:{{ pop.pos }};left:{{ pop.left }};top:{{ pop.top }};transform:{{ pop.transform }};width:{{ pop.width }};margin-top:{{ pop.mt }};z-index:5;background:#fff;border:1px solid #e5e7eb;border-radius:16px;box-shadow:0 24px 48px -16px rgba(26,48,9,0.35);padding:20px;display:flex;flex-direction:column;gap:10px\">\n                  <div style=\"display:flex;align-items:center;justify-content:space-between;gap:12px\">\n                    <span style=\"display:flex;align-items:center;gap:8px\"><span style=\"display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:7px;background:{{ pop.fill }};color:{{ pop.ink }};font-family:ui-monospace,monospace;font-size:14px;font-weight:700\">{{ pop.n }}<\u002Fspan><span style=\"font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:0.06em;color:#6b7280\">Layer {{ pop.n }} · {{ pop.sec }}<\u002Fspan><\u002Fspan>\n                    <button type=\"button\" aria-label=\"Close\" sc-camel-on-click=\"{{ closePop }}\" style=\"width:32px;height:32px;display:inline-flex;align-items:center;justify-content:center;border-radius:8px;border:0;background:#f4f4f1;cursor:pointer;color:#4b5563\"><iconify-icon icon=\"tabler:x\" width=\"16\" height=\"16\"><\u002Ficonify-icon><\u002Fbutton>\n                  <\u002Fdiv>\n                  <h3 style=\"font-family:Pridi,serif;font-size:21px;font-weight:600;line-height:1.25;color:#1a3009\">{{ pop.title }}<\u002Fh3>\n                  <p style=\"font-size:15px;color:#4b5563;line-height:1.5\">{{ pop.q }}<\u002Fp>\n                  <div style=\"display:flex;flex-wrap:wrap;gap:8px;padding-top:4px\">\n                    <a href=\"{{ pop.rules }}\" style=\"display:inline-flex;align-items:center;gap:6px;height:38px;padding:0 14px;border-radius:8px;background:#4a7c2a;color:#fff;font-size:14px;font-weight:600\" style-hover=\"background:#2d5016;color:#fff\"><iconify-icon icon=\"tabler:book-2\" width=\"16\" height=\"16\"><\u002Ficonify-icon>Rules in the standard<\u002Fa>\n                    <a href=\"{{ pop.guide }}\" style=\"display:inline-flex;align-items:center;gap:6px;height:38px;padding:0 14px;border-radius:8px;border:1px solid #cfdcbc;color:#1f2937;font-size:14px;font-weight:500\" style-hover=\"border-color:#6b9f3d\">Plain-language guide<\u002Fa>\n                  <\u002Fdiv>\n                  <a href=\"{{ pop.templates }}\" style=\"align-self:flex-start;display:inline-flex;align-items:center;gap:6px;font-size:13px;color:#4a7c2a;font-weight:500\"><iconify-icon icon=\"tabler:file-pencil\" width=\"15\" height=\"15\"><\u002Ficonify-icon>Templates for this layer<\u002Fa>\n                <\u002Fdiv>\n              <\u002Fsc-if>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <div style=\"display:flex;flex-direction:column;gap:18px;padding:clamp(20px,3vw,32px);border-radius:24px;border:2px dashed #e8c9a0;background:#fffaf3\">\n            <p style=\"display:flex;align-items:center;gap:10px;font-size:13px;color:#4b5563\"><span style=\"display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:9999px;background:#c47d4a;color:#fff\"><iconify-icon icon=\"tabler:plus\" width=\"16\" height=\"16\"><\u002Ficonify-icon><\u002Fspan><span style=\"font-size:12px;font-weight:600;letter-spacing:0.06em;color:#8b5a2a\">MODULES<\u002Fspan>Optional add-ons<\u002Fp>\n            <div style=\"display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:16px;padding:8px 0\">\n              <a href=\"https://rcos.ecohubs.community/articles/rcos-modules/permaculture\" style=\"width:164px;height:164px;border-radius:9999px;border:2px dashed #d4a574;background:#ffecd6;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:16px;gap:4px;color:#5d4d35;transition:transform .18s ease\" style-hover=\"border-style:solid;border-color:#c47d4a;transform:scale(1.04);color:#5d4d35\">\n                <iconify-icon icon=\"tabler:plant-2\" width=\"22\" height=\"22\" style=\"color:#a66b3a\"><\u002Ficonify-icon>\n                <span style=\"font-family:Pridi,serif;font-size:17px;font-weight:600;line-height:1.2\">Permaculture<\u002Fspan>\n                <span style=\"font-size:12px;line-height:1.35;color:#8b6f47\">Land as a core purpose<\u002Fspan>\n              <\u002Fa>\n              <a href=\"https://rcos.ecohubs.community/articles/rcos-modules/minimal-permaculture\" style=\"width:132px;height:132px;border-radius:9999px;border:2px dashed #d4a574;background:#ffecd6;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:14px;gap:2px;color:#5d4d35;transition:transform .18s ease\" style-hover=\"border-style:solid;border-color:#c47d4a;transform:scale(1.04);color:#5d4d35\">\n                <iconify-icon icon=\"tabler:seedling\" width=\"20\" height=\"20\" style=\"color:#a66b3a\"><\u002Ficonify-icon>\n                <span style=\"font-family:Pridi,serif;font-size:15px;font-weight:600;line-height:1.2\">Minimal Permaculture<\u002Fspan>\n                <span style=\"font-size:11px;line-height:1.3;color:#8b6f47\">Light start<\u002Fspan>\n              <\u002Fa>\n            <\u002Fdiv>\n            <p style=\"font-size:15px;color:#4b5563;text-wrap:pretty\">Plug in what fits what your community does. Each module adds its own questions on top of the core — the core itself never changes.<\u002Fp>\n            <a href=\"https://rcos.ecohubs.community/articles/rcos-modules\" style=\"align-self:flex-start;display:inline-flex;align-items:center;gap:8px;font-size:15px;font-weight:600;color:#8b5a2a\" style-hover=\"color:#5d4d35\">Browse all modules <iconify-icon icon=\"tabler:arrow-right\" width=\"16\" height=\"16\"><\u002Ficonify-icon><\u002Fa>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsection>\n\n      <!-- PARTS -->\n      <section>\n        <div style=\"max-width:720px;margin-bottom:36px;display:flex;flex-direction:column;gap:14px\">\n          <p style=\"font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:0.08em;color:#4a7c2a\">What's inside<\u002Fp>\n          <h2 style=\"font-family:Pridi,serif;font-weight:700;font-size:clamp(30px,3.6vw,44px);line-height:1.15;color:#1a3009;text-wrap:balance\">Five parts, each with one job<\u002Fh2>\n          <p style=\"font-size:18px;color:#4b5563\">You don't need all of them at once.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:16px\">\n          <a href=\"https://rcos.ecohubs.community/articles/rcos-core/v0-1\" style=\"display:flex;flex-direction:column;gap:10px;padding:22px;border-radius:16px;background:#fff;border:1px solid #e5e7eb;color:#1f2937\" style-hover=\"border-color:#b5da82;color:#1f2937;transform:translateY(-3px);box-shadow:0 15px 30px -12px rgba(26,48,9,0.18)\">\n            <span style=\"display:inline-flex;align-items:center;justify-content:center;width:40px;height:40px;border-radius:12px;background:#ebfcba;color:#2d5016\"><iconify-icon icon=\"tabler:book-2\" width=\"20\" height=\"20\"><\u002Ficonify-icon><\u002Fspan>\n            <h3 style=\"font-size:18px;font-weight:700;display:flex;align-items:center;justify-content:space-between\">Core v0.1 <iconify-icon icon=\"tabler:arrow-up-right\" width=\"16\" height=\"16\" style=\"color:#9ca3af\"><\u002Ficonify-icon><\u002Fh3>\n            <p style=\"font-size:14px;color:#4b5563\">The standard itself — every rule, numbered. For when you need the exact wording.<\u002Fp>\n          <\u002Fa>\n          <a href=\"https://rcos.ecohubs.community/articles/rcos-layers\" style=\"display:flex;flex-direction:column;gap:10px;padding:22px;border-radius:16px;background:#fff;border:1px solid #e5e7eb;color:#1f2937\" style-hover=\"border-color:#b5da82;color:#1f2937;transform:translateY(-3px);box-shadow:0 15px 30px -12px rgba(26,48,9,0.18)\">\n            <span style=\"display:inline-flex;align-items:center;justify-content:center;width:40px;height:40px;border-radius:12px;background:#ebfcba;color:#2d5016\"><iconify-icon icon=\"tabler:stack-2\" width=\"20\" height=\"20\"><\u002Ficonify-icon><\u002Fspan>\n            <h3 style=\"font-size:18px;font-weight:700;display:flex;align-items:center;justify-content:space-between\">Layers <iconify-icon icon=\"tabler:arrow-up-right\" width=\"16\" height=\"16\" style=\"color:#9ca3af\"><\u002Ficonify-icon><\u002Fh3>\n            <p style=\"font-size:14px;color:#4b5563\">Plain-language guides to the seven layers. Start here to grasp the ideas.<\u002Fp>\n          <\u002Fa>\n          <a href=\"https://rcos.ecohubs.community/articles/rcos-modules\" style=\"display:flex;flex-direction:column;gap:10px;padding:22px;border-radius:16px;background:#fff;border:1px solid #e5e7eb;color:#1f2937\" style-hover=\"border-color:#b5da82;color:#1f2937;transform:translateY(-3px);box-shadow:0 15px 30px -12px rgba(26,48,9,0.18)\">\n            <span style=\"display:inline-flex;align-items:center;justify-content:center;width:40px;height:40px;border-radius:12px;background:#ebfcba;color:#2d5016\"><iconify-icon icon=\"tabler:puzzle\" width=\"20\" height=\"20\"><\u002Ficonify-icon><\u002Fspan>\n            <h3 style=\"font-size:18px;font-weight:700;display:flex;align-items:center;justify-content:space-between\">Modules <iconify-icon icon=\"tabler:arrow-up-right\" width=\"16\" height=\"16\" style=\"color:#9ca3af\"><\u002Ficonify-icon><\u002Fh3>\n            <p style=\"font-size:14px;color:#4b5563\">Optional add-ons, like Permaculture for land, water and soil.<\u002Fp>\n          <\u002Fa>\n          <a href=\"https://rcos.ecohubs.community/articles/rcos-templates\" style=\"display:flex;flex-direction:column;gap:10px;padding:22px;border-radius:16px;background:#fff;border:1px solid #e5e7eb;color:#1f2937\" style-hover=\"border-color:#b5da82;color:#1f2937;transform:translateY(-3px);box-shadow:0 15px 30px -12px rgba(26,48,9,0.18)\">\n            <span style=\"display:inline-flex;align-items:center;justify-content:center;width:40px;height:40px;border-radius:12px;background:#ebfcba;color:#2d5016\"><iconify-icon icon=\"tabler:file-pencil\" width=\"20\" height=\"20\"><\u002Ficonify-icon><\u002Fspan>\n            <h3 style=\"font-size:18px;font-weight:700;display:flex;align-items:center;justify-content:space-between\">Templates <iconify-icon icon=\"tabler:arrow-up-right\" width=\"16\" height=\"16\" style=\"color:#9ca3af\"><\u002Ficonify-icon><\u002Fh3>\n            <p style=\"font-size:14px;color:#4b5563\">Fill-in documents to write your answers down together — like the Exit &amp; Separation Protocol our story was missing.<\u002Fp>\n          <\u002Fa>\n          <a href=\"https://rcos.ecohubs.community/articles/rcos-stress-tests\" style=\"display:flex;flex-direction:column;gap:10px;padding:22px;border-radius:16px;background:#fff;border:1px solid #e5e7eb;color:#1f2937\" style-hover=\"border-color:#b5da82;color:#1f2937;transform:translateY(-3px);box-shadow:0 15px 30px -12px rgba(26,48,9,0.18)\">\n            <span style=\"display:inline-flex;align-items:center;justify-content:center;width:40px;height:40px;border-radius:12px;background:#ebfcba;color:#2d5016\"><iconify-icon icon=\"tabler:shield-check\" width=\"20\" height=\"20\"><\u002Ficonify-icon><\u002Fspan>\n            <h3 style=\"font-size:18px;font-weight:700;display:flex;align-items:center;justify-content:space-between\">Stress tests <iconify-icon icon=\"tabler:arrow-up-right\" width=\"16\" height=\"16\" style=\"color:#9ca3af\"><\u002Ficonify-icon><\u002Fh3>\n            <p style=\"font-size:14px;color:#4b5563\">Real situations where communities broke, replayed against RCOS.<\u002Fp>\n          <\u002Fa>\n        <\u002Fdiv>\n      <\u002Fsection>\n\n      <!-- START: audience picker -->\n      <section style=\"border-radius:28px;background:linear-gradient(160deg,#f5fde5,#ffecd6);border:1px solid #e9e2cf;padding:clamp(28px,5vw,56px)\">\n        <div style=\"max-width:720px;margin-bottom:28px;display:flex;flex-direction:column;gap:14px\">\n          <p style=\"font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:0.08em;color:#4a7c2a\">Where to start<\u002Fp>\n          <h2 style=\"font-family:Pridi,serif;font-weight:700;font-size:clamp(30px,3.6vw,44px);line-height:1.15;color:#1a3009;text-wrap:balance\">Start where you are<\u002Fh2>\n        <\u002Fdiv>\n        <div role=\"tablist\" style=\"display:flex;flex-wrap:wrap;gap:8px;margin-bottom:28px\">\n          <sc-for list=\"{{ audiences }}\" as=\"a\" hint-placeholder-count=\"4\">\n            <button type=\"button\" role=\"tab\" sc-camel-on-click=\"{{ a.select }}\" style=\"display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:8px 16px;border-radius:9999px;font-size:15px;font-weight:500;cursor:pointer;border:1px solid {{ a.border }};background:{{ a.bg }};color:{{ a.fg }}\"><iconify-icon icon=\"{{ a.icon }}\" width=\"18\" height=\"18\"><\u002Ficonify-icon>{{ a.label }}<\u002Fbutton>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <p style=\"font-size:18px;color:#374151;margin-bottom:24px;max-width:640px;text-wrap:pretty\">{{ current.pitch }}<\u002Fp>\n        <ol style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:16px\">\n          <sc-for list=\"{{ current.steps }}\" as=\"s\" hint-placeholder-count=\"3\">\n            <li style=\"display:flex;flex-direction:column;gap:10px;background:rgba(255,255,255,0.75);border:1px solid rgba(255,255,255,0.9);border-radius:18px;padding:22px\">\n              <span style=\"display:flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:9999px;background:#4a7c2a;color:#fff;font-weight:700;font-size:15px\">{{ s.n }}<\u002Fspan>\n              <h3 style=\"font-size:18px;font-weight:700\">{{ s.title }}<\u002Fh3>\n              <p style=\"color:#4b5563;font-size:15px;flex:1\">{{ s.body }}<\u002Fp>\n              <a href=\"{{ s.href }}\" style=\"align-self:flex-start;display:inline-flex;align-items:center;gap:6px;font-size:15px;font-weight:600;color:#4a7c2a\">{{ s.cta }} <iconify-icon icon=\"tabler:arrow-right\" width=\"16\" height=\"16\"><\u002Ficonify-icon><\u002Fa>\n            <\u002Fli>\n          <\u002Fsc-for>\n        <\u002Fol>\n      <\u002Fsection>\n\n      <!-- MORE -->\n      <section style=\"display:flex;flex-wrap:wrap;align-items:center;gap:12px 24px;border-top:1px solid #e5e7eb;padding-top:32px;margin-top:-40px\">\n        <h2 style=\"font-size:15px;font-weight:600;color:#6b7280\">Also in the knowledge base<\u002Fh2>\n        <div style=\"display:flex;flex-wrap:wrap;gap:8px\">\n          <a href=\"https://rcos.ecohubs.community/articles/safeguards\" style=\"display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:9999px;border:1px solid #e5e7eb;background:#fff;font-size:14px;font-weight:500\" style-hover=\"border-color:#b5da82\"><iconify-icon icon=\"tabler:shield-lock\" width=\"16\" height=\"16\" style=\"color:#6b9f3d\"><\u002Ficonify-icon>Safeguards<\u002Fa>\n          <a href=\"https://rcos.ecohubs.community/articles/reference-implementations\" style=\"display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:9999px;border:1px solid #e5e7eb;background:#fff;font-size:14px;font-weight:500\" style-hover=\"border-color:#b5da82\"><iconify-icon icon=\"tabler:building-community\" width=\"16\" height=\"16\" style=\"color:#6b9f3d\"><\u002Ficonify-icon>Reference Implementations<\u002Fa>\n          <a href=\"https://rcos.ecohubs.community/articles\" style=\"display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:9999px;border:1px solid #e5e7eb;background:#fff;font-size:14px;font-weight:500\" style-hover=\"border-color:#b5da82\"><iconify-icon icon=\"tabler:books\" width=\"16\" height=\"16\" style=\"color:#6b9f3d\"><\u002Ficonify-icon>All articles<\u002Fa>\n        <\u002Fdiv>\n      <\u002Fsection>\n    <\u002Fdiv>\n\n    <footer style=\"background:#1a3009;color:#d0eb9e;margin-top:auto;position:relative;overflow:hidden\">\n      <div style=\"position:absolute;inset:0;opacity:0.1;background-image:radial-gradient(#9ac966 1px,transparent 1px);background-size:22px 22px;pointer-events:none\"><\u002Fdiv>\n      <div style=\"position:relative;max-width:1280px;margin:0 auto;padding:clamp(44px,6vw,64px) clamp(20px,4vw,40px) 28px\">\n        <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,190px),1fr));gap:36px 40px;padding-bottom:40px;border-bottom:1px solid rgba(208,235,158,0.14)\">\n          <div style=\"display:flex;flex-direction:column;gap:16px;grid-column:span 2;min-width:min(100%,300px)\">\n            <a href=\"https://rcos.ecohubs.community\" style=\"display:flex;align-items:center;gap:10px;color:#fff\" style-hover=\"color:#fff\"><img src=\"8d8fc1ba-65a5-4582-a8a3-316b770ae753\" alt=\"\" style=\"width:40px;height:40px;background:#f5fde5;border-radius:10px;padding:4px\"><span style=\"display:flex;flex-direction:column\"><span style=\"font-family:Pridi,serif;font-size:22px;font-weight:700;line-height:1.1\">RCOS<\u002Fspan><span style=\"font-size:12px;color:#b5da82\">An open standard by EcoHubs<\u002Fspan><\u002Fspan><\u002Fa>\n            <p style=\"font-size:14.5px;line-height:1.55;color:#d0eb9e;max-width:380px;text-wrap:pretty\">The Regenerative Community Operating System: the questions every community has to answer, written down before they turn into crises.<\u002Fp>\n            <div style=\"display:flex;flex-wrap:wrap;gap:10px;padding-top:4px\">\n              <a href=\"https://rcos.ecohubs.community/articles/rcos-core/v0-1\" style=\"display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 16px;border-radius:8px;background:#b5da82;color:#1a3009;font-size:14px;font-weight:600\" style-hover=\"background:#d0eb9e;color:#1a3009\"><iconify-icon icon=\"tabler:book-2\" width=\"16\" height=\"16\"><\u002Ficonify-icon>Read the Standard v0.1<\u002Fa>\n              <a href=\"https://github.com/ecohubs-community/RCOS-website\" style=\"display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 14px;border-radius:8px;border:1px solid rgba(208,235,158,0.3);color:#f5fde5;font-size:14px;font-weight:500\" style-hover=\"border-color:#b5da82;color:#fff\"><iconify-icon icon=\"tabler:brand-github\" width=\"16\" height=\"16\"><\u002Ficonify-icon>Contribute<\u002Fa>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:10px\">\n            <h4 style=\"font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:0.08em;color:#9ac966;margin-bottom:4px\">The Standard<\u002Fh4>\n            <a href=\"https://rcos.ecohubs.community/articles/rcos-core\" style=\"font-size:14px;color:#e2f5b8\" style-hover=\"color:#fff\">About RCOS Core<\u002Fa>\n            <a href=\"https://rcos.ecohubs.community/articles/rcos-core/v0-1\" style=\"font-size:14px;color:#e2f5b8\" style-hover=\"color:#fff\">Core v0.1<\u002Fa>\n            <a href=\"https://rcos.ecohubs.community/articles/rcos-layers\" style=\"font-size:14px;color:#e2f5b8\" style-hover=\"color:#fff\">The seven layers<\u002Fa>\n            <a href=\"https://rcos.ecohubs.community/articles/rcos-modules\" style=\"font-size:14px;color:#e2f5b8\" style-hover=\"color:#fff\">Modules<\u002Fa>\n            <a href=\"https://rcos.ecohubs.community/articles/rcos-core/v0-1/appendix-a-glossary\" style=\"font-size:14px;color:#e2f5b8\" style-hover=\"color:#fff\">Glossary<\u002Fa>\n          <\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:10px\">\n            <h4 style=\"font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:0.08em;color:#9ac966;margin-bottom:4px\">Toolkit<\u002Fh4>\n            <a href=\"https://rcos.ecohubs.community/articles/rcos-templates#downloads\" style=\"font-size:14px;color:#e2f5b8\" style-hover=\"color:#fff\">Templates<\u002Fa>\n            <a href=\"https://rcos.ecohubs.community/articles/rcos-stress-tests/self-assessment\" style=\"font-size:14px;color:#e2f5b8\" style-hover=\"color:#fff\">Self-assessment<\u002Fa>\n            <a href=\"https://rcos.ecohubs.community/articles/rcos-stress-tests\" style=\"font-size:14px;color:#e2f5b8\" style-hover=\"color:#fff\">Stress tests<\u002Fa>\n            <a href=\"https://rcos.ecohubs.community/articles/safeguards\" style=\"font-size:14px;color:#e2f5b8\" style-hover=\"color:#fff\">Safeguards<\u002Fa>\n          <\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:10px\">\n            <h4 style=\"font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:0.08em;color:#9ac966;margin-bottom:4px\">EcoHubs<\u002Fh4>\n            <a href=\"https://ecohubs.community\" style=\"display:inline-flex;align-items:center;gap:4px;font-size:14px;color:#e2f5b8\" style-hover=\"color:#fff\">About us<iconify-icon icon=\"tabler:arrow-up-right\" width=\"13\" height=\"13\"><\u002Ficonify-icon><\u002Fa>\n            <a href=\"https://ecohubs.community/membership\" style=\"display:inline-flex;align-items:center;gap:4px;font-size:14px;color:#e2f5b8\" style-hover=\"color:#fff\">Join us<iconify-icon icon=\"tabler:arrow-up-right\" width=\"13\" height=\"13\"><\u002Ficonify-icon><\u002Fa>\n            <a href=\"https://github.com/ecohubs-community/RCOS-website\" style=\"display:inline-flex;align-items:center;gap:4px;font-size:14px;color:#e2f5b8\" style-hover=\"color:#fff\">GitHub<iconify-icon icon=\"tabler:arrow-up-right\" width=\"13\" height=\"13\"><\u002Ficonify-icon><\u002Fa>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:14px 24px;padding-top:22px;font-size:12.5px;color:#9ac966\">\n          <div style=\"display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px\">\n            <span>© 2026 EcoHubs Platform<\u002Fspan>\n            <span style=\"display:inline-flex;gap:6px\"><span style=\"border:1px solid rgba(208,235,158,0.25);border-radius:9999px;padding:1px 9px\">Spec &amp; templates · CC BY 4.0<\u002Fspan><span style=\"border:1px solid rgba(208,235,158,0.25);border-radius:9999px;padding:1px 9px\">Software · AGPL-3.0<\u002Fspan><\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"display:flex;flex-wrap:wrap;align-items:center;gap:16px\">\n            <a href=\"https://ecohubs.community/privacy\" style=\"color:#b5da82\" style-hover=\"color:#fff\">Privacy<\u002Fa>\n            <a href=\"https://ecohubs.community/terms\" style=\"color:#b5da82\" style-hover=\"color:#fff\">Terms<\u002Fa>\n            <span style=\"display:inline-flex;align-items:center;gap:6px;color:#d0eb9e\"><iconify-icon icon=\"tabler:world\" width=\"15\" height=\"15\"><\u002Ficonify-icon>English<iconify-icon icon=\"tabler:chevron-down\" width=\"12\" height=\"12\"><\u002Ficonify-icon><\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Ffooter>\n  <\u002Fmain>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;storyStyle&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;illustrated&quot;,&quot;compact&quot;],&quot;default&quot;:&quot;illustrated&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Story&quot;}}\">\nconst A = 'https://rcos.ecohubs.community/articles/';\nconst LAYERS = [\n  { n: 0, name: 'Identity & Scope', short: 'Identity & Scope', slug: 'layer-0-identity-scope', spec: 'layer-0-identity-scope', q: 'Why do we exist, and what will we never do?' },\n  { n: 1, name: 'Membership System', short: 'Membership', slug: 'layer-1-membership-system', spec: 'layer-1-membership-system', q: 'Who belongs, how do people join, and how do they leave?' },\n  { n: 2, name: 'Governance & Decision Logic', short: 'Governance', slug: 'layer-2-governance-decision-logic', spec: 'layer-2-governance-decision-logic', q: 'Who decides what, and how?' },\n  { n: 3, name: 'Economic & Resource System', short: 'Economy & Resources', slug: 'layer-3-economic-resource-system', spec: 'layer-3-economic-resource-system', q: 'How do money, land, tools and work flow?' },\n  { n: 4, name: 'Conflict, Repair & Accountability', short: 'Conflict & Repair', slug: 'layer-4-conflict-repair-accountability', spec: 'layer-4-conflict-repair-accountability', q: 'What happens when things break between people?' },\n  { n: 5, name: 'Operations & Coordination', short: 'Operations', slug: 'layer-5-operations-coordination', spec: 'layer-5-operations-coordination', q: 'How does the daily work actually get done?' },\n  { n: 6, name: 'Evolution & Adaptation', short: 'Evolution & Adaptation', slug: 'layer-6-evolution-adaptation', spec: 'layer-6-evolution-adaptation', q: 'How do we change our own rules without falling apart?' }\n];\nconst FILL = ['#1a3009', '#2d5016', '#4a7c2a', '#6b9f3d', '#9ac966', '#b5da82', '#d0eb9e'];\nconst FILL_HOVER = ['#2d5016', '#4a7c2a', '#5b8f33', '#7fb84a', '#b5da82', '#c6e494', '#e2f5b8'];\nconst INK = ['#ffffff', '#ffffff', '#ffffff', '#1a3009', '#1a3009', '#1a3009', '#1a3009'];\nconst RAD = [54, 80, 106, 132, 158, 184, 210];\nconst BOTTOM = 430;\nconst layerLinks = l => ({ guide: A + 'rcos-layers/' + l.slug, rules: A + 'rcos-core/v0-1/' + l.spec, templates: A + 'rcos-templates/layer-' + l.n, sec: '§' + (l.n + 2) });\nconst labelY = n => n === 0 ? BOTTOM - RAD[0] : BOTTOM - RAD[n] - RAD[n - 1] + 7;\n\nconst C = A + 'rcos-core/v0-1/';\nconst START = [\n  { num: '→', label: 'About RCOS Core', desc: 'What it is, why it exists, its principles', href: A + 'rcos-core' },\n  { num: '0', label: 'Introduction', desc: 'Purpose, scope and definitions', href: C + 'introduction' },\n  { num: '1', label: 'Compliance model', desc: 'What “RCOS-compliant” means', href: C + 'rcos-compliance-model' }\n];\nconst MODULES = [\n  { icon: 'tabler:plant-2', label: 'Permaculture', desc: 'For land as a core purpose', href: A + 'rcos-modules/permaculture' },\n  { icon: 'tabler:seedling', label: 'Minimal Permaculture', desc: 'A lightweight ecological start', href: A + 'rcos-modules/minimal-permaculture' }\n];\nconst REFERENCE = [\n  { num: '9', label: 'Non-normative sections', href: C + 'non-normative-sections' },\n  { num: '10', label: 'Compliance & auditing', href: C + 'compliance-auditing' },\n  { num: '11', label: 'Versioning & governance', href: C + 'versioning-governance-of-the-standard' },\n  { num: 'A', label: 'Glossary', href: C + 'appendix-a-glossary' },\n  { num: 'B', label: 'Example artifacts', href: C + 'appendix-b-example-artifacts-non-normative' },\n  { num: 'C', label: 'Reference implementation summary', href: C + 'appendix-c-reference-implementation-summary' }\n];\nconst TOC = [\n  { title: 'Start here', items: START },\n  { title: 'The seven layers', items: LAYERS.map(l => ({ num: String(l.n + 2), label: 'Layer ' + l.n + ' — ' + l.name, href: C + l.spec })) },\n  { title: 'Modules · optional', items: MODULES.map(m => ({ num: '+', label: m.label, href: m.href })) },\n  { title: 'Reference', items: REFERENCE }\n];\nconst TOOLKIT = [\n  { title: 'Write it down', items: [\n    { icon: 'tabler:file-pencil', label: 'Templates', desc: 'Fill-in documents for every layer', href: A + 'rcos-templates#downloads' },\n    { icon: 'tabler:messages', label: 'Facilitation worksheet', desc: 'Run a session with your group', href: A + 'rcos-stress-tests/facilitation-worksheet' } ] },\n  { title: 'Check yourself', items: [\n    { icon: 'tabler:checklist', label: 'Self-assessment', desc: 'Tick the warning signs you recognize', href: A + 'rcos-stress-tests/self-assessment' },\n    { icon: 'tabler:shield-check', label: 'Stress tests', desc: 'Real failures, replayed against RCOS', href: A + 'rcos-stress-tests' } ] },\n  { title: 'Go deeper', items: [\n    { icon: 'tabler:shield-lock', label: 'Safeguards', desc: 'Extra protections, e.g. for land commons', href: A + 'safeguards' },\n    { icon: 'tabler:building-community', label: 'Reference implementations', desc: 'How RCOS looks in practice', href: A + 'reference-implementations' },\n    { icon: 'tabler:books', label: 'All articles', desc: 'Browse the whole knowledge base', href: A.slice(0, -1) } ] }\n];\n\nclass Component extends DCLogic {\n  state = { who: 'founders', menu: null, drawer: false, dsec: null, w: 1280, hover: null, sel: null };\n  static DATA = {\n    founders: { label: 'Starting a community', icon: 'tabler:seedling',\n      pitch: 'Build the structure from day one, instead of patching it after the first crisis.',\n      steps: [\n        { title: 'Get the big picture', body: 'Read the seven layers in plain language.', cta: 'Read the layers', href: A + 'rcos-layers' },\n        { title: 'Write your purpose', body: 'Start with Layer 0. Everything else builds on it.', cta: 'Get the templates', href: A + 'rcos-templates/layer-0' },\n        { title: 'Add what fits', body: 'Pick optional modules for what your community does.', cta: 'Browse modules', href: A + 'rcos-modules' }\n      ] },\n    existing: { label: 'Already living together', icon: 'tabler:home-heart',\n      pitch: \"Find the questions you've never answered — before they find you.\",\n      steps: [\n        { title: 'See where you stand', body: 'Tick the warning signs that feel familiar.', cta: 'Take the self-assessment', href: A + 'rcos-stress-tests/self-assessment' },\n        { title: 'Learn from others', body: 'Read the stress tests closest to your situation.', cta: 'Read the stress tests', href: A + 'rcos-stress-tests' },\n        { title: 'Close the gaps', body: 'Write the missing answers down together.', cta: 'Get the templates', href: A + 'rcos-templates#downloads' }\n      ] },\n    facilitators: { label: 'Facilitator or mediator', icon: 'tabler:messages',\n      pitch: 'A shared, neutral language for hard conversations about power, money and conflict.',\n      steps: [\n        { title: 'Learn the language', body: 'Read the seven layers in plain language.', cta: 'Read the layers', href: A + 'rcos-layers' },\n        { title: 'Bring real cases', body: 'Use stress tests to open difficult topics safely.', cta: 'Facilitation worksheet', href: A + 'rcos-stress-tests/facilitation-worksheet' },\n        { title: 'Leave with a document', body: 'Fill in a template with the group, in the room.', cta: 'Get the templates', href: A + 'rcos-templates#downloads' }\n      ] },\n    builders: { label: 'Researcher or tool builder', icon: 'tabler:code',\n      pitch: 'The whole standard is open and published as structured data you can build on.',\n      steps: [\n        { title: 'Read the standard', body: 'Every rule, numbered and sorted into layers.', cta: 'Read Core v0.1', href: A + 'rcos-core/v0-1' },\n        { title: 'Use the data', body: 'Spec, templates and data live in the open repository.', cta: 'Open on GitHub', href: 'https://github.com/ecohubs-community/RCOS-website' },\n        { title: 'Check the licenses', body: 'Spec and templates CC BY 4.0, software AGPL-3.0.', cta: 'See licensing', href: 'https://github.com/ecohubs-community/RCOS-website' }\n      ] }\n  };\n  componentDidMount() {\n    this.onResize = () => this.setState({ w: window.innerWidth });\n    this.onKey = e => {\n      if (e.key === 'Escape') this.setState({ menu: null, sel: null, drawer: false });\n      if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); const i = document.querySelector('header input[type=search]'); i && i.focus(); }\n    };\n    this.onResize();\n    window.addEventListener('resize', this.onResize);\n    window.addEventListener('keydown', this.onKey);\n  }\n  componentWillUnmount() {\n    window.removeEventListener('resize', this.onResize);\n    window.removeEventListener('keydown', this.onKey);\n  }\n  renderVals() {\n    const { w, menu, hover, sel, dsec } = this.state;\n    const isDesktop = w >= 1000;\n    const navItem = k => ({\n      open: isDesktop && menu === k,\n      bg: menu === k ? '#eef4e4' : 'transparent',\n      toggle: () => this.setState(s => ({ menu: s.menu === k ? null : k })),\n      peek: () => { if (this.state.menu && this.state.menu !== k) this.setState({ menu: k }); }\n    });\n    const dItem = k => ({ open: dsec === k, icon: dsec === k ? 'tabler:minus' : 'tabler:plus', toggle: () => this.setState(s => ({ dsec: s.dsec === k ? null : k })) });\n\n    const rings = [...LAYERS].reverse().map(l => {\n      const n = l.n, on = sel === n, hv = hover === n;\n      const select = () => this.setState(s => ({ sel: s.sel === n ? null : n }));\n      return {\n        cy: BOTTOM - RAD[n], r: RAD[n], aria: 'Layer ' + n + ': ' + l.name,\n        fillNow: hv || on ? FILL_HOVER[n] : FILL[n],\n        stroke: on ? '#c47d4a' : '#fbfbf9', sw: on ? 4 : 2,\n        select, key: e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); select(); } },\n        enter: () => this.setState({ hover: n }), leave: () => this.setState(s => (s.hover === n ? { hover: null } : null))\n      };\n    });\n    const h = React.createElement;\n    const ringLabelsSvg = h('g', { style: { pointerEvents: 'none' } }, LAYERS.filter(l => l.n > 0).reverse().map(l =>\n      h('text', { key: l.n, x: 220, y: labelY(l.n), textAnchor: 'middle', dominantBaseline: 'middle',\n        style: { fontFamily: \"'Stack Sans Headline',sans-serif\", fontSize: '13.5px', fontWeight: 600, fill: INK[l.n], textDecoration: hover === l.n || sel === l.n ? 'underline' : 'none' } },\n        h('tspan', { style: { fontFamily: 'ui-monospace,monospace', fontWeight: 700, opacity: 0.75 } }, String(l.n)),\n        '\\u2002' + l.short)));\n\n    let pop = { show: false };\n    if (sel !== null) {\n      const l = LAYERS[sel], links = layerLinks(l), y = labelY(sel);\n      const compact = w < 720;\n      const below = y / 440 < 0.5;\n      pop = {\n        show: true, n: l.n, title: l.name, q: l.q, fill: FILL[l.n], ink: INK[l.n], ...links,\n        pos: compact ? 'relative' : 'absolute',\n        left: compact ? '0' : '50%',\n        top: compact ? '0' : (y / 440 * 100) + '%',\n        transform: compact ? 'none' : (below ? 'translate(-50%, 22px)' : 'translate(-50%, calc(-100% - 22px))'),\n        width: compact ? '100%' : '330px',\n        mt: compact ? '12px' : '0'\n      };\n    }\n\n    const D = Component.DATA, who = this.state.who;\n    const audiences = Object.keys(D).map(k => {\n      const on = k === who;\n      return { label: D[k].label, icon: D[k].icon, select: () => this.setState({ who: k }),\n        bg: on ? '#1a3009' : 'rgba(255,255,255,0.8)', fg: on ? '#ffffff' : '#1f2937', border: on ? '#1a3009' : '#e5e7eb' };\n    });\n    const cur = D[who];\n\n    return {\n      isDesktop, isMobile: !isDesktop,\n      wideSearch: w >= 1240, narrowSearch: w < 1240,\n      nav: { standard: navItem('standard'), layers: navItem('layers'), toolkit: navItem('toolkit') },\n      anyMenu: isDesktop && !!menu,\n      closeMenu: () => this.setState({ menu: null }),\n      drawer: !isDesktop && this.state.drawer,\n      openDrawer: () => this.setState({ drawer: true }),\n      closeDrawer: () => this.setState({ drawer: false }),\n      dsec: { standard: dItem('standard'), layers: dItem('layers'), toolkit: dItem('toolkit') },\n      toc: TOC, toolkit: TOOLKIT, startHere: START, modules: MODULES, reference: REFERENCE,\n      specLayers: LAYERS.map(l => ({ n: l.n, name: l.name, q: l.q, fill: FILL[l.n], ink: INK[l.n], ...layerLinks(l) })),\n      layersTop: [...LAYERS].reverse().map(l => ({ n: l.n, name: l.name, fill: FILL[l.n], ink: INK[l.n], ...layerLinks(l) })),\n      rings, ringLabelsSvg, zeroDeco: hover === 0 || sel === 0 ? 'underline' : 'none',\n      pop, closePop: () => this.setState({ sel: null }),\n      layersCols: w >= 960 ? 'minmax(0,1.5fr) minmax(0,1fr)' : 'minmax(0,1fr)',\n      illustrated: (this.props.storyStyle ?? 'illustrated') === 'illustrated',\n      audiences,\n      current: { pitch: cur.pitch, steps: cur.steps.map((s, i) => ({ ...s, n: i + 1 })) }\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
