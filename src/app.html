<!doctype html>
<html lang="%lang%">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<link rel="icon" href="/favicon.ico" sizes="48x48" />
		<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
		<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
		<link rel="manifest" href="/site.webmanifest" />
		<!-- The page background (--color-paper) in each scheme. -->
		<meta name="theme-color" media="(prefers-color-scheme: light)" content="#fbfbf9" />
		<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0e1409" />
		<script>
			// Apply the theme before first paint so there is no light/dark flash.
			// A saved choice (localStorage "theme", see src/lib/stores/ui.ts) wins over the system setting.
			(function () {
				var t;
				try {
					t = localStorage.getItem('theme');
				} catch (e) {}
				if (t !== 'light' && t !== 'dark') {
					t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
				}
				document.documentElement.classList.add(t);
				// Hide the consent banner before first paint for visitors who already
				// chose (cookie shared with ecohubs.community; see consent.svelte.ts).
				var chosen = /(?:^|; )ecohubs_consent=(accepted|declined)/.test(document.cookie);
				if (!chosen) {
					try {
						var legacy = localStorage.getItem('cookie_consent');
						chosen = legacy === 'accepted' || legacy === 'declined';
					} catch (e) {}
				}
				if (chosen) document.documentElement.classList.add('consent-known');
				// The standard's contents rail, collapsed by the reader (see components/standard/rail.ts).
				try {
					if (localStorage.getItem('rcos-rail') === 'collapsed')
						document.documentElement.classList.add('rail-collapsed');
					// Reading mode "With guidance" (see components/standard/reading.svelte.ts).
					if (localStorage.getItem('rcos-reading') === 'guided')
						document.documentElement.classList.add('guided');
				} catch (e) {}
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
