- key: identity-constraints-register
  sourceId: t2e1fdh8
  layer: 0
  order: 3
  i18n:
    en:
      title: Identity Constraints Register
      summary: >-
        Identity constraints are the non-negotiable behavioural, ethical, and structural boundaries
        that shape who the community is. Unlike invariants (which protect the system itself),
        identity constraints define how members and the community relate to people, ecosystems, and
        ideologies.
    de:
      title: Register der Identitätsbeschränkungen
      summary: >-
        Identitätsbeschränkungen sind die nicht verhandelbaren verhaltensbezogenen, ethischen und
        strukturellen Grenzen, die bestimmen, wer die Gemeinschaft ist. Anders als Invarianten (die
        das System selbst schützen) definieren Identitätsbeschränkungen, wie Mitglieder und die
        Gemeinschaft sich zu Menschen, Ökosystemen und Ideologien verhalten.
    es:
      title: Registro de Restricciones de Identidad
      summary: >-
        Las restricciones de identidad son los límites conductuales, éticos y estructurales no
        negociables que definen quién es la comunidad. A diferencia de los invariantes (que protegen
        el sistema en sí), las restricciones de identidad definen cómo los miembros y la comunidad
        se relacionan con las personas, los ecosistemas y las ideologías.
    fr:
      title: Registre des contraintes d'identité
      summary: >-
        Les contraintes d'identité sont les limites comportementales, éthiques et structurelles non
        négociables qui définissent ce qu'est la communauté. Contrairement aux invariants (qui
        protègent le système lui-même), les contraintes d'identité définissent la manière dont les
        membres et la communauté se rapportent aux personnes, aux écosystèmes et aux idéologies.
    pt-br:
      title: Registro de Restrições de Identidade
      summary: >-
        Restrições de identidade são os limites comportamentais, éticos e estruturais inegociáveis
        que definem quem a comunidade é. Diferente dos invariantes (que protegem o próprio sistema),
        as restrições de identidade definem como os membros e a comunidade se relacionam com
        pessoas, ecossistemas e ideologias.
  mandatory: true
  sectionKeys:
    - identity-constraints-register.active-identity-constraints
    - identity-constraints-register.enforcement-and-testability
    - identity-constraints-register.conditions-for-change
    - identity-constraints-register.ratification-record
- key: invariants-register
  sourceId: 0672a85f
  layer: 0
  order: 2
  i18n:
    en:
      title: Invariants Register
      summary: >-
        Invariants are constraints that MUST NOT be violated while they are in force. No decision,
        role, process, or emergency measure may override an invariant. If a conflict arises between
        an invariant and any other rule, the invariant prevails.
    de:
      title: Invariantenregister
      summary: >-
        Invarianten sind Rahmenbedingungen, die DÜRFEN NICHT verletzt werden, solange sie in Kraft
        sind. Keine Entscheidung, Rolle, Prozess oder Notfallmaßnahme darf eine Invariante außer
        Kraft setzen. Entsteht ein Konflikt zwischen einer Invariante und einer anderen Regel, hat
        die Invariante Vorrang.
    es:
      title: Registro de Invariantes
      summary: >-
        Las invariantes son restricciones que NO DEBEN ser violadas mientras estén en vigor. Ninguna
        decisión, rol, proceso o medida de emergencia puede anular una invariante. Si surge un
        conflicto entre una invariante y cualquier otra regla, la invariante prevalece.
    fr:
      title: Registre des invariants
      summary: >-
        Les invariants sont des contraintes qui NE DOIVENT PAS être violées tant qu'ils sont en
        vigueur. Aucune décision, aucun rôle, processus ou mesure d'urgence ne PEUT outrepasser un
        invariant. En cas de conflit entre un invariant et toute autre règle, l'invariant prévaut.
    pt-br:
      title: Registro de Invariantes
      summary: >-
        Invariantes são restrições que NÃO DEVEM ser violadas enquanto estiverem em vigor. Nenhuma
        decisão, papel, processo ou medida emergencial pode sobrepor um invariante. Se surgir um
        conflito entre um invariante e qualquer outra regra, o invariante prevalece.
  mandatory: true
  sectionKeys:
    - invariants-register.active-invariants
    - invariants-register.ratification-record
- key: purpose-charter
  sourceId: 543520dc
  layer: 0
  order: 0
  i18n:
    en:
      title: Purpose Charter
      summary: >-
        States the one primary purpose your community exists for, its secondary purposes and
        explicit non-goals, and the conditions under which that purpose may change.
    de:
      title: Zweckcharta
      summary: >-
        Legt den einen primären Zweck fest, für den eure Gemeinschaft existiert, dazu ihre
        sekundären Zwecke und ausdrücklichen Nicht-Ziele sowie die Bedingungen, unter denen sich
        dieser Zweck ändern darf.
    es:
      title: Carta de Propósito
      summary: >-
        Establece el único propósito principal por el que existe tu comunidad, sus propósitos
        secundarios y sus no-objetivos explícitos, y las condiciones bajo las cuales ese propósito
        puede cambiar.
    fr:
      title: Charte de raison d'être
      summary: >-
        Énonce l'unique raison d'être principale de ta communauté, ses raisons d'être secondaires et
        ses non-objectifs explicites, ainsi que les conditions dans lesquelles cette raison d'être
        peut changer.
    pt-br:
      title: Carta de Propósito
      summary: >-
        Declara o único propósito primário pelo qual sua comunidade existe, seus propósitos
        secundários e não-objetivos explícitos, e as condições em que esse propósito pode mudar.
  mandatory: true
  sectionKeys:
    - purpose-charter.primary-purpose
    - purpose-charter.secondary-purposes
    - purpose-charter.non-goals-and-exclusions
    - purpose-charter.conditions-for-purpose-change
    - purpose-charter.ratification-record
- key: scope-declaration
  sourceId: 5bfa1b3e
  layer: 0
  order: 1
  i18n:
    en:
      title: Scope Declaration
      summary: >-
        Draws the boundary of what your community governs: the assets, decision domains, activities,
        and responsibilities in scope — and what is explicitly out of scope.
    de:
      title: Geltungsbereichserklärung
      summary: >-
        Zieht die Grenze dessen, was eure Gemeinschaft regelt: die erfassten Vermögenswerte,
        Entscheidungsbereiche, Aktivitäten und Verantwortlichkeiten — und was ausdrücklich nicht
        erfasst ist.
    es:
      title: Declaración de Alcance
      summary: >-
        Traza el límite de lo que gobierna tu comunidad: los activos, dominios de decisión,
        actividades y responsabilidades dentro del alcance — y lo que queda explícitamente fuera.
    fr:
      title: Déclaration de périmètre
      summary: >-
        Trace la limite de ce que ta communauté gouverne : les actifs, domaines de décision,
        activités et responsabilités dans le périmètre — et ce qui en est explicitement exclu.
    pt-br:
      title: Declaração de Escopo
      summary: >-
        Traça o limite do que sua comunidade governa: os ativos, domínios de decisão, atividades e
        responsabilidades dentro do escopo — e o que fica explicitamente fora dele.
  mandatory: true
  sectionKeys:
    - scope-declaration.in-scope-assets
    - scope-declaration.in-scope-decision-domains
    - scope-declaration.in-scope-activities-and-responsibilities
    - scope-declaration.explicitly-out-of-scope
    - scope-declaration.ratification-record
- key: exit-protocol
  sourceId: 0e61a813
  layer: 1
  order: 2
  i18n:
    en:
      title: Exit & Separation Protocol
      summary: >-
        Defines how membership ends — voluntary exit at any time, forced exit and suspension with
        due process — and how assets, roles, and responsibilities are separated when someone leaves.
    de:
      title: Austritts- & Trennungsprotokoll
      summary: >-
        Legt fest, wie eine Mitgliedschaft endet — freiwilliger Austritt jederzeit, erzwungener
        Austritt und Suspendierung mit fairem Verfahren — und wie Vermögenswerte, Rollen und
        Verantwortlichkeiten getrennt werden, wenn jemand geht.
    es:
      title: Protocolo de Salida y Separación
      summary: >-
        Define cómo termina la membresía — salida voluntaria en cualquier momento, salida forzada y
        suspensión con debido proceso — y cómo se separan los activos, roles y responsabilidades
        cuando alguien se va.
    fr:
      title: Protocole de sortie et de séparation
      summary: >-
        Définit comment l'adhésion prend fin — sortie volontaire à tout moment, sortie forcée et
        suspension avec une procédure régulière — et comment les actifs, rôles et responsabilités
        sont séparés lorsqu'une personne part.
    pt-br:
      title: Protocolo de Saída e Separação
      summary: >-
        Define como a associação termina — saída voluntária a qualquer momento, saída forçada e
        suspensão com devido processo — e como ativos, papéis e responsabilidades são separados
        quando alguém sai.
  mandatory: true
  sectionKeys:
    - exit-protocol.voluntary-exit
    - exit-protocol.forced-exit
    - exit-protocol.suspension
    - exit-protocol.asset-role-and-responsibility-separation
    - exit-protocol.ratification-record
- key: membership-agreement
  sourceId: 15fe28a6
  layer: 1
  order: 0
  i18n:
    en:
      title: Membership Agreement
      summary: >-
        Signed (or explicitly acknowledged) by every member at the time of admission. Defines the
        rights and obligations of each membership state.
    de:
      title: Mitgliedschaftsvereinbarung
      summary: >-
        Wird von jedem Mitglied zum Zeitpunkt der Aufnahme unterschrieben (oder ausdrücklich
        bestätigt). Definiert die Rechte und Pflichten jedes Mitgliedschaftsstatus.
    es:
      title: Acuerdo de Membresía
      summary: >-
        Firmado (o reconocido explícitamente) por cada miembro en el momento de su admisión. Define
        los derechos y obligaciones de cada estado de membresía.
    fr:
      title: Accord d'adhésion
      summary: >-
        Signé (ou explicitement reconnu) par chaque membre au moment de l'admission. Définit les
        droits et obligations de chaque état d'adhésion.
    pt-br:
      title: Acordo de Associação
      summary: >-
        Assinado (ou explicitamente reconhecido) por cada membro no momento da admissão. Define os
        direitos e obrigações de cada estado de associação.
  mandatory: true
  sectionKeys:
    - membership-agreement.membership-state-on-signing
    - membership-agreement.member-rights
    - membership-agreement.member-obligations
    - membership-agreement.participation-and-contribution-expectations
    - membership-agreement.due-process-reference
    - membership-agreement.consent-acknowledgment
    - membership-agreement.ratification-record
- key: membership-state-registry
  sourceId: b6d4e7f9
  layer: 1
  order: 3
  i18n:
    en:
      title: Membership State Registry
      summary: >-
        Lists every membership state your community recognizes, with the rights and obligations of
        each and how people move between them. Each person holds exactly one state at a time.
    de:
      title: Mitgliedschaftsstatus-Register
      summary: >-
        Listet jeden Mitgliedschaftsstatus auf, den eure Gemeinschaft kennt, mit seinen Rechten und
        Pflichten und den Wegen zwischen den Status. Jede Person hat zu jedem Zeitpunkt genau einen
        Status.
    es:
      title: Registro de Estados de Membresía
      summary: >-
        Enumera cada estado de membresía que reconoce tu comunidad, con los derechos y obligaciones
        de cada uno y cómo se pasa de uno a otro. Cada persona tiene exactamente un estado a la vez.
    fr:
      title: Registre des états de membre
      summary: >-
        Répertorie chaque état de membre que reconnaît ta communauté, avec les droits et obligations
        de chacun et la manière de passer de l'un à l'autre. Chaque personne a exactement un état à
        la fois.
    pt-br:
      title: Registro de Estados de Associação
      summary: >-
        Lista cada estado de associação que sua comunidade reconhece, com os direitos e obrigações
        de cada um e como se passa de um para outro. Cada pessoa tem exatamente um estado por vez.
  mandatory: true
  sectionKeys:
    - membership-state-registry.defined-membership-states
    - membership-state-registry.ratification-record
- key: onboarding-protocol
  sourceId: 8f3a5c21
  layer: 1
  order: 1
  i18n:
    en:
      title: Onboarding Protocol
      summary: >-
        Defines how a person becomes a member: the admission criteria, the onboarding steps, the
        membership state they start in, and how the trial period is evaluated and recorded.
    de:
      title: Onboarding-Protokoll
      summary: >-
        Legt fest, wie eine Person Mitglied wird: die Aufnahmekriterien, die Onboarding-Schritte,
        der Mitgliedschaftsstatus, mit dem sie beginnt, und wie die Probezeit bewertet und
        dokumentiert wird.
    es:
      title: Protocolo de Incorporación
      summary: >-
        Define cómo una persona se convierte en miembro: los criterios de admisión, los pasos de
        incorporación, el estado de membresía con el que empieza y cómo se evalúa y registra el
        período de prueba.
    fr:
      title: Protocole d'intégration
      summary: >-
        Définit comment une personne devient membre : les critères d'admission, les étapes
        d'intégration, l'état d'adhésion de départ et la manière dont la période d'essai est évaluée
        et consignée.
    pt-br:
      title: Protocolo de Integração
      summary: >-
        Define como uma pessoa se torna membro: os critérios de admissão, as etapas de integração, o
        estado de associação em que ela começa e como o período de experiência é avaliado e
        registrado.
  mandatory: true
  sectionKeys:
    - onboarding-protocol.admission-criteria
    - onboarding-protocol.onboarding-steps
    - onboarding-protocol.initial-membership-state
    - onboarding-protocol.trial-and-evaluation
    - onboarding-protocol.completion-record
    - onboarding-protocol.ratification-record
- key: authority-registry
  sourceId: 2e9c4a18
  layer: 2
  order: 2
  i18n:
    en:
      title: Authority Registry
      summary: >-
        Lists all roles, circles, or bodies that hold decision-making authority, along with their
        explicit scope, limits, and term.
    de:
      title: Autoritätenregister
      summary: >-
        Listet alle Rollen, Kreise oder Gremien auf, die Entscheidungsbefugnis besitzen, zusammen
        mit ihrem expliziten Geltungsbereich, ihren Grenzen und ihrer Amtszeit.
    es:
      title: Registro de Autoridades
      summary: >-
        Enumera todos los roles, círculos u órganos que poseen autoridad de toma de decisiones,
        junto con su alcance explícito, límites y duración del mandato.
    fr:
      title: Registre des autorités
      summary: >-
        Répertorie tous les rôles, cercles ou organes détenant une autorité décisionnelle, ainsi que
        leur périmètre explicite, leurs limites et leur durée de mandat.
    pt-br:
      title: Registro de Autoridades
      summary: >-
        Lista todos os papéis, círculos ou órgãos que detêm autoridade decisória, junto com seu
        escopo explícito, limites e duração.
  mandatory: true
  sectionKeys:
    - authority-registry.registered-authorities
    - authority-registry.ratification-record
- key: decision-matrix
  sourceId: 4885248e
  layer: 2
  order: 0
  i18n:
    en:
      title: Decision Matrix
      summary: >-
        Maps every decision type and domain to an authorized role or body, mechanism, threshold, and
        escalation path. Decisions made outside this matrix are considered invalid.
    de:
      title: Entscheidungsmatrix
      summary: >-
        Ordnet jeden Entscheidungstyp und -bereich einer autorisierten Rolle oder einem Gremium,
        einem Mechanismus, einer Schwelle und einem Eskalationspfad zu. Entscheidungen, die
        außerhalb dieser Matrix getroffen werden, gelten als ungültig.
    es:
      title: Matriz de Decisiones
      summary: >-
        Asigna cada tipo de decisión y dominio a un rol o cuerpo autorizado, mecanismo, umbral y vía
        de escalamiento. Las decisiones tomadas fuera de esta matriz se consideran inválidas.
    fr:
      title: Matrice de décision
      summary: >-
        Associe chaque type et domaine de décision à un rôle ou organe autorisé, un mécanisme, un
        seuil et un chemin d'escalade. Toute décision prise en dehors de cette matrice est
        considérée comme invalide.
    pt-br:
      title: Matriz de Decisão
      summary: >-
        Mapeia cada tipo e domínio de decisão para um papel ou órgão autorizado, mecanismo, limiar e
        caminho de escalonamento. Decisões tomadas fora desta matriz são consideradas inválidas.
  mandatory: true
  sectionKeys:
    - decision-matrix.voting-principles
    - decision-matrix.matrix
    - decision-matrix.decision-type-definitions
    - decision-matrix.ratification-record
- key: governance-protocol
  sourceId: 1403643f
  layer: 2
  order: 1
  i18n:
    en:
      title: Governance Protocol
      summary: >-
        Defines the full lifecycle of a collective decision — from proposal submission to
        documentation and appeal.
    de:
      title: Governance-Protokoll
      summary: >-
        Definiert den vollständigen Lebenszyklus einer kollektiven Entscheidung — von der
        Antragseinreichung bis zur Dokumentation und zum Einspruch.
    es:
      title: Protocolo de Gobernanza
      summary: >-
        Define el ciclo de vida completo de una decisión colectiva — desde la presentación de la
        propuesta hasta la documentación y la apelación.
    fr:
      title: Protocole de gouvernance
      summary: >-
        Définit le cycle de vie complet d'une décision collective — de la soumission de proposition
        à la documentation et à l'appel.
    pt-br:
      title: Protocolo de Governança
      summary: >-
        Define o ciclo de vida completo de uma decisão coletiva — desde a submissão da proposta até
        a documentação e o recurso.
  mandatory: true
  sectionKeys:
    - governance-protocol.proposal-submission
    - governance-protocol.review-and-deliberation
    - governance-protocol.decision-execution
    - governance-protocol.documentation-and-publication
    - governance-protocol.appeal-and-review
    - governance-protocol.conflict-between-decisions
    - governance-protocol.safeguards-and-failure-modes
    - governance-protocol.ratification-record
- key: internal-economy-protocol
  sourceId: 1496e7ff
  layer: 3
  order: 0
  i18n:
    en:
      title: Internal Economy Protocol
      summary: >-
        Defines what is commons and what is private, which contributions are recognized and how, any
        internal units, and the limits that keep value from concentrating in a few hands.
    de:
      title: Protokoll für die interne Wirtschaft
      summary: >-
        Legt fest, was Gemeingut und was privat ist, welche Beiträge wie anerkannt werden, welche
        internen Einheiten es gibt und welche Grenzen verhindern, dass sich Werte in wenigen Händen
        sammeln.
    es:
      title: Protocolo de Economía Interna
      summary: >-
        Define qué es bien común y qué es privado, qué contribuciones se reconocen y cómo, las
        unidades internas que existan y los límites que evitan que el valor se concentre en pocas
        manos.
    fr:
      title: Protocole d'économie interne
      summary: >-
        Définit ce qui relève des communs et ce qui est privé, quelles contributions sont reconnues
        et comment, les éventuelles unités internes, et les limites qui empêchent la valeur de se
        concentrer entre quelques mains.
    pt-br:
      title: Protocolo de Economia Interna
      summary: >-
        Define o que é bem comum e o que é privado, quais contribuições são reconhecidas e como, as
        unidades internas existentes e os limites que impedem que o valor se concentre em poucas
        mãos.
  mandatory: true
  sectionKeys:
    - internal-economy-protocol.commons-vs-private-classification
    - internal-economy-protocol.recognized-contribution-categories
    - internal-economy-protocol.contribution-recognition-mechanism
    - internal-economy-protocol.internal-units
    - internal-economy-protocol.accumulation-constraints
    - internal-economy-protocol.external-income-interfaces
    - internal-economy-protocol.dispute-resolution-for-economic-records
    - internal-economy-protocol.ratification-record
- key: treasury-ruleset
  sourceId: 9ead12cf
  layer: 3
  order: 1
  i18n:
    en:
      title: Treasury Ruleset
      summary: >-
        Sets the rules for the community's shared money: what the treasury covers, where income
        comes from, who may spend and up to what limit, how it is reported, and the limits on
        reserves, risk, debt, and conflicts of interest.
    de:
      title: Kassensatzung
      summary: >-
        Regelt das gemeinsame Geld der Gemeinschaft: wofür die Kasse da ist, woher Einnahmen kommen,
        wer bis zu welcher Grenze ausgeben darf, wie berichtet wird und welche Grenzen für
        Rücklagen, Risiko, Schulden und Interessenkonflikte gelten.
    es:
      title: Reglamento de Tesorería
      summary: >-
        Fija las reglas del dinero compartido de la comunidad: qué cubre la tesorería, de dónde
        vienen los ingresos, quién puede gastar y hasta qué límite, cómo se informa y los límites
        sobre reservas, riesgo, deuda y conflictos de intereses.
    fr:
      title: Règles de trésorerie
      summary: >-
        Fixe les règles de l'argent commun de la communauté : ce que couvre la trésorerie, d'où
        viennent les revenus, qui peut dépenser et jusqu'à quelle limite, comment on en rend compte,
        et les limites en matière de réserves, de risque, de dette et de conflits d'intérêts.
    pt-br:
      title: Regulamento da Tesouraria
      summary: >-
        Define as regras do dinheiro compartilhado da comunidade: o que a tesouraria cobre, de onde
        vem a receita, quem pode gastar e até que limite, como se presta contas e os limites para
        reservas, risco, dívida e conflitos de interesses.
  mandatory: true
  sectionKeys:
    - treasury-ruleset.treasury-scope
    - treasury-ruleset.income-sources
    - treasury-ruleset.spending-authority
    - treasury-ruleset.transparency-and-reporting
    - treasury-ruleset.reserve-risk-and-debt-constraints
    - treasury-ruleset.conflict-of-interest-rules
    - treasury-ruleset.ratification-record
- key: accountability-protocol
  sourceId: d0c21119
  layer: 4
  order: 1
  i18n:
    en:
      title: Accountability Protocol
      summary: >-
        Defines what happens when an agreement is broken: what triggers a review, how it is
        investigated, the due-process and anti-retaliation guarantees, the repair and sanction
        options, and how rights are restored.
    de:
      title: Rechenschaftsprotokoll
      summary: >-
        Legt fest, was geschieht, wenn eine Vereinbarung gebrochen wird: was eine Überprüfung
        auslöst, wie untersucht wird, welche Verfahrensgarantien und welcher Schutz vor Vergeltung
        gelten, welche Wiedergutmachungs- und Sanktionsoptionen es gibt und wie Rechte
        wiederhergestellt werden.
    es:
      title: Protocolo de Rendición de Cuentas
      summary: >-
        Define qué ocurre cuando se incumple un acuerdo: qué activa una revisión, cómo se investiga,
        las garantías de debido proceso y contra represalias, las opciones de reparación y sanción,
        y cómo se restituyen los derechos.
    fr:
      title: Protocole de responsabilisation
      summary: >-
        Définit ce qui se passe lorsqu'un accord est rompu : ce qui déclenche un examen, comment
        l'enquête se déroule, les garanties de procédure régulière et contre les représailles, les
        options de réparation et de sanction, et comment les droits sont rétablis.
    pt-br:
      title: Protocolo de Responsabilização
      summary: >-
        Define o que acontece quando um acordo é rompido: o que aciona uma revisão, como se
        investiga, as garantias de devido processo e contra retaliação, as opções de reparação e
        sanção, e como os direitos são restaurados.
  mandatory: true
  sectionKeys:
    - accountability-protocol.triggers
    - accountability-protocol.investigation-and-review
    - accountability-protocol.due-process-guarantees
    - accountability-protocol.anti-retaliation-protections
    - accountability-protocol.sanction-and-repair-options
    - accountability-protocol.conditions-for-restoring-rights
    - accountability-protocol.coordination-with-layer-1
    - accountability-protocol.ratification-record
- key: conflict-resolution-ladder
  sourceId: a1de3ac3
  layer: 4
  order: 0
  i18n:
    en:
      title: Conflict Resolution Ladder
      summary: >-
        Gives every conflict a clear path, from direct conversation through facilitated dialogue and
        formal review up to a governance decision, with rules for non-response, deadlock,
        facilitators, and privacy along the way.
    de:
      title: Konfliktlösungsleiter
      summary: >-
        Gibt jedem Konflikt einen klaren Weg, vom direkten Gespräch über moderierten Dialog und
        formelle Überprüfung bis zur Governance-Entscheidung, mit Regeln für Nichtreaktion,
        Pattsituationen, Moderation und Datenschutz unterwegs.
    es:
      title: Escalera de Resolución de Conflictos
      summary: >-
        Da a cada conflicto un camino claro, desde la conversación directa pasando por el diálogo
        facilitado y la revisión formal hasta una decisión de gobernanza, con reglas para la falta
        de respuesta, el punto muerto, la facilitación y la privacidad en el camino.
    fr:
      title: Échelle de résolution des conflits
      summary: >-
        Donne à chaque conflit un chemin clair, de la conversation directe au dialogue facilité et à
        l'examen formel jusqu'à une décision de gouvernance, avec des règles pour la non-réponse,
        l'impasse, la facilitation et la vie privée en cours de route.
    pt-br:
      title: Escada de Resolução de Conflitos
      summary: >-
        Dá a cada conflito um caminho claro, da conversa direta ao diálogo facilitado e à revisão
        formal até uma decisão de governança, com regras para não-resposta, impasse, facilitação e
        privacidade ao longo do caminho.
  mandatory: true
  sectionKeys:
    - conflict-resolution-ladder.conflict-classification
    - conflict-resolution-ladder.resolution-ladder-steps
    - conflict-resolution-ladder.non-response-withdrawal-and-deadlock
    - conflict-resolution-ladder.facilitator-selection-and-replacement
    - conflict-resolution-ladder.privacy-and-information-access-boundaries
    - conflict-resolution-ladder.safeguards
    - conflict-resolution-ladder.ratification-record
- key: meeting-templates
  sourceId: c416f3ec
  layer: 5
  order: 2
  i18n:
    en:
      title: Meeting Templates
      summary: >-
        Meeting templates declare the purpose, decision scope, quorum, and structure of each meeting
        type. A meeting without a declared template will, given enough time, accumulate authority it
        should not have. Adapt these templates and add or remove meeting types as your community
        needs.
    de:
      title: Sitzungsvorlagen
      summary: >-
        Sitzungsvorlagen legen Zweck, Entscheidungsbereich, Beschlussfähigkeit und Struktur jedes
        Sitzungstyps fest. Eine Sitzung ohne festgelegte Vorlage wird mit der Zeit Befugnisse
        ansammeln, die sie nicht haben sollte. Passt diese Vorlagen an und fügt Sitzungstypen hinzu
        oder entfernt sie, wie es eure Gemeinschaft braucht.
    es:
      title: Plantillas de Reuniones
      summary: >-
        Las plantillas de reuniones declaran el propósito, el alcance de decisión, el quórum y la
        estructura de cada tipo de reunión. Una reunión sin una plantilla declarada, dado el tiempo
        suficiente, acumulará autoridad que no debería tener. Adapta estas plantillas y añade o
        elimina tipos de reunión según las necesidades de tu comunidad.
    fr:
      title: Modèles de réunion
      summary: >-
        Les modèles de réunion déclarent l'objectif, le périmètre de décision, le quorum et la
        structure de chaque type de réunion. Une réunion sans modèle déclaré finira, avec le temps,
        par accumuler une autorité qu'elle ne devrait pas avoir. Adapte ces modèles et ajoute ou
        supprime des types de réunion selon les besoins de ta communauté.
    pt-br:
      title: Modelos de Reunião
      summary: >-
        Os modelos de reunião declaram o propósito, o escopo de decisão, o quórum e a estrutura de
        cada tipo de reunião. Uma reunião sem um modelo declarado, com tempo suficiente, acumulará
        autoridade que não deveria ter. Adapte estes modelos e adicione ou remova tipos de reunião
        conforme sua comunidade precisar.
  mandatory: true
  sectionKeys:
    - meeting-templates.meeting-type-operations
    - meeting-templates.meeting-type-governance
    - meeting-templates.meeting-type-coordination-alignment
    - meeting-templates.meeting-type-reflection-learning
    - meeting-templates.meeting-type-conflict-handling
    - meeting-templates.ratification-record
- key: operations-manual
  sourceId: 7d1b3f2a
  layer: 5
  order: 0
  i18n:
    en:
      title: Operations Manual
      summary: >-
        Describes how day-to-day work gets done: the core processes, ad-hoc responsibilities, how
        roles hand work to each other, workload limits, continuity when people are away, and where
        the documentation lives.
    de:
      title: Betriebshandbuch
      summary: >-
        Beschreibt, wie die tägliche Arbeit erledigt wird: die zentralen Prozesse,
        Ad-hoc-Verantwortlichkeiten, wie Rollen einander Arbeit übergeben, Belastungsgrenzen,
        Kontinuität bei Abwesenheit und wo die Dokumentation liegt.
    es:
      title: Manual de Operaciones
      summary: >-
        Describe cómo se hace el trabajo del día a día: los procesos fundamentales, las
        responsabilidades ad hoc, cómo los roles se pasan el trabajo, los límites de carga, la
        continuidad cuando alguien no está y dónde vive la documentación.
    fr:
      title: Manuel opérationnel
      summary: >-
        Décrit comment le travail quotidien se fait : les processus essentiels, les responsabilités
        ponctuelles, la façon dont les rôles se transmettent le travail, les limites de charge, la
        continuité en cas d'absence et l'emplacement de la documentation.
    pt-br:
      title: Manual de Operações
      summary: >-
        Descreve como o trabalho do dia a dia é feito: os processos essenciais, as responsabilidades
        ad hoc, como os papéis passam o trabalho entre si, os limites de carga, a continuidade
        quando alguém está ausente e onde fica a documentação.
  mandatory: true
  sectionKeys:
    - operations-manual.core-operational-processes
    - operations-manual.temporary-and-ad-hoc-responsibilities
    - operations-manual.role-and-domain-interfaces
    - operations-manual.workload-boundaries
    - operations-manual.operational-continuity
    - operations-manual.information-flow-and-anti-gatekeeping
    - operations-manual.documentation-locations-and-update-procedures
    - operations-manual.ratification-record
- key: role-registry
  sourceId: 6de5caef
  layer: 5
  order: 1
  i18n:
    en:
      title: Role Registry
      summary: >-
        Lists every operational and functional role in your community with its purpose, domain, and
        current holder, so it is always clear who does what — and that no one's role is unwritten.
    de:
      title: Rollenverzeichnis
      summary: >-
        Listet jede operative und funktionale Rolle eurer Gemeinschaft mit Zweck,
        Zuständigkeitsbereich und aktueller Besetzung auf, damit immer klar ist, wer was tut — und
        keine Rolle ungeschrieben bleibt.
    es:
      title: Registro de Roles
      summary: >-
        Enumera cada rol operativo y funcional de tu comunidad con su propósito, dominio y titular
        actual, para que siempre quede claro quién hace qué — y ningún rol quede sin escribir.
    fr:
      title: Registre des rôles
      summary: >-
        Répertorie chaque rôle opérationnel et fonctionnel de ta communauté avec sa raison d'être,
        son domaine et la personne qui l'occupe, pour qu'il soit toujours clair qui fait quoi — et
        qu'aucun rôle ne reste non écrit.
    pt-br:
      title: Registro de Papéis
      summary: >-
        Lista cada papel operacional e funcional da sua comunidade com seu propósito, domínio e
        titular atual, para que sempre fique claro quem faz o quê — e nenhum papel fique sem
        registro.
  mandatory: true
  sectionKeys:
    - role-registry.overview
    - role-registry.summary-table
    - role-registry.operational-roles
    - role-registry.functional-roles
    - role-registry.ratification-record
- key: change-protocol
  sourceId: 0d3486d6
  layer: 6
  order: 0
  i18n:
    en:
      title: Change Protocol
      summary: >-
        Defines how the community's rules change: how a change is proposed, classified, reviewed,
        adopted or rejected, rolled out and rolled back — plus the narrow paths for emergency
        changes and experiments.
    de:
      title: Änderungsprotokoll
      summary: >-
        Legt fest, wie sich die Regeln der Gemeinschaft ändern: wie eine Änderung vorgeschlagen,
        eingestuft, geprüft, angenommen oder abgelehnt, eingeführt und zurückgenommen wird — dazu
        die engen Wege für Notfalländerungen und Experimente.
    es:
      title: Protocolo de Cambios
      summary: >-
        Define cómo cambian las reglas de la comunidad: cómo se propone, clasifica, revisa, adopta o
        rechaza, implementa y revierte un cambio — además de las vías estrechas para cambios de
        emergencia y experimentos.
    fr:
      title: Protocole de changement
      summary: >-
        Définit comment les règles de la communauté changent : comment un changement est proposé,
        classifié, examiné, adopté ou rejeté, mis en place et annulé — ainsi que les voies étroites
        pour les changements d'urgence et les expérimentations.
    pt-br:
      title: Protocolo de Mudanças
      summary: >-
        Define como as regras da comunidade mudam: como uma mudança é proposta, classificada,
        revisada, adotada ou rejeitada, implementada e revertida — além dos caminhos estreitos para
        mudanças de emergência e experimentos.
  mandatory: true
  sectionKeys:
    - change-protocol.how-changes-are-proposed
    - change-protocol.how-proposals-are-classified
    - change-protocol.review-and-deliberation
    - change-protocol.adoption-and-publication
    - change-protocol.rejection
    - change-protocol.transition-and-migration
    - change-protocol.rollback
    - change-protocol.emergency-changes
    - change-protocol.experiments
    - change-protocol.ratification-record
- key: experiment-template
  sourceId: 896b1777
  layer: 6
  order: 3
  i18n:
    en:
      title: Experiment Template
      summary: >-
        Experiments let the community try a change without permanently adopting it. To stay safe,
        every experiment must be time-bounded, labeled, and auto-expiring — and must record its
        results in the Learning Log.
    de:
      title: Experiment-Vorlage
      summary: >-
        Experimente erlauben es der Gemeinschaft, eine Änderung auszuprobieren, ohne sie dauerhaft
        zu übernehmen. Damit das sicher bleibt, muss jedes Experiment zeitlich begrenzt,
        gekennzeichnet und automatisch ablaufend sein — und seine Ergebnisse im Lernprotokoll
        festhalten.
    es:
      title: Plantilla de Experimento
      summary: >-
        Los experimentos permiten que la comunidad pruebe un cambio sin adoptarlo de forma
        permanente. Para mantener la seguridad, cada experimento DEBE estar acotado en el tiempo,
        etiquetado y con expiración automática — y DEBE registrar sus resultados en el Registro de
        Aprendizajes.
    fr:
      title: Modèle d'expérimentation
      summary: >-
        Les expérimentations permettent à la communauté d'essayer un changement sans l'adopter
        définitivement. Pour rester sûre, chaque expérimentation DOIT être limitée dans le temps,
        étiquetée et à expiration automatique — et DOIT consigner ses résultats dans le Journal
        d'apprentissage.
    pt-br:
      title: Modelo de Experimento
      summary: >-
        Experimentos permitem que a comunidade teste uma mudança sem adotá-la permanentemente. Para
        serem seguros, todos os experimentos devem ter prazo definido, estar rotulados e expirar
        automaticamente — e devem registrar seus resultados no Registro de Aprendizados (Learning
        Log).
  mandatory: false
  sectionKeys:
    - experiment-template.required-fields
    - experiment-template.expiry-and-renewal
    - experiment-template.outcome-record-filled-in-at-experiment-end
- key: learning-log
  sourceId: 9a3f7c1e
  layer: 6
  order: 2
  i18n:
    en:
      title: Learning Log
      summary: >-
        Records major failures, adaptations, reversals, and systemic learnings. Repeated failure
        patterns must trigger structural review, not individual blame. Entries are prepended (most
        recent first).
    de:
      title: Lernprotokoll
      summary: >-
        Dokumentiert größere Fehler, Anpassungen, Rücknahmen und systemische Erkenntnisse.
        Wiederkehrende Fehlermuster müssen eine strukturelle Überprüfung auslösen, keine
        individuelle Schuldzuweisung. Einträge werden vorangestellt (neueste zuerst).
    es:
      title: Registro de Aprendizajes
      summary: >-
        Registra fallos importantes, adaptaciones, reversiones y aprendizajes sistémicos. Los
        patrones de fallo recurrentes DEBEN activar una revisión estructural, no culpa individual.
        Las entradas se añaden al inicio (las más recientes primero).
    fr:
      title: Journal d'apprentissage
      summary: >-
        Consigne les échecs majeurs, les adaptations, les retours en arrière et les apprentissages
        systémiques. Les schémas d'échec récurrents DOIVENT déclencher une revue structurelle, pas
        une mise en cause individuelle. Les entrées sont ajoutées en tête de liste (la plus récente
        en premier).
    pt-br:
      title: Registro de Aprendizado
      summary: >-
        Registra falhas importantes, adaptações, reversões e aprendizados sistêmicos. Padrões
        recorrentes de falha devem desencadear uma revisão estrutural, não a culpabilização
        individual. As entradas são adicionadas no topo (mais recentes primeiro).
  mandatory: true
  sectionKeys:
    - learning-log.what-constitutes-a-learnable-event
    - learning-log.entry-format
    - learning-log.yyyy-mm-dd-short-title
- key: version-history
  sourceId: 4c8e6d5b
  layer: 6
  order: 1
  i18n:
    en:
      title: Version History
      summary: >-
        The authoritative human-readable record of all adopted changes to your community's RCOS
        implementation. The currently active version is the most recent entry at the top of this
        file. Superseded rules remain accessible via version control.
    de:
      title: Versionshistorie
      summary: >-
        Das maßgebliche, menschenlesbare Protokoll aller übernommenen Änderungen an der
        RCOS-Implementierung eurer Gemeinschaft. Die aktuell gültige Version ist der neueste Eintrag
        am Anfang dieser Datei. Abgelöste Regeln bleiben über die Versionskontrolle zugänglich.
    es:
      title: Historial de Versiones
      summary: >-
        El registro legible por humanos y con carácter oficial de todos los cambios adoptados en la
        implementación RCOS de tu comunidad. La versión actualmente vigente es la entrada más
        reciente en la parte superior de este archivo. Las reglas sustituidas permanecen accesibles
        a través del control de versiones.
    fr:
      title: Historique des versions
      summary: >-
        Le registre officiel lisible par les humains de tous les changements adoptés dans
        l'implémentation RCOS de ta communauté. La version actuellement active est l'entrée la plus
        récente en haut de ce fichier. Les règles remplacées restent accessibles via le contrôle de
        version.
    pt-br:
      title: Histórico de Versões
      summary: >-
        O registro autoritativo legível por humanos de todas as mudanças adotadas na implementação
        RCOS da sua comunidade. A versão atualmente ativa é a entrada mais recente no topo deste
        arquivo. Regras substituídas permanecem acessíveis via controle de versão.
  mandatory: true
  sectionKeys:
    - version-history.entry-format
    - version-history.version-short-title
    - version-history.current-version-v0-0-repository-initialized
