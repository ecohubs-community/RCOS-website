- ref: '8.8'
  layer: 6
  i18n:
    en:
      title: Explicitness Rules
      inShort: >-
        How rules change, how versions work and how experiments end has to be explicit. How fast you
        innovate is your choice.
      questions:
        - id: pace
          question: Does RCOS expect us to keep changing?
          answer: >-
            No. The pace of innovation stays optional and out of scope; only the way change happens
            has to be explicit.
          ref: 8.8.3
    de:
      title: Explizitätsregeln
      inShort: >-
        Wie Regeln sich ändern, wie Versionen funktionieren und wie Experimente enden, muss
        ausdrücklich geregelt sein. Wie schnell ihr Neues ausprobiert, ist eure Entscheidung.
      questions:
        - id: pace
          question: Erwartet RCOS von uns, dass wir uns ständig verändern?
          answer: >-
            Nein. Das Tempo der Erneuerung bleibt optional und außerhalb des Geltungsbereichs; nur
            die Art, wie Veränderung geschieht, muss ausdrücklich geregelt sein.
          ref: 8.8.3
    es:
      title: Reglas de explicitud
      inShort: >-
        Cómo cambian las reglas, cómo funcionan las versiones y cómo terminan los experimentos tiene
        que ser explícito. La velocidad a la que innovan es su decisión.
      questions:
        - id: pace
          question: ¿RCOS espera que sigamos cambiando?
          answer: >-
            No. El ritmo de innovación queda opcional y fuera del alcance; solo la forma en que
            ocurre el cambio tiene que ser explícita.
          ref: 8.8.3
    fr:
      title: Règles d'explicitation
      inShort: >-
        La manière dont les règles changent, le fonctionnement des versions et la façon dont les
        expérimentations prennent fin doivent être explicites. La vitesse à laquelle vous innovez
        est votre choix.
      questions:
        - id: pace
          question: RCOS attend-il de nous que nous changions continuellement ?
          answer: >-
            Non. Le rythme de l'innovation reste optionnel et hors périmètre ; seule la manière dont
            le changement se produit doit être explicite.
          ref: 8.8.3
    pt-br:
      title: Regras de Explicitude
      inShort: >-
        Como as regras mudam, como as versões funcionam e como os experimentos terminam tem que ser
        explícito. O ritmo da inovação é escolha de vocês.
      questions:
        - id: pace
          question: O RCOS espera que a gente esteja sempre mudando?
          answer: >-
            Não. O ritmo da inovação permanece opcional e fora do escopo; só a forma como a mudança
