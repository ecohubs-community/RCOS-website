# Site checks: types, lint and unit tests pass, the production build succeeds, every internal link and anchor
# in the prerendered pages resolves, and the Playwright suite passes against
# the built site (smoke tests, plus WCAG 2.1 A/AA via axe in both colour schemes).
#
# Locally: pnpm check && pnpm test:unit && pnpm build && pnpm check:links && pnpm test:e2e
name: Site

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      # Read through $env/static/public, so type checks, tests and the build
      # all need it.
      PUBLIC_APP_URL: https://rcos.ecohubs.community
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Types and lint
        run: |
          pnpm check
          pnpm exec eslint .
          pnpm exec prettier --check .

      - name: Unit tests
        run: pnpm test:unit

      - name: Build
        run: pnpm build

      - name: Internal links and anchors
        run: pnpm check:links

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: End-to-end and accessibility
        run: pnpm test:e2e

      - name: Keep the Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: test-results/
          retention-days: 7
