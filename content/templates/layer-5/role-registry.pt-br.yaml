  functional-roles:
    title: Papéis Funcionais
    blocks:
      rationale:
        summary: Por que separar papéis funcionais dos operacionais?
        body: Nem toda contribuição precisa de autoridade delegada — a maior parte do trabalho é sobre fazer, não decidir. Papéis funcionais nomeiam escopos de contribuição sem agregar poder de governança, para que os membros possam aderir ao trabalho sem uma transferência de autoridade e para que o sistema de governança permaneça claro sobre quem pode agir em nome da comunidade.
      instructions:
        summary: Como preencher
        body: Para cada papel funcional, defina propósito, escopo, interfaces, elegibilidade e transição. Papéis funcionais não requerem votação para serem assumidos — a declaração é suficiente.
      m1:
        md: Papéis funcionais definem o escopo de contribuição de um membro. Eles não carregam autoridade delegada de governança além dos direitos de Membro Pleno. Qualquer Membro Pleno PODE assumir um papel funcional ao declará-lo; nenhuma votação é exigida. Os papéis podem ser deixados a qualquer momento mediante notificação.
      m2:
        md: '---'
      m3:
        md: '### _<Nome do Papel Funcional, ex.: Facilitador(a)>_'
      m4:
        md: |-
          - **Propósito:** _<propósito.>_
          - **Escopo de responsabilidade:** _<responsabilidades.>_
          - **Autoridade decisória:** _<apenas direitos de Membro Pleno.>_
          - **Interfaces:** _<outros papéis.>_
          - **Critérios de elegibilidade:** _<Membro Pleno; quaisquer preferências adicionais.>_
          - **Mandato / rotação:** _<contínuo até ser deixado.>_
          - **Processo de nomeação:** _<autodeclaração.>_
          - **Revisão e remoção:** _<PODE ser deixado a qualquer momento; substituição por conflito de interesse conforme a Camada 4, se relevante.>_
          - **Transição:** _<compromissos ativos a serem informados.>_
      m5:
        md: '---'
      m6:
        md: '### _<Adicione papéis funcionais adicionais conforme necessário.>_'
      m7:
        md: '---'
