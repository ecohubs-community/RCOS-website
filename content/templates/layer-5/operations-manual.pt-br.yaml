lang: pt-br
sourceHash: c9649562
title: Manual de Operações
preamble: |-
  - **Camada:** 5 — Operações e Coordenação
  - **Status:** Modelo — adapte para a sua comunidade
  - **Referência RCOS:** [§7.1](rcos:§7.1), [§7.3](rcos:§7.3), [§7.4](rcos:§7.4), [§7.5](rcos:§7.5), [§7.6](rcos:§7.6)

  ---
sections:
  core-operational-processes:
    title: Processos Operacionais Essenciais
    blocks:
      rationale:
        summary: Por que documentar processos críticos?
        body: Se um processo só existe na cabeça de uma pessoa, a comunidade depende dela aparecer — para sempre. Escrever os processos críticos, com pessoas responsáveis nomeadas, é o que transforma conhecimento privado em um ativo comunitário que sobrevive a transições, ausências e saídas.
      instructions:
        summary: Como preencher
        body: Para cada processo crítico recorrente (acolhimento, saída, publicação de propostas, registro de contribuições, cadência de reuniões, gestão de tesouraria, revisão de acesso a plataformas), nomeie uma pessoa responsável e uma breve descrição.
      m1:
        md: |-
          | Processo | Quem | Detalhe |
          |---|---|---|
          | _<Acolhimento de membros>_ | _<papel>_ | _<ver Protocolo de Acolhimento (Camada 1)>_ |
          | _<Saída de membros>_ | _<papel>_ | _<ver Protocolo de Saída e Separação (Camada 1)>_ |
          | _<Publicação de propostas>_ | _<papel>_ | _<ver Protocolo de Governança (Camada 2)>_ |
          | _<Registro de contribuições>_ | _<papel>_ | _<ver Protocolo de Economia Interna (Camada 3)>_ |
          | _<Reunião recorrente>_ | _<facilitador(a)>_ | _<publicação de pauta; notas; acompanhamento de ações>_ |
          | _<Gestão de tesouraria>_ | _<responsável financeiro>_ | _<ver Regulamento de Tesouraria (Camada 3)>_ |
          | _<Revisão de acesso a plataformas>_ | _<responsável por infraestrutura>_ | _<cadência de revisão; revogação de acesso de membros que saíram>_ |
  temporary-and-ad-hoc-responsibilities:
    title: Responsabilidades Temporárias e Ad-Hoc
    blocks:
      rationale:
        summary: Por que limitar as responsabilidades temporárias?
        body: Tarefas ad-hoc silenciosamente se cristalizam em trabalhos permanentes não remunerados — geralmente sobre quem disse sim uma vez. Um prazo rígido e uma revisão obrigatória fazem a diferença entre "cobri por uma semana" e "aparentemente esse é o meu papel agora".
      instructions:
        summary: Como preencher
        body: Estabeleça que qualquer responsabilidade temporária DEVE ter prazo definido na atribuição, ser documentada, revisada antes da expiração e formalizada ou encerrada.
      m1:
        md: 'Quando uma tarefa ou responsabilidade for atribuída temporariamente, ela DEVE ser:'
      m2:
        md: |-
          - _<Explicitamente limitada no tempo desde o início (data final específica ou condição de conclusão).>_
          - _<Documentada como temporária no momento da atribuição.>_
          - _<Revisada antes da data final; convertida em papel formal ou encerrada.>_
      m3:
        md: _<Duração máxima de qualquer responsabilidade temporária antes que precise ser formalmente atribuída ou encerrada — por exemplo, 90 dias.>_ Se uma responsabilidade temporária não tiver responsável após sua data final, ela expira; não é transferida implicitamente.
      m4:
        md: '---'
  role-and-domain-interfaces:
    title: Interfaces entre Papéis e Domínios
    blocks:
      rationale:
        summary: Por que mapear as transições explicitamente?
        body: A maioria das falhas operacionais não acontece dentro de um papel, mas entre papéis — nas fronteiras onde o trabalho passa de um responsável para outro. Nomear as transições transforma dependências invisíveis em revisáveis e evita falhas do tipo "achei que você tivesse cuidado disso".
      instructions:
        summary: Como preencher
        body: Para cada par de papéis que passa trabalho entre si, nomeie a transição e o tipo de trabalho transferido.
      m1:
        md: |-
          | De | Para | Transição |
          |---|---|---|
          | _<papel>_ | _<papel>_ | _<o que é entregue>_ |
          | _<papel>_ | _<papel>_ | _<...>_ |
  workload-boundaries:
    title: Limites de Carga de Trabalho
    blocks:
      rationale:
        summary: Por que tornar os limites de carga explícitos?
        body: Carga de coordenação sem limites é o modo padrão de falha de comunidades voluntárias — ela silenciosamente esgota as pessoas mais comprometidas até que elas saiam. Limites explícitos e revisáveis fazem da capacidade uma preocupação compartilhada em vez de um fardo privado.
      instructions:
        summary: Como preencher
        body: Defina limites para carga de reuniões, carga de papéis, expectativas de tempo de resposta e o caminho para renegociar responsabilidades.
      m1:
        md: |-
          - **Carga de reuniões:** _<cadência das reuniões recorrentes e duração máxima; regras para reuniões extraordinárias.>_
          - **Carga de papéis:** _<limite, se houver; regra para sinalizar sobrecarga; janela de resolução.>_
          - **Expectativas de tempo de resposta:** _<assíncrono não urgente; operacional urgente; crítico para a segurança.>_
          - **Renegociação e alívio:** _<processo para redistribuir responsabilidades; janela de resolução.>_
          - **Sobrecarga persistente:** _<como a sobrecarga persistente, o risco de esgotamento, a não participação crônica ou a dependência de pessoas que assumem funções em excesso são detectados, e como são encaminhados ao processo de revisão ou reparação da Camada 4.>_
  operational-continuity:
    title: Continuidade Operacional
    blocks:
      rationale:
        summary: Por que planejar a continuidade agora?
        body: Uma comunidade que depende de uma pessoa insubstituível está a uma doença, um conflito ou uma saída do colapso. Nomear os pontos únicos de falha — honestamente — e incorporar a transição em cada papel é o que mantém a comunidade sobrevivendo aos seus fundadores.
      instructions:
        summary: Como preencher
        body: Nomeie os atuais pontos únicos de falha honestamente. Estabeleça a exigência de transição para cada papel e a cadência de revisão da continuidade.
      m1:
        md: |-
          - **Estado atual:** _<lista honesta de pontos únicos de falha; plano de recrutamento para reduzir a concentração.>_
          - **Mecanismos de transição:** _<consulte as exigências de transição por papel no Registro de Papéis; a transição DEVE ser concluída antes que um papel seja desocupado.>_
          - **Cadência de revisão da continuidade:** _<trimestral; ad hoc em caso de mudança de papel.>_
  information-flow-and-anti-gatekeeping:
    title: Fluxo de Informação e Antibloqueio de Acesso
    blocks:
      rationale:
        summary: Por que tratar o acesso à informação como uma questão de governança?
        body: Quem controla o acesso à informação controla a comunidade, querendo ou não. Tornar as regras de acesso explícitas — e proibir pontos únicos de acesso — é o que impede que guardiões informais acumulem o tipo de poder que o sistema de governança deveria conter.
      instructions:
        summary: Como preencher
        body: Estabeleça quais registros são abertos a todos os Membros Plenos, a janela de resposta para solicitações de informação e a regra contra pontos únicos de acesso a informações relevantes para a governança.
      m1:
        md: |-
          - _<Decisões de governança acessíveis a todos os Membros Plenos.>_
          - _<Notas de reuniões publicadas em até X horas.>_
          - _<Estado de adesão e atribuições de papéis acessíveis.>_
          - _<Registros de contribuições acessíveis.>_
          - _<Janela de resposta para solicitações de informação.>_
          - _<Negar acesso a informações às quais os membros têm direito é um gatilho de responsabilização sob a Camada 4.>_
          - _<Nenhum papel ou indivíduo PODE ser o único ponto de acesso a informações requeridas por outros responsáveis por papéis.>_
      m2:
        md: '---'
  documentation-locations-and-update-procedures:
    title: Localização da Documentação e Procedimentos de Atualização
    blocks:
      rationale:
        summary: Por que nomear onde cada documento vive?
        body: Se ninguém consegue dizer onde mora a versão canônica de algo, não há versão canônica. Nomear a localização, a pessoa responsável e a cadência de revisão para cada tipo de documento é o que torna a memória da comunidade auditável em vez de folclórica.
      instructions:
        summary: Como preencher
        body: Para cada tipo de documento, nomeie a localização canônica, a pessoa responsável e a cadência de revisão.
      m1:
        md: |-
          | Tipo de documento | Localização | Responsável | Cadência de revisão |
          |---|---|---|---|
          | _<Artefatos RCOS>_ | _<localização>_ | _<responsável>_ | _<cadência>_ |
          | _<Registro de membros>_ | _<localização>_ | _<responsável>_ | _<cadência>_ |
          | _<Notas de reuniões>_ | _<localização>_ | _<responsável>_ | _<cadência>_ |
          | _<Propostas de governança>_ | _<localização>_ | _<responsável>_ | _<cadência>_ |
          | _<Registros de contribuições>_ | _<localização>_ | _<responsável>_ | _<cadência>_ |
      m2:
        md: '---'
  ratification-record:
    title: Registro de Ratificação
    blocks:
      m1:
        md: |-
          - **Adotado em:** <AAAA-MM-DD>
          - **Tipo de decisão:** Estratégica
          - **Versão:** <versão>
          - **Registro da decisão:** <link para o registro da decisão>
