lang: de
sourceHash: e8e18914
title: Rollenverzeichnis
preamble: |-
  - **Ebene:** 5 — Betrieb & Koordination
  - **Status:** Vorlage — an eure Gemeinschaft anpassen
  - **RCOS-Referenz:** [§7.1](rcos:§7.1), [§7.6](rcos:§7.6)

  ---
sections:
  overview:
    title: Überblick
    blocks:
      rationale:
        summary: Warum muss jede Verantwortung einer benannten Rolle zugeordnet sein?
        body: Laufende Verantwortlichkeiten ohne explizite Rollen werden zu unsichtbarer Arbeit — erledigt von wem auch immer es auffällt, still hingenommen und unmöglich zu übergeben. Jede laufende Verantwortung zu einer benannten, rechenschaftspflichtigen Rolle zu machen, verhindert, dass die Gemeinschaft auf dem unbezahlten Wohlwollen einiger weniger Mitglieder läuft.
      instructions:
        summary: Wie ihr das ausfüllt
        body: Unterscheidet operative Rollen (mit delegierter Autorität gemäß der Entscheidungsmatrix) von funktionalen Rollen (beitragsbezogen, ohne besondere Governance-Autorität). Legt die Definition von „in gutem Status" fest, die ihr für die Berechtigung verwenden werdet.
      m1:
        md: Dieses Verzeichnis definiert alle anerkannten Rollen innerhalb der Gemeinschaft. Rollen sind entweder **operativ** (mit delegierter Autorität gemäß der Entscheidungsmatrix) oder **funktional** (beitragsbezogen, ohne besondere Governance-Autorität über die Rechte als Vollmitglied hinaus).
      m2:
        md: '> **„In gutem Status"** bedeutet ein Vollmitglied, das seine Mitwirkungserwartungen in den letzten _<Zeitraum>_ erfüllt hat und derzeit keinem aktiven Rechenschaftsprozess oder Konfliktprüfung nach Schicht 4 unterliegt.'
      m3:
        md: '---'
  summary-table:
    title: Übersichtstabelle
    blocks:
      m1:
        md: |-
          | Rolle | Typ | Aktuelle\*r Inhaber\*in |
          |---|---|---|
          | _<Rollenname>_ | _<Operativ / Funktional>_ | _<Inhaber\*in oder „Vakant">_ |
          | _<...>_ | _<...>_ | _<...>_ |
      m2:
        md: '---'
  operational-roles:
    title: Operative Rollen
    blocks:
      rationale:
        summary: Warum Rechenschaftspflicht für delegierte Autorität definieren?
        body: 'Operative Rollen tragen echte Macht — sie können innerhalb ihres Zuständigkeitsbereichs ohne Gemeinschaftsabstimmung handeln. Diese Macht bleibt nur sicher, wenn jede Rolle einen klaren Rechenschaftsmechanismus hat: Wer kann Bedenken äußern, wie läuft die Überprüfung ab, und wie kann eine Rolle neu besetzt werden, wenn das Vertrauen bricht.'
      instructions:
        summary: Wie ihr das ausfüllt
        body: Füllt für jede operative Rolle die untenstehende Vorlage mit konkretem Zuständigkeitsbereich, Entscheidungsbefugnis, Schnittstellen, Berechtigungskriterien, Amtszeit, Ernennung, Überprüfung/Abberufung und Übergabeanforderungen aus.
      m1:
        md: Operative Rollen tragen delegierte Autorität, innerhalb explizit definierter Grenzen ohne Vollmitglieder-Abstimmung zu handeln, wie in der Entscheidungsmatrix (Schicht 2) festgelegt. Alle Inhaber\*innen operativer Rollen sind der Gesamtheit der Vollmitglieder rechenschaftspflichtig. Jedes Vollmitglied darf Bedenken darüber äußern, wie eine Rolle ausgeübt wird; eine Neubesetzung erfordert eine Strategische Abstimmung.
      m2:
        md: '---'
      m3:
        md: '### _<Name der operativen Rolle, z. B. Mitgliederverwaltung>_'
      m4:
        md: |-
          - **Zweck:** _<Zweck in einem Satz.>_
          - **Zuständigkeitsbereich:** _<konkrete Verantwortlichkeiten.>_
          - **Entscheidungsbefugnis:** _<welche Entscheidungen in der Entscheidungsmatrix diese Rolle ausführt; explizite Grenzen.>_
          - **Schnittstellen:** _<andere Rollen, an die diese Rolle übergibt oder von denen sie empfängt.>_
          - **Berechtigungskriterien:** _<Vollmitglied in gutem Status; ggf. weitere Kriterien.>_
          - **Amtszeit / Rotation:** _<fortlaufend / rotierend / befristet.>_
          - **Ernennungsverfahren:** _<wie die Rolle besetzt wird.>_
          - **Überprüfung und Abberufung:** _<wie Bedenken vorgebracht werden; Neubesetzung per Strategischer Abstimmung.>_
          - **Übergabe:** _<was vor dem Verlassen der Rolle übergeben werden muss.>_
      m5:
        md: '---'
      m6:
        md: '### _<Name der operativen Rolle, z. B. Finanzverantwortliche\*r>_'
      m7:
