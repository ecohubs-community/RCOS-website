          - **Schnittstellen:** _<andere Rollen.>_
          - **Berechtigungskriterien:** _<Vollmitglied in gutem Status.>_
          - **Amtszeit / Rotation:** _<...>_
          - **Ernennungsverfahren:** _<...>_
