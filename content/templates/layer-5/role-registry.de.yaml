  functional-roles:
    title: Funktionale Rollen
    blocks:
      rationale:
        summary: Warum funktionale von operativen Rollen trennen?
        body: Nicht jeder Beitrag braucht delegierte Autorität — die meiste Arbeit dreht sich ums Tun, nicht ums Entscheiden. Funktionale Rollen benennen Beitragsbereiche, ohne Governance-Macht zu bündeln, sodass Mitglieder sich in Arbeit einbringen können, ohne eine Autoritätsübertragung, und damit das Governance-System klar bleibt, wer im Namen der Gemeinschaft handeln darf.
      instructions:
        summary: Wie ihr das ausfüllt
        body: Definiert für jede funktionale Rolle Zweck, Zuständigkeitsbereich, Schnittstellen, Berechtigung und Übergabe. Funktionale Rollen erfordern keine Abstimmung zur Übernahme — eine Erklärung genügt.
      m1:
        md: Funktionale Rollen definieren den Beitragsbereich eines Mitglieds. Sie tragen keine delegierte Governance-Autorität über die Rechte als Vollmitglied hinaus. Jedes Vollmitglied kann eine funktionale Rolle durch Erklärung übernehmen; eine Abstimmung ist nicht erforderlich. Rollen können jederzeit durch Benachrichtigung niedergelegt werden.
      m2:
        md: '---'
      m3:
        md: '### _<Name der funktionalen Rolle, z. B. Moderation>_'
      m4:
        md: |-
          - **Zweck:** _<Zweck.>_
          - **Zuständigkeitsbereich:** _<Verantwortlichkeiten.>_
          - **Entscheidungsbefugnis:** _<nur Vollmitglieder-Rechte.>_
          - **Schnittstellen:** _<andere Rollen.>_
          - **Berechtigungskriterien:** _<Vollmitglied; ggf. weitere Präferenzen.>_
          - **Amtszeit / Rotation:** _<fortlaufend bis zur Niederlegung.>_
          - **Ernennungsverfahren:** _<Selbsterklärung.>_
          - **Überprüfung und Abberufung:** _<kann jederzeit niedergelegt werden; Befangenheitsvertretung gemäß Schicht 4 falls relevant.>_
          - **Übergabe:** _<laufende Verpflichtungen einweisen.>_
      m5:
        md: '---'
      m6:
        md: '### _<Weitere funktionale Rollen nach Bedarf hinzufügen.>_'
