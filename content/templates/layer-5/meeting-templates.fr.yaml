lang: fr
sourceHash: 7c2a4167
title: Modèles de réunion
preamble: |-
  - **Couche :** 5 — Opérations & Coordination
  - **Statut :** Modèle — à adapter pour ta communauté
  - **Référence RCOS :** [§7.2](/articles/rcos-core/v0-1/layer-5-operations-coordination#72-meeting-system), [§7.6](/articles/rcos-core/v0-1/layer-5-operations-coordination#76-artifacts)

  > Les modèles de réunion déclarent l'objectif, le périmètre de décision, le quorum et la structure de chaque type de réunion. Une réunion sans modèle déclaré finira, avec le temps, par accumuler une autorité qu'elle ne devrait pas avoir. Adapte ces modèles et ajoute ou supprime des types de réunion selon les besoins de ta communauté.

  ---
sections:
  meeting-type-operations:
    title: 'Type de réunion : Opérations'
    blocks:
      rationale:
        summary: Pourquoi une réunion Opérations régulière ?
        body: 'La coordination au quotidien a besoin d''un rythme régulier, pas d''improvisation ad hoc. La réunion Opérations est le pouls de la communauté — un espace prévisible pour passer en revue le travail en cours, faire remonter les blocages et prendre de petites décisions opérationnelles. Point crucial : seules les décisions Opérationnelles sont prises ici ; les décisions Stratégiques et Constitutionnelles passent par le processus de gouvernance, de sorte que la réunion ne peut pas accumuler discrètement une autorité qu''elle n''a pas.'
      instructions:
        summary: Comment remplir ce modèle
        body: Définis l'objectif, le périmètre de décision, les participants requis et optionnels, la cadence, la durée et les règles de facilitation. Limite le périmètre de décision aux décisions Opérationnelles uniquement.
      m1:
        md: |-
          - **Objectif :** _<passer en revue le travail en cours, coordonner les tâches, faire remonter les blocages, prendre des décisions opérationnelles.>_
          - **Périmètre de décision :** Décisions opérationnelles uniquement — ne peut pas prendre de décisions Stratégiques ou Constitutionnelles.
          - **Participants requis :** _<qui est invité ; quorum minimum.>_
          - **Participants optionnels :** _<qui peut assister sur invitation.>_
          - **Cadence :** _<hebdomadaire / bimensuelle / mensuelle.>_
          - **Durée limite :** _<p. ex. 90 minutes maximum.>_
          - **Facilitation :** _<rôle de facilitateur·rice ; règle de remplacement.>_
      m2:
        md: '### Structure de l''ordre du jour'
      m3:
        md: |-
          1. **Tour d'ouverture** _<durée>_
          2. **Revue des actions précédentes** _<durée>_
          3. **Mises à jour des rôles et domaines** _<durée>_
          4. **Points actifs à l'ordre du jour** _<durée>_
          5. **Décisions opérationnelles** _<durée>_
          6. **Prochaines actions et responsables** _<durée>_
          7. **Tour de clôture** _<durée ; optionnel>_
      m4:
        md: '### Notes et comptes rendus'
      m5:
        md: |-
          - **Date :**
          - **Facilitateur·rice :**
          - **Participant·es :**
          - **Notes :**
      m6:
        md: '### Registre de décision (le cas échéant)'
      m7:
        md: |-
          - **Type de décision :** Opérationnelle
          - **Autorité :** _<titulaire du rôle selon la Matrice de décision>_
          - **Mécanisme / seuil :** Autorité déléguée
          - **Résultat :** _<ce qui a été décidé>_
          - **Date d'effet :**
          - **Classé dans :** _<emplacement>_
      m8:
        md: '---'
  meeting-type-governance:
    title: 'Type de réunion : Gouvernance'
    blocks:
      rationale:
        summary: Pourquoi séparer la délibération du vote contraignant ?
        body: Si une réunion peut à la fois discuter et décider, ce sont les personnes présentes ce jour-là qui décident — indépendamment des règles de quorum ou d'autorité. Séparer la délibération du vote contraignant préserve l'intégrité de la Matrice de décision et garantit que les membres absents conservent leur droit de vote.
      instructions:
        summary: Comment remplir ce modèle
        body: Cette réunion délibère sur les propositions actives pendant leur période de délibération. La décision contraignante est prise via le processus de gouvernance conformément à la Matrice de décision.
      m1:
        md: |-
          - **Objectif :** Délibérer sur une proposition active pendant sa période de délibération.
          - **Périmètre de décision :** Délibération uniquement — la décision contraignante est prise via le processus de gouvernance conformément à la Matrice de décision.
          - **Participants requis :** _<tous les Membres titulaires sont invités ; le·la porteur·se de la proposition doit être présent·e.>_
          - **Participants optionnels :** _<qui peut observer.>_
          - **Cadence :** _<selon les besoins pendant les périodes de délibération.>_
          - **Durée limite :** _<p. ex. 60 minutes maximum.>_
          - **Facilitation :** _<rôle de facilitateur·rice.>_
      m2:
        md: '### Structure de l''ordre du jour'
      m3:
        md: |-
          1. **Tour d'ouverture** _<durée>_
          2. **Résumé de la proposition** _<durée — le·la porteur·se présente la proposition : ce qu'elle change, pourquoi, et les alternatives envisagées.>_
          3. **Questions de clarification** _<durée — questions factuelles uniquement ; pas encore de plaidoyer.>_
          4. **Délibération ouverte** _<durée.>_
          5. **Synthèse des positions et prochaines étapes** _<durée — le·la facilitateur·rice résume ; confirme le calendrier de vote.>_
      m4:
        md: '### Notes et comptes rendus'
      m5:
        md: |-
          - **Date :**
          - **Facilitateur·rice :**
          - **Participant·es :**
          - **Notes :**
      m6:
        md: '### Registre de décision'
      m7:
        md: |-
          - **Référence de la proposition :** _<lien vers la proposition>_
          - **Type de décision :** _<Stratégique / Constitutionnelle>_
          - **Autorité :** Membres titulaires (collectif)
          - **Mécanisme / seuil :** _<mécanisme de vote + seuil>_
          - **Résultat :** _<Adoptée / Rejetée / Reportée>_
          - **Date d'effet :**
          - **Lien du vote :**
      m8:
        md: '---'
  meeting-type-coordination-alignment:
    title: 'Type de réunion : Coordination & Alignement'
    blocks:
      rationale:
        summary: Pourquoi une réunion de coordination dédiée ?
        body: Certains blocages impliquent plusieurs rôles et ne peuvent pas être résolus dans le rythme régulier des Opérations. La réunion Coordination & Alignement offre aux travaux transversaux leur propre espace — pour les dépendances, les passages de relais et les priorités concurrentes — afin que la réunion hebdomadaire ne s'étire pas en essayant de tout absorber.
      instructions:
        summary: Comment remplir ce modèle
        body: Utilise ce modèle lorsqu'une coordination entre rôles est nécessaire. Limite le périmètre de décision aux décisions Opérationnelles uniquement et restreins les participants requis à ceux ayant des initiatives actives.
      m1:
        md: |-
          - **Objectif :** Synchroniser le travail entre les rôles et les initiatives ; faire remonter les dépendances et les blocages ; aligner les priorités.
          - **Périmètre de décision :** Décisions opérationnelles uniquement.
          - **Participants requis :** _<titulaires de rôles avec des initiatives actives.>_
          - **Participants optionnels :** _<tous les Membres titulaires sont les bienvenus.>_
          - **Cadence :** _<mensuelle ou selon les besoins.>_
          - **Durée limite :** _<p. ex. 60 minutes.>_
          - **Facilitation :** _<facilitateur·rice ; règle de remplacement.>_
      m2:
        md: '### Structure de l''ordre du jour'
      m3:
        md: |-
          1. **Tour d'ouverture** _<durée>_
          2. **Mises à jour de l'avancement des initiatives** _<durée>_
          3. **Blocages et dépendances** _<durée>_
          4. **Prochaines étapes** _<durée>_
      m4:
        md: '### Notes et comptes rendus'
      m5:
        md: |-
          - **Date :**
          - **Facilitateur·rice :**
          - **Participant·es :**
          - **Notes :**
      m6:
        md: '---'
  meeting-type-reflection-learning:
    title: 'Type de réunion : Réflexion & Apprentissage'
    blocks:
      rationale:
        summary: Pourquoi accorder à la réflexion son propre type de réunion ?
        body: La réflexion qui n'a lieu que quand le temps le permet n'a jamais lieu. Un type de réunion nommé avec une cadence définie crée l'espace pour regarder en arrière — et empêche la rétrospection d'être éclipsée par l'urgence opérationnelle. Sans cela, le Journal d'apprentissage (Couche 6) reste vide et le cadre cesse d'évoluer.
      instructions:
        summary: Comment remplir ce modèle
        body: Cette réunion passe en revue la période la plus récente et alimente le Journal d'apprentissage (Couche 6) et la file des Propositions futures.
      m1:
        md: |-
          - **Objectif :** Passer en revue l'expérience, repérer des schémas récurrents, capturer les apprentissages, réinjecter les enseignements dans le cadre.
          - **Périmètre de décision :** Peut produire des propositions de changement ; pas d'autorité de décision directe sauf si spécifié dans la Matrice de décision.
          - **Participants requis :** _<tous les Membres titulaires sont invités.>_
          - **Cadence :** _<trimestrielle.>_
          - **Durée limite :** _<p. ex. 90 minutes.>_
          - **Facilitation :** _<rôle de facilitateur·rice.>_
      m2:
        md: '### Structure de l''ordre du jour'
      m3:
        md: |-
          1. **Tour d'ouverture** _<durée>_
          2. **Faits marquants de la période** _<durée>_
          3. **Ce qui a bien fonctionné** _<durée>_
          4. **Ce qui n'a pas fonctionné / ce que nous ferions différemment** _<durée ; pas de blâme, se concentrer sur les schémas.>_
          5. **Apprentissages à retenir** _<durée ; identifier les entrées du Journal d'apprentissage.>_
          6. **Mises à jour du journal d'apprentissage et propositions futures** _<durée.>_
          7. **Tour de clôture** _<durée>_
      m4:
        md: '### Notes et comptes rendus'
      m5:
        md: |-
          - **Date :**
          - **Facilitateur·rice :**
          - **Participant·es :**
          - **Notes :**
          - **Entrées du Journal d'apprentissage déclenchées :** _<liste ou « aucune »>_
          - **Propositions futures ajoutées :** _<liste ou « aucune »>_
      m6:
        md: '---'
  meeting-type-conflict-handling:
    title: 'Type de réunion : Traitement des conflits'
    blocks:
      clauses:
        note: ' ; voir aussi Couche 4 — [Échelle de résolution des conflits](/articles/rcos-core/v0-1/layer-4-conflict-repair-accountability#62-resolution-pathways)'
      rationale:
        summary: Pourquoi un type de réunion distinct pour les conflits ?
        body: 'Le travail sur les conflits obéit à des règles que les autres réunions n''ont pas : confidentialité, sélection du·de la facilitateur·rice qui contourne les préférences des parties, protections contre les représailles et registres restreints. Utiliser le modèle Opérations pour une session de conflit violerait discrètement toutes ces règles. Un modèle dédié rend le cadre différent visible dès la première minute.'
      instructions:
        summary: Comment remplir ce modèle
        body: Utilise ce modèle uniquement pour les sessions facilitées relevant des étapes 2 à 4 de l'Échelle de résolution des conflits. Les règles de confidentialité et de sélection du·de la facilitateur·rice sont régies par la Couche 4, pas par la réunion elle-même.
      m1:
        md: |-
          - **Objectif :** Faciliter la résolution à une étape définie de l'échelle (Échelle de résolution des conflits, étapes 2 à 4).
          - **Périmètre de décision :** Produit des plans de réparation, des accords ou des décisions d'escalade ; les résultats contraignants nécessitent l'autorité définie dans l'Échelle de résolution des conflits et la Matrice de décision.
          - **Participants requis :** Les parties au conflit ; facilitateur·rice désigné·e (selon les règles de sélection de l'Échelle de résolution des conflits).
          - **Participants optionnels :** Une personne de soutien, avec le consentement écrit mutuel de toutes les parties.
          - **Cadence :** Selon les besoins ; déclenchée par la prise en charge.
          - **Durée limite :** _<typiquement 60 à 90 minutes ; le·la facilitateur·rice peut prolonger.>_
          - **Facilitation :** Sélectionné·e selon l'Échelle de résolution des conflits (Couche 4) — non choisi·e par les parties elles-mêmes.
      m2:
        md: '> **Note de confidentialité :** Les registres de ce type de réunion sont soumis aux limites de confidentialité et d''accès à l''information définies dans l''Échelle de résolution des conflits (Couche 4). Ils ne sont pas publiés dans le registre général des membres par défaut.'
      m3:
        md: '### Structure de l''ordre du jour'
      m4:
        md: |-
          1. **Ouverture et règles de base** _<durée ; consentement, confidentialité, non-représailles, droit de pause.>_
          2. **Chaque partie partage sa perspective** _<sans interruption ; temps égal.>_
          3. **Vérification de la compréhension partagée** _<durée.>_
          4. **Besoins et demandes** _<durée.>_
          5. **Options de réparation ou d'accord** _<durée.>_
          6. **Décision ou prochaine étape** _<durée.>_
          7. **Documentation** _<durée ; enregistrement selon les règles de confidentialité de la Couche 4.>_
      m5:
        md: '### Format du registre'
      m6:
        md: '> Ce registre est confidentiel. L''accès est restreint conformément à l''Échelle de résolution des conflits (Couche 4).'
      m7:
        md: |-
          - **Date :**
          - **Facilitateur·rice :**
          - **Parties présentes :**
          - **Étape de l'échelle :**
          - **Classe du conflit :**
          - **Résultat :** _<Accord trouvé / Escaladé à l'étape suivante / Ajourné>_
          - **Actions convenues (le cas échéant) :**
          - **Destination de l'escalade (le cas échéant) :**
          - **Accès :** Parties et facilitateur·rice uniquement ; communiqué aux Membres titulaires uniquement en cas d'escalade à l'étape de gouvernance.
      m8:
        md: '---'
  ratification-record:
    title: Registre de ratification
    blocks:
      m1:
        md: |-
          - **Adoptée le :** <AAAA-MM-JJ>
          - **Type de décision :** Stratégique
          - **Version :** <version>
          - **Registre de décision :** <lien vers le registre de décision>
