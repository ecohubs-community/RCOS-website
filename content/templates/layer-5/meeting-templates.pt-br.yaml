lang: pt-br
sourceHash: 811085fd
title: Modelos de Reunião
preamble: |-
  - **Camada:** 5 — Operações e Coordenação
  - **Status:** Modelo — adapte para sua comunidade
  - **Referência RCOS:** [§7.2](rcos:§7.2), [§7.6](rcos:§7.6)

  > Os modelos de reunião declaram o propósito, o escopo de decisão, o quórum e a estrutura de cada tipo de reunião. Uma reunião sem um modelo declarado, com tempo suficiente, acumulará autoridade que não deveria ter. Adapte estes modelos e adicione ou remova tipos de reunião conforme sua comunidade precisar.

  ---
sections:
  meeting-type-operations:
    title: 'Tipo de Reunião: Operações'
    blocks:
      rationale:
        summary: Por que uma reunião regular de Operações?
        body: A coordenação do dia a dia precisa de uma cadência regular, não de improvisação ad-hoc. A reunião de Operações é o batimento cardíaco da comunidade — um espaço previsível para revisar o trabalho ativo, trazer à tona bloqueios e tomar pequenas decisões operacionais. Crucialmente, apenas decisões Operacionais acontecem aqui; as Estratégicas e Constitucionais passam pelo processo de governança, para que a reunião não acumule silenciosamente uma autoridade que não tem.
      instructions:
        summary: Como preencher
        body: Defina propósito, escopo de decisão, participantes obrigatórios e opcionais, cadência, duração e regras de facilitação. Mantenha o escopo de decisão apenas como Operacional.
      m1:
        md: |-
          - **Propósito:** _<revisar trabalho ativo, coordenar tarefas, trazer à tona bloqueios, tomar decisões operacionais.>_
          - **Escopo de decisão:** Apenas decisões operacionais — não pode tomar decisões Estratégicas ou Constitucionais.
          - **Participantes obrigatórios:** _<quem é convidado; quórum mínimo.>_
          - **Participantes opcionais:** _<quem pode comparecer mediante convite.>_
          - **Cadência:** _<semanal / quinzenal / mensal.>_
          - **Limite de duração:** _<ex.: 90 minutos no máximo.>_
          - **Facilitação:** _<papel do facilitador; regra de substituição.>_
      m2:
        md: '### Estrutura da Pauta'
      m3:
        md: |-
          1. **Check-in** _<duração>_
          2. **Revisão das ações anteriores** _<duração>_
          3. **Atualizações de papéis e domínios** _<duração>_
          4. **Itens ativos da pauta** _<duração>_
          5. **Decisões operacionais** _<duração>_
          6. **Próximas ações e responsáveis** _<duração>_
          7. **Check-out** _<duração; opcional>_
      m4:
        md: '### Notas e Registros'
      m5:
        md: |-
          - **Data:**
          - **Facilitador(a):**
          - **Presentes:**
          - **Notas:**
      m6:
        md: '### Registro de Decisão (se aplicável)'
      m7:
        md: |-
          - **Tipo de decisão:** Operacional
          - **Autoridade:** _<titular do papel conforme a Matriz de Decisão>_
          - **Mecanismo / limiar:** Autoridade delegada
          - **Resultado:** _<o que foi decidido>_
          - **Data de vigência:**
          - **Arquivado em:** _<localização>_
      m8:
        md: '---'
  meeting-type-governance:
    title: 'Tipo de Reunião: Governança'
    blocks:
      rationale:
        summary: Por que separar a deliberação da votação vinculante?
        body: Se uma reunião pode tanto discutir quanto decidir, quem estiver na sala naquele dia acaba decidindo — independentemente das regras de quórum ou autoridade. Manter a deliberação separada da votação vinculante preserva a integridade da Matriz de Decisão e garante que membros ausentes ainda tenham voto.
      instructions:
        summary: Como preencher
        body: Esta reunião delibera sobre propostas ativas durante seu período de deliberação. A decisão vinculante é tomada por meio do processo de governança conforme a Matriz de Decisão.
      m1:
        md: |-
          - **Propósito:** Deliberar sobre uma proposta ativa durante seu período de deliberação.
          - **Escopo de decisão:** Apenas deliberação — a decisão vinculante é tomada por meio do processo de governança conforme a Matriz de Decisão.
          - **Participantes obrigatórios:** _<todos os Membros Plenos convidados; o(a) proponente DEVE estar presente.>_
          - **Participantes opcionais:** _<quem pode observar.>_
          - **Cadência:** _<conforme necessário durante períodos de deliberação.>_
          - **Limite de duração:** _<ex.: 60 minutos no máximo.>_
          - **Facilitação:** _<papel do facilitador.>_
      m2:
        md: '### Estrutura da Pauta'
      m3:
        md: |-
          1. **Check-in** _<duração>_
          2. **Resumo da proposta** _<duração — o(a) proponente apresenta a proposta: o que muda, por quê, e alternativas consideradas.>_
          3. **Perguntas de esclarecimento** _<duração — apenas perguntas factuais; ainda sem defesa de posições.>_
          4. **Deliberação aberta** _<duração.>_
          5. **Resumo de posições e próximos passos** _<duração — o(a) facilitador(a) resume; confirma o cronograma da votação.>_
      m4:
        md: '### Notas e Registros'
      m5:
        md: |-
          - **Data:**
          - **Facilitador(a):**
          - **Presentes:**
          - **Notas:**
      m6:
        md: '### Registro de Decisão'
      m7:
        md: |-
          - **Referência da proposta:** _<link para a proposta>_
          - **Tipo de decisão:** _<Estratégica / Constitucional>_
          - **Autoridade:** Membros Plenos (coletivo)
          - **Mecanismo / limiar:** _<mecanismo de votação + limiar>_
          - **Resultado:** _<Aprovada / Rejeitada / Adiada>_
          - **Data de vigência:**
          - **Link da votação:**
      m8:
        md: '---'
  meeting-type-coordination-alignment:
    title: 'Tipo de Reunião: Coordenação e Alinhamento'
    blocks:
      rationale:
        summary: Por que uma reunião dedicada à coordenação?
        body: Alguns bloqueios atravessam mais de um papel e não podem ser resolvidos no ritmo regular de Operações. Coordenação e Alinhamento dá ao trabalho entre papéis seu próprio espaço — para dependências, transições e prioridades conflitantes — para que a reunião semanal não cresça desordenadamente tentando absorver tudo.
      instructions:
        summary: Como preencher
        body: Use este modelo quando for necessária coordenação entre papéis. Mantenha o escopo de decisão apenas como Operacional e limite os participantes obrigatórios àqueles com iniciativas ativas.
      m1:
        md: |-
          - **Propósito:** Sincronizar o trabalho entre papéis e iniciativas; trazer à tona dependências e bloqueios; alinhar prioridades.
          - **Escopo de decisão:** Apenas decisões operacionais.
          - **Participantes obrigatórios:** _<titulares de papéis com iniciativas ativas.>_
          - **Participantes opcionais:** _<todos os Membros Plenos são bem-vindos.>_
          - **Cadência:** _<mensal ou conforme necessário.>_
          - **Limite de duração:** _<ex.: 60 minutos.>_
          - **Facilitação:** _<facilitador(a); regra de substituição.>_
      m2:
        md: '### Estrutura da Pauta'
      m3:
        md: |-
          1. **Check-in** _<duração>_
          2. **Atualizações de status das iniciativas** _<duração>_
          3. **Bloqueios e dependências** _<duração>_
          4. **Próximos passos** _<duração>_
      m4:
        md: '### Notas e Registros'
      m5:
        md: |-
          - **Data:**
          - **Facilitador(a):**
          - **Presentes:**
          - **Notas:**
      m6:
        md: '---'
  meeting-type-reflection-learning:
    title: 'Tipo de Reunião: Reflexão e Aprendizado'
    blocks:
      rationale:
        summary: Por que dar à reflexão seu próprio tipo de reunião?
        body: A reflexão que só acontece quando o tempo permite nunca acontece. Um tipo de reunião nomeado e com cadência definida abre espaço para olhar para trás — e impede que a retrospectiva seja espremida pela urgência operacional. Sem ela, o Registro de Aprendizado (Camada 6) fica vazio e o framework para de evoluir.
      instructions:
        summary: Como preencher
        body: Esta reunião revisa o período mais recente e alimenta insights no Registro de Aprendizado (Camada 6) e na fila de Propostas Futuras.
      m1:
        md: |-
          - **Propósito:** Revisar a experiência, identificar padrões, capturar aprendizados, devolver insights ao framework.
          - **Escopo de decisão:** PODE gerar propostas de mudança; sem autoridade direta de decisão, salvo se especificado na Matriz de Decisão.
          - **Participantes obrigatórios:** _<todos os Membros Plenos convidados.>_
          - **Cadência:** _<trimestral.>_
          - **Limite de duração:** _<ex.: 90 minutos.>_
          - **Facilitação:** _<papel do facilitador.>_
      m2:
        md: '### Estrutura da Pauta'
      m3:
        md: |-
          1. **Check-in** _<duração>_
          2. **Destaques do período revisado** _<duração>_
          3. **O que funcionou bem** _<duração>_
          4. **O que não funcionou / o que faríamos diferente** _<duração; sem culpabilização, foco em padrões.>_
          5. **Aprendizados para levar adiante** _<duração; identifique entradas do Registro de Aprendizado.>_
          6. **Atualizações no registro de aprendizado e propostas futuras** _<duração.>_
          7. **Check-out** _<duração>_
      m4:
        md: '### Notas e Registros'
      m5:
        md: |-
          - **Data:**
          - **Facilitador(a):**
          - **Presentes:**
          - **Notas:**
          - **Entradas geradas no Registro de Aprendizado:** _<lista ou "nenhuma">_
          - **Propostas futuras adicionadas:** _<lista ou "nenhuma">_
      m6:
        md: '---'
  meeting-type-conflict-handling:
    title: 'Tipo de Reunião: Tratamento de Conflitos'
    blocks:
      clauses:
        note: ; ver também Camada 4 — [Escada de Resolução de Conflitos](rcos:§6.2)
      rationale:
        summary: Por que um tipo de reunião distinto para conflito?
        body: 'O trabalho com conflitos tem regras que outras reuniões não têm: confidencialidade, seleção do(a) Facilitador(a) que ignora a preferência das partes, proteções contra retaliação e registros restritos. Usar o modelo de Operações para uma sessão de conflito violaria silenciosamente todas elas. Um modelo dedicado torna o container diferente visível desde o primeiro minuto.'
      instructions:
        summary: Como preencher
        body: Use este modelo apenas para sessões facilitadas sob os Passos 2–4 da Escada de Resolução de Conflitos. As regras de privacidade e de seleção do(a) Facilitador(a) são regidas pela Camada 4, não pela própria reunião.
      m1:
        md: |-
          - **Propósito:** Facilitar a resolução em um passo definido da escada (Passos 2–4 da Escada de Resolução de Conflitos).
          - **Escopo de decisão:** Produz planos de reparo, acordos ou decisões de escalonamento; resultados vinculantes exigem a autoridade definida na Escada de Resolução de Conflitos e na Matriz de Decisão.
          - **Participantes obrigatórios:** Partes do conflito; Facilitador(a) designado(a) (conforme regras de seleção da Escada de Resolução de Conflitos).
          - **Participantes opcionais:** Uma pessoa de apoio, mediante consentimento mútuo por escrito de todas as partes.
          - **Cadência:** Conforme necessário; acionada por abertura de caso.
          - **Limite de duração:** _<tipicamente 60–90 minutos; o(a) Facilitador(a) PODE estender.>_
          - **Facilitação:** Selecionada conforme a Escada de Resolução de Conflitos (Camada 4) — não escolhida pelas próprias partes.
      m2:
        md: '> **Nota sobre privacidade:** Os registros deste tipo de reunião estão sujeitos aos limites de privacidade e acesso à informação definidos na Escada de Resolução de Conflitos (Camada 4). Por padrão, não são publicados no registro geral de membros.'
      m3:
        md: '### Estrutura da Pauta'
      m4:
        md: |-
          1. **Abertura e regras de convivência** _<duração; consentimento, confidencialidade, não retaliação, direito de pausa.>_
          2. **Cada parte compartilha sua perspectiva** _<sem interrupções; tempo igual.>_
          3. **Checagem de entendimento compartilhado** _<duração.>_
          4. **Necessidades e pedidos** _<duração.>_
          5. **Opções de reparo ou acordo** _<duração.>_
          6. **Decisão ou próximo passo** _<duração.>_
          7. **Documentação** _<duração; registrar conforme regras de privacidade da Camada 4.>_
      m5:
        md: '### Formato do Registro'
      m6:
        md: '> Este registro é confidencial. O acesso é restrito conforme a Escada de Resolução de Conflitos (Camada 4).'
      m7:
        md: |-
          - **Data:**
          - **Facilitador(a):**
          - **Partes presentes:**
          - **Passo da escada:**
          - **Classe do conflito:**
          - **Resultado:** _<Acordo alcançado / Escalado para o próximo passo / Suspenso>_
          - **Ações acordadas (se houver):**
          - **Destino do escalonamento (se aplicável):**
          - **Acesso:** Apenas partes e Facilitador(a); divulgado a Membros Plenos somente se escalado ao passo de governança.
      m8:
        md: '---'
  ratification-record:
    title: Registro de Ratificação
    blocks:
      m1:
        md: |-
          - **Adotado em:** <AAAA-MM-DD>
          - **Tipo de decisão:** Estratégica
          - **Versão:** <versão>
          - **Registro de decisão:** <link para o registro de decisão>
