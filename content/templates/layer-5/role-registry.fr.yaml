lang: fr
sourceHash: e8e18914
title: Registre des rôles
preamble: |-
  - **Couche :** 5 — Opérations & Coordination
  - **Statut :** Modèle — à adapter pour ta communauté
  - **Référence RCOS :** [§7.1](rcos:§7.1), [§7.6](rcos:§7.6)

  ---
sections:
  overview:
    title: Vue d'ensemble
    blocks:
      rationale:
        summary: Pourquoi exiger qu'un rôle nommé existe pour chaque responsabilité ?
        body: Les responsabilités continues sans rôle explicite deviennent du travail invisible — effectué par la personne qui le remarque, source de ressentiment silencieux, et impossible à transmettre. Associer chaque responsabilité continue à un rôle nommé et redevable est ce qui empêche la communauté de fonctionner grâce à la bonne volonté non reconnue de quelques membres.
      instructions:
        summary: Comment remplir ce document
        body: Distingue les rôles opérationnels (détenant une autorité déléguée selon la Matrice de décision) des rôles fonctionnels (limités à un périmètre de contribution, sans autorité de gouvernance particulière). Indique la définition de « en règle » que tu utiliseras pour l'éligibilité.
      m1:
        md: Ce registre définit tous les rôles reconnus au sein de la communauté. Les rôles sont soit **opérationnels** (détenant une autorité déléguée selon la Matrice de décision), soit **fonctionnels** (limités à un périmètre de contribution, sans autorité de gouvernance particulière au-delà des droits de Membre à part entière).
      m2:
        md: '> **« En règle »** signifie un Membre à part entière qui a rempli ses attentes de participation au cours de la dernière _<période>_ et qui ne fait pas actuellement l''objet d''un processus de redevabilité ou d''un examen de conflit en cours au titre de la Couche 4.'
      m3:
        md: '---'
  summary-table:
    title: Tableau récapitulatif
    blocks:
      m1:
        md: |-
          | Rôle | Type | Titulaire actuel |
          |---|---|---|
          | _<Nom du rôle>_ | _<Opérationnel / Fonctionnel>_ | _<titulaire ou « Vacant »>_ |
          | _<...>_ | _<...>_ | _<...>_ |
      m2:
        md: '---'
  operational-roles:
    title: Rôles opérationnels
    blocks:
      rationale:
        summary: Pourquoi définir la redevabilité pour l'autorité déléguée ?
        body: 'Les rôles opérationnels détiennent un pouvoir réel — ils peuvent agir sans vote communautaire dans leur périmètre. Ce pouvoir ne reste sûr que si chaque rôle dispose d''un mécanisme de redevabilité clair : qui peut soulever des préoccupations, comment se déroule l''examen, et comment un rôle peut être réattribué lorsque la confiance se brise.'
      instructions:
        summary: Comment remplir ce document
        body: Pour chaque rôle opérationnel, remplis le modèle ci-dessous avec le périmètre concret, l'autorité de décision, les interfaces, l'éligibilité, la durée, la procédure de nomination, l'examen/la révocation, et les exigences de passation.
      m1:
        md: Les rôles opérationnels détiennent une autorité déléguée pour agir dans des limites explicitement définies sans vote des Membres à part entière, tel que défini dans la Matrice de décision (Couche 2). Tous les titulaires de rôles opérationnels sont redevables envers l'ensemble des Membres à part entière. Tout Membre à part entière peut soulever une préoccupation concernant l'exercice d'un rôle ; la réattribution nécessite un vote Stratégique.
      m2:
        md: '---'
      m3:
        md: '### _<Nom du rôle opérationnel, p. ex. Administration des adhésions>_'
      m4:
        md: |-
          - **Objet :** _<objet en une phrase.>_
          - **Périmètre de responsabilité :** _<responsabilités concrètes.>_
          - **Autorité de décision :** _<quelles décisions de la Matrice de décision ce rôle exécute ; limites explicites.>_
          - **Interfaces :** _<autres rôles auxquels ce rôle transmet ou dont il reçoit.>_
          - **Critères d'éligibilité :** _<Membre à part entière en règle ; tout critère supplémentaire.>_
          - **Durée / rotation :** _<continu / rotatif / durée fixe.>_
          - **Procédure de nomination :** _<comment le rôle est attribué.>_
          - **Examen et révocation :** _<comment les préoccupations sont soulevées ; réattribution par vote Stratégique.>_
          - **Passation :** _<ce qui doit être transmis avant de quitter le rôle.>_
      m5:
        md: '---'
      m6:
        md: '### _<Nom du rôle opérationnel, p. ex. Intendant·e des finances>_'
      m7:
        md: |-
          - **Objet :** _<objet.>_
          - **Périmètre de responsabilité :** _<responsabilités.>_
          - **Autorité de décision :** _<périmètre de la Matrice de décision ; plafond de dépenses.>_
          - **Interfaces :** _<autres rôles.>_
          - **Critères d'éligibilité :** _<Membre à part entière en règle.>_
          - **Durée / rotation :** _<...>_
          - **Procédure de nomination :** _<...>_
          - **Examen et révocation :** _<...>_
          - **Passation :** _<...>_
      m8:
        md: '---'
      m9:
        md: '### _<Ajouter d''autres rôles opérationnels selon les besoins (p. ex. Intendant·e des infrastructures, Intendant·e de la communication).>_'
      m10:
        md: '---'
  functional-roles:
    title: Rôles fonctionnels
    blocks:
      rationale:
        summary: Pourquoi séparer les rôles fonctionnels des rôles opérationnels ?
        body: Chaque contribution n'a pas besoin d'une autorité déléguée — la plupart du travail consiste à faire, pas à décider. Les rôles fonctionnels nomment des périmètres de contribution sans y associer de pouvoir de gouvernance, de sorte que les membres peuvent s'engager dans le travail sans transfert d'autorité, et que le système de gouvernance reste clair sur qui peut agir au nom de la communauté.
      instructions:
        summary: Comment remplir ce document
        body: Pour chaque rôle fonctionnel, définis l'objet, le périmètre, les interfaces, l'éligibilité et la passation. Les rôles fonctionnels ne nécessitent pas de vote pour être assumés — une déclaration suffit.
      m1:
        md: Les rôles fonctionnels définissent le périmètre de contribution d'un membre. Ils ne détiennent aucune autorité de gouvernance déléguée au-delà des droits de Membre à part entière. Tout Membre à part entière peut assumer un rôle fonctionnel en le déclarant ; aucun vote n'est requis. Les rôles peuvent être libérés à tout moment par notification.
      m2:
        md: '---'
      m3:
        md: '### _<Nom du rôle fonctionnel, p. ex. Facilitateur·ice>_'
      m4:
        md: |-
          - **Objet :** _<objet.>_
          - **Périmètre de responsabilité :** _<responsabilités.>_
          - **Autorité de décision :** _<droits de Membre à part entière uniquement.>_
          - **Interfaces :** _<autres rôles.>_
          - **Critères d'éligibilité :** _<Membre à part entière ; toute préférence supplémentaire.>_
          - **Durée / rotation :** _<continu jusqu'à libération.>_
          - **Procédure de nomination :** _<auto-déclaration.>_
          - **Examen et révocation :** _<peut être libéré à tout moment ; substitution en cas de conflit d'intérêts selon la Couche 4 si pertinent.>_
          - **Passation :** _<engagements en cours à transmettre.>_
      m5:
        md: '---'
      m6:
        md: '### _<Ajouter d''autres rôles fonctionnels selon les besoins.>_'
      m7:
        md: '---'
  ratification-record:
    title: Registre de ratification
    blocks:
      m1:
        md: |-
          - **Adopté le :** <AAAA-MM-JJ>
          - **Type de décision :** Stratégique
          - **Version :** <version>
          - **Registre de décision :** <lien vers le registre de décision>
