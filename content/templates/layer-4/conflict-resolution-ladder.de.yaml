lang: de
sourceHash: 067f10fa
title: Konfliktlösungsleiter
preamble: |-
  - **Schicht:** 4 — Konflikt, Wiedergutmachung & Rechenschaftspflicht
  - **Status:** Vorlage — an deine Gemeinschaft anpassen
  - **RCOS-Referenz:** [§6.1](/articles/rcos-core/v0-1/layer-4-conflict-repair-accountability#61-conflict-classification), [§6.2](/articles/rcos-core/v0-1/layer-4-conflict-repair-accountability#62-resolution-pathways), [§6.3](/articles/rcos-core/v0-1/layer-4-conflict-repair-accountability#63-safeguards), [§6.5](/articles/rcos-core/v0-1/layer-4-conflict-repair-accountability#65-artifacts)

  ---
sections:
  conflict-classification:
    title: Konfliktklassifizierung
    blocks:
      rationale:
        summary: Warum Konflikte überhaupt klassifizieren?
        body: Ohne benannte Klassen wird jeder Streit gleich behandelt — oder schlimmer noch, je nach beteiligter Person unterschiedlich. Explizite Klassen legen den Einstiegspunkt, das Reaktionsfenster und den Dokumentationsaufwand von vornherein fest, sodass sicherheitskritische Angelegenheiten nicht stillschweigend über ein freundliches Gespräch abgehandelt und geringfügige Reibungen nicht zu einer formellen Überprüfung aufgebauscht werden können.
      instructions:
        summary: Wie du das ausfüllst
        body: Lege für jede Klasse die Eintrittskriterien, die Einstiegsstufe in der Leiter, das anfängliche Reaktionsfenster und den Dokumentationsaufwand fest.
      m1:
        md: |-
          | Klasse | Eintrittskriterien | Einstiegspunkt | Anfängliches Reaktionsfenster | Dokumentation |
          |---|---|---|---|---|
          | _<Zwischenmenschlich>_ | _<Reibung zwischen Mitgliedern>_ | _<Stufe 1>_ | _<Fenster>_ | _<ab welcher Stufe>_ |
          | _<Rollenbasiert>_ | _<Streit über Rollenausübung>_ | _<...>_ | _<...>_ | _<...>_ |
          | _<Strukturell>_ | _<Streit über Governance-Prozesse>_ | _<...>_ | _<...>_ | _<...>_ |
          | _<Ethischer / Pflichtverstoss>_ | _<...>_ | _<...>_ | _<...>_ | _<...>_ |
          | _<Sicherheitskritisch>_ | _<glaubhaftes Sicherheitsrisiko, Nötigung, Missbrauch oder Drohungen>_ | _<überspringt frühere Stufen>_ | _<kurzes Fenster>_ | _<ab Eingang; sofortiges Handeln erlaubt>_ |
      m2:
        md: '> Sicherheitskritische Konflikte setzen Teilnahmerechte, Rollenkontinuität und betriebliche Zweckmässigkeit ausser Kraft.'
  resolution-ladder-steps:
    title: Stufen der Lösungsleiter
    blocks:
      rationale:
        summary: Warum eine abgestufte Leiter statt eines einzigen Prozesses?
        body: Die meisten Konflikte sind niedrigschwellig und lassen sich am besten zwischen den Beteiligten lösen; alles in eine formelle Überprüfung zu zwingen würde Vertrauen zerstören und das Governance-System überfluten. Eine Leiter passt den Prozessaufwand an das Streitgewicht an — zuerst ein privates Gespräch, dann ein moderierter Dialog, eine schriftliche Dokumentation nur bei Bedarf, eine Governance-Abstimmung nur wenn alles andere scheitert. Ausserdem wird die Eskalation zu einem strukturellen Recht, statt einem Gefallen, der von der Person mit der meisten sozialen Macht gewährt wird.
      instructions:
        summary: Wie du das ausfüllst
        body: 'Definiere jede Leiterstufe: wer beteiligt ist, was passiert, das Zeitfenster und die Eskalationsregel. Halte die frühen Stufen leicht und vertraulich; reserviere die formelle Überprüfung für spätere Stufen.'
      m1:
        md: |-
          1. **Direktes Gespräch** — _<Parteien versuchen, die Sache privat zu klären; Zeitfenster; Ergebnisregeln.>_
          2. **Moderierter Dialog** — _<Moderator*in leitet das Gespräch; Vertraulichkeit; Zeitfenster; Ergebnisregeln.>_
          3. **Rechenschafts-Eingang** — _<formelle schriftliche Dokumentation wird eröffnet; Eingaben; Zeitfenster; Ergebnisregeln.>_
          4. **Rechenschafts-Überprüfung** — _<strukturierte Überprüfung; beide Parteien anwesend; schriftliche Empfehlung; Zeitfenster; Ergebnisregeln.>_
          5. **Governance-Entscheidung** — _<minimalnotwendige Offenlegung gegenüber Vollmitgliedern; Beratungsfrist; Abstimmungsverfahren und Schwellenwert.>_
          6. **Trennungsprozess** — _<koordiniert mit dem Austritts- & Trennungsprotokoll; Mindest-Sperrfrist für erneute Bewerbung.>_
  non-response-withdrawal-and-deadlock:
    title: Nichtreaktion, Rückzug und Pattsituation
    blocks:
      rationale:
        summary: Was verhindert, dass ein Prozess durch Schweigen sabotiert wird?
        body: Der einfachste Weg, jeden Rechenschaftsprozess auszuhebeln, ist ihn zu ignorieren. Wenn Nichtreaktion, Rückzug oder Pattsituation die Angelegenheit einfriert, trägt die geschädigte Partei die Kosten der Untätigkeit. Explizite Regeln für jeden Ausfallmodus verwandeln Schweigen in einen dokumentierten Eskalationsauslöser statt in ein Veto.
      instructions:
        summary: Wie du das ausfüllst
        body: Definiere, wie Nichtreaktion, Rückzug während des Prozesses, Pattsituationen und Verfahrensfehler behandelt werden. Jeder Fall sollte einen dokumentierten Eskalationspfad haben.
      m1:
        md: |-
          **Wenn eine Partei nicht innerhalb des definierten Zeitfensters reagiert:**
          - _<Folgebenachrichtigung; zusätzliche Nachfrist; Behandlung anhaltenden Schweigens als Nichtlösung; Eskalationsregel.>_
      m2:
        md: |-
          **Wenn eine Partei sich während des Prozesses zurückzieht:**
          - _<Mitteilung über den Rückzug; Option für die andere Partei, den Fall abzuschliessen oder eine schriftliche Zusammenfassung anzufordern; Eskalationsregel für offene Rechenschaftsfragen.>_
      m3:
        md: |-
          **Pattsituation (alle Lösungsversuche ausgeschöpft):**
          - _<Dokumentation der Pattsituation; Eskalation zur Governance-Entscheidung.>_
      m4:
        md: |-
          **Überprüfung bei Verfahrensfehlern:**
          - _<Wie Verfahrenseinwände erhoben werden; wo sie protokolliert werden; Auslöser für eine Überprüfung dieses Artefakts gemäss dem Änderungsprotokoll.>_
      m5:
        md: '---'
  facilitator-selection-and-replacement:
    title: Auswahl und Ersetzung der Moderation
    blocks:
      rationale:
        summary: Warum festlegen, wie die Moderation ausgewählt oder ersetzt wird?
        body: Eine moderierende Person, die selbst in den Konflikt verwickelt ist — oder sozial einer Partei nahesteht — kann den Prozess nicht fair führen, egal wie gut ihre Absichten sind. Auswahl- und Ersetzungsregeln vorab festzulegen bedeutet, dass die betroffene Partei nicht um ein neutrales Verfahren kämpfen muss, während sie ohnehin unter Stress steht.
      instructions:
        summary: Wie du das ausfüllst
        body: Lege die standardmässige Moderationsrolle fest, die Regel für den Fall, dass die moderierende Person selbst Partei ist, das Ablehnungsrecht und eine optionale externe Moderation.
      m1:
        md: |-
          - _<Standard-Moderationsrolle gemäss dem Rollenverzeichnis.>_
          - _<Regel für den Fall, dass die moderierende Person selbst Partei ist — Auswahl einer neutralen Vertretung.>_
          - _<Recht jeder Partei, eine moderierende Person bei festgestelltem Interessenkonflikt abzulehnen.>_
          - _<Optionale externe Moderation in gegenseitigem Einvernehmen.>_
  privacy-and-information-access-boundaries:
    title: Datenschutz und Informationszugangsgrenzen
    blocks:
      rationale:
        summary: Warum den Informationsfluss so streng begrenzen?
        body: Konfliktakten enthalten das sensibelste Material, über das die Gemeinschaft verfügt. Durchsickern, Klatsch oder beiläufige Weitergabe verursachen Folgeschäden und schrecken vor zukünftigen Meldungen ab. Explizite Grenzen — was bei den Parteien bleibt, was die Vollmitglieder erfahren und wann Akten vernichtet werden — machen Vertraulichkeit durchsetzbar statt nur wünschenswert.
      instructions:
        summary: Wie du das ausfüllst
        body: Lege fest, welche Stufen vollständig vertraulich sind, welche Mindestinformationen in der Governance-Stufe offengelegt werden dürfen, die Aufbewahrungsfrist und die Verschwiegenheitspflicht.
      m1:
        md: |-
          - _<Stufen 1–4: vollständig vertraulich; nur Parteien und Moderation haben Zugang zu den Akten.>_
          - _<Stufen 5–6: minimalnotwendige Informationen werden den Vollmitgliedern offengelegt; Parteien werden vor der Offenlegung benachrichtigt. Definiere, was „minimalnotwendig" bedeutet.>_
          - _<Aufbewahrung: wer die Akten verwahrt, für wie lange, danach Vernichtung.>_
          - _<Verschwiegenheit: kein*e Teilnehmer*in darf Informationen über den Prozess ausserhalb der definierten Beteiligten ohne schriftliche Zustimmung aller Parteien weitergeben.>_
  safeguards:
    title: Schutzmassnahmen
    blocks:
      rationale:
        summary: Warum gibt es Schutzmassnahmen zusätzlich zur Leiter?
        body: Ein Prozess allein schützt nicht die Partei mit weniger Macht. Vergeltung, böswillige Beschwerden, befangene Moderation und ungeprüfte Sicherheitsrisiken können ein ansonsten gutes Verfahren aushebeln. Schutzmassnahmen sind die Sicherheitsnetze, die die Leiter funktionsfähig halten, wenn Anreize gegen ehrliche Meldungen wirken.
      instructions:
        summary: Wie du das ausfüllst
        body: Lege für jede Schutzmassnahme die Regel und die Konsequenz bei Verstoss fest. Fälle mit Machtgefälle benötigen einen eigenen Eingangskanal.
      m1:
        md: |-
          - **Vergeltungsschutz:** _<Vergeltung gegen ein Mitglied, das in gutem Glauben einen Konflikt meldet, ist selbst Grund für ein Rechenschaftsverfahren.>_
          - **Böswillige Beschwerden:** _<Vorsätzlich falsche Beschwerden können ein Rechenschaftsverfahren gegen die beschwerdeführende Person auslösen.>_
          - **Interessenkonflikt der Moderation:** _<siehe Auswahl und Ersetzung der Moderation.>_
          - **Prozesspause:** _<Jede Partei darf den Prozess einmal für bis zu X Tage per schriftlicher Mitteilung pausieren.>_
          - **Sicherheitskritische Sofortmassnahme:** _<Die Moderation darf eine vorübergehende Zugangsbeschränkung bis zur Überprüfung empfehlen; Überprüfungsfenster.>_
          - **Machtgefälle — separater Eingangskanal:** _<Wenn ein Machtgefälle besteht, darf das betroffene Mitglied die Eingabe direkt an ein anderes Gremium als die standardmässige Moderation richten.>_
          - **Rollensuspendierung während der Überprüfung:** _<Vollmitglieder dürfen die delegierte Autorität einer Rolleninhaberin oder eines Rolleninhabers während der Überprüfung vorübergehend aussetzen, ohne dass dies einen erzwungenen Austritt darstellt.>_
      m2:
        md: '---'
  ratification-record:
    title: Ratifizierungsprotokoll
    blocks:
      m1:
        md: |-
          - **Angenommen:** <JJJJ-MM-TT>
          - **Entscheidungstyp:** Strategisch
          - **Version:** <Version>
          - **Entscheidungsprotokoll:** <Link zum Entscheidungsprotokoll>
