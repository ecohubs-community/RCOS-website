lang: de
sourceHash: 1eaf3e41
title: Rechenschaftsprotokoll
preamble: |-
  - **Ebene:** 4 — Konflikt, Wiedergutmachung & Rechenschaft
  - **Status:** Vorlage — an deine Gemeinschaft anpassen
  - **RCOS-Referenz:** [§6.4](rcos:§6.4), [§6.5](rcos:§6.5)

  ---
sections:
  triggers:
    title: Auslöser
    blocks:
      rationale:
        summary: Warum festlegen, was eine Rechenschaftsprüfung auslöst?
        body: Wenn Rechenschaftsprüfungen nur stattfinden, wenn jemand sich stark genug fühlt, sie durchzusetzen, werden sie politisch. Die genauen Auslöser zu benennen — Inaktivität, Verstoß, Invarianten-Verletzung, Verweisung — bedeutet, dass der Prozess bei einer Bedingung ansetzt, die jeder überprüfen kann, und nicht bei einem Urteil über eine Person.
      instructions:
        summary: Wie du das ausfüllst
        body: Liste die konkreten, überprüfbaren Auslöser auf, die eine Rechenschaftsprüfung einleiten. Jeder Auslöser sollte anhand von Aufzeichnungen oder einer direkten Verweisung nachvollziehbar sein.
      m1:
        md: 'Eine Rechenschaftsprüfung wird eingeleitet, wenn:'
      m2:
        md: |-
          1. _<Ein Mitglied in X aufeinanderfolgenden Monaten keinen anerkannten Beitrag geleistet hat.>_
          2. _<Ein Mitglied gegen eine Pflicht aus der Mitgliedschaftsvereinbarung verstoßen hat.>_
          3. _<Ein Mitglied eine Identitäts-Einschränkung oder Invariante der Schicht 0 verletzt hat.>_
          4. _<Eine Verweisung aus der Konfliktlösungsleiter (Stufe 3 oder höher) erfolgt ist.>_
  investigation-and-review:
    title: Untersuchung und Überprüfung
    blocks:
      rationale:
        summary: Warum die Reaktion nach Schweregrad abstufen?
        body: Einen versäumten Beitrag genauso zu behandeln wie eine Invarianten-Verletzung erdrückt entweder leichte Fälle mit schwerem Verfahren oder lässt schwere Fälle mit einem privaten Gespräch durchrutschen. Abgestufte Wege — sanftes Nachfragen, mittlere schriftliche Benachrichtigung, direkte Eskalation bei schweren Verstößen — passen das Gewicht der Reaktion an das Gewicht des Verstoßes an und machen Wiedergutmachung dort zum Standard, wo Wiedergutmachung noch möglich ist.
      instructions:
        summary: Wie du das ausfüllst
        body: Definiere sanfte (Inaktivität), mittlere (Pflichtverletzung) und schwere (Invarianten-Verletzung, Sicherheit) Wege. Gib an, wer den Prozess einleitet, welche Reaktionsfrist gilt und wie die Eskalation jeweils verläuft.
      m1:
        md: '> **Leitlinie zur Verstoßschwere:** _<mittel = Nichteinhaltung einer Pflicht aus der Mitgliedschaftsvereinbarung, die weder die Sicherheit von Mitgliedern noch die Integrität der Gemeinschaft gefährdet; schwer = Verletzung einer Invariante der Schicht 0, glaubwürdige Sicherheitsbedenken, anhaltend bösgläubiges Verhalten.>_'
      m2:
        md: |-
          - **Inaktivität (leichter Verstoß):** _<Wer kontaktiert das Mitglied; Reaktionsfrist; mögliche Ergebnisse.>_
          - **Pflichtverletzung (mittel):** _<Schriftliche Benachrichtigung; Reaktionsfrist; Lösungs- / Eskalationswege.>_
          - **Schwerer Verstoß / Invarianten-Verletzung:** _<Direkte Eskalation an die entsprechende Stufe der Konfliktlösungsleiter.>_
  due-process-guarantees:
    title: Verfahrensgarantien
    blocks:
      rationale:
        summary: Warum Benachrichtigungs-, Antwort- und Widerspruchsrechte ausformulieren?
        body: Rechenschaft ohne faires Verfahren ist nur Bestrafung mit Papierkram. Ein Mitglied, das mit einer Sanktion konfrontiert ist, muss das Anliegen kennen, echte Zeit zum Antworten haben und eine Stelle zum Einlegen eines Widerspruchs haben — andernfalls ist das Wort des Entscheidungsgremiums standardmäßig endgültig, was Macht genau dort konzentriert, wo sie sich nicht konzentrieren sollte.
      instructions:
        summary: Wie du das ausfüllst
        body: Lege das Recht auf schriftliche Benachrichtigung, eine Mindest-Reaktionsfrist und einen expliziten Widerspruchsweg an die Vollmitglieder fest.
      m1:
        md: |-
          - **Recht auf Benachrichtigung:** _<Das Mitglied wird schriftlich über das Anliegen informiert, bevor eine Überprüfung oder Sanktion beginnt.>_
          - **Recht auf Antwort:** _<Mindest-Reaktionsfrist — z. B. 30 Tage.>_
          - **Recht auf Widerspruch:** _<Jede Entscheidung kann über den Governance-Prozess angefochten werden (strategische Abstimmung).>_
  anti-retaliation-protections:
    title: Schutz vor Vergeltung
    blocks:
      rationale:
        summary: Warum Beteiligte explizit schützen?
        body: Wenn das Äußern eines Anliegens oder das Bereitstellen von Informationen ein Mitglied Ansehen, Beziehungen oder Zugang kosten kann, werden die Menschen schweigen und das Rechenschaftssystem bricht in der Praxis zusammen. Vergeltung selbst als Auslöser zu benennen, macht die Kosten der Unterdrückung höher als die Kosten der Meldung.
      instructions:
        summary: Wie du das ausfüllst
        body: Halte fest, dass Vergeltung gegen jedes Mitglied, das ein Anliegen erhebt, an einem Rechenschaftsprozess teilnimmt oder Informationen dazu beisteuert, selbst ein Auslöser für eine Rechenschaftsprüfung ist.
      m1:
        md: _<Vergeltung gegen ein Mitglied für die Teilnahme an irgendeinem Teil dieses Prozesses ist selbst ein Auslöser für eine Rechenschaftsprüfung.>_
  sanction-and-repair-options:
    title: Sanktions- und Wiedergutmachungsoptionen
    blocks:
      rationale:
        summary: Warum den Katalog der Sanktionen vorab festlegen?
        body: Ad-hoc-Sanktionen, die mitten im Prozess erfunden werden, spiegeln wider, wer am lautesten im Raum ist, nicht was der Verstoß rechtfertigt. Ein fester Katalog — mit Voraussetzungen, befugtem Gremium und Widerspruchsweg für jede Sanktion — hält die Reaktionen verhältnismäßig, verhindert, dass informeller Ausschluss zur Standardstrafe wird, und macht deutlich, wenn eine Sanktion außerhalb des Zuständigkeitsbereichs des anwendenden Gremiums liegt.
      instructions:
        summary: Wie du das ausfüllst
        body: Definiere für jeden Sanktionstyp die Voraussetzungen, das befugte Gremium und den Widerspruchsweg. Auf Wiedergutmachung ausgerichtete Maßnahmen sollten der Standard sein; strafende Maßnahmen sind sicherheitskritischen oder ungelösten Verstößen vorbehalten.
      m1:
        md: |-
          > Auf Wiedergutmachung ausgerichtete Maßnahmen werden gegenüber strafenden bevorzugt, außer in sicherheitskritischen Fällen.
          > Sanktionen müssen verhältnismäßig, wo anwendbar zeitlich begrenzt, dokumentiert und niemals durch informellen Ausschluss oder sozialen Druck verhängt werden.
      m2:
        md: |-
          | Typ | Voraussetzungen | Befugtes Gremium | Anfechtbar? |
          |---|---|---|---|
          | _<Persönliches Nachfragen / Erinnerung>_ | _<Inaktivität oder geringfügiger Verstoß>_ | _<Rolle>_ | _<ja>_ |
          | _<Schriftliche Verwarnung>_ | _<Ungelöste Pflichtverletzung nach Nachfragen>_ | _<Rolle>_ | _<ja>_ |
          | _<Vorübergehende Zugangsbeschränkung>_ | _<Sicherheitskritische Situation; Überprüfungsfenster>_ | _<Rolle>_ | _<ja>_ |
          | _<Erzwungener Austritt>_ | _<Schwerer oder ungelöster Verstoß, oder Entscheidung der Vollmitglieder>_ | _<Vollmitglieder>_ | _<ja — erneute Abstimmung>_ |
  conditions-for-restoring-rights:
    title: Bedingungen für die Wiederherstellung von Rechten
    blocks:
      rationale:
        summary: Warum Bedingungen für die Wiederherstellung explizit festlegen?
        body: Wenn es keinen definierten Weg zurück gibt, wird jede Sanktion faktisch dauerhaft und jeder Austritt zu einer lebenslangen Strafe. Explizite Bedingungen für die Wiederherstellung signalisieren, dass Rechenschaft auf Wiedergutmachung abzielt, wo Wiedergutmachung möglich ist, und sie verhindern nachträgliches Gatekeeping darüber, ob jemand „wirklich" willkommen zurück ist.
      instructions:
        summary: Wie du das ausfüllst
        body: Lege für jede Sanktionsklasse den Weg zur Wiederherstellung der Rechte fest — erneute Bewerbung nach freiwilligem Austritt, Sperrfrist für erneute Bewerbung nach erzwungenem Austritt, Wiederherstellung nach vorübergehender Einschränkung.
      m1:
        md: |-
          - **Nach freiwilligem Austritt:** _<Erneute Bewerbung über das Onboarding-Protokoll; keine automatische Wiederherstellung.>_
          - **Nach erzwungenem Austritt:** _<Mindest-Sperrfrist für erneute Bewerbung; das reguläre Aufnahmeverfahren gilt.>_
          - **Nach vorübergehender Zugangsbeschränkung:** _<Rechte werden nach Bestätigung der Lösung innerhalb des Überprüfungsfensters wiederhergestellt.>_
  coordination-with-layer-1:
    title: Abstimmung mit Schicht 1
    blocks:
      rationale:
        summary: Warum das mit dem Austritts- und Trennungsprotokoll verknüpfen?
        body: Austrittsregeln sind aus gutem Grund in Schicht 1 angesiedelt — sie regeln, wer Mitglied ist und wer nicht. Wenn Rechenschaftsmaßnahmen ihren eigenen parallelen Austrittsweg schaffen würden, gäbe es zwei Regelwerke, zwei Sätze von Aufzeichnungen und ein Schlupfloch, um das faire Verfahren zu umgehen. Ein einziges kanonisches Austrittsprotokoll schließt diese Lücke.
      instructions:
        summary: Wie du das ausfüllst
        body: Halte fest, dass alle erzwungenen Austritte und vorübergehenden Zugangsbeschränkungen dem Austritts- und Trennungsprotokoll (Schicht 1) folgen, und stelle klar, dass eine vorübergehende Einschränkung keinen Austritt darstellt.
      m1:
        md: _<Alle erzwungenen Austritte und vorübergehenden Zugangsbeschränkungen folgen dem Austritts- und Trennungsprotokoll (Schicht 1). Eine vorübergehende Zugangsbeschränkung stellt keinen Austritt dar und löst keine Sperrfrist für eine erneute Bewerbung aus, es sei denn, ein erzwungener Austritt wird anschließend von den Vollmitgliedern beschlossen.>_
      m2:
        md: '---'
  ratification-record:
    title: Ratifizierungsprotokoll
    blocks:
      m1:
        md: |-
          - **Angenommen:** <JJJJ-MM-TT>
          - **Entscheidungstyp:** Strategisch
          - **Version:** <Version>
          - **Entscheidungsprotokoll:** <Link zum Entscheidungsprotokoll>
