lang: es
sourceHash: f6582746
title: Escalera de Resolución de Conflictos
preamble: |-
  - **Capa:** 4 — Conflicto, Reparación y Rendición de Cuentas
  - **Estado:** Plantilla — adaptar para tu comunidad
  - **Referencia RCOS:** [§6.1](rcos:§6.1), [§6.2](rcos:§6.2), [§6.3](rcos:§6.3), [§6.5](rcos:§6.5)

  ---
sections:
  conflict-classification:
    title: Clasificación de Conflictos
    blocks:
      rationale:
        summary: ¿Por qué clasificar los conflictos?
        body: Sin clases definidas, toda disputa recibe el mismo tratamiento — o peor, un tratamiento diferente según quién esté involucrado. Las clases explícitas establecen desde el inicio el punto de entrada, la ventana de respuesta y la carga de documentación, de modo que los asuntos críticos para la seguridad no puedan canalizarse discretamente a través de una conversación amistosa y las fricciones menores no puedan convertirse en arma mediante una revisión formal.
      instructions:
        summary: Cómo completar esto
        body: Para cada clase, define los criterios de entrada, el paso de entrada en la escalera, la ventana de respuesta inicial y la carga de documentación.
      m1:
        md: |-
          | Clase | Criterios de entrada | Punto de entrada | Ventana de respuesta inicial | Documentación |
          |---|---|---|---|---|
          | _<Interpersonal>_ | _<fricción entre miembros>_ | _<Paso 1>_ | _<ventana>_ | _<desde qué paso>_ |
          | _<Basado en roles>_ | _<disputa sobre desempeño del rol>_ | _<...>_ | _<...>_ | _<...>_ |
          | _<Estructural>_ | _<disputa sobre procesos de gobernanza>_ | _<...>_ | _<...>_ | _<...>_ |
          | _<Ético / incumplimiento de obligaciones>_ | _<...>_ | _<...>_ | _<...>_ | _<...>_ |
          | _<Crítico para la seguridad>_ | _<riesgo de seguridad creíble, coerción, abuso o amenazas>_ | _<omite pasos anteriores>_ | _<ventana corta>_ | _<desde la admisión; acción inmediata permitida>_ |
      m2:
        md: '> Los conflictos críticos para la seguridad prevalecen sobre los derechos de participación, la continuidad de roles y la conveniencia operativa.'
  resolution-ladder-steps:
    title: Pasos de la Escalera de Resolución
    blocks:
      rationale:
        summary: ¿Por qué una escalera escalonada en lugar de un proceso único?
        body: La mayoría de los conflictos son de bajo impacto y se resuelven mejor entre las personas involucradas; forzar todo hacia una revisión formal destruiría la confianza e inundaría el sistema de gobernanza. Una escalera ajusta el peso del proceso al peso de la disputa — primero conversación privada, luego diálogo facilitado, registro escrito solo cuando sea necesario, votación de gobernanza solo cuando todo lo demás falla. También convierte la escalada en un derecho estructural, no en un favor concedido por quien detenta el poder social.
      instructions:
        summary: Cómo completar esto
        body: 'Define cada paso de la escalera: quién participa, qué sucede, la ventana temporal y la regla de escalada. Mantén los primeros pasos ligeros y confidenciales; reserva la revisión formal para pasos posteriores.'
      m1:
        md: |-
          1. **Conversación directa** — _<las partes intentan resolver en privado; ventana; reglas de resultado.>_
          2. **Diálogo facilitado** — _<un facilitador conduce la conversación; confidencialidad; ventana; reglas de resultado.>_
          3. **Admisión de rendición de cuentas** — _<se abre un registro escrito formal; presentaciones; ventana; reglas de resultado.>_
          4. **Revisión de rendición de cuentas** — _<revisión estructurada; ambas partes presentes; recomendación escrita; ventana; reglas de resultado.>_
          5. **Decisión de gobernanza** — _<divulgación mínima necesaria a los Miembros Plenos; período de deliberación; mecanismo de votación y umbral.>_
          6. **Proceso de separación** — _<coordinado con el Protocolo de Salida y Separación; período mínimo de bloqueo para re-solicitud.>_
  non-response-withdrawal-and-deadlock:
    title: Falta de Respuesta, Retiro y Punto Muerto
    blocks:
      rationale:
        summary: ¿Qué impide que un proceso sea anulado por el silencio?
        body: La forma más fácil de derrotar cualquier proceso de rendición de cuentas es ignorarlo. Si la falta de respuesta, el retiro o el punto muerto dejan el asunto congelado, la parte que recibe el daño carga con el costo de la inacción. Reglas explícitas para cada modo de fallo convierten el silencio en un detonante de escalada documentado en lugar de un veto.
      instructions:
        summary: Cómo completar esto
        body: Define cómo se manejan la falta de respuesta, el retiro a mitad del proceso, el punto muerto y el fallo procedimental. Cada uno DEBE tener una ruta de escalada documentada.
      m1:
        md: |-
          **Si una parte no responde dentro de la ventana definida:**
          - _<Aviso de seguimiento; período de gracia adicional; tratamiento del silencio continuado como no resolución; regla de escalada.>_
      m2:
        md: |-
          **Si una parte se retira a mitad del proceso:**
          - _<Notificación de retiro; opción para la otra parte de cerrar o solicitar un resumen escrito; regla de escalada para asuntos pendientes de rendición de cuentas.>_
      m3:
        md: |-
          **Punto muerto (todos los intentos de resolución agotados):**
          - _<Documentación del punto muerto; escalada a decisión de gobernanza.>_
      m4:
        md: |-
          **Revisión por fallo procedimental:**
          - _<Cómo se plantean las objeciones procedimentales; dónde se registran; detonante para revisión de este artefacto bajo el Protocolo de Cambios.>_
      m5:
        md: '---'
  facilitator-selection-and-replacement:
    title: Selección y Sustitución del Facilitador
    blocks:
      rationale:
        summary: ¿Por qué especificar cómo se elige o sustituye al Facilitador?
        body: Un facilitador que está implicado en el conflicto — o socialmente alineado con una parte — no puede conducir el proceso de manera justa, sin importar cuán buenas sean sus intenciones. Definir las reglas de selección y sustitución de antemano significa que la parte afectada no tiene que luchar por una audiencia neutral mientras ya está bajo estrés.
      instructions:
        summary: Cómo completar esto
        body: Indica el rol de facilitador por defecto, la regla cuando el facilitador es parte del conflicto, el derecho a declinar y cualquier disposición para facilitación externa.
      m1:
        md: |-
          - _<Rol de facilitador por defecto según el Registro de Roles.>_
          - _<Regla cuando el facilitador es parte — selección de un sustituto neutral.>_
          - _<Derecho de cualquiera de las partes a declinar a un facilitador con conflicto de interés declarado.>_
          - _<Facilitación externa opcional por acuerdo mutuo.>_
  privacy-and-information-access-boundaries:
    title: Privacidad y Límites de Acceso a la Información
    blocks:
      rationale:
        summary: ¿Por qué limitar el flujo de información tan estrictamente?
        body: Los registros de conflictos contienen el material más sensible que posee la comunidad. Las filtraciones, los rumores o la divulgación casual causan daño de segundo orden y disuaden futuras denuncias. Límites explícitos — qué permanece con las partes, qué llega a los Miembros Plenos y cuándo se destruyen los registros — hacen que la confidencialidad sea exigible en lugar de aspiracional.
      instructions:
        summary: Cómo completar esto
        body: Indica qué pasos son completamente confidenciales, qué información mínima puede divulgarse en el paso de gobernanza, el período de retención y la obligación de no divulgación.
      m1:
        md: |-
          - _<Pasos 1–4: completamente confidenciales; solo las partes y el Facilitador pueden acceder a los registros.>_
          - _<Pasos 5–6: información mínima necesaria divulgada a los Miembros Plenos; las partes son notificadas antes de la divulgación. Definir qué significa "mínimo necesario".>_
          - _<Retención de registros: quién conserva los registros, por cuánto tiempo, y luego se destruyen.>_
          - _<No divulgación: ningún participante puede compartir información sobre el proceso fuera de los participantes definidos sin el consentimiento escrito de todas las partes.>_
  safeguards:
    title: Salvaguardas
    blocks:
      rationale:
        summary: ¿Por qué existen salvaguardas además de la escalera?
        body: El proceso por sí solo no protege a la parte con menos poder. Las represalias, las quejas de mala fe, los facilitadores con conflictos de interés y los riesgos de seguridad no revisados pueden neutralizar un procedimiento que de otro modo sería bueno. Las salvaguardas son los mecanismos de respaldo que mantienen la escalera funcional cuando los incentivos empujan en contra de la denuncia honesta.
      instructions:
        summary: Cómo completar esto
        body: Para cada salvaguarda, establece la regla y la consecuencia cuando se viola. Los casos con diferencial de poder necesitan su propio canal de admisión.
      m1:
        md: |-
          - **Anti-represalias:** _<las represalias contra un miembro que plantea un conflicto de buena fe son en sí mismas motivo para un proceso de rendición de cuentas.>_
          - **Quejas de mala fe:** _<las quejas deliberadamente falsas pueden desencadenar un proceso de rendición de cuentas contra el denunciante.>_
          - **Conflicto de interés del facilitador:** _<ver Selección y Sustitución del Facilitador.>_
          - **Pausa del proceso:** _<cualquiera de las partes puede pausar una vez por hasta X días mediante aviso escrito.>_
          - **Acción inmediata en casos críticos para la seguridad:** _<el facilitador puede recomendar una restricción temporal de acceso pendiente de revisión; ventana de revisión.>_
          - **Diferencial de poder — canal de admisión separado:** _<cuando existe un diferencial de poder, el miembro afectado puede presentar la admisión directamente a un órgano distinto al Facilitador estándar.>_
          - **Suspensión de rol durante la revisión:** _<los Miembros Plenos pueden suspender temporalmente la autoridad delegada de un titular de rol durante la revisión sin que esto constituya una salida forzada.>_
      m2:
        md: '---'
  ratification-record:
    title: Registro de Ratificación
    blocks:
      m1:
        md: |-
          - **Adoptado:** <AAAA-MM-DD>
          - **Tipo de decisión:** Estratégica
          - **Versión:** <versión>
          - **Registro de decisión:** <enlace al registro de decisión>
