lang: es
sourceHash: '28e93a6e'
title: Registro de Estados de Membresía
preamble: |-
  - **Capa:** 1 — Sistema de Membresía
  - **Estado:** Plantilla — adaptar para tu comunidad
  - **Referencia RCOS:** [§3.1](rcos:§3.1)

  ---
sections:
  defined-membership-states:
    title: Estados de Membresía Definidos
    blocks:
      rationale:
        summary: ¿Por qué una única tabla de estados?
        body: Los derechos y obligaciones dispersos en distintos documentos terminan divergiendo. Reunir cada estado, sus derechos, sus obligaciones y sus transiciones en una sola tabla hace que el sistema de membresía sea auditable de un vistazo — puedes ver cada puerta de entrada y salida de la comunidad, y lo que cada una otorga. Si dos documentos alguna vez se contradicen, este registro es el que prevalece.
      instructions:
        summary: Cómo completar esto
        body: Define cada estado de membresía que tu comunidad reconoce (p. ej., Solicitante, Miembro en Prueba, Miembro Pleno, Miembro Saliente). Para cada uno, enumera derechos, obligaciones, condición de entrada y condición de salida. Mantén los estados mutuamente excluyentes — ninguna persona puede tener dos estados simultáneamente.
      m1:
        md: |-
          | Estado | Derechos | Obligaciones | Condición de entrada | Condición de salida |
          |---|---|---|---|---|
          | _<Estado 1, p. ej. Solicitante>_ | _<derechos>_ | _<obligaciones>_ | _<entrada>_ | _<salida>_ |
          | _<Estado 2, p. ej. Miembro en Prueba>_ | _<derechos>_ | _<obligaciones>_ | _<entrada>_ | _<salida>_ |
          | _<Estado 3, p. ej. Miembro Pleno>_ | _<derechos>_ | _<obligaciones>_ | _<entrada>_ | _<salida>_ |
          | _<Estado 4, p. ej. Miembro Saliente>_ | _<derechos>_ | _<obligaciones>_ | _<entrada>_ | _<salida>_ |
      m2:
        md: |-
          > Ninguna persona puede tener múltiples estados de membresía simultáneamente.
          > No se pueden asumir derechos ni obligaciones fuera del estado de membresía actual de la persona.
      m3:
        md: '---'
