lang: es
sourceHash: 1da32db3
title: Protocolo de Incorporación
preamble: |-
  - **Capa:** 1 — Sistema de Membresía
  - **Estado:** Plantilla — adaptar para tu comunidad
  - **Referencia RCOS:** [§3.2](rcos:§3.2), [§3.3](rcos:§3.3), [§3.8](rcos:§3.8)

  ---
sections:
  admission-criteria:
    title: Criterios de Admisión
    blocks:
      rationale:
        summary: ¿Por qué documentar quién puede entrar?
        body: La admisión es el momento en que una persona desconocida queda vinculada por — y protegida por — las reglas de la comunidad. Si los criterios son informales, la decisión se reduce a quién le cae bien al solicitante en ese momento. Los criterios escritos hacen de la admisión un acto de gobernanza, no un favor social, y hacen que un rechazo sea defendible con fundamentos que la comunidad puede señalar.
      instructions:
        summary: Cómo completar esta sección
        body: Indica las condiciones explícitas bajo las cuales un solicitante puede ser admitido. Cada criterio debería ser verificable a partir de la propia solicitud o mediante una comprobación externa.
      m1:
        md: |-
          1. _<Criterio 1, p. ej. alineación con el propósito principal y las restricciones de identidad de la Capa 0.>_
          2. _<Criterio 2, p. ej. disposición a contribuir activamente en al menos una categoría reconocida.>_
          3. _<Criterio 3, p. ej. sin expulsión forzosa ni rechazo previo en los últimos X meses.>_
          4. _<Criterio 4, p. ej. formulario de solicitud completado de buena fe — sin tergiversación.>_
  onboarding-steps:
    title: Pasos de Incorporación
    blocks:
      rationale:
        summary: ¿Por qué hacer del proceso una secuencia fija?
        body: El consentimiento a la gobernanza solo tiene sentido si el miembro realmente ha visto la gobernanza. Una secuencia fija — revisión, consentimiento, configuración técnica — garantiza que cada Miembro Pleno cruzó el mismo umbral en el mismo orden, de modo que nadie accede a derechos plenos sin haber conocido las restricciones que los acompañan.
      instructions:
        summary: Cómo completar esta sección
        body: Enumera los pasos ordenados que cada nuevo miembro debe completar para pasar de solicitante a Miembro Pleno. Incluye pasos explícitos de consentimiento y cualquier aprovisionamiento de herramientas o acceso requerido.
      m1:
        md: |-
          1. _<Paso 1, p. ej. revisar todos los artefactos de las Capas 0–6 y este protocolo de incorporación.>_
          2. _<Paso 2, p. ej. consentir explícitamente el Acuerdo de Membresía y las restricciones de identidad de la Capa 0.>_
          3. _<Paso 3, p. ej. configurar las herramientas requeridas (billetera, cuentas, identidad).>_
          4. _<Paso 4, p. ej. unirse a los canales de comunicación exclusivos para miembros.>_
          5. _<Paso 5, p. ej. recibir los permisos necesarios para participar en la gobernanza.>_
          6. _<Paso 6, p. ej. finalización de la incorporación registrada — el estado de membresía cambia a Miembro Pleno.>_
  initial-membership-state:
    title: Estado Inicial de Membresía
    blocks:
      rationale:
        summary: ¿Por qué asignar un estado al final de la incorporación?
        body: Entre "solicitante aprobado" y "totalmente integrado" hay una brecha real — los permisos, el acceso y las expectativas cambian. Declarar el estado exacto que un nuevo miembro tiene en cada paso elimina la ambigüedad sobre lo que puede hacer en ese momento, y evita concesiones involuntarias de derechos antes de que la incorporación esté completa.
      instructions:
        summary: Cómo completar esta sección
        body: Indica los estados de membresía por los que transita un miembro durante la incorporación, y qué desencadena cada transición. Consulta el Registro de Estados de Membresía.
      m1:
        md: |-
          - Al ser aprobado: _<p. ej. Miembro en Prueba.>_
          - Al completar la incorporación: _<p. ej. Miembro Pleno (automático al completar).>_
  trial-and-evaluation:
    title: Prueba y Evaluación
    blocks:
      rationale:
        summary: ¿Por qué delimitar el periodo de prueba?
        body: 'Un periodo de prueba sin límite es una membresía de segunda clase que nunca termina — todas las obligaciones, menos derechos. Fijar la duración, los criterios y el camino en caso de fallo obliga a un punto de decisión: o el nuevo miembro pasa a pleno derecho o se ejecuta una salida definida. Esto evita que el estado de prueba se convierta en un limbo permanente.'
      instructions:
        summary: Cómo completar esta sección
        body: Define la duración, los criterios de evaluación, la decisión de transición, el periodo de gracia, el camino en caso de fallo y cualquier regla de extensión. Los derechos durante la prueba se definen en el Registro de Estados de Membresía.
      m1:
        md: |-
          - **Duración:** _<p. ej. 30 días desde la aprobación.>_
          - **Criterios de evaluación:** _<p. ej. todos los pasos de incorporación completados y registrados.>_
          - **Decisión de transición:** _<p. ej. automática al completar; o por votación.>_
          - **Periodo de gracia:** _<p. ej. X días adicionales si la incorporación no se completa a tiempo.>_
          - **Fallo en completar:** _<p. ej. proceso de salida activado automáticamente tras agotarse el periodo total.>_
          - **Extensión:** _<p. ej. extensión única de X días bajo solicitud.>_
          - **Derechos durante la prueba:** _<consultar el Registro de Estados de Membresía.>_
          - **Bloqueo de nueva solicitud:** _<p. ej. los miembros que salieron por incorporación incompleta no pueden volver a solicitar durante X meses.>_
  completion-record:
    title: Registro de Finalización
    blocks:
      rationale:
        summary: ¿Por qué mantener el registro de forma permanente?
        body: El registro de finalización es la evidencia de que un miembro consintió a una versión específica de las reglas en una fecha específica. Perderlo o editarlo haría imposible responder, meses o años después, "¿a qué exactamente accedió?" — que es la única pregunta que importa cuando llega una disputa.
      instructions:
        summary: Cómo completar esta sección
        body: Indica dónde se guarda el registro de finalización, qué captura (marca de tiempo, versiones de artefactos consentidos) y la regla de retención.
      m1:
        md: _<Descripción del registro de finalización de la incorporación — dónde se almacena, qué captura y que se retiene permanentemente después de la salida.>_
      m2:
        md: '---'
  ratification-record:
    title: Registro de Ratificación
    blocks:
      m1:
        md: |-
          - **Adoptado:** <AAAA-MM-DD>
          - **Tipo de decisión:** Estratégica
          - **Versión:** <versión>
          - **Registro de decisión:** <enlace al registro de decisión>
