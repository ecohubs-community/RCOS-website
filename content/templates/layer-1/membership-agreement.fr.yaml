lang: fr
sourceHash: '8ae44b9b'
title: Accord d'adhésion
preamble: |-
  - **Couche :** 1 — Système d'adhésion
  - **Statut :** Modèle — à adapter pour ta communauté
  - **Référence RCOS :** [§3.4](rcos:§3.4), [§3.5](rcos:§3.5), [§3.8](rcos:§3.8)

  > Signé (ou explicitement reconnu) par chaque membre au moment de l'admission. Définit les droits et obligations de chaque état d'adhésion.

  ---
sections:
  membership-state-on-signing:
    title: État d'adhésion à la signature
    blocks:
      rationale:
        summary: Pourquoi déclarer l'état à la signature ?
        body: L'adhésion n'est pas un simple binaire. Une personne qui rejoint la communauté doit savoir exactement dans quel état elle entre — Essai ou Plein — car cet état détermine ce qu'elle peut faire et ce qu'on attend d'elle. Le nommer au moment du consentement évite toute ambiguïté ultérieure sur ce à quoi elle s'est réellement engagée.
      instructions:
        summary: Comment remplir cette section
        body: Indique quel(s) état(s) d'adhésion un nouveau membre obtient à la signature (par ex. Membre à l'essai, Membre à part entière, ou tout état personnalisé défini dans ton Registre des états d'adhésion).
      m1:
        md: _<État d'adhésion attribué à la signature — par ex. Membre à l'essai après approbation de la candidature ; Membre à part entière après achèvement de l'intégration.>_
  member-rights:
    title: Droits des membres
    blocks:
      rationale:
        summary: Pourquoi énumérer les droits explicitement ?
        body: Les droits qui ne sont pas écrits sont des droits qui peuvent être discrètement retirés. Les énumérer rend les engagements de la communauté lisibles, opposables et symétriques avec les obligations que les membres sont invités à assumer. Sans cette liste, les obligations deviennent des exigences ouvertes sans protection réciproque.
      instructions:
        summary: Comment remplir cette section
        body: Liste les droits concrets accordés à chaque état d'adhésion. Réfère-toi à la Matrice de décision (Couche 2) pour les droits de vote, au Registre des rôles (Couche 5) pour l'éligibilité aux rôles, et à la Couche 4 pour les garanties de procédure régulière.
      m1:
        md: |-
          1. _<Droit 1, par ex. le droit de voter sur toutes les décisions telles que définies dans la Matrice de décision.>_
          2. _<Droit 2, par ex. le droit d'accéder à tous les canaux, appels et documents réservés aux membres.>_
          3. _<Droit 3, par ex. le droit d'occuper des rôles tels que définis dans le Registre des rôles.>_
          4. _<Droit 4, par ex. le droit d'obtenir une reconnaissance via des contributions reconnues.>_
          5. _<Droit 5, par ex. le droit de proposer des changements via le processus de gouvernance.>_
          6. _<Droit 6, par ex. le droit de signaler un conflit via l'Échelle de résolution des conflits sans représailles.>_
          7. _<Droit 7, par ex. le droit de quitter la communauté volontairement à tout moment.>_
          8. _<Droit 8, par ex. le droit à une procédure régulière avant toute exclusion forcée, suspension ou restriction d'accès.>_
  member-obligations:
    title: Obligations des membres
    blocks:
      rationale:
        summary: Pourquoi encadrer strictement les obligations ?
        body: Les obligations ouvertes sont le mécanisme par lequel les communautés glissent vers l'exploitation — « contribue plus », « sois disponible », « sois présent·e » sans limite définie. Lister les obligations de manière discrète, et associer chacune à un droit correspondant, maintient la demande bornée et contestable. Un membre doit toujours pouvoir déterminer s'il respecte l'accord ou si on lui demande quelque chose qui va au-delà.
      instructions:
        summary: Comment remplir cette section
        body: 'Liste des obligations concrètes et bornées. Chaque obligation doit être vérifiable : un membre doit pouvoir savoir s''il la remplit. Évite les devoirs vagues.'
      m1:
        md: |-
          1. _<Obligation 1, par ex. respecter en permanence toutes les contraintes d'identité et invariants de la Couche 0.>_
          2. _<Obligation 2, par ex. contribuer à la communauté dans au moins une catégorie reconnue par période définie.>_
          3. _<Obligation 3, par ex. participer aux processus de résolution des conflits lorsqu'on est nommé comme partie ou sollicité comme témoin.>_
          4. _<Obligation 4, par ex. terminer l'intégration avant d'exercer les droits de Membre à part entière.>_
          5. _<Obligation 5, par ex. prévenir la communauté avant une absence prolongée.>_
          6. _<Obligation 6, par ex. ne pas déformer l'image de la communauté, de ses membres ou de sa gouvernance à l'extérieur.>_
          7. _<Obligation 7, par ex. ne pas exercer d'autorité au-delà de ce qui est explicitement attribué par le système de gouvernance.>_
  participation-and-contribution-expectations:
    title: Attentes en matière de participation et de contribution
    blocks:
      rationale:
        summary: Pourquoi définir la participation en chiffres ?
        body: « Membre actif » ne veut rien dire sans seuil. Un minimum défini — en temps, en catégorie et en cadence — transforme la participation d'un ressenti en un fait, de sorte que personne n'a à deviner s'il est en règle, et personne ne peut être accusé de dérive sans preuves. Cela rend aussi la frontière entre une absence réelle et un abandon silencieux visible assez tôt pour agir.
      instructions:
        summary: Comment remplir cette section
        body: Indique un minimum mesurable (fréquence × catégorie), les règles de substitution et d'absence, et le déclencheur qui oriente un membre non participant vers un processus de Couche 4.
      m1:
        md: |-
          - **Contribution minimale :** _<par ex. au moins une contribution reconnue par période de 6 mois, dans n'importe quelle catégorie reconnue.>_
          - **Catégories reconnues :** _<référence au Protocole d'économie interne (Couche 3).>_
          - **Substitution :** _<par ex. un membre peut déléguer une tâche spécifique mais reste responsable du respect des attentes globales de contribution.>_
          - **Absence prolongée :** _<par ex. notification requise avant toute absence de plus de X mois ; les attentes sont suspendues pour la période notifiée, jusqu'à un maximum.>_
          - **Déclencheur de non-participation :** _<par ex. l'absence de contribution reconnue pendant X mois consécutifs sans préavis déclenche un contrôle de redevabilité (Couche 4).>_
  due-process-reference:
    title: Référence à la procédure régulière
    blocks:
      rationale:
        summary: Pourquoi rappeler la procédure régulière ici ?
        body: L'Accord d'adhésion est le seul document que chaque membre lit réellement et auquel il consent. Nommer la procédure régulière ici — et pas seulement dans la Couche 4 — garantit qu'aucun membre ne peut être exclu ou restreint en vertu d'une règle qui ne lui a pas été présentée au moment de son adhésion. Cela comble l'écart entre ce que la communauté promet et ce qu'elle peut faire.
      instructions:
        summary: Comment remplir cette section
        body: Fais référence à l'Échelle de résolution des conflits (Couche 4) et au Protocole de sortie et de séparation afin que tout membre lisant l'Accord d'adhésion sache où se trouvent les protections procédurales.
      m1:
        md: Toute exclusion forcée, suspension ou restriction d'accès suit la procédure régulière de la Couche 4 et le Protocole de sortie et de séparation.
  consent-acknowledgment:
    title: Reconnaissance du consentement
    blocks:
      rationale:
        summary: Pourquoi exiger un consentement explicite ?
        body: Un consentement présumé est un consentement qui peut être nié ultérieurement. Exiger un acte explicite — signer, cliquer, reconnaître — à un moment connu lie le membre aux versions spécifiques des artefacts en vigueur ce jour-là, et fournit à la communauté une preuve défendable que l'accord a été conclu librement et en connaissance de cause.
      instructions:
        summary: Comment remplir cette section
        body: Décris l'acte de consentement (signature, reconnaissance dans l'application, etc.), et à quelles versions d'artefacts le membre consent à ce moment-là.
      m1:
        md: En rejoignant la communauté via le processus d'intégration défini, le membre consent explicitement aux termes de cet accord et aux artefacts de la Couche 0 en vigueur au moment de l'admission.
      m2:
        md: '---'
  ratification-record:
    title: Registre de ratification
    blocks:
      m1:
        md: |-
          - **Adopté le :** <AAAA-MM-JJ>
          - **Type de décision :** Stratégique
          - **Version :** <version>
          - **Registre de décision :** <lien vers le registre de décision>
