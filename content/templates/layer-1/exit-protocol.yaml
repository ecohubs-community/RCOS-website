kind: template
legacyPath: rcos-templates/layer-1/exit-protocol
id: 0e61a813
title: Exit & Separation Protocol
parentId: 2c750c19
order: 2
preamble: |-
  - **Layer:** 1 — Membership System
  - **Status:** Template — adapt for your community
  - **RCOS reference:** [§3.6](/articles/rcos-core/v0-1/layer-1-membership-system#36-exit-and-separation), [§3.7](/articles/rcos-core/v0-1/layer-1-membership-system#37-suspension-and-temporary-status), [§3.8](/articles/rcos-core/v0-1/layer-1-membership-system#38-artifacts)

  ---
sections:
  - id: voluntary-exit
    title: Voluntary Exit
    blocks:
      - id: clauses
        kind: clauses
        refs:
          - 3.6.1
          - 3.6.2
          - 3.6.4
      - id: rationale
        kind: rationale
        summary: Why make leaving frictionless?
        body: A community that is hard to leave is not a community — it is a trap. Voluntary exit must be available at all times, without interrogation, notice periods, or punishment, because the right to withdraw consent is what makes every other act of consent real. Retaining contribution history separately ensures that leaving does not erase the work the person did.
      - id: instructions
        kind: instructions
        summary: How to fill this in
        body: Describe the channel for submitting exit, time-to-revocation of access, what records are retained, and the resulting state transition.
      - id: m1
        kind: md
        md: |-
          - _<How a member submits a voluntary exit; reasons optional.>_
          - _<Notice period or handover expectation, if any.>_
          - _<Time-to-revocation of access (e.g. within 24 hours of confirmation).>_
          - _<What is retained — contribution history, recognition records — and what is removed.>_
          - _<Resulting state transition (e.g. to Exited Member).>_
          - _<Where and how the exit is recorded with timestamp.>_
  - id: forced-exit
    title: Forced Exit
    blocks:
      - id: clauses
        kind: clauses
        refs:
          - 3.6.3
          - 3.6.4
      - id: rationale
        kind: rationale
        summary: Why gate removal behind Layer 4?
        body: Removal is the sharpest power the community holds over a person. If it can be exercised by anyone with enough social pull, membership is worthless. Requiring a concluded Layer 4 accountability decision — with written reasons, a notification, and a minimum re-application window — turns removal from an act of power into an act of governance that can be reviewed and contested.
      - id: instructions
        kind: instructions
        summary: How to fill this in
        body: State that forced exit can only follow a concluded Layer 4 accountability process. Define notification, access revocation, retained records, re-application block, and decision-record privacy.
      - id: m1
        kind: md
        md: |-
          - _<Forced exit may only result from a concluded Layer 4 accountability process with a documented decision.>_
          - _<Affected member must be notified in writing with reason and decision-record reference before access is revoked.>_
          - _<Time-to-revocation of access (e.g. within 24 hours of decision).>_
          - _<What is retained, what is removed.>_
          - _<Re-application block (minimum duration, set by accountability decision; reference Layer 4).>_
          - _<Privacy of the decision record (reference Conflict Resolution Ladder privacy rules).>_
  - id: suspension
    title: Suspension
    blocks:
      - id: clauses
        kind: clauses
        refs:
          - 3.7.1
          - 3.7.2
          - 3.7.3
      - id: rationale
        kind: rationale
        summary: Why design suspension carefully or not at all?
        body: A poorly-designed suspension state is worse than none — it becomes a soft exit with no due process, or an indefinite limbo used to punish without the accountability of a full removal. If the community cannot commit to explicit conditions, time bounds, and review mechanisms, it is safer to have no formal suspension than a loose one.
      - id: instructions
        kind: instructions
        summary: How to fill this in
        body: Either define suspension explicitly (entry conditions, time limits, rights during suspension, review mechanism, exit) or state that no formal suspension exists. Do not leave this section ambiguous.
      - id: m1
        kind: md
        md: '_<Either: define suspension state with entry conditions, maximum duration, rights during suspension, mandatory review mechanism, and exit; or: state that formal suspension is not currently defined.>_'
  - id: asset-role-and-responsibility-separation
    title: Asset, Role, and Responsibility Separation
    blocks:
      - id: clauses
        kind: clauses
        refs:
          - 3.6.5
      - id: rationale
        kind: rationale
        summary: Why enumerate separation steps?
        body: When someone leaves, every unclosed thread — a role nobody vacated, a wallet key still active, a task still assigned — becomes a live attack surface or an operational gap. A checklist forces these threads to be closed deliberately, not discovered months later when something breaks or someone abuses access they no longer should have.
      - id: instructions
        kind: instructions
        summary: How to fill this in
        body: Provide a checklist applied to both voluntary and forced exits. Include role vacation, task release, financial-instrument access removal, platform admin revocation, and resolution of outstanding obligations.
      - id: m1
        kind: md
        md: 'The following separation steps apply to both voluntary and forced exits:'
      - id: m2
        kind: md
        md: |-
          - _<Roles held must be vacated and documented in the Role Registry.>_
          - _<Ongoing tasks must be released or handed over.>_
          - _<Treasury / wallet / signing access must be removed.>_
          - _<All administrative access to platforms must be revoked.>_
          - _<Outstanding obligations resolved or transferred before exit is finalised where possible.>_
      - id: m3
        kind: md
        md: '---'
  - id: ratification-record
    title: Ratification Record
    blocks:
      - id: m1
        kind: md
        md: |-
          - **Adopted:** <YYYY-MM-DD>
          - **Decision type:** Strategic
          - **Version:** <version>
          - **Decision record:** <link to decision record>
