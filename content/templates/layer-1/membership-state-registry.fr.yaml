lang: fr
sourceHash: '28e93a6e'
title: Registre des états de membre
preamble: |-
  - **Couche :** 1 — Système de membres
  - **Statut :** Modèle — à adapter pour ta communauté
  - **Référence RCOS :** [§3.1](rcos:§3.1)

  ---
sections:
  defined-membership-states:
    title: États de membre définis
    blocks:
      rationale:
        summary: Pourquoi un tableau unique des états ?
        body: Les droits et obligations dispersés dans plusieurs documents finissent par diverger. Rassembler chaque état, ses droits, ses obligations et ses transitions dans un seul tableau rend le système de membres vérifiable d'un coup d'œil — tu peux voir chaque porte d'entrée et de sortie de la communauté, et ce que chacune accorde. Si deux documents se contredisent, ce registre fait foi.
      instructions:
        summary: Comment remplir cette section
        body: Définis chaque état de membre que ta communauté reconnaît (par ex. Candidat·e, Membre en période d'essai, Membre à part entière, Membre sorti·e). Pour chacun, liste les droits, les obligations, la condition d'entrée et la condition de sortie. Les états doivent être mutuellement exclusifs — aucune personne ne peut détenir deux états simultanément.
      m1:
        md: |-
          | État | Droits | Obligations | Condition d'entrée | Condition de sortie |
          |---|---|---|---|---|
          | _<État 1, par ex. Candidat·e>_ | _<droits>_ | _<obligations>_ | _<entrée>_ | _<sortie>_ |
          | _<État 2, par ex. Membre en période d'essai>_ | _<droits>_ | _<obligations>_ | _<entrée>_ | _<sortie>_ |
          | _<État 3, par ex. Membre à part entière>_ | _<droits>_ | _<obligations>_ | _<entrée>_ | _<sortie>_ |
          | _<État 4, par ex. Membre sorti·e>_ | _<droits>_ | _<obligations>_ | _<entrée>_ | _<sortie>_ |
      m2:
        md: |-
          > Aucune personne ne peut détenir plusieurs états de membre simultanément.
          > Aucun droit ni obligation ne peut être assumé en dehors de l'état de membre actuel de la personne.
      m3:
        md: '---'
  ratification-record:
    title: Procès-verbal de ratification
    blocks:
      m1:
        md: |-
          - **Adopté le :** <AAAA-MM-JJ>
          - **Type de décision :** Stratégique
          - **Version :** <version>
          - **Registre de décision :** <lien vers le registre de décision>
