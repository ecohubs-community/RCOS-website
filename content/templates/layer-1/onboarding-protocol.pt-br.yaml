lang: pt-br
sourceHash: 'cbf0e539'
title: Protocolo de Integração
preamble: |-
  - **Camada:** 1 — Sistema de Associação
  - **Status:** Modelo — adapte para sua comunidade
  - **Referência RCOS:** [§3.2](rcos:§3.2), [§3.3](rcos:§3.3), [§3.8](rcos:§3.8)

  ---
sections:
  admission-criteria:
    title: Critérios de Admissão
    blocks:
      rationale:
        summary: Por que escrever quem entra?
        body: A admissão é o momento em que uma pessoa estranha passa a estar vinculada — e protegida — pelas regras da comunidade. Se os critérios forem informais, a decisão se reduz a quem por acaso simpatiza com a pessoa candidata. Critérios escritos tornam a admissão um ato de governança, não um favor social, e permitem que uma recusa seja defensável com base em fundamentos que a comunidade pode apontar.
      instructions:
        summary: Como preencher
        body: Declare as condições explícitas sob as quais uma pessoa candidata pode ser admitida. Cada critério deve ser verificável a partir da própria candidatura ou de uma checagem externa.
      m1:
        md: |-
          1. _<Critério 1, ex. alinhamento com o propósito principal e com as restrições de identidade da Camada 0.>_
          2. _<Critério 2, ex. disposição para contribuir ativamente em pelo menos uma categoria reconhecida.>_
          3. _<Critério 3, ex. nenhuma saída forçada ou rejeição prévia nos últimos X meses.>_
          4. _<Critério 4, ex. preenchimento do formulário de candidatura em boa-fé — sem informações falsas.>_
  onboarding-steps:
    title: Etapas de Integração
    blocks:
      rationale:
        summary: Por que transformar o processo em uma sequência fixa?
        body: O consentimento à governança só significa algo se a pessoa membro de fato conheceu a governança. Uma sequência fixa — revisão, consentimento, configuração técnica — garante que toda Pessoa Membro Plena cruzou o mesmo limiar na mesma ordem, de modo que ninguém entre nos direitos plenos sem ter encontrado as restrições que vêm junto com eles.
      instructions:
        summary: Como preencher
        body: Liste as etapas ordenadas que toda pessoa nova membro DEVE completar para passar de candidata a Membro Pleno. Inclua etapas explícitas de consentimento e qualquer provisão de ferramentas/acessos necessária.
      m1:
        md: |-
          1. _<Etapa 1, ex. revisar todos os artefatos das Camadas 0–6 e este protocolo de integração.>_
          2. _<Etapa 2, ex. consentir explicitamente com o Acordo de Associação e com as restrições de identidade da Camada 0.>_
          3. _<Etapa 3, ex. configurar as ferramentas necessárias (carteira, contas, identidade).>_
          4. _<Etapa 4, ex. entrar nos canais de comunicação exclusivos para membros.>_
          5. _<Etapa 5, ex. receber as permissões necessárias para participar da governança.>_
          6. _<Etapa 6, ex. conclusão da integração registrada — o estado de associação transita para Membro Pleno.>_
  initial-membership-state:
    title: Estado Inicial de Associação
    blocks:
      rationale:
        summary: Por que atribuir um estado ao final da integração?
        body: Entre "candidatura aprovada" e "totalmente integrada" existe uma lacuna real — permissões, acesso e expectativas mudam. Declarar o estado exato que uma pessoa nova membro ocupa em cada etapa elimina a ambiguidade sobre o que ela pode fazer naquele momento, e evita concessões não intencionais de direitos antes que a integração esteja completa.
      instructions:
        summary: Como preencher
        body: Declare os estados de associação pelos quais uma pessoa membro transita durante a integração e o que dispara cada transição. Faça referência ao Registro de Estados de Associação.
      m1:
        md: |-
          - Ao aprovar: _<ex. Membro em Período de Experiência.>_
          - Ao concluir a integração: _<ex. Membro Pleno (automático ao concluir).>_
  trial-and-evaluation:
    title: Período de Experiência e Avaliação
    blocks:
      rationale:
        summary: Por que limitar o período de experiência?
        body: 'Um período de experiência sem prazo é uma associação de segunda classe que nunca termina — todas as obrigações, menos direitos. Fixar a duração, os critérios e o caminho de falha força um ponto de decisão: ou a pessoa nova membro transita para o status pleno ou uma saída definida é acionada. Isso impede que o estado de experiência se torne uma sala de espera permanente.'
      instructions:
        summary: Como preencher
        body: Defina a duração, os critérios de avaliação, a decisão de transição, o período de carência, o caminho de falha e quaisquer regras de prorrogação. Os direitos durante o período de experiência são definidos no Registro de Estados de Associação.
      m1:
        md: |-
          - **Duração:** _<ex. 30 dias a partir da aprovação.>_
          - **Critérios de avaliação:** _<ex. todas as etapas de integração concluídas e registradas.>_
          - **Decisão de transição:** _<ex. automática ao concluir; ou baseada em votação.>_
          - **Período de carência:** _<ex. mais X dias se a integração não for concluída no prazo.>_
          - **Falha em concluir:** _<ex. processo de saída acionado automaticamente após o término do período total.>_
          - **Prorrogação:** _<ex. prorrogação única de X dias mediante solicitação.>_
          - **Direitos durante o período de experiência:** _<faça referência ao Registro de Estados de Associação.>_
          - **Bloqueio de nova candidatura:** _<ex. pessoas membros excluídas por integração incompleta NÃO PODEM se recandidatar por X meses.>_
  completion-record:
    title: Registro de Conclusão
    blocks:
      rationale:
        summary: Por que manter o registro permanente?
        body: O registro de conclusão é a evidência de que uma pessoa membro consentiu com uma versão específica das regras em uma data específica. Perdê-lo ou editá-lo tornaria impossível responder, meses ou anos depois, "com o que exatamente ela concordou?" — que é a única pergunta que importa quando surge uma disputa.
      instructions:
        summary: Como preencher
        body: Declare onde o registro de conclusão é mantido, o que ele captura (carimbo de data/hora, versões dos artefatos consentidos) e a regra de retenção.
      m1:
        md: _<Descrição do registro de conclusão da integração — onde fica, o que captura e que é retido permanentemente após a saída.>_
      m2:
        md: '---'
  ratification-record:
    title: Registro de Ratificação
    blocks:
      m1:
        md: |-
          - **Adotado em:** <AAAA-MM-DD>
          - **Tipo de decisão:** Estratégica
          - **Versão:** <versão>
          - **Registro da decisão:** <link para o registro da decisão>
