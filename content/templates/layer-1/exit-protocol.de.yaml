lang: de
sourceHash: 13ed4fc4
title: Austritts- & Trennungsprotokoll
preamble: |-
  - **Schicht:** 1 — Mitgliedschaftssystem
  - **Status:** Vorlage — an deine Gemeinschaft anpassen
  - **RCOS-Referenz:** [§3.6](rcos:§3.6), [§3.7](rcos:§3.7), [§3.8](rcos:§3.8)

  ---
sections:
  voluntary-exit:
    title: Freiwilliger Austritt
    blocks:
      rationale:
        summary: Warum sollte das Verlassen reibungslos sein?
        body: Eine Gemeinschaft, die schwer zu verlassen ist, ist keine Gemeinschaft — sie ist eine Falle. Freiwilliger Austritt muss jederzeit möglich sein, ohne Verhör, Kündigungsfristen oder Bestrafung, denn das Recht, Zustimmung zurückzuziehen, ist das, was jede andere Zustimmung erst real macht. Die separate Aufbewahrung der Beitragshistorie stellt sicher, dass ein Austritt die geleistete Arbeit nicht auslöscht.
      instructions:
        summary: Wie du diesen Abschnitt ausfüllst
        body: Beschreibe den Kanal für die Einreichung des Austritts, die Frist bis zum Entzug des Zugangs, welche Aufzeichnungen aufbewahrt werden und den resultierenden Statusübergang.
      m1:
        md: |-
          - _<Wie ein Mitglied einen freiwilligen Austritt einreicht; Gründe optional.>_
          - _<Kündigungsfrist oder Übergabeerwartung, falls vorhanden.>_
          - _<Frist bis zum Entzug des Zugangs (z. B. innerhalb von 24 Stunden nach Bestätigung).>_
          - _<Was aufbewahrt wird — Beitragshistorie, Anerkennungsnachweise — und was entfernt wird.>_
          - _<Resultierender Statusübergang (z. B. zu „Ausgetretenes Mitglied").>_
          - _<Wo und wie der Austritt mit Zeitstempel erfasst wird.>_
  forced-exit:
    title: Erzwungener Austritt
    blocks:
      rationale:
        summary: Warum den Ausschluss an Schicht 4 knüpfen?
        body: Der Ausschluss ist die schärfste Macht, die eine Gemeinschaft über eine Person hat. Wenn sie von jedem ausgeübt werden kann, der genug sozialen Einfluss hat, ist die Mitgliedschaft wertlos. Die Voraussetzung eines abgeschlossenen Rechenschaftsverfahrens der Schicht 4 — mit schriftlicher Begründung, einer Benachrichtigung und einer Mindest-Wartefrist für erneute Bewerbung — verwandelt den Ausschluss von einem Machtakt in einen Akt der Governance, der überprüft und angefochten werden kann.
      instructions:
        summary: Wie du diesen Abschnitt ausfüllst
        body: Lege fest, dass ein erzwungener Austritt nur nach einem abgeschlossenen Rechenschaftsverfahren der Schicht 4 erfolgen kann. Definiere Benachrichtigung, Zugangsentzug, aufbewahrte Aufzeichnungen, Sperrfrist für erneute Bewerbung und Datenschutz des Entscheidungsprotokolls.
      m1:
        md: |-
          - _<Ein erzwungener Austritt darf nur aus einem abgeschlossenen Rechenschaftsverfahren der Schicht 4 mit dokumentierter Entscheidung resultieren.>_
          - _<Das betroffene Mitglied muss schriftlich mit Begründung und Verweis auf das Entscheidungsprotokoll benachrichtigt werden, bevor der Zugang entzogen wird.>_
          - _<Frist bis zum Entzug des Zugangs (z. B. innerhalb von 24 Stunden nach Entscheidung).>_
          - _<Was aufbewahrt wird, was entfernt wird.>_
          - _<Sperrfrist für erneute Bewerbung (Mindestdauer, festgelegt durch Rechenschaftsentscheidung; Verweis auf Schicht 4).>_
          - _<Datenschutz des Entscheidungsprotokolls (Verweis auf die Datenschutzregeln der Konfliktlösungsleiter).>_
  suspension:
    title: Suspendierung
    blocks:
      rationale:
        summary: Warum Suspendierung sorgfältig gestalten — oder gar nicht?
        body: Ein schlecht gestalteter Suspendierungsstatus ist schlimmer als keiner — er wird zu einem weichen Austritt ohne ordentliches Verfahren oder zu einem unbefristeten Schwebezustand, der als Strafe dient, ohne die Rechenschaftspflicht eines vollständigen Ausschlusses. Wenn die Gemeinschaft sich nicht zu expliziten Bedingungen, Zeitgrenzen und Überprüfungsmechanismen verpflichten kann, ist es sicherer, keine formale Suspendierung zu haben als eine unklare.
      instructions:
        summary: Wie du diesen Abschnitt ausfüllst
        body: Definiere die Suspendierung entweder explizit (Eintrittsbedingungen, Zeitlimits, Rechte während der Suspendierung, Überprüfungsmechanismus, Ende) oder stelle fest, dass keine formale Suspendierung existiert. Lass diesen Abschnitt nicht mehrdeutig.
      m1:
        md: '_<Entweder: Definiere den Suspendierungsstatus mit Eintrittsbedingungen, Höchstdauer, Rechten während der Suspendierung, verpflichtendem Überprüfungsmechanismus und Ende; oder: stelle fest, dass eine formale Suspendierung derzeit nicht definiert ist.>_'
  asset-role-and-responsibility-separation:
    title: Trennung von Vermögenswerten, Rollen und Verantwortlichkeiten
    blocks:
      rationale:
        summary: Warum Trennungsschritte auflisten?
        body: Wenn jemand geht, wird jeder offene Faden — eine Rolle, die niemand abgegeben hat, ein Wallet-Schlüssel, der noch aktiv ist, eine Aufgabe, die noch zugewiesen ist — zu einer aktiven Angriffsfläche oder einer operativen Lücke. Eine Checkliste erzwingt, dass diese Fäden bewusst geschlossen werden, anstatt Monate später entdeckt zu werden, wenn etwas kaputtgeht oder jemand Zugang missbraucht, den er nicht mehr haben sollte.
      instructions:
        summary: Wie du diesen Abschnitt ausfüllst
        body: Erstelle eine Checkliste, die sowohl bei freiwilligem als auch bei erzwungenem Austritt angewendet wird. Berücksichtige Rollenabgabe, Aufgabenfreigabe, Entzug des Zugangs zu Finanzinstrumenten, Entzug von Plattform-Administrationsrechten und Klärung offener Verpflichtungen.
      m1:
        md: 'Die folgenden Trennungsschritte gelten sowohl für freiwillige als auch für erzwungene Austritte:'
      m2:
        md: |-
          - _<Gehaltene Rollen müssen abgegeben und im Rollenregister dokumentiert werden.>_
          - _<Laufende Aufgaben müssen freigegeben oder übergeben werden.>_
          - _<Zugang zu Kasse / Wallet / Signaturrechten muss entzogen werden.>_
          - _<Alle Administrationsrechte auf Plattformen müssen widerrufen werden.>_
          - _<Offene Verpflichtungen werden nach Möglichkeit geklärt oder übertragen, bevor der Austritt abgeschlossen wird.>_
      m3:
        md: '---'
  ratification-record:
    title: Ratifizierungsprotokoll
    blocks:
      m1:
        md: |-
          - **Angenommen:** <JJJJ-MM-TT>
          - **Entscheidungstyp:** Strategisch
          - **Version:** <Version>
          - **Entscheidungsprotokoll:** <Link zum Entscheidungsprotokoll>
