lang: fr
sourceHash: 73efb5de
title: Protocole de sortie et de séparation
preamble: |-
  - **Couche :** 1 — Système d'adhésion
  - **Statut :** Modèle — à adapter pour ta communauté
  - **Référence RCOS :** [§3.6](/articles/rcos-core/v0-1/layer-1-membership-system#36-exit-and-separation), [§3.7](/articles/rcos-core/v0-1/layer-1-membership-system#37-suspension-and-temporary-status), [§3.8](/articles/rcos-core/v0-1/layer-1-membership-system#38-artifacts)

  ---
sections:
  voluntary-exit:
    title: Sortie volontaire
    blocks:
      rationale:
        summary: Pourquoi rendre le départ sans friction ?
        body: Une communauté qu'il est difficile de quitter n'est pas une communauté — c'est un piège. La sortie volontaire DOIT être disponible à tout moment, sans interrogatoire, délai de préavis ou sanction, car le droit de retirer son consentement est ce qui rend tout autre acte de consentement réel. Conserver l'historique des contributions séparément garantit que partir n'efface pas le travail accompli par la personne.
      instructions:
        summary: Comment remplir cette section
        body: Décris le canal de soumission de la sortie, le délai de révocation des accès, les données conservées et la transition d'état résultante.
      m1:
        md: |-
          - _<Comment un membre soumet une sortie volontaire ; les raisons sont facultatives.>_
          - _<Délai de préavis ou attente de passation, le cas échéant.>_
          - _<Délai de révocation des accès (par ex. dans les 24 heures suivant la confirmation).>_
          - _<Ce qui est conservé — historique des contributions, registres de reconnaissance — et ce qui est supprimé.>_
          - _<Transition d'état résultante (par ex. vers Membre sorti·e).>_
          - _<Où et comment la sortie est enregistrée avec horodatage.>_
  forced-exit:
    title: Sortie forcée
    blocks:
      rationale:
        summary: Pourquoi conditionner l'exclusion à la Couche 4 ?
        body: L'exclusion est le pouvoir le plus tranchant que la communauté détient sur une personne. Si elle peut être exercée par quiconque dispose de suffisamment d'influence sociale, l'adhésion ne vaut rien. Exiger une décision de responsabilité conclue en Couche 4 — avec des motifs écrits, une notification et une durée minimale avant nouvelle candidature — transforme l'exclusion d'un acte de pouvoir en un acte de gouvernance qui peut être examiné et contesté.
      instructions:
        summary: Comment remplir cette section
        body: Indique que la sortie forcée ne peut résulter que d'un processus de responsabilité conclu en Couche 4. Définis la notification, la révocation des accès, les données conservées, le blocage de nouvelle candidature et la confidentialité du dossier de décision.
      m1:
        md: |-
          - _<La sortie forcée ne PEUT résulter que d'un processus de responsabilité conclu en Couche 4 avec une décision documentée.>_
          - _<Le membre concerné DOIT être notifié par écrit avec le motif et la référence du dossier de décision avant que les accès ne soient révoqués.>_
          - _<Délai de révocation des accès (par ex. dans les 24 heures suivant la décision).>_
          - _<Ce qui est conservé, ce qui est supprimé.>_
          - _<Blocage de nouvelle candidature (durée minimale, fixée par la décision de responsabilité ; référence Couche 4).>_
          - _<Confidentialité du dossier de décision (référence aux règles de confidentialité de l'Échelle de résolution des conflits).>_
  suspension:
    title: Suspension
    blocks:
      rationale:
        summary: Pourquoi concevoir la suspension avec soin — ou pas du tout ?
        body: Un état de suspension mal conçu est pire que pas de suspension du tout — il devient une sortie douce sans procédure régulière, ou un limbe indéfini utilisé pour punir sans la responsabilité d'une exclusion complète. Si la communauté ne peut pas s'engager sur des conditions explicites, des limites de durée et des mécanismes de révision, il est plus sûr de n'avoir aucune suspension formelle qu'une suspension floue.
      instructions:
        summary: Comment remplir cette section
        body: Soit tu définis explicitement la suspension (conditions d'entrée, limites de durée, droits pendant la suspension, mécanisme de révision, sortie), soit tu indiques qu'aucune suspension formelle n'existe. Ne laisse pas cette section ambiguë.
      m1:
        md: '_<Soit : définis l''état de suspension avec les conditions d''entrée, la durée maximale, les droits pendant la suspension, le mécanisme de révision obligatoire et la sortie ; soit : indique que la suspension formelle n''est pas définie actuellement.>_'
  asset-role-and-responsibility-separation:
    title: Séparation des actifs, rôles et responsabilités
    blocks:
      rationale:
        summary: Pourquoi énumérer les étapes de séparation ?
        body: Quand quelqu'un part, chaque fil non clos — un rôle que personne n'a libéré, une clé de portefeuille encore active, une tâche encore assignée — devient une surface d'attaque active ou une faille opérationnelle. Une liste de vérification force la clôture délibérée de ces fils, au lieu de les découvrir des mois plus tard quand quelque chose casse ou que quelqu'un utilise un accès qu'il ne DEVRAIT plus avoir.
      instructions:
        summary: Comment remplir cette section
        body: Fournis une liste de vérification applicable aux sorties volontaires et forcées. Inclus la libération des rôles, le transfert des tâches, la suppression des accès aux instruments financiers, la révocation des droits d'administration des plateformes et la résolution des obligations en cours.
      m1:
        md: 'Les étapes de séparation suivantes s''appliquent aux sorties volontaires et forcées :'
      m2:
        md: |-
          - _<Les rôles détenus DOIVENT être libérés et documentés dans le Registre des rôles.>_
          - _<Les tâches en cours DOIVENT être libérées ou transférées.>_
          - _<Les accès à la trésorerie / au portefeuille / à la signature DOIVENT être supprimés.>_
          - _<Tous les accès administratifs aux plateformes DOIVENT être révoqués.>_
          - _<Les obligations en cours sont résolues ou transférées avant la finalisation de la sortie dans la mesure du possible.>_
      m3:
        md: '---'
  ratification-record:
    title: Registre de ratification
    blocks:
      m1:
        md: |-
          - **Adopté le :** <AAAA-MM-JJ>
          - **Type de décision :** Stratégique
          - **Version :** <version>
          - **Dossier de décision :** <lien vers le dossier de décision>
