lang: de
sourceHash: '8ae44b9b'
title: Mitgliedschaftsvereinbarung
preamble: |-
  - **Ebene:** 1 — Mitgliedschaftssystem
  - **Status:** Vorlage — an deine Gemeinschaft anpassen
  - **RCOS-Referenz:** [§3.4](rcos:§3.4), [§3.5](rcos:§3.5), [§3.8](rcos:§3.8)

  > Wird von jedem Mitglied zum Zeitpunkt der Aufnahme unterschrieben (oder ausdrücklich bestätigt). Definiert die Rechte und Pflichten jedes Mitgliedschaftsstatus.

  ---
sections:
  membership-state-on-signing:
    title: Mitgliedschaftsstatus bei Unterzeichnung
    blocks:
      rationale:
        summary: Warum den Status bei Unterzeichnung festhalten?
        body: Mitgliedschaft ist kein einfaches Ja oder Nein. Eine beitretende Person muss genau wissen, in welchen Status sie eintritt — Probe oder Voll — denn der Status bestimmt, was sie tun kann und was von ihr erwartet wird. Den Status im Moment der Zustimmung zu benennen, verhindert spätere Unklarheiten darüber, wofür sie sich eigentlich angemeldet hat.
      instructions:
        summary: Wie du diesen Abschnitt ausfüllst
        body: Gib an, in welchen Mitgliedschaftsstatus ein neues Mitglied bei Unterzeichnung eintritt (z. B. Probemitglied, Vollmitglied oder ein anderer im Mitgliedschaftsstatus-Register definierter Status).
      m1:
        md: _<Mitgliedschaftsstatus bei Unterzeichnung — z. B. Probemitglied nach Genehmigung der Bewerbung; Vollmitglied nach Abschluss des Onboardings.>_
  member-rights:
    title: Rechte der Mitglieder
    blocks:
      rationale:
        summary: Warum Rechte ausdrücklich aufzählen?
        body: Rechte, die nicht schriftlich festgehalten sind, können stillschweigend entzogen werden. Sie aufzuzählen macht die Verpflichtungen der Gemeinschaft lesbar, durchsetzbar und symmetrisch zu den Pflichten, die den Mitgliedern auferlegt werden. Ohne diese Liste werden Pflichten zu unbegrenzten Forderungen ohne gegenseitigen Schutz.
      instructions:
        summary: Wie du diesen Abschnitt ausfüllst
        body: Liste konkrete Rechte auf, die jedem Mitgliedschaftsstatus gewährt werden. Verweise auf die Entscheidungsmatrix (Schicht 2) für Stimmrechte, das Rollenregister (Schicht 5) für Rollenberechtigung und Schicht 4 für Verfahrensgarantien.
      m1:
        md: |-
          1. _<Recht 1, z. B. das Recht, bei allen Entscheidungen gemäß der Entscheidungsmatrix abzustimmen.>_
          2. _<Recht 2, z. B. das Recht auf Zugang zu allen mitgliederexklusiven Kanälen, Calls und Gemeinschaftsunterlagen.>_
          3. _<Recht 3, z. B. das Recht, Rollen gemäß dem Rollenregister zu übernehmen.>_
          4. _<Recht 4, z. B. das Recht, Anerkennung durch anerkannte Beiträge zu erhalten.>_
          5. _<Recht 5, z. B. das Recht, Änderungen über den Governance-Prozess vorzuschlagen.>_
          6. _<Recht 6, z. B. das Recht, einen Konflikt über die Konfliktlösungsstufen ohne Vergeltung anzusprechen.>_
          7. _<Recht 7, z. B. das Recht, die Gemeinschaft jederzeit freiwillig zu verlassen.>_
          8. _<Recht 8, z. B. das Recht auf ein ordentliches Verfahren vor jedem erzwungenen Austritt, jeder Suspendierung oder Zugangsbeschränkung.>_
  member-obligations:
    title: Pflichten der Mitglieder
    blocks:
      rationale:
        summary: Warum Pflichten eng begrenzen?
        body: Unbegrenzte Pflichten sind der Weg, auf dem Gemeinschaften in Ausbeutung abgleiten — „trag mehr bei", „sei verfügbar", „sei da" ohne definierte Grenze. Pflichten einzeln aufzulisten und jede mit einem entsprechenden Recht zu verknüpfen, hält die Anforderungen begrenzt und anfechtbar. Ein Mitglied muss immer erkennen können, ob es die Vereinbarung erfüllt oder ob etwas verlangt wird, das darüber hinausgeht.
      instructions:
        summary: Wie du diesen Abschnitt ausfüllst
        body: 'Liste konkrete, begrenzte Pflichten auf. Jede Pflicht muss überprüfbar sein: Ein Mitglied muss erkennen können, ob es sie erfüllt. Vermeide vage Anforderungen.'
      m1:
        md: |-
          1. _<Pflicht 1, z. B. alle Identitätsvorgaben und Invarianten der Schicht 0 jederzeit einhalten.>_
          2. _<Pflicht 2, z. B. in mindestens einer anerkannten Kategorie pro definiertem Zeitraum zur Gemeinschaft beitragen.>_
          3. _<Pflicht 3, z. B. an Konfliktlösungsverfahren teilnehmen, wenn als Partei benannt oder als Zeuge angefragt.>_
          4. _<Pflicht 4, z. B. das Onboarding abschließen, bevor Vollmitgliedsrechte ausgeübt werden.>_
          5. _<Pflicht 5, z. B. die Gemeinschaft vor längerer Abwesenheit benachrichtigen.>_
          6. _<Pflicht 6, z. B. die Gemeinschaft, ihre Mitglieder oder ihre Governance nach außen nicht falsch darstellen.>_
          7. _<Pflicht 7, z. B. keine Befugnisse ausüben, die nicht ausdrücklich durch das Governance-System zugewiesen wurden.>_
  participation-and-contribution-expectations:
    title: Erwartungen an Teilnahme und Beitrag
    blocks:
      rationale:
        summary: Warum Teilnahme in Zahlen definieren?
        body: „Aktives Mitglied" bedeutet nichts ohne einen Schwellenwert. Ein definiertes Minimum — in Zeit, Kategorie und Häufigkeit — macht Teilnahme von einem Gefühl zu einer Tatsache, sodass niemand raten muss, ob er in gutem Ansehen steht, und niemand ohne Beweise beschuldigt werden kann, sich zurückgezogen zu haben. Es macht außerdem die Grenze zwischen einer echten Abwesenheit und stillem Rückzug früh genug sichtbar, um darauf reagieren zu können.
      instructions:
        summary: Wie du diesen Abschnitt ausfüllst
        body: Gib ein messbares Minimum an (Häufigkeit × Kategorie), Vertretungs- und Abwesenheitsregeln sowie den Auslöser, der ein nicht teilnehmendes Mitglied in einen Ebene-4-Prozess überführt.
      m1:
        md: |-
          - **Mindestbeitrag:** _<z. B. mindestens ein anerkannter Beitrag pro 6 Monate, in einer beliebigen anerkannten Kategorie.>_
          - **Anerkannte Kategorien:** _<Verweis auf das Binnenwirtschaftsprotokoll (Schicht 3).>_
          - **Vertretung:** _<z. B. ein Mitglied kann eine bestimmte Aufgabe delegieren, bleibt aber für die Erfüllung der Gesamtbeitragserwartungen verantwortlich.>_
          - **Längere Abwesenheit:** _<z. B. Benachrichtigung erforderlich bei Abwesenheiten länger als X Monate; Erwartungen werden für den gemeldeten Zeitraum bis zu einem Maximum pausiert.>_
          - **Auslöser bei Nichtteilnahme:** _<z. B. Fehlen anerkannter Beiträge über X aufeinanderfolgende Monate ohne vorherige Mitteilung löst eine Rechenschaftsprüfung (Schicht 4) aus.>_
  due-process-reference:
    title: Verweis auf ordentliches Verfahren
    blocks:
      rationale:
        summary: Warum das ordentliche Verfahren hier nochmals erwähnen?
        body: Die Mitgliedschaftsvereinbarung ist das eine Dokument, das jedes Mitglied tatsächlich liest und dem es zustimmt. Das ordentliche Verfahren hier zu benennen — nicht nur in Schicht 4 — stellt sicher, dass kein Mitglied nach einer Regel entfernt oder eingeschränkt werden kann, die ihm beim Beitritt nicht gezeigt wurde. Es schließt die Lücke zwischen dem, was die Gemeinschaft verspricht, und dem, was sie tun kann.
      instructions:
        summary: Wie du diesen Abschnitt ausfüllst
        body: Verweise auf die Konfliktlösungsstufen (Schicht 4) und das Austritts- und Trennungsprotokoll, damit jedes Mitglied, das die Mitgliedschaftsvereinbarung liest, weiß, wo die Verfahrensgarantien zu finden sind.
      m1:
        md: Jeder erzwungene Austritt, jede Suspendierung oder Zugangsbeschränkung folgt dem ordentlichen Verfahren der Schicht 4 und dem Austritts- und Trennungsprotokoll.
  consent-acknowledgment:
    title: Zustimmungserklärung
    blocks:
      rationale:
        summary: Warum ausdrückliche Zustimmung verlangen?
        body: Zustimmung, die angenommen wird, ist Zustimmung, die später bestritten werden kann. Einen ausdrücklichen Akt zu verlangen — Unterschrift, Klick, Bestätigung — zu einem bekannten Zeitpunkt bindet das Mitglied an die an diesem Tag geltenden Artefaktversionen und gibt der Gemeinschaft einen belastbaren Nachweis, dass die Vereinbarung freiwillig und wissentlich eingegangen wurde.
      instructions:
        summary: Wie du diesen Abschnitt ausfüllst
        body: Beschreibe den Akt der Zustimmung (Unterschrift, In-App-Bestätigung usw.) und welche Artefaktversionen das Mitglied zu diesem Zeitpunkt anerkennt.
      m1:
        md: Durch den Beitritt zur Gemeinschaft über den definierten Onboarding-Prozess stimmt das Mitglied ausdrücklich den Bedingungen dieser Vereinbarung und den zum Zeitpunkt der Aufnahme geltenden Ebene-0-Artefakten zu.
      m2:
        md: '---'
  ratification-record:
    title: Ratifizierungsprotokoll
    blocks:
      m1:
        md: |-
          - **Angenommen:** <JJJJ-MM-TT>
          - **Entscheidungstyp:** Strategisch
          - **Version:** <Version>
          - **Entscheidungsprotokoll:** <Link zum Entscheidungsprotokoll>
