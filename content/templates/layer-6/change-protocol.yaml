legacyPath: rcos-templates/layer-6/change-protocol
id: 0d3486d6
title: Change Protocol
parentId: e676f693
order: 0
preamble: |-
  - **Layer:** 6 — Evolution & Adaptation
  - **Status:** Template — adapt for your community
  - **RCOS reference:** [§8.1](/articles/rcos-core/v0-1/layer-6-evolution-adaptation#81-change-mechanisms), [§8.5](/articles/rcos-core/v0-1/layer-6-evolution-adaptation#85-change-safety-and-reversibility), [§8.6](/articles/rcos-core/v0-1/layer-6-evolution-adaptation#86-artifacts)

  ---
sections:
  - id: how-changes-are-proposed
    title: How Changes Are Proposed
    blocks:
      - id: clauses
        kind: clauses
        refs:
          - 8.1.1
          - 8.1.3
          - 8.6.3
          - 8.8.1
      - id: rationale
        kind: rationale
        summary: Why require a structured proposal?
        body: A change that arrives as a vague idea in chat cannot be evaluated, challenged, or rolled back later. Forcing every proposal through the same minimum shape — affected artifacts, rationale, risks, rollback — turns an opinion into a reviewable artifact and makes it impossible to slip a rule change past the community by accident.
      - id: instructions
        kind: instructions
        summary: How to fill this in
        body: State who may propose, where proposals are submitted, and the mandatory content fields. Tie this to the Governance Protocol (Layer 2).
      - id: m1
        kind: md
        md: '_<Any Full Member may propose a change to any RCOS artifact. State the submission channel.>_ Every proposal must include:'
      - id: m2
        kind: md
        md: |-
          - _<Summary of the change.>_
          - _<Affected layers and artifacts (with links).>_
          - _<Decision type (Operational / Strategic / Constitutional).>_
          - _<Rationale.>_
          - _<Risks and mitigations.>_
          - _<Rollback plan.>_
          - _<Proposed effective date.>_
  - id: how-proposals-are-classified
    title: How Proposals Are Classified
    blocks:
      - id: clauses
        kind: clauses
        refs:
          - 8.1.2
          - 8.1.4
      - id: rationale
        kind: rationale
        summary: Why classify by impact?
        body: Not every change deserves the same friction. Typo fixes should not need a supermajority; constitutional shifts should not pass quietly. Mapping proposals to decision types — and defaulting unclear cases upward — makes the cost of a change proportional to its blast radius and protects Layer 0 from being eroded through small moves.
      - id: instructions
        kind: instructions
        summary: How to fill this in
        body: Define what falls under each decision type. State the default-higher rule for ambiguous cases.
      - id: m1
        kind: md
        md: |-
          - **Operational:** _<wording corrections, formatting, minor content updates; no vote required; executed by the responsible role within delegated limits.>_
          - **Strategic:** _<changes to Layer 1–5 content that affect member rights, processes, or structures.>_
          - **Constitutional:** _<changes to Layer 0 (purpose, scope, invariants) or to the governance system itself (Layer 2).>_
      - id: m2
        kind: md
        md: '> If classification is unclear, it defaults to the higher-impact type.'
  - id: review-and-deliberation
    title: Review and Deliberation
    blocks:
      - id: clauses
        kind: clauses
        refs:
          - 8.1.2
          - 8.7.1
      - id: rationale
        kind: rationale
        summary: Why enforce minimum deliberation windows?
        body: Without a floor on deliberation time, any change can be rushed through on a slow day when few members are paying attention. Mandatory minimums — longer for higher-impact changes — guarantee that members who are travelling, ill, or simply busy still get a real chance to read, object, or show up.
      - id: instructions
        kind: instructions
        summary: How to fill this in
        body: Set minimum deliberation periods for each decision type, and a ratification period for Constitutional changes.
      - id: m1
        kind: md
        md: |-
          - **Operational:** _<no deliberation required.>_
          - **Strategic:** _<minimum X-day deliberation; deliberation venue.>_
          - **Constitutional:** _<minimum Y-day deliberation; Z-day ratification period after the vote passes.>_
  - id: adoption-and-publication
    title: Adoption and Publication
    blocks:
      - id: clauses
        kind: clauses
        refs:
          - 8.2.1
          - 8.2.2
          - 8.2.5
          - 8.6.3
      - id: rationale
        kind: rationale
        summary: Why fixed publication steps?
        body: A vote that passes but is never written down is the same as no vote at all — and worse, it creates a gap where whoever remembers the outcome gets to define it. Tight, ordered publication steps close that gap and make "what was adopted" a matter of record, not of memory.
      - id: instructions
        kind: instructions
        summary: How to fill this in
        body: State the ordered steps that must run after a proposal passes. Include time bounds and the version-history obligation.
      - id: m1
        kind: md
        md: 'When a proposal passes:'
      - id: m2
        kind: md
        md: |-
          1. _<Proposal file moved to the passed-proposals archive within X days.>_
          2. _<Affected artifacts updated within X days.>_
          3. _<Version history entry added.>_
          4. _<Status fields updated on affected artifacts.>_
  - id: rejection
    title: Rejection
    blocks:
      - id: clauses
        kind: clauses
        refs:
          - 8.2.2
          - 8.2.4
      - id: rationale
        kind: rationale
        summary: Why archive rejected proposals?
        body: Rejected ideas carry as much signal as accepted ones — they show what the community considered and declined. Keeping rejections filed and accessible prevents the same proposal from reappearing under a new name every six months and gives future members a view of the paths not taken.
      - id: instructions
        kind: instructions
        summary: How to fill this in
        body: State the archive location for rejected proposals and the re-vote conditions for revisiting the question.
      - id: m1
        kind: md
        md: 'When a proposal is rejected:'
      - id: m2
        kind: md
        md: |-
          1. _<Proposal file moved to the rejected-proposals archive within X days.>_
          2. _<No artifact changes made.>_
          3. _<Re-vote mechanism applies if new information emerges (per the Decision Matrix, Layer 2).>_
  - id: transition-and-migration
    title: Transition and Migration
    blocks:
      - id: clauses
        kind: clauses
        refs:
          - 8.5.1
          - 8.5.2
      - id: rationale
        kind: rationale
        summary: Why protect existing rights during transitions?
        body: If new rules could silently rewrite existing agreements, membership would be meaningless — what you signed up for could be changed out from under you. Explicit transition rules guarantee that rights are not reduced retroactively and that people operating under the old rules are given time and notice before the ground shifts.
      - id: instructions
        kind: instructions
        summary: How to fill this in
        body: State the rules protecting existing role holders, members, and records when a rule change takes effect.
      - id: m1
        kind: md
        md: 'When a rule change affects existing roles, agreements, or records:'
      - id: m2
        kind: md
        md: |-
          - _<Existing role holders notified before the change takes effect.>_
          - _<Existing members' rights may not be reduced without consent or a Constitutional vote.>_
          - _<Records that predate the change are not retroactively altered unless explicitly part of the proposal.>_
          - _<A transition period may be defined in the proposal itself.>_
  - id: rollback
    title: Rollback
    blocks:
      - id: clauses
        kind: clauses
        refs:
          - 8.1.5
          - 8.5.1
      - id: rationale
        kind: rationale
        summary: Why make rollback symmetrical with adoption?
        body: A change that cannot be undone through the same path that created it is a trap. Requiring rollback to use the original decision type keeps the door open for correction without letting a single member quietly reverse a community-level decision by calling it a "fix."
      - id: instructions
        kind: instructions
        summary: How to fill this in
        body: State that rollback uses the same decision type and process as the original adoption.
      - id: m1
        kind: md
        md: _<Any passed decision can be reversed through the same process as the original. Any Full Member may trigger a re-vote by submitting a written reasoned objection that was not considered during the original deliberation. Rollback uses the same decision type as the original.>_
  - id: emergency-changes
    title: Emergency Changes
    blocks:
      - id: clauses
        kind: clauses
        refs:
          - 8.5.3
      - id: rationale
        kind: rationale
        summary: Why allow emergency changes at all?
        body: Some harms unfold faster than a vote can be convened. A narrow, well-guarded emergency path lets the community respond to genuine safety or platform failures without handing anyone a general-purpose override. The mandatory report, review, and ratification-or-rollback cycle is what keeps emergency powers from becoming ordinary powers.
      - id: instructions
        kind: instructions
        summary: How to fill this in
        body: Define the conditions under which an emergency change may be made, who can make it, and the mandatory report-review-ratify-or-rollback cycle.
      - id: m1
        kind: md
        md: 'An emergency operational change may be made by _<role>_ only if all of the following conditions are met:'
      - id: m2
        kind: md
        md: |-
          1. _<Immediate action required to prevent safety harm or platform failure.>_
          2. _<A Full Member vote cannot be convened in time.>_
          3. _<The change does not override a Layer 0 invariant.>_
      - id: m3
        kind: md
        md: 'Emergency changes must be:'
      - id: m4
        kind: md
        md: |-
          - _<Reported to all Full Members within X hours.>_
          - _<Reviewed at the next community meeting.>_
          - _<Ratified via the appropriate decision type within Y days, or automatically rolled back.>_
  - id: experiments
    title: Experiments
    blocks:
      - id: clauses
        kind: clauses
        refs:
          - 8.3.1
          - 8.3.2
          - 8.3.3
          - 8.3.4
          - 8.3.5
          - 8.7.3
      - id: rationale
        kind: rationale
        summary: Why treat experiments as a distinct mechanism?
        body: The community needs a way to try new things without having to permanently adopt them to test them. Experiments create that space — but only if they are time-bounded, labeled, and auto-expiring. Without those guardrails, an "experiment" becomes the fastest way to install a permanent rule with no real deliberation.
      - id: instructions
        kind: instructions
        summary: How to fill this in
        body: Define the rules every experiment must satisfy. Reference the Experiment Template for the full submission shape.
      - id: m1
        kind: md
        md: _<Any Full Member may propose a time-bounded experiment via Strategic decision. See the Experiment Template for the required fields.>_
      - id: m2
        kind: md
        md: |-
          - _<Experiments expire automatically at the end of their defined duration unless explicitly renewed via a new proposal.>_
          - _<All artifacts affected by an experiment must be explicitly labeled as experimental for the duration.>_
          - _<Safety suspension: if an experiment introduces a credible safety risk, coercion, or sustained harm, an emergency suspension may be invoked per Emergency Changes above.>_
          - _<Results and learnings are recorded in the Learning Log.>_
      - id: m3
        kind: md
        md: '---'
  - id: ratification-record
    title: Ratification Record
    blocks:
      - id: m1
        kind: md
        md: |-
          - **Adopted:** <YYYY-MM-DD>
          - **Decision type:** Constitutional
          - **Version:** <version>
          - **Decision record:** <link to decision record>
