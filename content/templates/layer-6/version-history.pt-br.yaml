lang: pt-br
sourceHash: ecfe9629
title: Histórico de Versões
preamble: |-
  - **Camada:** 6 — Evolução e Adaptação
  - **Status:** Modelo — adapte para sua comunidade; atualizado a cada mudança adotada
  - **Referência RCOS:** [§8.2](rcos:§8.2), [§8.6](rcos:§8.6)

  > O registro autoritativo legível por humanos de todas as mudanças adotadas na implementação RCOS da sua comunidade. A versão atualmente ativa é a entrada mais recente no topo deste arquivo. Regras substituídas permanecem acessíveis via controle de versão.

  ---
sections:
  entry-format:
    title: Formato da Entrada
    blocks:
      rationale:
        summary: Por que registrar cada mudança adotada?
        body: Uma governança que não consegue apontar "o que mudou, quando e por quê" é indistinguível de uma governança ditada por quem fala mais alto. Um único livro-razão apenas-acréscimo de mudanças adotadas — com as versões substituídas preservadas no controle de versão — torna o estado atual das regras inequívoco e dá aos membros, auditores e futuros administradores uma forma de reconstruir o caminho que nos trouxe até aqui.
      instructions:
        summary: Como preencher isto
        body: Use o modelo de entrada abaixo para cada mudança adotada. Novas entradas são adicionadas acima da mais recente. Não edite entradas históricas — correções são registradas como novas entradas.
      m1:
        md: |-
          ```markdown
          ## <versão> — <Título curto>

          - **Data de vigência:** <AAAA-MM-DD>
          - **Registro de decisão:** <link para o registro de decisão>
          - **Tipo de decisão:** <Operacional / Estratégica / Constitucional>
          - **Mecanismo:** <mecanismo de votação / autoridade delegada>
          - **Resumo:** <uma a três sentenças descrevendo o que mudou.>
          - **Camadas afetadas:** <ex.: Camada 2, Camada 5>
          - **Artefatos alterados:** <lista de artefatos>
          - **Notas de migração:** <quaisquer regras de transição; "nenhuma" se não aplicável>
          ```
      m2:
        md: '---'
  current-version-v0-0-repository-initialized:
    title: 'Versão Atual: v0.0 — Repositório Inicializado'
    blocks:
      m1:
        md: |-
          - **Data de vigência:** <AAAA-MM-DD>
          - **Registro de decisão:** N/A — estrutura inicial
          - **Tipo de decisão:** N/A
          - **Mecanismo:** N/A
          - **Resumo:** Modelos inicializados. Todos os artefatos são modelos — nenhuma regra foi adotada ainda.
          - **Camadas afetadas:** Todas (apenas estrutura inicial)
          - **Artefatos alterados:** Todos os arquivos criados como modelos
          - **Notas de migração:** Nenhuma — estado inicial
      m2:
        md: '---'
      m3:
        md: _Novas entradas são adicionadas acima desta linha._
