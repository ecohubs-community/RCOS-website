lang: es
sourceHash: '522c9899'
title: Historial de Versiones
preamble: |-
  - **Capa:** 6 — Evolución y Adaptación
  - **Estado:** Plantilla — adapta para tu comunidad; actualizada con cada cambio adoptado
  - **Referencia RCOS:** [§8.2](rcos:§8.2), [§8.6](rcos:§8.6)

  > El registro legible por humanos y con carácter oficial de todos los cambios adoptados en la implementación RCOS de tu comunidad. La versión actualmente vigente es la entrada más reciente en la parte superior de este archivo. Las reglas sustituidas permanecen accesibles a través del control de versiones.

  ---
sections:
  entry-format:
    title: Formato de Entrada
    blocks:
      rationale:
        summary: ¿Por qué registrar cada cambio adoptado?
        body: Una gobernanza que no puede señalar "qué cambió, cuándo y por qué" es indistinguible de una gobernanza donde manda quien más alto habla. Un único registro de solo-anexión de cambios adoptados — con las versiones sustituidas preservadas en el control de versiones — hace que el estado actual de las reglas sea inequívoco y ofrece a los miembros, auditores y futuros responsables una forma de reconstruir el camino que nos trajo hasta aquí.
      instructions:
        summary: Cómo rellenar esto
        body: Usa la plantilla de entrada a continuación para cada cambio adoptado. Las nuevas entradas se anteponen por encima de la más reciente. No edites entradas históricas — las correcciones se registran como nuevas entradas.
      m1:
        md: |-
          ```markdown
          ## <versión> — <Título breve>

          - **Fecha de entrada en vigor:** <AAAA-MM-DD>
          - **Registro de decisión:** <enlace al registro de decisión>
          - **Tipo de decisión:** <Operativa / Estratégica / Constitucional>
          - **Mecanismo:** <mecanismo de votación / autoridad delegada>
          - **Resumen:** <una a tres frases describiendo qué cambió.>
          - **Capas afectadas:** <p. ej. Capa 2, Capa 5>
          - **Artefactos modificados:** <lista de artefactos>
          - **Notas de migración:** <cualquier regla de transición; "ninguna" si no aplica>
          ```
      m2:
        md: '---'
  current-version-v0-0-repository-initialized:
    title: 'Versión Actual: v0.0 — Repositorio Inicializado'
    blocks:
      m1:
        md: |-
          - **Fecha de entrada en vigor:** <AAAA-MM-DD>
          - **Registro de decisión:** N/A — andamiaje inicial
          - **Tipo de decisión:** N/A
          - **Mecanismo:** N/A
          - **Resumen:** Plantillas inicializadas. Todos los artefactos son plantillas — aún no se ha adoptado ninguna regla.
          - **Capas afectadas:** Todas (solo andamiaje)
          - **Artefactos modificados:** Todos los archivos creados como plantillas
          - **Notas de migración:** Ninguna — estado inicial
      m2:
        md: '---'
      m3:
        md: _Las nuevas entradas se anteponen por encima de esta línea._
