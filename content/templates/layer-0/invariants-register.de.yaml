lang: de
sourceHash: '9df2b8cc'
title: Invariantenregister
preamble: |-
  - **Schicht:** 0 — Identität & Geltungsbereich
  - **Status:** Vorlage — für deine Gemeinschaft anpassen
  - **RCOS-Referenz:** [§2.3](rcos:§2.3), [§2.5](rcos:§2.5)

  > Invarianten sind Rahmenbedingungen, die DARF NICHT verletzt werden, solange sie in Kraft sind. Keine Entscheidung, Rolle, Prozess oder Notfallmaßnahme darf eine Invariante außer Kraft setzen. Entsteht ein Konflikt zwischen einer Invariante und einer anderen Regel, hat die Invariante Vorrang.

  ---
sections:
  active-invariants:
    title: Aktive Invarianten
    blocks:
      rationale:
        summary: Warum können Invarianten nicht außer Kraft gesetzt werden?
        body: Invarianten sind der harte Boden des Systems — Dinge, die auch unter Druck, in Notfällen oder bei einer Mehrheitsentscheidung gelten müssen. Wenn eine Entscheidung, eine Rolle oder eine Krisenmaßnahme sie außer Kraft setzen könnte, wären sie keine Rahmenbedingungen mehr, sondern nur noch Präferenzen. Sie explizit aufzulisten und auf allen Schichten zu verankern macht das Governance-System auch unter Stress verlässlich — nicht nur an ruhigen Tagen.
      instructions:
        summary: So füllst du das aus
        body: 'Jede Invariante ist eine harte Rahmenbedingung. Halte sie wenige, spezifisch und absolut — so formuliert, dass jede Verletzung eindeutig erkennbar ist. Häufige Kategorien: Zweckschutz, Rückverfolgbarkeit von Autorität, Austrittsrechte, ideologische Neutralität, Nicht-Extraktion, Sicherheitsvorrang.'
      m1:
        md: |-
          | ID | Invariante | Hinzugefügt | Entscheidungsprotokoll |
          |---|---|---|---|
          | INV-001 | _<Invariantenaussage, z. B. Der primäre Zweck darf durch keine operative oder strategische Entscheidung, Rolle oder Notfallmaßnahme außer Kraft gesetzt werden.>_ | <JJJJ-MM-TT> | [Link] |
          | INV-002 | _<Invariantenaussage, z. B. Autorität muss stets explizit und auf das Governance-System zurückführbar sein — keine Person und keine Rolle darf nicht deklarierte Autorität innehaben oder ausüben.>_ | <JJJJ-MM-TT> | [Link] |
          | INV-003 | _<Invariantenaussage, z. B. Der Austritt aus der Gemeinschaft muss stets möglich sein und darf niemals blockiert, bestraft oder über das in Schicht 1 Festgelegte hinaus an Bedingungen geknüpft werden.>_ | <JJJJ-MM-TT> | [Link] |
          | INV-004 | _<Invariantenaussage.>_ | <JJJJ-MM-TT> | [Link] |
          | INV-005 | _<Invariantenaussage.>_ | <JJJJ-MM-TT> | [Link] |
          | INV-006 | _<Invariantenaussage, z. B. Körperliche, psychische und Kindersicherheit haben stets Vorrang vor Teilnahmerechten, Rollenkontinuität und Reputationsbelangen.>_ | <JJJJ-MM-TT> | [Link] |
