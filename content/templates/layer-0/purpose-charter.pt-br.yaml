lang: pt-br
sourceHash: f85baff8
title: Carta de Propósito
preamble: |-
  - **Camada:** 0 — Identidade e Escopo
  - **Status:** Modelo — adapte para sua comunidade
  - **Referência RCOS:** [§2.1](rcos:§2.1), [§2.5](rcos:§2.5)

  ---
sections:
  primary-purpose:
    title: Propósito Primário
    blocks:
      rationale:
        summary: Por que um único propósito duradouro?
        body: 'Toda decisão, papel e alocação de recursos a jusante precisa permanecer consistente com uma única coisa — o propósito primário da comunidade. Se ele deriva, muda com as tendências ou é reescrito para justificar o projeto mais recente, não sobra nada para ancorar a governança. Um propósito primário único e estável é a estrela polar constitucional: as estratégias mudam, o propósito não.'
      instructions:
        summary: Como preencher isto
        body: Declare exatamente um propósito primário. Ele deve descrever a razão duradoura pela qual sua comunidade existe — não um projeto, estratégia ou meta de curto prazo. Uma ou duas frases.
      m1:
        md: _<O propósito primário da sua comunidade, em uma ou duas frases.>_
  secondary-purposes:
    title: Propósitos Secundários
    blocks:
      rationale:
        summary: Por que permitir propósitos secundários?
        body: Uma comunidade raramente faz apenas uma coisa. Os propósitos secundários abrem espaço para os outros resultados concretos que a comunidade persegue — mas são subordinados. Se um propósito secundário entrar em conflito com o primário, o primário vence. Declará-los explicitamente impede que a expansão de escopo se disfarce de trabalho central.
      instructions:
        summary: Como preencher isto
        body: Liste resultados secundários concretos que a comunidade persegue. Eles não devem conflitar com nem sobrepor-se ao propósito primário. Remova a seção inteira se você não tiver nenhum.
      m1:
        md: |-
          1. _<Propósito secundário 1.>_
          2. _<Propósito secundário 2.>_
          3. _<Propósito secundário 3.>_
  non-goals-and-exclusions:
    title: Não-Objetivos e Exclusões
    blocks:
      rationale:
        summary: Por que declarar o que a comunidade não é?
        body: Comunidades derivam por acréscimo — uma suposição não contestada de cada vez. Nomear o que a comunidade explicitamente *não é* torna as violações de fronteira visíveis cedo e dá a qualquer pessoa uma base clara para objetar antes que uma atividade se normalize. O silêncio aqui é lido como consentimento.
      instructions:
        summary: Como preencher isto
        body: Nomeie as coisas que sua comunidade explicitamente NÃO é, especialmente identidades ou papéis que outros possam presumir por padrão (partido político, veículo de investimento, grupo religioso, etc.).
      m1:
        md: |-
          1. _<Não-objetivo 1.>_
          2. _<Não-objetivo 2.>_
          3. _<Não-objetivo 3.>_
  conditions-for-purpose-change:
    title: Condições para Mudança de Propósito
    blocks:
      rationale:
        summary: Por que tornar difícil mudar o propósito?
        body: O propósito é a única coisa da qual todo o resto depende. Se fosse fácil de mudar, nada acima dele na pilha — associação, governança, invariantes — poderia ser confiado a significar a mesma coisa de um ano para o outro. Limiares de nível constitucional e um prazo de ratificação forçam um ato deliberado e visível, não uma deriva silenciosa.
      instructions:
        summary: Como preencher isto
        body: 'Descreva o procedimento de mudança. No mínimo: o tipo de decisão exigido para o propósito primário (Constitucional, conforme a Camada 2), o limiar, o prazo de ratificação e onde a mudança é registrada (histórico de versões da Camada 6). Propósitos secundários normalmente precisam de um patamar mais baixo.'
      m1:
        md: 'O propósito primário só pode ser alterado por meio de uma decisão Constitucional conforme definida na Matriz de Decisão (Camada 2), exigindo _<limiar, ex.: supermaioria de Membros Plenos ≥⅔ dos votos emitidos>_, seguida de um período de ratificação não inferior a _<duração, ex.: 30 dias>_. Propósitos secundários podem ser alterados por meio de uma decisão Estratégica. Qualquer mudança deve ser registrada no Histórico de Versões (Camada 6).'
      m2:
        md: '---'
  ratification-record:
    title: Registro de Ratificação
    blocks:
      m1:
        md: |-
          - **Adotado em:** <AAAA-MM-DD>
          - **Tipo de decisão:** Constitucional
          - **Versão:** <versão>
          - **Registro de decisão:** <link para o registro de decisão>
