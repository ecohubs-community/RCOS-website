lang: es
sourceHash: 'b2f58556'
title: Declaración de Alcance
preamble: |-
  - **Capa:** 0 — Identidad y Alcance
  - **Estado:** Plantilla — adaptar para tu comunidad
  - **Referencia RCOS:** [§2.2](rcos:§2.2), [§2.5](rcos:§2.5)

  ---
sections:
  in-scope-assets:
    title: Activos Dentro del Alcance
    blocks:
      rationale:
        summary: ¿Por qué enumerar cada activo gobernado?
        body: Si la comunidad no ha nombrado explícitamente un activo como dentro del alcance, no lo está — punto final. Listar los activos por nombre cierra la brecha donde reclamos informales de autoridad crecen sobre recursos no declarados, y da a los miembros una lista de verificación concreta para comprobar qué controla realmente la comunidad.
      instructions:
        summary: Cómo rellenar esto
        body: 'Lista cada activo que la comunidad gobierna colectivamente: fondos compartidos, tesorerías, terrenos, bienes raíces, software, sitios web, cuentas en redes sociales, marca, propiedad intelectual, infraestructura física, etc. Sé específico/a — nombra cuentas, billeteras, dominios.'
      m1:
        md: |-
          1. _<Activo 1, p. ej. la tesorería compartida en una billetera multi-firma específica.>_
          2. _<Activo 2, p. ej. el sitio web de la comunidad y su dominio.>_
          3. _<Activo 3, p. ej. infraestructura física compartida o terrenos.>_
          4. _<Activo 4.>_
  in-scope-decision-domains:
    title: Dominios de Decisión Dentro del Alcance
    blocks:
      rationale:
        summary: ¿Por qué nombrar dominios de decisión y no solo activos?
        body: El alcance no se trata solo de cosas — se trata de qué tipos de preguntas la comunidad puede responder colectivamente. Nombrar los dominios de decisión deja claro sin ambigüedad dónde se aplica la autoridad colectiva y dónde un individuo o una parte externa aún decide, previniendo la captura silenciosa de territorio de decisión.
      instructions:
        summary: Cómo rellenar esto
        body: Lista las categorías de decisiones sobre las que la comunidad tiene autoridad. Estas se corresponden con capas posteriores (gobernanza, membresía, tesorería, etc.) — nómbralas a un nivel que deje claro qué tipos de preguntas la comunidad decide en conjunto.
      m1:
        md: |-
          1. _<Dominio de decisión 1, p. ej. reglas de gobernanza y procesos de decisión (Capa 2).>_
          2. _<Dominio de decisión 2, p. ej. reglas de membresía y admisión (Capa 1).>_
          3. _<Dominio de decisión 3, p. ej. tesorería y asignación de recursos compartidos (Capa 3).>_
          4. _<Dominio de decisión 4.>_
  in-scope-activities-and-responsibilities:
    title: Actividades y Responsabilidades Dentro del Alcance
    blocks:
      rationale:
        summary: ¿Por qué declarar el trabajo que la comunidad asume?
        body: Autoridad sin responsabilidad asumida produce parálisis; responsabilidad sin autoridad declarada produce agotamiento y culpa. Listar las actividades que la comunidad gobierna colectivamente hace el trabajo visible, asignable y con rendición de cuentas — y hace obvio cuándo algo importante no tiene responsable.
      instructions:
        summary: Cómo rellenar esto
        body: 'Lista las actividades continuas de las que la comunidad es responsable: mantener infraestructura compartida, admitir miembros, reportar sobre recursos, custodiar la marca, etc. Estas son las cosas que necesitan un responsable a través de la Capa 5.'
      m1:
        md: |-
          1. _<Actividad 1.>_
          2. _<Actividad 2.>_
          3. _<Actividad 3.>_
          4. _<Actividad 4.>_
  explicitly-out-of-scope:
    title: Explícitamente Fuera del Alcance
    blocks:
      rationale:
        summary: ¿Por qué nombrar lo que la comunidad no debe tocar?
        body: Un límite no declarado no es ningún límite. Los elementos explícitamente fuera del alcance protegen a los miembros de que la comunidad se entrometa en sus vidas privadas y finanzas, y protegen a partes externas de que la comunidad presuma autoridad sobre sus asuntos. Si no está nombrado aquí, la regla por defecto de "no está dentro del alcance significa fuera del alcance" sigue aplicando — pero nombrar los más importantes elimina cualquier margen de discusión.
      instructions:
        summary: Cómo rellenar esto
        body: 'Lista los límites más importantes: cosas que la gente podría asumir que están dentro del alcance pero no lo están. Finanzas personales, relaciones privadas, infraestructura de terceros, proyectos externos, etc.'
      m1:
        md: |-
          1. _<Elemento fuera del alcance 1, p. ej. ingresos personales y finanzas privadas de los miembros.>_
          2. _<Elemento fuera del alcance 2, p. ej. relaciones privadas y arreglos de vivienda personales (excepto donde apliquen condiciones críticas de seguridad de la Capa 4).>_
          3. _<Elemento fuera del alcance 3, p. ej. infraestructura de servidores subyacente y contratos con servicios de terceros.>_
          4. _<Elemento fuera del alcance 4.>_
      m2:
        md: '---'
  ratification-record:
    title: Registro de Ratificación
    blocks:
      m1:
        md: |-
          - **Adoptado:** <AAAA-MM-DD>
          - **Tipo de decisión:** Constitucional
          - **Versión:** <versión>
          - **Registro de decisión:** <enlace al registro de decisión>
