lang: de
sourceHash: '1d3cb162'
title: Register der Identitätsbeschränkungen
preamble: |-
  - **Ebene:** 0 — Identität & Geltungsbereich
  - **Status:** Vorlage — an deine Gemeinschaft anpassen
  - **RCOS-Referenz:** [§2.4](rcos:§2.4), [§2.5](rcos:§2.5)

  > Identitätsbeschränkungen sind die nicht verhandelbaren verhaltensbezogenen, ethischen und strukturellen Grenzen, die bestimmen, wer die Gemeinschaft ist. Anders als Invarianten (die das System selbst schützen) definieren Identitätsbeschränkungen, wie Mitglieder und die Gemeinschaft sich zu Menschen, Ökosystemen und Ideologien verhalten.

  ---
sections:
  active-identity-constraints:
    title: Aktive Identitätsbeschränkungen
    blocks:
      rationale:
        summary: Warum Identitätsbeschränkungen explizit festhalten?
        body: 'Jede Gemeinschaft hat implizite Regeln — „das machen wir hier nicht." Implizite Regeln werden zu Werkzeugen willkürlicher Durchsetzung: Wer soziale Macht hat, bestimmt, was sie bedeuten. Identitätsbeschränkungen aufzuschreiben und zu verlangen, dass sie durch definierte Prozesse überprüfbar sind, macht aus einer informellen Norm etwas, auf das sich ein Mitglied tatsächlich verlassen oder das es anfechten kann.'
      instructions:
        summary: Wie du diesen Abschnitt ausfüllst
        body: 'Jede Beschränkung muss durch einen definierten Prozess überprüfbar und durchsetzbar sein — keine vagen Bestrebungen. Gängige Kategorien aus RCOS §2.4.2: ethische/verhaltensbezogene Grenzen, Teilnahmevoraussetzungen, nicht verhandelbare kulturelle oder ökologische Beschränkungen. Verweise auf Schicht 4 für die Durchsetzung, Schicht 1 für Teilnahmekonsequenzen.'
      m1:
        md: |-
          1. _<Beschränkung 1, z. B. Mitglieder dürfen nicht in einer Weise handeln, die Macht konzentriert, Wert abschöpft oder Menschen, Land oder die Integrität der Governance schädigt.>_
          2. _<Beschränkung 2, z. B. Die Gemeinschaft darf nicht als Vehikel für spekulativen finanziellen Gewinn genutzt werden — interne Wirtschaftsmechanismen dienen der Anerkennung von Beiträgen, nicht der Profiterzielung.>_
          3. _<Beschränkung 3, z. B. Kein Mitglied und keine Rolle darf Autorität beanspruchen, die nicht ausdrücklich durch das Governance-System erteilt wurde.>_
          4. _<Beschränkung 4, z. B. Die Gemeinschaft darf lokalen Ökosystemen, dem Land oder der Biodiversität keinen anhaltenden Nettoschaden zufügen.>_
          5. _<Beschränkung 5, z. B. Ökologische Auswirkungen müssen bei allen wesentlichen Entscheidungen zu Ressourcen, Land und Infrastruktur berücksichtigt werden.>_
          6. _<Beschränkung 6, z. B. Die strukturelle Ebene der Gemeinschaft muss nicht-ideologisch und nicht-normativ bleiben — sie bietet ein Gerüst, keine vorgeschriebene Lebensweise.>_
          7. _<Beschränkung 7, z. B. Kein bestimmtes Glaubenssystem, keine Spiritualität, Kultur oder politische Ideologie darf als Voraussetzung für Mitgliedschaft oder Teilnahme verlangt werden.>_
          8. _<Beschränkung 8, z. B. Die Vielfalt der Ansätze für regeneratives Leben ist ein Merkmal, kein Problem.>_
  enforcement-and-testability:
    title: Durchsetzung und Überprüfbarkeit
    blocks:
      rationale:
        summary: Warum müssen Beschränkungen überprüfbar sein und nicht informell?
        body: Eine Beschränkung, die nicht überprüft werden kann, ist eine Beschränkung, die von demjenigen durchgesetzt wird, der das meiste soziale Kapital im Raum hat. Zu definieren, wie jede Beschränkung erkannt wird, wer sie anspricht und durch welchen Prozess sie gelöst wird, verhindert, dass Identitätsregeln zu Werkzeugen willkürlichen Ausschlusses werden.
      instructions:
        summary: Wie du diesen Abschnitt ausfüllst
        body: Beschreibe für jede oben genannte Beschränkung (oder als allgemeine Richtlinie), wie ein Verstoß erkannt und behandelt wird. Verweise auf die Konfliktlösungsleiter (Schicht 4) und alle für die Überwachung zuständigen Rollen (Schicht 5).
      m1:
        md: |-
          - _<Wie Verstöße erkannt und gemeldet werden.>_
          - _<Welcher Ebene-4-Prozess Verstöße welcher Beschränkungsklasse behandelt.>_
          - _<Welche Rollen oder Gremien für Überwachung und Überprüfung zuständig sind.>_
  conditions-for-change:
    title: Bedingungen für Änderungen
    blocks:
      instructions:
        summary: Wie du diesen Abschnitt ausfüllst
        body: Identitätsbeschränkungen sind verfassungsrechtlicher Natur — beschreibe den Entscheidungstyp, die Schwelle und das Ratifizierungsverfahren, die erforderlich sind, um eine Beschränkung hinzuzufügen, zu entfernen oder zu ändern.
      m1:
        md: Identitätsbeschränkungen dürfen nur durch eine Verfassungsentscheidung gemäß der Entscheidungsmatrix (Schicht 2) hinzugefügt, entfernt oder geändert werden, wobei _<Schwellenwert>_ erforderlich ist und eine Ratifizierungsfrist von mindestens _<Dauer>_ einzuhalten ist. Jede Änderung muss in der Versionshistorie (Schicht 6) dokumentiert werden.
      m2:
        md: '---'
  ratification-record:
    title: Ratifizierungsprotokoll
    blocks:
      m1:
        md: |-
          - **Angenommen:** <JJJJ-MM-TT>
          - **Entscheidungstyp:** Verfassungsentscheidung
          - **Version:** <Version>
          - **Entscheidungsprotokoll:** <Link zum Entscheidungsprotokoll>
