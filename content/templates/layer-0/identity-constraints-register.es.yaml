lang: es
sourceHash: '1d3cb162'
title: Registro de Restricciones de Identidad
preamble: |-
  - **Capa:** 0 — Identidad y Alcance
  - **Estado:** Plantilla — adaptar para tu comunidad
  - **Referencia RCOS:** [§2.4](rcos:§2.4), [§2.5](rcos:§2.5)

  > Las restricciones de identidad son los límites conductuales, éticos y estructurales no negociables que definen quién es la comunidad. A diferencia de los invariantes (que protegen el sistema en sí), las restricciones de identidad definen cómo los miembros y la comunidad se relacionan con las personas, los ecosistemas y las ideologías.

  ---
sections:
  active-identity-constraints:
    title: Restricciones de Identidad Activas
    blocks:
      rationale:
        summary: ¿Por qué declarar las restricciones de identidad explícitamente?
        body: 'Toda comunidad tiene reglas implícitas — "eso aquí no se hace." Las reglas implícitas se convierten en herramientas de aplicación arbitraria: quien tiene poder social decide lo que significan. Escribir las restricciones de identidad y exigir que sean verificables a través de procesos definidos es lo que convierte una norma informal en algo en lo que un miembro puede confiar o que puede cuestionar.'
      instructions:
        summary: Cómo rellenar esto
        body: 'Cada restricción debe ser verificable y aplicable mediante un proceso definido — no aspiraciones vagas. Categorías comunes de RCOS §2.4.2: límites éticos/conductuales, prerrequisitos de participación, restricciones culturales o ecológicas no negociables. Consultar la Capa 4 para la aplicación, la Capa 1 para las consecuencias de participación.'
      m1:
        md: |-
          1. _<Restricción 1, p. ej. Los miembros no deben actuar de formas que concentren poder, extraigan valor o causen daño a personas, territorio o integridad de la gobernanza.>_
          2. _<Restricción 2, p. ej. La comunidad no puede ser utilizada como vehículo para la ganancia financiera especulativa — los mecanismos económicos internos existen para reconocer la contribución, no para generar beneficio.>_
          3. _<Restricción 3, p. ej. Ningún miembro o rol puede reclamar autoridad que no haya sido explícitamente otorgada a través del sistema de gobernanza.>_
          4. _<Restricción 4, p. ej. La comunidad no debe causar daño neto sostenido a los ecosistemas locales, el territorio o la biodiversidad.>_
          5. _<Restricción 5, p. ej. El impacto ecológico debe ser considerado en todas las decisiones significativas sobre recursos, territorio e infraestructura.>_
          6. _<Restricción 6, p. ej. La capa estructural de la comunidad debe permanecer no ideológica y no normativa — proporciona andamiaje, no una forma de vida prescrita.>_
          7. _<Restricción 7, p. ej. Ningún sistema de creencias, espiritualidad, cultura o ideología política específica puede ser requerido como condición de membresía o participación.>_
          8. _<Restricción 8, p. ej. La diversidad de enfoques hacia la vida regenerativa es una característica, no un problema.>_
  enforcement-and-testability:
    title: Aplicación y Verificabilidad
    blocks:
      rationale:
        summary: ¿Por qué las restricciones deben ser verificables, no informales?
        body: Una restricción que no puede ser verificada es una restricción que será aplicada por quien tenga más capital social en la sala. Definir cómo se detecta cada restricción, quién la plantea y a través de qué proceso se resuelve es lo que impide que las reglas de identidad se conviertan en herramientas de exclusión arbitraria.
      instructions:
        summary: Cómo rellenar esto
        body: Para cada restricción anterior (o como política general), describe cómo se identifica y aborda una violación. Consultar la Escalera de Resolución de Conflictos (Capa 4) y cualquier rol responsable de la supervisión (Capa 5).
      m1:
        md: |-
          - _<Cómo se detectan y reportan las violaciones.>_
          - _<Qué proceso de la Capa 4 gestiona las violaciones de cada clase de restricción.>_
          - _<Qué roles u órganos son responsables de la supervisión y revisión.>_
  conditions-for-change:
    title: Condiciones para el Cambio
    blocks:
      instructions:
        summary: Cómo rellenar esto
        body: Las restricciones de identidad son constitucionales — describe el tipo de decisión, el umbral y el proceso de ratificación necesarios para añadir, eliminar o modificar una restricción.
      m1:
        md: Las restricciones de identidad solo pueden añadirse, eliminarse o modificarse mediante una decisión Constitucional según lo definido en la Matriz de Decisiones (Capa 2), requiriendo _<umbral>_ y un período de ratificación no inferior a _<duración>_. Cualquier cambio debe registrarse en el Historial de Versiones (Capa 6).
      m2:
        md: '---'
  ratification-record:
    title: Registro de Ratificación
    blocks:
      m1:
        md: |-
          - **Adoptado:** <AAAA-MM-DD>
          - **Tipo de decisión:** Constitucional
          - **Versión:** <versión>
          - **Registro de decisión:** <enlace al registro de decisión>
