lang: fr
sourceHash: f85baff8
title: Charte de raison d'être
preamble: |-
  - **Couche :** 0 — Identité et périmètre
  - **Statut :** Modèle — à adapter pour ta communauté
  - **Référence RCOS :** [§2.1](rcos:§2.1), [§2.5](rcos:§2.5)

  ---
sections:
  primary-purpose:
    title: Raison d'être principale
    blocks:
      rationale:
        summary: Pourquoi une raison d'être unique et pérenne ?
        body: 'Chaque décision, rôle et allocation de ressources en aval doit rester cohérent avec une seule chose — la raison d''être principale de la communauté. Si elle dérive, suit les tendances ou est réécrite pour justifier le dernier projet en date, il ne reste plus rien pour ancrer la gouvernance. Une raison d''être principale unique et stable est l''étoile polaire constitutionnelle : les stratégies changent, la raison d''être non.'
      instructions:
        summary: Comment remplir cette section
        body: Énonce exactement une raison d'être principale. Elle DOIT décrire la raison pérenne pour laquelle ta communauté existe — pas un projet, une stratégie ou un objectif à court terme. Une ou deux phrases.
      m1:
        md: _<La raison d'être principale de ta communauté, en une ou deux phrases.>_
  secondary-purposes:
    title: Raisons d'être secondaires
    blocks:
      rationale:
        summary: Pourquoi autoriser des raisons d'être secondaires ?
        body: Une communauté fait rarement une seule chose. Les raisons d'être secondaires laissent de la place aux autres résultats concrets que la communauté poursuit — mais elles sont subordonnées. Si une raison d'être secondaire entre un jour en conflit avec la principale, la principale l'emporte. Les déclarer explicitement empêche la dérive de périmètre de se faire passer pour du travail fondamental.
      instructions:
        summary: Comment remplir cette section
        body: Liste les résultats secondaires concrets que la communauté poursuit. Ils NE DOIVENT PAS entrer en conflit avec ou supplanter la raison d'être principale. Supprime entièrement cette section si tu n'en as aucun.
      m1:
        md: |-
          1. _<Raison d'être secondaire 1.>_
          2. _<Raison d'être secondaire 2.>_
          3. _<Raison d'être secondaire 3.>_
  non-goals-and-exclusions:
    title: Non-objectifs et exclusions
    blocks:
      rationale:
        summary: Pourquoi énoncer ce que la communauté n'est pas ?
        body: Les communautés dérivent par accumulation — une hypothèse non contestée à la fois. Nommer ce que la communauté n'est explicitement *pas* rend les violations de périmètre visibles tôt, et donne à quiconque une base claire pour s'opposer avant qu'une activité ne devienne normalisée. Le silence ici est interprété comme un consentement.
      instructions:
        summary: Comment remplir cette section
        body: Nomme les choses que ta communauté n'est explicitement PAS, en particulier les identités ou rôles que d'autres pourraient supposer par défaut (parti politique, véhicule d'investissement, groupe religieux, etc.).
      m1:
        md: |-
          1. _<Non-objectif 1.>_
          2. _<Non-objectif 2.>_
          3. _<Non-objectif 3.>_
  conditions-for-purpose-change:
    title: Conditions de modification de la raison d'être
    blocks:
      rationale:
        summary: Pourquoi rendre la modification de la raison d'être difficile ?
        body: La raison d'être est la seule chose dont tout le reste dépend. Si elle était facile à modifier, rien au-dessus dans la pile — adhésion, gouvernance, invariants — ne pourrait être considéré comme ayant le même sens d'une année à l'autre. Des seuils de niveau constitutionnel et un délai de ratification imposent un acte délibéré et visible, pas une dérive silencieuse.
      instructions:
        summary: Comment remplir cette section
        body: 'Décris la procédure de modification. Au minimum : le type de décision requis pour la raison d''être principale (Constitutionnelle, selon la Couche 2), le seuil, le délai de ratification, et où la modification est enregistrée (historique des versions, Couche 6). Les raisons d''être secondaires nécessitent typiquement un seuil plus bas.'
      m1:
        md: La raison d'être principale ne PEUT être modifiée que par une décision Constitutionnelle telle que définie dans la Matrice de décision (Couche 2), nécessitant _<seuil, par ex. supermajorité des Membres titulaires ≥⅔ des votes exprimés>_, suivie d'une période de ratification d'au moins _<durée, par ex. 30 jours>_. Les raisons d'être secondaires PEUVENT être modifiées par une décision Stratégique. Toute modification DOIT être enregistrée dans l'Historique des versions (Couche 6).
      m2:
        md: '---'
  ratification-record:
    title: Registre de ratification
    blocks:
      m1:
        md: |-
          - **Adoptée le :** <AAAA-MM-JJ>
          - **Type de décision :** Constitutionnelle
          - **Version :** <version>
          - **Procès-verbal de décision :** <lien vers le procès-verbal de décision>
