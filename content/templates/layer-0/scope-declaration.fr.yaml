lang: fr
sourceHash: bbf3d0e6
title: Déclaration de périmètre
preamble: |-
  - **Couche :** 0 — Identité et périmètre
  - **Statut :** Modèle — à adapter pour ta communauté
  - **Référence RCOS :** [§2.2](/articles/rcos-core/v0-1/layer-0-identity-scope#22-scope-declaration), [§2.5](/articles/rcos-core/v0-1/layer-0-identity-scope#25-artifacts)

  ---
sections:
  in-scope-assets:
    title: Actifs dans le périmètre
    blocks:
      rationale:
        summary: Pourquoi énumérer chaque actif gouverné ?
        body: Si la communauté n'a pas explicitement désigné un actif comme étant dans le périmètre, il ne l'est pas — point final. Lister les actifs par leur nom comble le vide dans lequel des revendications informelles d'autorité se développent sur des ressources non déclarées, et donne aux membres une liste de vérification concrète de ce que la communauté contrôle réellement.
      instructions:
        summary: Comment remplir cette section
        body: 'Liste tous les actifs que la communauté gouverne collectivement : fonds partagés, trésoreries, terrains, biens immobiliers, logiciels, sites web, comptes sur les réseaux sociaux, marque, propriété intellectuelle, infrastructure physique, etc. Sois précis·e — nomme les comptes, portefeuilles, domaines.'
      m1:
        md: |-
          1. _<Actif 1, p. ex. la trésorerie commune détenue dans un portefeuille multi-signature spécifique.>_
          2. _<Actif 2, p. ex. le site web de la communauté et son nom de domaine.>_
          3. _<Actif 3, p. ex. l'infrastructure physique partagée ou le terrain.>_
          4. _<Actif 4.>_
  in-scope-decision-domains:
    title: Domaines de décision dans le périmètre
    blocks:
      rationale:
        summary: Pourquoi nommer les domaines de décision, et pas seulement les actifs ?
        body: Le périmètre ne concerne pas uniquement les biens — il s'agit aussi de savoir quels types de questions la communauté peut trancher collectivement. Nommer les domaines de décision rend explicite où s'applique l'autorité collective et où c'est un individu ou une partie externe qui décide, empêchant ainsi la capture silencieuse de territoires décisionnels.
      instructions:
        summary: Comment remplir cette section
        body: Liste les catégories de décisions sur lesquelles la communauté a autorité. Elles correspondent aux couches ultérieures (gouvernance, adhésion, trésorerie, etc.) — nomme-les à un niveau qui rende clair quels types de questions la communauté décide ensemble.
      m1:
        md: |-
          1. _<Domaine de décision 1, p. ex. règles de gouvernance et processus décisionnels (Couche 2).>_
          2. _<Domaine de décision 2, p. ex. règles d'adhésion et admission (Couche 1).>_
          3. _<Domaine de décision 3, p. ex. trésorerie et allocation des ressources partagées (Couche 3).>_
          4. _<Domaine de décision 4.>_
  in-scope-activities-and-responsibilities:
    title: Activités et responsabilités dans le périmètre
    blocks:
      rationale:
        summary: Pourquoi déclarer le travail dont la communauté est responsable ?
        body: L'autorité sans responsabilité assumée produit la paralysie ; la responsabilité sans autorité déclarée produit l'épuisement et les reproches. Lister les activités que la communauté gouverne collectivement rend le travail visible, assignable et imputable — et met en évidence quand quelque chose d'important n'a pas de responsable.
      instructions:
        summary: Comment remplir cette section
        body: 'Liste les activités permanentes dont la communauté est responsable : entretien de l''infrastructure partagée, admission des membres, rapports sur les ressources, gestion de la marque, etc. Ce sont les choses qui ont besoin d''un·e responsable via la Couche 5.'
      m1:
        md: |-
          1. _<Activité 1.>_
          2. _<Activité 2.>_
          3. _<Activité 3.>_
          4. _<Activité 4.>_
  explicitly-out-of-scope:
    title: Explicitement hors périmètre
    blocks:
      rationale:
        summary: Pourquoi nommer ce que la communauté ne doit pas toucher ?
        body: Une limite non énoncée n'est pas une limite. Les éléments explicitement hors périmètre protègent les membres contre l'intrusion de la communauté dans leur vie privée et leurs finances, et protègent les parties externes contre toute présomption d'autorité de la communauté sur leurs affaires. Si un élément n'est pas nommé ici, la règle par défaut « ce qui n'est pas dans le périmètre est hors périmètre » s'applique toujours — mais nommer les éléments importants ne laisse aucune place à la contestation.
      instructions:
        summary: Comment remplir cette section
        body: 'Liste les limites les plus importantes : les choses que les gens pourraient supposer être dans le périmètre mais qui ne le sont pas. Finances personnelles, relations privées, infrastructure de tiers, projets externes, etc.'
      m1:
        md: |-
          1. _<Élément hors périmètre 1, p. ex. revenus personnels et finances privées des membres.>_
          2. _<Élément hors périmètre 2, p. ex. relations privées et arrangements de vie personnels (sauf lorsque les conditions critiques de sécurité de la Couche 4 s'appliquent).>_
          3. _<Élément hors périmètre 3, p. ex. infrastructure serveur sous-jacente et contrats de services tiers.>_
          4. _<Élément hors périmètre 4.>_
      m2:
        md: '---'
  ratification-record:
    title: Registre de ratification
    blocks:
      m1:
        md: |-
          - **Adopté le :** <AAAA-MM-JJ>
          - **Type de décision :** Constitutionnel
          - **Version :** <version>
          - **Registre de décision :** <lien vers le registre de décision>
