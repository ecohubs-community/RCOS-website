lang: pt-br
sourceHash: f187885c
title: Registro de Invariantes
preamble: |-
  - **Camada:** 0 — Identidade e Escopo
  - **Status:** Modelo — adapte para a sua comunidade
  - **Referência RCOS:** [§2.3](/articles/rcos-core/v0-1/layer-0-identity-scope#23-invariants), [§2.5](/articles/rcos-core/v0-1/layer-0-identity-scope#25-artifacts)

  > Invariantes são restrições que NÃO DEVEM ser violadas enquanto estiverem em vigor. Nenhuma decisão, papel, processo ou medida emergencial pode sobrepor um invariante. Se surgir um conflito entre um invariante e qualquer outra regra, o invariante prevalece.

  ---
sections:
  active-invariants:
    title: Invariantes Ativos
    blocks:
      rationale:
        summary: Por que os invariantes não podem ser sobrepostos?
        body: Os invariantes são o piso rígido do sistema — as coisas que precisam continuar verdadeiras mesmo sob pressão, emergência ou votação popular. Se qualquer decisão, papel ou medida de crise pudesse sobrepô-los, eles deixariam de ser restrições e se tornariam preferências. Listá-los explicitamente e vinculá-los a todas as camadas é o que torna o sistema de governança confiável sob estresse, não apenas em dias tranquilos.
      instructions:
        summary: Como preencher
        body: 'Cada invariante é uma restrição rígida. Mantenha-os poucos, específicos e absolutos — formulados de modo que qualquer violação seja inequivocamente identificável. Categorias comuns: proteção do propósito, rastreabilidade da autoridade, direitos de saída, neutralidade ideológica, não extração, primazia da segurança.'
      m1:
        md: |-
          | ID | Invariante | Adicionado em | Registro de decisão |
          |---|---|---|---|
          | INV-001 | _<Declaração do invariante, ex.: O propósito primário nunca pode ser sobreposto por qualquer decisão operacional ou estratégica, papel ou medida emergencial.>_ | <AAAA-MM-DD> | [link] |
          | INV-002 | _<Declaração do invariante, ex.: A autoridade deve ser sempre explícita e rastreável até o sistema de governança — nenhuma pessoa ou papel pode deter ou exercer autoridade não declarada.>_ | <AAAA-MM-DD> | [link] |
          | INV-003 | _<Declaração do invariante, ex.: A saída da comunidade deve ser sempre possível e nunca deve ser bloqueada, penalizada ou condicionada além do que está definido na Camada 1.>_ | <AAAA-MM-DD> | [link] |
          | INV-004 | _<Declaração do invariante.>_ | <AAAA-MM-DD> | [link] |
