lang: de
sourceHash: 703e533c
title: Autoritätenregister
preamble: |-
  - **Schicht:** 2 — Governance & Entscheidungslogik
  - **Status:** Vorlage — an deine Gemeinschaft anpassen
  - **RCOS-Referenz:** [§4.3](/articles/rcos-core/v0-1/layer-2-governance-decision-logic#43-authority-boundaries), [§4.7](/articles/rcos-core/v0-1/layer-2-governance-decision-logic#47-artifacts)

  > Listet alle Rollen, Kreise oder Gremien auf, die Entscheidungsbefugnis besitzen, zusammen mit ihrem expliziten Geltungsbereich, ihren Grenzen und ihrer Amtszeit.

  ---
sections:
  registered-authorities:
    title: Registrierte Autoritäten
    blocks:
      rationale:
        summary: Warum jede Autorität schriftlich festhalten?
        body: Autorität, die nicht explizit registriert ist, wird stillschweigend gefüllt — von wem auch immer am längsten dabei ist, am lautesten spricht oder die Schlüssel kontrolliert. Ein einziges Register, das jede Rolle benennt, ihren Geltungsbereich eingrenzt, ihre Grenzen festlegt und ihre Grundlage an einen Delegationsakt knüpft, macht unautorisiertes Handeln erkennbar und verhindert, dass Autorität aus Charisma, Seniorität oder Eigentum abgeleitet wird.
      instructions:
        summary: Wie du das ausfüllst
        body: Liste für jede Rolle, jedes Gremium oder jeden Kreis, der Autorität besitzt, den Geltungsbereich der Autorität, harte Grenzen, Amtszeit/Dauer und die Grundlage (Mitgliedschaftsstatus, Delegationsakt usw.) auf. Das Kollektivgremium der Vollmitglieder ist selbst eine Autorität und gehört in diese Tabelle.
      m1:
        md: |-
          | Rolle / Gremium | Geltungsbereich der Autorität | Grenzen | Amtszeit / Dauer | Grundlage |
          |---|---|---|---|---|
          | _<z. B. Vollmitglieder (kollektiv)>_ | _<Geltungsbereich>_ | _<Grenzen — darf Invarianten nicht außer Kraft setzen; darf nicht außerhalb der Entscheidungsmatrix handeln>_ | _<Dauer>_ | _<Grundlage — Mitgliedschaftsstatus>_ |
          | _<z. B. Mitgliedschaftsverwaltung>_ | _<Geltungsbereich>_ | _<Grenzen>_ | _<Dauer>_ | _<Grundlage — delegiert durch Vollmitglieder>_ |
          | _<z. B. Finanz-Steward>_ | _<Geltungsbereich>_ | _<Grenzen — Ausgabenobergrenze>_ | _<Dauer>_ | _<Grundlage>_ |
          | _<...>_ | _<...>_ | _<...>_ | _<...>_ | _<...>_ |
      m2:
        md: '> **Befangenheitsausschluss:** Eine Rolleninhaberin oder ein Rolleninhaber darf die delegierte Autorität nicht in Entscheidungen ausüben, bei denen ein direktes persönliches Interesse besteht. In solchen Fällen wird die Entscheidung über den Governance-Prozess eskaliert.'
      m3:
        md: |-
          > Autorität darf nicht aus Charisma, Seniorität, Eigentum oder informellem Einfluss abgeleitet werden.
          > Temporäre oder Notfall-Autorität muss explizit definiert, zeitlich begrenzt und einer Überprüfung unterzogen werden.
      m4:
        md: '---'
  ratification-record:
    title: Ratifizierungsprotokoll
    blocks:
      m1:
        md: |-
          - **Angenommen:** <JJJJ-MM-TT>
          - **Entscheidungstyp:** Konstitutionell
          - **Version:** <Version>
          - **Entscheidungsprotokoll:** <Link zum Entscheidungsprotokoll>
