lang: fr
sourceHash: 24c47a1f
title: Registre des autorités
preamble: |-
  - **Couche :** 2 — Gouvernance et logique de décision
  - **Statut :** Modèle — à adapter pour ta communauté
  - **Référence RCOS :** [§4.3](rcos:§4.3), [§4.7](rcos:§4.7)

  > Répertorie tous les rôles, cercles ou organes détenant une autorité décisionnelle, ainsi que leur périmètre explicite, leurs limites et leur durée de mandat.

  ---
sections:
  registered-authorities:
    title: Autorités enregistrées
    blocks:
      rationale:
        summary: Pourquoi consigner chaque autorité par écrit ?
        body: Une autorité qui n'est pas explicitement enregistrée est comblée par défaut — par la personne présente depuis le plus longtemps, qui parle le plus fort ou qui détient les clés. Un registre unique qui nomme chaque rôle, délimite son périmètre, plafonne ses limites et rattache sa base à un acte de délégation rend toute action non autorisée détectable et empêche que l'autorité ne découle du charisme, de l'ancienneté ou de la propriété.
      instructions:
        summary: Comment remplir ce document
        body: Pour chaque rôle, organe ou cercle détenant une autorité, indique le périmètre d'autorité, les limites strictes, la durée du mandat et la base (statut de membre, acte de délégation, etc.). Le corps collectif des membres à part entière est lui-même une autorité et doit figurer dans ce tableau.
      m1:
        md: |-
          | Rôle / Organe | Périmètre d'autorité | Limites | Durée du mandat | Base |
          |---|---|---|---|---|
          | _<p. ex. Membres à part entière (collectif)>_ | _<périmètre>_ | _<limites — ne peut pas outrepasser les invariants ; ne peut pas agir en dehors de la matrice de décision>_ | _<durée>_ | _<base — statut de membre>_ |
          | _<p. ex. Admin des adhésions>_ | _<périmètre>_ | _<limites>_ | _<durée>_ | _<base — délégué par les membres à part entière>_ |
          | _<p. ex. Responsable des finances>_ | _<périmètre>_ | _<limites — plafond de dépenses>_ | _<durée>_ | _<base>_ |
          | _<...>_ | _<...>_ | _<...>_ | _<...>_ | _<...>_ |
      m2:
        md: '> **Récusation pour conflit d''intérêts :** un titulaire de rôle NE DOIT PAS exercer son autorité déléguée dans toute décision où il a un intérêt personnel direct. Dans ce cas, la décision est escaladée via le processus de gouvernance.'
      m3:
        md: |-
          > L'autorité NE DOIT PAS découler du charisme, de l'ancienneté, de la propriété ou de l'influence informelle.
          > Toute autorité temporaire ou d'urgence DOIT être explicitement définie, limitée dans le temps et soumise à un examen.
      m4:
        md: '---'
  ratification-record:
    title: Procès-verbal de ratification
    blocks:
      m1:
        md: |-
          - **Adopté le :** <AAAA-MM-JJ>
          - **Type de décision :** Constitutionnel
          - **Version :** <version>
          - **Procès-verbal de décision :** <lien vers le procès-verbal de décision>
