lang: pt-br
sourceHash: 24c47a1f
title: Registro de Autoridades
preamble: |-
  - **Camada:** 2 — Governança e Lógica de Decisão
  - **Status:** Modelo — adapte para sua comunidade
  - **Referência RCOS:** [§4.3](rcos:§4.3), [§4.7](rcos:§4.7)

  > Lista todos os papéis, círculos ou órgãos que detêm autoridade decisória, junto com seu escopo explícito, limites e duração.

  ---
sections:
  registered-authorities:
    title: Autoridades Registradas
    blocks:
      rationale:
        summary: Por que registrar cada autoridade por escrito?
        body: A autoridade que não é registrada explicitamente acaba sendo preenchida por padrão — por quem está há mais tempo, fala mais alto ou controla as chaves. Um único registro que nomeia cada papel, delimita seu escopo, define seus limites e vincula sua base a um ato de delegação torna ações não autorizadas detectáveis e impede que a autoridade seja derivada de carisma, antiguidade ou propriedade.
      instructions:
        summary: Como preencher
        body: Para cada papel, órgão ou círculo que detém autoridade, liste o escopo da autoridade, os limites rígidos, o mandato/duração e a base (estado de associação, ato de delegação, etc.). O conjunto coletivo de Membros Plenos é em si uma autoridade e pertence a esta tabela.
      m1:
        md: |-
          | Papel / Órgão | Escopo da autoridade | Limites | Mandato / Duração | Base |
          |---|---|---|---|---|
          | _<ex.: Membros Plenos (coletivo)>_ | _<escopo>_ | _<limites — não pode anular invariantes; não pode agir fora da Matriz de Decisão>_ | _<duração>_ | _<base — estado de associação>_ |
          | _<ex.: Administrador de Associação>_ | _<escopo>_ | _<limites>_ | _<duração>_ | _<base — delegada pelos Membros Plenos>_ |
          | _<ex.: Responsável de Finanças>_ | _<escopo>_ | _<limites — teto de gastos>_ | _<duração>_ | _<base>_ |
          | _<...>_ | _<...>_ | _<...>_ | _<...>_ | _<...>_ |
      m2:
        md: '> **Impedimento por conflito de interesse:** Um detentor de papel não pode exercer sua autoridade delegada em qualquer decisão em que tenha interesse pessoal direto. Nesses casos, a decisão é escalada pelo processo de governança.'
      m3:
        md: |-
          > A autoridade não deve ser derivada de carisma, antiguidade, propriedade ou influência informal.
          > Autoridade temporária ou de emergência deve ser explicitamente definida, limitada no tempo e sujeita a revisão.
      m4:
        md: '---'
  ratification-record:
    title: Registro de Ratificação
    blocks:
      m1:
        md: |-
          - **Adotado em:** <AAAA-MM-DD>
          - **Tipo de decisão:** Constitucional
          - **Versão:** <versão>
          - **Registro da decisão:** <link para o registro da decisão>
