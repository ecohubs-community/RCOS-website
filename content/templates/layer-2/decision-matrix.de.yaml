lang: de
sourceHash: '8c53f945'
title: Entscheidungsmatrix
preamble: |-
  - **Schicht:** 2 — Governance & Entscheidungslogik
  - **Status:** Vorlage — an deine Gemeinschaft anpassen
  - **RCOS-Referenz:** [§4.2](rcos:§4.2), [§4.4](rcos:§4.4), [§4.7](rcos:§4.7)

  > Ordnet jeden Entscheidungstyp und -bereich einer autorisierten Rolle oder einem Gremium, einem Mechanismus, einer Schwelle und einem Eskalationspfad zu. Entscheidungen, die außerhalb dieser Matrix getroffen werden, gelten als ungültig.

  ---
sections:
  voting-principles:
    title: Abstimmungsgrundsätze
    blocks:
      rationale:
        summary: Warum Mechanismus, Schwelle und Zeitrahmen vorab festlegen?
        body: Eine Abstimmung ohne vordefinierten Mechanismus, Schwelle und Beratungszeitraum ist eine Einladung, Ergebnisse im Nachhinein zu manipulieren — wer die Stimmen zählt oder die Uhr stellt, gewinnt. Diese Parameter im Voraus festzulegen macht jede kollektive Entscheidung reproduzierbar und unter denselben Bedingungen anfechtbar, unabhängig davon, wer gerade im Raum ist.
      instructions:
        summary: Wie du diesen Abschnitt ausfüllst
        body: Lege die Abstimmungsplattform, die Schwelle für jeden Entscheidungstyp, den Beratungszeitraum, die Patt-Regel, die Regel für erneute Abstimmungen sowie etwaige delegierte Ausgabenlimits oder Zuständigkeitsgrenzen fest.
      m1:
        md: |-
          - **Abstimmungsplattform:** _<z. B. Snapshot, Loomio, Konsens in Präsenz.>_
          - **Operative Schwelle:** _<z. B. keine Abstimmung erforderlich — delegiert an die zuständige operative Rolleninhaberin laut Rollenregister.>_
          - **Strategische Schwelle:** _<z. B. einfache Mehrheit (>50 %); mindestens X Tage Beratungszeit.>_
          - **Konstitutionelle Schwelle:** _<z. B. Supermehrheit (≥⅔); mindestens Y Tage Beratungszeit; Z Tage Ratifizierungszeitraum.>_
          - **Stimmengleichheit:** _<z. B. Vorschlag scheitert; Status quo bleibt bestehen.>_
          - **Erneute Abstimmung:** _<z. B. jedes Vollmitglied kann mit einem schriftlich begründeten Einwand, der eine während der Beratung nicht behandelte Erwägung benennt, eine erneute Abstimmung auslösen.>_
          - **Begründeter Einwand:** _<Definiere, was als begründeter Einwand gilt — nenne eine konkrete Erwägung, die während der Beratung nicht vorgebracht wurde; allgemeine Ablehnung genügt nicht.>_
          - **Delegiertes Ausgabenlimit:** _<z. B. 0 €; oder definiere eine Schwelle, unterhalb derer delegierte Ausgaben zulässig sind.>_
          - _<Weitere Abstimmungsgrundsätze, die deine Gemeinschaft festlegen möchte.>_
      m2:
        md: '---'
  matrix:
    title: Matrix
    blocks:
      rationale:
        summary: Warum eine einzige verbindliche Matrix?
        body: Wenn die Regeln darüber, wer was entscheidet, nur in den Köpfen der Leute existieren, wird Autorität zu dem, was die lauteste oder ranghöchste Person sagt. Eine öffentliche Matrix, die jede Entscheidung an einen Bereich, ein Gremium, einen Mechanismus und eine Schwelle bindet, macht jede Kompetenzüberschreitung sofort sichtbar — und macht jede außerhalb der Matrix getroffene Entscheidung per Definition ungültig.
      instructions:
        summary: Wie du diesen Abschnitt ausfüllst
        body: Lege für jeden Entscheidungsbereich (Mitgliedschaft, Finanzen, Plattform, Partnerschaften, Governance usw.) den Entscheidungstyp, das autorisierte Gremium, die teilnahmeberechtigten Personen, den Mechanismus, die Schwelle, Blockadebedingungen und den Eskalationspfad fest.
      m1:
        md: |-
          | Entscheidungsbereich | Entscheidungstyp | Autorisiertes Gremium | Teilnahmeberechtigte | Mechanismus | Schwelle | Blockade- / Vetobedingungen | Eskalation |
          |---|---|---|---|---|---|---|---|
          | _<z. B. Mitgliedsaufnahme>_ | _<Operativ / Strategisch / Konstitutionell>_ | _<Rolle oder Gremium>_ | _<wer teilnimmt>_ | _<Abstimmung / delegiert>_ | _<Schwelle>_ | _<Blockadebedingungen>_ | _<Eskalationspfad>_ |
          | _<z. B. Finanzausgaben — klein>_ | _<...>_ | _<...>_ | _<...>_ | _<...>_ | _<...>_ | _<...>_ | _<...>_ |
          | _<z. B. Finanzausgaben — groß>_ | _<...>_ | _<...>_ | _<...>_ | _<...>_ | _<...>_ | _<...>_ | _<...>_ |
          | _<z. B. Änderungen an Governance-Regeln>_ | _<Konstitutionell>_ | _<...>_ | _<...>_ | _<...>_ | _<...>_ | _<...>_ | _<...>_ |
          | _<z. B. Änderungen am Hauptzweck / an Invarianten>_ | _<Konstitutionell>_ | _<...>_ | _<...>_ | _<...>_ | _<...>_ | _<...>_ | _<...>_ |
      m2:
        md: '> **Operative Rolleninhaber:** Jede operative Entscheidung wird von der benannten Rolleninhaberin ausgeführt, die für den jeweiligen Bereich zuständig ist, und zwar innerhalb ihres definierten Zuständigkeitsbereichs gemäß dem Rollenregister (Schicht 5). Wenn eine Entscheidung mehrere Bereiche betrifft, handelt jede Rolleninhaberin innerhalb ihres eigenen Zuständigkeitsbereichs.'
  decision-type-definitions:
    title: Definitionen der Entscheidungstypen
    blocks:
      rationale:
        summary: Warum jede Entscheidung klassifizieren?
        body: Ohne einen Typ wird jede Entscheidung mit der Geschwindigkeit und Sorgfalt behandelt, die gerade passt — Routineänderungen versanden in Debatten, und konstitutionelle Änderungen rutschen unbemerkt durch. Feste Typen binden das Gewicht einer Entscheidung an den Prozess, den sie durchlaufen muss, und die Regel „im Zweifel höher einstufen" schließt die Lücke, die sonst ausgenutzt werden könnte.
      instructions:
        summary: Wie du diesen Abschnitt ausfüllst
        body: Definiere jeden Entscheidungstyp anhand seines Geltungsbereichs, wer ihn ausführt, welchen Prozess er erfordert und wie Streitigkeiten über die Klassifizierung gelöst werden.
      m1:
        md: |-
          - **Operativ** — _<Tagesgeschäft innerhalb bestehender Regeln; wird von der zuständigen Rolleninhaberin ohne Abstimmung ausgeführt.>_
          - **Strategisch** — _<langfristige Ausrichtung, bedeutende Ressourcenzuweisung, Schaffung/Abschaffung wesentlicher Strukturen; erfordert eine Abstimmung der Vollmitglieder mit definiertem Beratungszeitraum.>_
          - **Konstitutionell** — _<Änderungen an Schicht 0 (Zweck, Geltungsbereich, Invarianten) oder am Governance-System selbst; erfordert eine Abstimmung der Vollmitglieder, Supermehrheit und einen Ratifizierungszeitraum.>_
      m2:
        md: '> Wenn eine Entscheidung nicht eindeutig klassifiziert werden kann, wird standardmäßig der Typ mit höherer Auswirkung angewandt.'
      m3:
        md: '---'
  ratification-record:
    title: Ratifizierungsprotokoll
    blocks:
      m1:
