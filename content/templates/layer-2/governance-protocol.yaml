kind: template
legacyPath: rcos-templates/layer-2/governance-protocol
id: 1403643f
title: Governance Protocol
parentId: b7e62f01
order: 1
preamble: |-
  - **Layer:** 2 — Governance & Decision Logic
  - **Status:** Template — adapt for your community
  - **RCOS reference:** [§4.5](/articles/rcos-core/v0-1/layer-2-governance-decision-logic#45-governance-protocol), [§4.6](/articles/rcos-core/v0-1/layer-2-governance-decision-logic#46-safeguards-and-failure-modes), [§4.7](/articles/rcos-core/v0-1/layer-2-governance-decision-logic#47-artifacts)

  > Defines the full lifecycle of a collective decision — from proposal submission to documentation and appeal.

  ---
sections:
  - id: proposal-submission
    title: Proposal Submission
    blocks:
      - id: clauses
        kind: clauses
        refs:
          - 4.5.1
          - 4.5.2
      - id: rationale
        kind: rationale
        summary: Why formalize how proposals enter the system?
        body: A decision process that accepts proposals informally — a message, a verbal suggestion, a founder's idea — has no reliable way to tell what is actually on the table. Requiring a standard submission format, filing location, and mandatory content fields means every proposal arrives with the same information, visible to everyone, traceable from day one.
      - id: instructions
        kind: instructions
        summary: How to fill this in
        body: State who may propose, where proposals are submitted, the mandatory content fields, and how decision type is determined and challenged.
      - id: m1
        kind: md
        md: |-
          - _<Operational decisions — handled by the relevant role holder per the Role Registry; no proposal required.>_
          - _<Strategic and Constitutional decisions — who may submit, and on what platform.>_
          - _<Mandatory proposal fields: summary, affected layers and artifacts, decision type, rationale, risks and mitigations, rollback plan, proposed effective date.>_
          - _<Decision type is declared by proposer; defaults to higher-impact type if unclear.>_
          - _<Withdrawal rules — when a proposal can be withdrawn and how.>_
  - id: review-and-deliberation
    title: Review and Deliberation
    blocks:
      - id: clauses
        kind: clauses
        refs:
          - 4.5.1
          - 4.5.2
      - id: rationale
        kind: rationale
        summary: Why enforce a minimum deliberation window?
        body: Rushed votes favor whoever is already paying attention and disadvantage everyone else. A mandatory deliberation period, tied to the weight of the decision, gives members time to read, respond, and surface concerns before the vote opens — so the vote reflects considered judgment, not speed of reaction.
      - id: instructions
        kind: instructions
        summary: How to fill this in
        body: Name the deliberation venues and the minimum periods for Strategic and Constitutional decisions before a vote may open.
      - id: m1
        kind: md
        md: |-
          - _<Where deliberation happens (forum, chat, meeting).>_
          - _<Minimum deliberation period before a vote opens — Strategic.>_
          - _<Minimum deliberation period before a vote opens — Constitutional.>_
          - _<Expectation that members raise concerns during deliberation to avoid the need for re-votes.>_
  - id: decision-execution
    title: Decision Execution
    blocks:
      - id: clauses
        kind: clauses
        refs:
          - 4.5.1
          - 4.5.4
      - id: rationale
        kind: rationale
        summary: Why tie execution to the record?
        body: A passed proposal that never reaches the affected artifact is a decision in name only — the rules on the ground still say what they said before. Binding execution to a concrete artifact update and version-history entry closes the gap between what was decided and what is actually in force.
      - id: instructions
        kind: instructions
        summary: How to fill this in
        body: State what happens when a proposal passes (artifact updates, version history) and when it is rejected (archive). Define a time bound for both.
      - id: m1
        kind: md
        md: |-
          - _<On passing: how proposal is filed; affected artifacts updated; version history entry made.>_
          - _<On rejection: where proposal is archived.>_
          - _<Time bound for execution after a vote concludes.>_
  - id: documentation-and-publication
    title: Documentation and Publication
    blocks:
      - id: clauses
        kind: clauses
        refs:
          - 4.5.4
      - id: rationale
        kind: rationale
        summary: Why document every outcome, including rejections?
        body: Keeping a record of only the decisions that passed erases the reasoning history — members lose track of what was already considered and rejected, and the same debates get re-litigated indefinitely. Archiving both passed and rejected proposals, with a time bound and a verifiable decision record, preserves institutional memory and makes the governance system auditable.
      - id: instructions
        kind: instructions
        summary: How to fill this in
        body: State retention rules for passed and rejected proposals, what counts as the decision record, and the version-history update obligation.
      - id: m1
        kind: md
        md: |-
          - _<All passed and rejected proposals are filed within X days of the vote closing.>_
          - _<The vote artifact (e.g. Snapshot link) serves as the decision record.>_
          - _<Version history (Layer 6) updated with every passed proposal.>_
  - id: appeal-and-review
    title: Appeal and Review
    blocks:
      - id: clauses
        kind: clauses
        refs:
          - 4.5.2
          - 4.6.2
      - id: rationale
        kind: rationale
        summary: Why make re-votes possible but bounded?
        body: A governance system with no appeal route hardens mistakes into permanent rules; one with unlimited informal appeal paths never settles anything. Allowing any Full Member to trigger a re-vote — but only with a written, reasoned objection raising something not already addressed — keeps the system self-correcting without turning every decision into a standing referendum.
      - id: instructions
        kind: instructions
        summary: How to fill this in
        body: Define the conditions for triggering a re-vote, the objection format, and the threshold/mechanism for the re-vote itself.
      - id: m1
        kind: md
        md: |-
          - _<Who may trigger a re-vote and how.>_
          - _<Reasoned objection requirement — a consideration not addressed in original deliberation.>_
          - _<Re-vote uses the same mechanism and threshold as the original.>_
          - _<Treatment of repeated frivolous re-vote requests.>_
  - id: conflict-between-decisions
    title: Conflict Between Decisions
    blocks:
      - id: clauses
        kind: clauses
        refs:
          - 4.5.3
      - id: rationale
        kind: rationale
        summary: Why predefine conflict resolution?
        body: When two decisions point in different directions, someone has to choose which one counts — and if that choice is made ad hoc, it reduces to whoever has the authority or energy to enforce their reading. A fixed precedence rule (higher type wins; more recent wins at the same type) resolves conflicts mechanically, without a judgment call.
      - id: instructions
        kind: instructions
        summary: How to fill this in
        body: 'State the precedence rule (typically: higher decision type prevails; more recent wins at the same type, unless explicitly locked).'
      - id: m1
        kind: md
        md: |-
          - _<Precedence: Constitutional > Strategic > Operational.>_
          - _<Same-type conflicts: more recent prevails unless earlier explicitly locked future changes.>_
          - _<Where conflicts are surfaced and how they are resolved.>_
  - id: safeguards-and-failure-modes
    title: Safeguards and Failure Modes
    blocks:
      - id: clauses
        kind: clauses
        refs:
          - 4.6.1
          - 4.6.2
          - 4.6.3
      - id: rationale
        kind: rationale
        summary: Why plan for governance failure up front?
        body: Every governance system fails somewhere — captured by a subgroup, frozen by informal vetoes, drifted by a role holder who quietly expanded their remit. Naming the specific failure modes in advance, wiring in challenge routes that cannot be retaliated against, and requiring a formal review when failures accumulate, is what keeps governance from slowly hollowing out while no one is watching.
      - id: instructions
        kind: instructions
        summary: How to fill this in
        body: For each named failure mode, state the safeguard. Include a trigger that forces a Constitutional review if failures accumulate.
      - id: m1
        kind: md
        md: |-
          - **Power concentration:** _<how the protocol prevents unilateral authority above operational scope.>_
          - **Informal vetoes:** _<rule that only written, reasoned objections submitted via the defined process carry weight.>_
          - **Decision capture:** _<rule about quorum and openness of voting.>_
          - **Founder/role entrenchment:** _<rule that no role grants permanent authority; founders hold no special governance authority beyond membership state.>_
          - **Challenge without retaliation:** _<reference Layer 4 anti-retaliation provisions.>_
          - **Persistent failure trigger:** _<e.g. three or more governance failures within X months trigger a Constitutional review.>_
      - id: m2
        kind: md
        md: '---'
  - id: ratification-record
    title: Ratification Record
    blocks:
      - id: m1
        kind: md
        md: |-
          - **Adopted:** <YYYY-MM-DD>
          - **Decision type:** Constitutional
          - **Version:** <version>
          - **Decision record:** <link to decision record>
