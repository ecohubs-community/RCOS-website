kind: template
legacyPath: rcos-templates/layer-3/treasury-ruleset
id: 9ead12cf
title: Treasury Ruleset
parentId: 7fcb6634
order: 1
preamble: |-
  - **Layer:** 3 — Economic & Resource System
  - **Status:** Template — adapt for your community
  - **RCOS reference:** [§5.3](/articles/rcos-core/v0-1/layer-3-economic-resource-system#53-treasury-management), [§5.5](/articles/rcos-core/v0-1/layer-3-economic-resource-system#55-artifacts)

  ---
sections:
  - id: treasury-scope
    title: Treasury Scope
    blocks:
      - id: clauses
        kind: clauses
        refs:
          - 5.3.1
          - 5.5.4
      - id: rationale
        kind: rationale
        summary: Why draw a hard line around treasury funds?
        body: Without an explicit boundary, any money flowing near the community — a founder's personal card, a side account, an informal reimbursement pool — can drift into being treated as community money, with all the obligations that entails. Naming exactly which accounts are treasury and which are not protects both the community and the individuals paying out of pocket.
      - id: instructions
        kind: instructions
        summary: How to fill this in
        body: Name every account that is treasury (wallet, bank account, etc.) and state explicitly that personal funds operating informally are not treasury and create no community obligation.
      - id: m1
        kind: md
        md: _<Define which accounts are community treasury — explicit wallet addresses, bank accounts, etc. State that any new treasury account must be declared and approved via a Strategic decision before funds are received into it. State that personal funds covering operational costs are not treasury and carry no community repayment claim.>_
  - id: income-sources
    title: Income Sources
    blocks:
      - id: clauses
        kind: clauses
        refs:
          - 5.3.2
      - id: rationale
        kind: rationale
        summary: Why route all income through one declared list?
        body: Every income source carries strings — reporting requirements, expectations, dependency risks. If income channels can open informally, those strings get attached before the community has had a chance to weigh them. One declared list, changed only through Strategic decisions, keeps the community's obligations under its own control.
      - id: instructions
        kind: instructions
        summary: How to fill this in
        body: Name every income source the community currently has, and reference the Internal Economy Protocol for the rule that any new income channel requires a Strategic decision.
      - id: m1
        kind: md
        md: _<List current income sources, or state that there are none. Reference the External Income Interfaces section in the Internal Economy Protocol.>_
  - id: spending-authority
    title: Spending Authority
    blocks:
      - id: clauses
        kind: clauses
        refs:
          - 5.3.3
          - 5.7.1
      - id: rationale
        kind: rationale
        summary: Why spell out thresholds in a table?
        body: 'When spending authority is vague, two failure modes appear: either every small decision escalates and nothing gets done, or a single steward quietly accumulates discretion no one ever voted to grant them. A table of amounts, decision types, and authorized bodies removes the ambiguity and makes unauthorized spending immediately visible.'
      - id: instructions
        kind: instructions
        summary: How to fill this in
        body: Define spending tiers by amount and the decision type, authorized body, and mechanism for each. Multi-year contracts and debt should sit in their own (Constitutional) tier.
      - id: m1
        kind: md
        md: |-
          | Amount | Decision Type | Authorized Body | Mechanism |
          |---:|---|---|---|
          | _<Up to delegated limit (e.g. €X)>_ | _<Operational>_ | _<Finance Steward>_ | _<Delegated>_ |
          | _<Any amount above delegated limit>_ | _<Strategic>_ | _<Full Members>_ | _<Vote>_ |
          | _<Multi-year contracts, debt, or structural financial obligations>_ | _<Constitutional>_ | _<Full Members>_ | _<Supermajority + ratification>_ |
  - id: transparency-and-reporting
    title: Transparency and Reporting
    blocks:
      - id: clauses
        kind: clauses
        refs:
          - 5.3.4
          - 5.3.5
          - 5.6.1
      - id: rationale
        kind: rationale
        summary: Why make transparency the default, not a feature?
        body: 'Opacity in a treasury compounds: one missing disclosure invites another, and before long members can no longer verify whether the community''s money is being handled as they agreed. Making real-time visibility the baseline — and requiring any exception to be named, justified, and time-bounded — keeps audit within reach of every member, not just stewards.'
      - id: instructions
        kind: instructions
        summary: How to fill this in
        body: State the visibility default for each treasury account. Where direct visibility is not possible (e.g. some bank accounts), define a periodic reporting cadence with a named owner.
      - id: m1
        kind: md
        md: |-
          - _<Primary treasury (e.g. Safe multi-sig): all Full Members hold at minimum read access; real-time visibility.>_
          - _<Other declared accounts: direct multi-user read access if supported; otherwise periodic balance and transaction summary.>_
          - _<All spending decisions reference the linked governance record (vote ID or delegated decision log).>_
  - id: reserve-risk-and-debt-constraints
    title: Reserve, Risk, and Debt Constraints
    blocks:
      - id: clauses
        kind: clauses
        refs:
          - 5.3.6
      - id: rationale
        kind: rationale
        summary: Why block debt and long-term obligations by default?
        body: Debt and recurring commitments bind the community beyond the people currently in it — future members inherit the obligations. Forbidding them unless a Strategic vote explicitly authorizes keeps long-term constraints from being entered into casually, and preserves the option to stay lightweight.
      - id: instructions
        kind: instructions
        summary: How to fill this in
        body: State the rules on debt, recurring obligations, contingency reserves, and off-treasury financial instruments. Default to "not allowed without Strategic vote" for anything that binds the future.
      - id: m1
        kind: md
        md: |-
          - **Debt:** _<allowed only via Strategic vote.>_
          - **Long-term obligations:** _<recurring costs / contracts allowed only via Strategic vote.>_
          - **Contingency reserve:** _<reserve target, or state that one is not yet defined.>_
          - **Off-treasury instruments:** _<loans, investments, guarantees only via Strategic vote.>_
  - id: conflict-of-interest-rules
    title: Conflict-of-Interest Rules
    blocks:
      - id: clauses
        kind: clauses
        refs:
          - 5.4.3
      - id: rationale
        kind: rationale
        summary: Why ban self-approval outright?
        body: Even well-intentioned people unconsciously tilt decisions toward their own interests; a rule that requires disclosure and abstention removes the judgment call and the social pressure to "trust someone." Self-approval of spending is the single most common way small governance systems quietly lose integrity, so the rule is stated bluntly.
      - id: instructions
        kind: instructions
        summary: How to fill this in
        body: State the no-self-approval rule and the disclose-and-abstain rule for any member with a direct financial interest in a spending decision.
      - id: m1
        kind: md
        md: |-
          - _<Requesters may not approve their own spending requests.>_
          - _<Members with a direct financial interest in a spending decision must declare it and abstain.>_
          - _<Treasury role holders may not authorize unilateral spending beyond the delegated limit.>_
      - id: m2
        kind: md
        md: '---'
  - id: ratification-record
    title: Ratification Record
    blocks:
      - id: m1
        kind: md
        md: |-
          - **Adopted:** <YYYY-MM-DD>
          - **Decision type:** Strategic
          - **Version:** <version>
          - **Decision record:** <link to decision record>
