lang: de
sourceHash: 'ff1d75cd'
title: Protokoll für die interne Wirtschaft
preamble: |-
  - **Ebene:** 3 — Wirtschafts- & Ressourcensystem
  - **Status:** Vorlage — an deine Gemeinschaft anpassen
  - **RCOS-Referenz:** [§5.1](rcos:§5.1), [§5.2](rcos:§5.2), [§5.4](rcos:§5.4), [§5.5](rcos:§5.5)

  ---
sections:
  commons-vs-private-classification:
    title: 'Klassifikation: Gemeingut vs. Privateigentum'
    blocks:
      rationale:
        summary: Warum jede Ressource klassifizieren?
        body: Nicht klassifizierte Ressourcen sind der Ort, an dem stille Privatisierung geschieht — jemand beginnt, ein gemeinschaftliches Gut als persönliches zu behandeln, oder ein privates Gut wird stillschweigend in Gemeinschaftsverpflichtungen übernommen, und wenn es jemand bemerkt, hat sich die Norm bereits verschoben. Eine explizite Klassifikation — mit vorab benannten Verwalter\*innen und Übertragungsregeln — macht jede Statusänderung zu einem sichtbaren Governance-Akt statt zu einer schleichenden Tatsache.
      instructions:
        summary: Wie du das ausfüllst
        body: Lege für jede Ressource der Gemeinschaft die Klassifikation fest (Gemeingut / Privateigentum), benenne eine\*n Verwalter\*in, definiere Zugangsregeln und formuliere Übertragungsbeschränkungen. Nicht klassifizierte Ressourcen dürfen weder zugewiesen, belastet, monetarisiert noch übertragen werden, bis sie klassifiziert sind.
      m1:
        md: |-
          | Ressource | Klassifikation | Verwalter\*in | Zugangsregeln | Übertragungsbeschränkungen |
          |---|---|---|---|---|
          | _<z. B. RCOS-Spezifikation und Artefakte>_ | _<Gemeingut / Privateigentum>_ | _<Verwalterrolle>_ | _<wer liest / schreibt>_ | _<Übertragungsbeschränkungen>_ |
          | _<z. B. Gemeinschaftskasse>_ | _<...>_ | _<...>_ | _<...>_ | _<...>_ |
          | _<z. B. Gemeinschaftswebsite / Domains>_ | _<...>_ | _<...>_ | _<...>_ | _<...>_ |
          | _<z. B. Marke und Social-Media-Konten>_ | _<...>_ | _<...>_ | _<...>_ | _<...>_ |
          | _<z. B. Grundstück oder physische Infrastruktur>_ | _<...>_ | _<...>_ | _<...>_ | _<...>_ |
      m2:
        md: '> Nicht klassifizierte Ressourcen dürfen weder zugewiesen, belastet, monetarisiert noch übertragen werden, bis die Klassifikation abgeschlossen ist.'
  recognized-contribution-categories:
    title: Anerkannte Beitragskategorien
    blocks:
      rationale:
        summary: Warum benennen, welche Arten von Arbeit zählen?
        body: Wenn die Gemeinschaft nie ausspricht, auf welche Arten von Arbeit sie angewiesen ist, bleibt die unsichtbare Arbeit — Fürsorge, Moderation, Facilitation, Verwaltung — unsichtbar, und die Menschen, die sie leisten, brennen aus oder gehen. Das Aufzählen von Kategorien verwandelt „das macht halt irgendjemand" in anerkannte Arbeit, die das System berücksichtigen muss.
      instructions:
        summary: Wie du das ausfüllst
        body: Liste die Beitragskategorien auf, die deine Gemeinschaft anerkennt. Fürsorge, Facilitation, Verwaltung und informelle Teilnahme werden häufig zu wenig anerkannt — benenne sie explizit, wenn sie zutreffen.
      m1:
        md: |-
          | Kategorie | Beispiele |
          |---|---|
          | _<z. B. Wissen & Forschung>_ | _<Beispiele>_ |
          | _<z. B. Technische Entwicklung>_ | _<Beispiele>_ |
          | _<z. B. Governance & Koordination>_ | _<Beispiele>_ |
          | _<z. B. Gemeinschaftsaufbau>_ | _<Beispiele>_ |
          | _<z. B. Fürsorge & Unterstützung>_ | _<Beispiele>_ |
          | _<z. B. Verwaltung>_ | _<Beispiele>_ |
          | _<z. B. Informelle Teilnahme>_ | _<Beispiele>_ |
  contribution-recognition-mechanism:
    title: Mechanismus zur Beitragsanerkennung
    blocks:
      rationale:
        summary: Warum genau festlegen, wie Anerkennung funktioniert?
        body: Ohne einen definierten Mechanismus wird „wer Anerkennung bekommt" zu einer Frage davon, wer am lautesten ist oder der entscheidenden Person am nächsten steht. Wenn festgelegt wird, was zählt, wie es dokumentiert wird, wer es bestätigt und wie man es anfechten kann, wird Anerkennung zu etwas, auf das sich ein Mitglied tatsächlich verlassen kann — und es wird verhindert, dass Anerkennung sich stillschweigend in Governance-Einfluss verwandelt.
      instructions:
        summary: Wie du das ausfüllst
        body: Lege fest, was zählt, wie Anerkennungen dokumentiert werden, wer sie bestätigt, was sie bewirken (oder nicht bewirken), und wie Mitglieder einen Eintrag anfechten können.
      m1:
        md: |-
          - **Was zählt:** _<welche Aktivitäten zählen und auf wessen Erklärung hin.>_
          - **Wie Beiträge dokumentiert werden:** _<strukturierter Kanal; informeller/selbst gemeldeter Kanal.>_
          - **Wer bestätigt:** _<automatisch / Rolleninhaber\*in / Nominierungsprozess.>_
          - **Auswirkung auf Zugang/Privilegien:** _<Anerkennung wirkt sich nur auf das Guthaben interner Einheiten aus; sie gewährt keine zusätzlichen Governance-Rechte über den Mitgliedschaftsstatus hinaus.>_
          - **Anfechtung:** _<Frist und Verfahren zur Anfechtung eines Eintrags.>_
  internal-units:
    title: Interne Einheiten
    blocks:
      rationale:
        summary: Warum interne Einheiten so genau definieren?
        body: Interne Einheiten neigen dazu, Befugnisse zu entwickeln, über die niemand abgestimmt hat — Verfall, Obergrenzen, Übertragbarkeit, Governance-Gewicht — es sei denn, jede Eigenschaft wird schriftlich festgehalten. Die Auflistung von Ausgabe, Übertragungsregeln, Datenschutz und explizitem Nicht-Governance-Status macht die Einheiten zu Werkzeugen der Anerkennung statt zu stillen Schattenwährungen.
      instructions:
        summary: Wie du das ausfüllst
        body: Wenn deine Gemeinschaft interne Einheiten verwendet (XP, ECO, Credits usw.), definiere für jede Einheit Zweck, Ausgabe, Übertragbarkeit, Verfall, Obergrenze, Betrugsprävention und Datenschutz. Stelle explizit fest, dass Einheiten keine Governance-Rechte über den Mitgliedschaftsstatus hinaus gewähren.
      m1:
        md: |-
          | Eigenschaft | _<Einheit A>_ | _<Einheit B>_ |
          |---|---|---|
          | **Zweck** | _<...>_ | _<...>_ |
          | **Ausgabe** | _<...>_ | _<...>_ |
          | **Übertragbarkeit** | _<...>_ | _<...>_ |
          | **Verfall / Abwertung** | _<...>_ | _<...>_ |
          | **Obergrenze** | _<...>_ | _<...>_ |
          | **Betrugsprävention** | _<...>_ | _<...>_ |
          | **Datenschutz** | _<...>_ | _<...>_ |
      m2:
        md: '> Interne Einheiten gewähren keine Governance-Rechte über das hinaus, was der Mitgliedschaftsstatus definiert.'
  accumulation-constraints:
    title: Akkumulationsbeschränkungen
    blocks:
      rationale:
        summary: Warum Akkumulation überhaupt beschränken?
        body: Jede interne Einheit, die sich ohne Limit anhäufen lässt, wird irgendwann zum Hebel — einige wenige Mitglieder mit großen Guthaben gewinnen informellen Einfluss, den das Governance-System ihnen nie verliehen hat. Das explizite Festlegen von Akkumulationsregeln — auch wenn die aktuelle Regel „noch keine" lautet — hält die Frage offen und erzwingt eine sichtbare Entscheidung, bevor Konzentration zum strukturellen Problem wird.
      instructions:
        summary: Wie du das ausfüllst
        body: Lege die aktuelle Akkumulationsregel fest (Obergrenze, Verfall, keine) und die Regel, dass keine interne Einheit in Governance-Autorität umgewandelt werden darf.
      m1:
        md: |-
          - _<Obergrenze für interne Einheiten, falls vorhanden.>_
          - _<Verfallsregel, falls vorhanden.>_
          - _<Interne Einheiten dürfen nicht in Governance-Autorität umgewandelt oder dazu verwendet werden, die Entscheidungsmatrix zu umgehen.>_
  external-income-interfaces:
    title: Externe Einkommensschnittstellen
    blocks:
      rationale:
        summary: Warum vor dem Geldeingang eine Genehmigung verlangen?
        body: Sobald Mittel eingegangen sind, verschiebt sich das Gespräch von „Sollen wir das annehmen?" zu „Was machen wir damit?" — und die an das Einkommen geknüpften Bedingungen (Förderbedingungen, Partnerschaftsverpflichtungen, Dienstleistungszusagen) sind oft bereits festgelegt. Eine strategische Entscheidung vor der Eröffnung eines neuen Einkommenskanals zu verlangen, stellt sicher, dass die Gemeinschaft die Kontrolle darüber behält, was sie auf sich nimmt.
      instructions:
        summary: Wie du das ausfüllst
        body: Liste die aktuell erklärten Einkommenskanäle auf, benenne potenzielle zukünftige Kanäle, und verlange eine strategische Genehmigung, bevor ein neuer Kanal eröffnet wird.
      m1:
        md: |-
          - _<Aktuelle Einkommenskanäle.>_
          - _<Potenzielle zukünftige Einkommenskanäle.>_
          - _<Regel: Jede neue externe Einkommensschnittstelle muss erklärt und durch eine strategische Entscheidung genehmigt werden, bevor Mittel empfangen oder Verpflichtungen eingegangen werden.>_
  dispute-resolution-for-economic-records:
    title: Streitbeilegung für wirtschaftliche Aufzeichnungen
    blocks:
      rationale:
        summary: Warum wirtschaftliche Streitigkeiten zeitlich begrenzen?
        body: Beitrags- und Guthabeneinträge häufen sich schnell an; wenn Streitigkeiten unbegrenzt erhoben werden könnten, würde das Hauptbuch nie abgeschlossen und jeder historische Eintrag bliebe anfechtbar. Ein definiertes Zeitfenster mit einer benannten Schlichtungsperson und einem Beschwerdeweg gibt Mitgliedern eine echte Chance, Fehler zu korrigieren, ohne die gesamte wirtschaftliche Historie dauerhaft instabil zu lassen.
      instructions:
        summary: Wie du das ausfüllst
        body: Lege das Zeitfenster für Streitigkeiten, die benannte Schlichtungsperson und den Beschwerdeweg fest. Verweise auf den Mechanismus zur Beitragsanerkennung für den vollständigen Prozess.
      m1:
        md: _<Zeitfenster für die Anfechtung eines Beitragseintrags oder Guthabens; benannte Schlichtungsperson; Beschwerdeweg an Vollmitglieder über den Governance-Prozess.>_
      m2:
        md: '---'
  ratification-record:
    title: Ratifizierungsprotokoll
    blocks:
      m1:
        md: |-
          - **Angenommen:** <JJJJ-MM-TT>
          - **Entscheidungstyp:** Strategisch
          - **Version:** <Version>
          - **Entscheidungsprotokoll:** <Link zum Entscheidungsprotokoll>
