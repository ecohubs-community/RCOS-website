lang: de
sourceHash: e31fff12
title: Kassensatzung
preamble: |-
  - **Ebene:** 3 — Wirtschafts- & Ressourcensystem
  - **Status:** Vorlage — an eure Gemeinschaft anpassen
  - **RCOS-Referenz:** [§5.3](/articles/rcos-core/v0-1/layer-3-economic-resource-system#53-treasury-management), [§5.5](/articles/rcos-core/v0-1/layer-3-economic-resource-system#55-artifacts)

  ---
sections:
  treasury-scope:
    title: Geltungsbereich der Kasse
    blocks:
      rationale:
        summary: Warum eine klare Grenze um die Gemeinschaftskasse ziehen?
        body: Ohne eine ausdrückliche Abgrenzung kann jedes Geld, das in der Nähe der Gemeinschaft fließt — die persönliche Karte einer Gründerin, ein Nebenkonto, ein informeller Erstattungspool — schleichend als Gemeinschaftsgeld behandelt werden, mit allen Pflichten, die das mit sich bringt. Genau festzulegen, welche Konten zur Kasse gehören und welche nicht, schützt sowohl die Gemeinschaft als auch die Einzelpersonen, die aus eigener Tasche zahlen.
      instructions:
        summary: Wie ihr das ausfüllt
        body: Benennt jedes Konto, das zur Kasse gehört (Wallet, Bankkonto usw.), und stellt ausdrücklich fest, dass persönliche Mittel, die informell eingesetzt werden, nicht zur Kasse gehören und keine Verpflichtung der Gemeinschaft begründen.
      m1:
        md: _<Legt fest, welche Konten die Gemeinschaftskasse bilden — explizite Wallet-Adressen, Bankkonten usw. Stellt fest, dass jedes neue Kassenkonto vor dem Eingang von Geldern durch eine Strategische Entscheidung deklariert und genehmigt werden muss. Stellt fest, dass persönliche Mittel, die Betriebskosten decken, nicht zur Kasse gehören und keinen Rückzahlungsanspruch gegenüber der Gemeinschaft begründen.>_
  income-sources:
    title: Einnahmequellen
    blocks:
      rationale:
        summary: Warum alle Einnahmen über eine einzige deklarierte Liste laufen lassen?
        body: Jede Einnahmequelle bringt Bedingungen mit sich — Berichtspflichten, Erwartungen, Abhängigkeitsrisiken. Wenn Einnahmekanäle informell entstehen können, werden diese Bedingungen angehängt, bevor die Gemeinschaft Gelegenheit hatte, sie abzuwägen. Eine deklarierte Liste, die nur durch Strategische Entscheidungen geändert wird, hält die Verpflichtungen der Gemeinschaft unter ihrer eigenen Kontrolle.
      instructions:
        summary: Wie ihr das ausfüllt
        body: Benennt jede Einnahmequelle, die die Gemeinschaft derzeit hat, und verweist auf das Binnenwirtschaftsprotokoll für die Regel, dass jeder neue Einnahmekanal eine Strategische Entscheidung erfordert.
      m1:
        md: _<Listet die aktuellen Einnahmequellen auf oder stellt fest, dass es keine gibt. Verweist auf den Abschnitt „Externe Einnahmeschnittstellen" im Binnenwirtschaftsprotokoll.>_
  spending-authority:
    title: Ausgabenbefugnis
    blocks:
      rationale:
        summary: Warum Schwellenwerte in einer Tabelle festhalten?
        body: 'Wenn die Ausgabenbefugnis vage ist, treten zwei Fehlermodi auf: Entweder eskaliert jede kleine Entscheidung und nichts wird erledigt, oder eine einzelne Stewardship-Person häuft still Ermessensspielraum an, den ihr niemand je per Abstimmung eingeräumt hat. Eine Tabelle mit Beträgen, Entscheidungstypen und befugten Gremien beseitigt die Mehrdeutigkeit und macht unautorisierte Ausgaben sofort sichtbar.'
      instructions:
        summary: Wie ihr das ausfüllt
        body: Definiert Ausgabenstufen nach Betrag sowie den Entscheidungstyp, das befugte Gremium und den Mechanismus für jede Stufe. Mehrjährige Verträge und Schulden sollten in einer eigenen (konstitutionellen) Stufe stehen.
      m1:
        md: |-
          | Betrag | Entscheidungstyp | Befugtes Gremium | Mechanismus |
          |---:|---|---|---|
          | _<Bis zur delegierten Grenze (z. B. €X)>_ | _<Operativ>_ | _<Finanz-Steward>_ | _<Delegiert>_ |
          | _<Jeder Betrag über der delegierten Grenze>_ | _<Strategisch>_ | _<Vollmitglieder>_ | _<Abstimmung>_ |
          | _<Mehrjährige Verträge, Schulden oder strukturelle finanzielle Verpflichtungen>_ | _<Konstitutionell>_ | _<Vollmitglieder>_ | _<Supermehrheit + Ratifizierung>_ |
  transparency-and-reporting:
    title: Transparenz und Berichtswesen
    blocks:
      rationale:
        summary: Warum Transparenz zum Standard machen statt zum Feature?
        body: 'Intransparenz in der Kasse potenziert sich: Eine fehlende Offenlegung lädt zur nächsten ein, und bald können die Mitglieder nicht mehr überprüfen, ob das Geld der Gemeinschaft so verwaltet wird, wie sie es vereinbart haben. Echtzeit-Sichtbarkeit als Ausgangslage zu setzen — und jede Ausnahme namentlich, begründet und zeitlich begrenzt zu verlangen — hält die Prüfbarkeit für jedes Mitglied erreichbar, nicht nur für Stewards.'
      instructions:
        summary: Wie ihr das ausfüllt
        body: Legt den Sichtbarkeitsstandard für jedes Kassenkonto fest. Wo direkte Einsicht nicht möglich ist (z. B. bei manchen Bankkonten), definiert einen periodischen Berichtszyklus mit einer namentlich benannten verantwortlichen Person.
      m1:
        md: |-
          - _<Primäre Kasse (z. B. Safe Multi-Sig): Alle Vollmitglieder haben mindestens Lesezugriff; Echtzeit-Sichtbarkeit.>_
          - _<Andere deklarierte Konten: direkter Mehrbenutzerzugriff zum Lesen, falls unterstützt; andernfalls periodische Saldo- und Transaktionsübersicht.>_
          - _<Alle Ausgabenentscheidungen verweisen auf den verknüpften Governance-Eintrag (Abstimmungs-ID oder delegiertes Entscheidungsprotokoll).>_
  reserve-risk-and-debt-constraints:
    title: Rücklagen-, Risiko- und Schuldenbeschränkungen
    blocks:
      rationale:
        summary: Warum Schulden und langfristige Verpflichtungen standardmäßig sperren?
        body: Schulden und wiederkehrende Verpflichtungen binden die Gemeinschaft über die aktuellen Mitglieder hinaus — zukünftige Mitglieder erben die Verpflichtungen. Sie nur zuzulassen, wenn eine Strategische Abstimmung sie ausdrücklich genehmigt, verhindert, dass langfristige Bindungen beiläufig eingegangen werden, und bewahrt die Möglichkeit, schlank zu bleiben.
      instructions:
        summary: Wie ihr das ausfüllt
        body: Legt die Regeln zu Schulden, wiederkehrenden Verpflichtungen, Rücklagen und außerhalb der Kasse geführten Finanzinstrumenten fest. Standard ist „nicht erlaubt ohne Strategische Abstimmung" für alles, was die Zukunft bindet.
      m1:
        md: |-
          - **Schulden:** _<nur per Strategischer Abstimmung zulässig.>_
          - **Langfristige Verpflichtungen:** _<wiederkehrende Kosten / Verträge nur per Strategischer Abstimmung zulässig.>_
          - **Rücklage:** _<Rücklagenziel, oder feststellen, dass noch keines definiert ist.>_
          - **Außerhalb der Kasse geführte Instrumente:** _<Darlehen, Investitionen, Bürgschaften nur per Strategischer Abstimmung.>_
  conflict-of-interest-rules:
    title: Interessenkonfliktregeln
    blocks:
      rationale:
        summary: Warum Selbstgenehmigung komplett verbieten?
        body: Selbst gut meinende Menschen neigen unbewusst dazu, Entscheidungen zu ihren eigenen Gunsten zu kippen; eine Regel, die Offenlegung und Enthaltung verlangt, beseitigt die subjektive Einschätzung und den sozialen Druck, jemandem „einfach zu vertrauen". Die Selbstgenehmigung von Ausgaben ist der häufigste Weg, auf dem kleine Governance-Systeme still ihre Integrität verlieren — daher wird die Regel unmissverständlich formuliert.
      instructions:
        summary: Wie ihr das ausfüllt
        body: Formuliert die Regel gegen Selbstgenehmigung und die Regel zur Offenlegung und Enthaltung für jedes Mitglied mit einem direkten finanziellen Interesse an einer Ausgabenentscheidung.
      m1:
        md: |-
          - _<Antragstellende dürfen ihre eigenen Ausgabenanträge nicht genehmigen.>_
          - _<Mitglieder mit einem direkten finanziellen Interesse an einer Ausgabenentscheidung müssen dieses offenlegen und sich enthalten.>_
          - _<Kassenverantwortliche dürfen keine einseitigen Ausgaben über die delegierte Grenze hinaus autorisieren.>_
      m2:
        md: '---'
  ratification-record:
    title: Ratifizierungsnachweis
    blocks:
      m1:
        md: |-
          - **Angenommen am:** <JJJJ-MM-TT>
          - **Entscheidungstyp:** Strategisch
          - **Version:** <Version>
          - **Entscheidungsnachweis:** <Link zum Entscheidungsnachweis>
