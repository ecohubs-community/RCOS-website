lang: fr
sourceHash: 3a557ad2
title: Protocole d'économie interne
preamble: |-
  - **Couche :** 3 — Système économique et des ressources
  - **Statut :** Modèle — à adapter pour ta communauté
  - **Référence RCOS :** [§5.1](rcos:§5.1), [§5.2](rcos:§5.2), [§5.4](rcos:§5.4), [§5.5](rcos:§5.5)

  ---
sections:
  commons-vs-private-classification:
    title: Classification communs vs. privés
    blocks:
      rationale:
        summary: Pourquoi classifier chaque ressource ?
        body: Les ressources non classifiées sont le terrain de la privatisation silencieuse — quelqu'un commence à traiter un bien partagé comme personnel, ou un bien privé se retrouve absorbé discrètement dans les obligations communautaires, et quand quelqu'un s'en aperçoit, la norme a déjà changé. Une classification explicite, avec des intendants et des règles de transfert nommés dès le départ, fait de tout changement de statut un acte de gouvernance visible plutôt qu'un glissement insidieux.
      instructions:
        summary: Comment remplir cette section
        body: Pour chaque ressource détenue par la communauté, déclare la classification (Communs / Privé), nomme un intendant, définis les règles d'accès et indique les contraintes de transfert. Les ressources non classifiées NE DOIVENT PAS être allouées, grevées, monétisées ou transférées tant qu'elles ne sont pas classifiées.
      m1:
        md: |-
          | Ressource | Classification | Intendant | Règles d'accès | Contraintes de transfert |
          |---|---|---|---|---|
          | _<ex. Spécification et artefacts RCOS>_ | _<Communs / Privé>_ | _<rôle d'intendant>_ | _<qui lit / écrit>_ | _<contraintes de transfert>_ |
          | _<ex. Trésorerie partagée>_ | _<...>_ | _<...>_ | _<...>_ | _<...>_ |
          | _<ex. Site web / domaines de la communauté>_ | _<...>_ | _<...>_ | _<...>_ | _<...>_ |
          | _<ex. Marque et comptes de réseaux sociaux>_ | _<...>_ | _<...>_ | _<...>_ | _<...>_ |
          | _<ex. Terrain ou infrastructure physique>_ | _<...>_ | _<...>_ | _<...>_ | _<...>_ |
      m2:
        md: '> Toute ressource non classifiée NE DOIT PAS être allouée, grevée, monétisée ou transférée tant que la classification n''est pas complétée.'
  recognized-contribution-categories:
    title: Catégories de contribution reconnues
    blocks:
      rationale:
        summary: Pourquoi nommer les types de travail qui comptent ?
        body: Si la communauté ne dit jamais à voix haute de quels types de travail elle dépend, le travail invisible — soin, facilitation, modération, intendance — reste invisible, et les personnes qui l'accomplissent s'épuisent ou partent. Énumérer les catégories transforme « quelqu'un s'en occupe, c'est tout » en travail reconnu que le système est tenu de prendre en compte.
      instructions:
        summary: Comment remplir cette section
        body: Liste les catégories de contribution que ta communauté reconnaît. Le soin, la facilitation, l'intendance et la participation informelle sont souvent sous-reconnus — nomme-les explicitement si cela s'applique.
      m1:
        md: |-
          | Catégorie | Exemples |
          |---|---|
          | _<ex. Connaissance et recherche>_ | _<exemples>_ |
          | _<ex. Développement technique>_ | _<exemples>_ |
          | _<ex. Gouvernance et coordination>_ | _<exemples>_ |
          | _<ex. Construction communautaire>_ | _<exemples>_ |
          | _<ex. Soin et soutien>_ | _<exemples>_ |
          | _<ex. Intendance>_ | _<exemples>_ |
          | _<ex. Participation informelle>_ | _<exemples>_ |
  contribution-recognition-mechanism:
    title: Mécanisme de reconnaissance des contributions
    blocks:
      rationale:
        summary: Pourquoi préciser comment la reconnaissance fonctionne concrètement ?
        body: Sans mécanisme défini, « qui obtient du crédit » devient une affaire de qui parle le plus fort ou de qui est le plus proche de la personne qui décide. Spécifier ce qui est éligible, comment c'est enregistré, qui valide et comment contester transforme la reconnaissance en quelque chose sur lequel un membre peut réellement compter — et empêche la reconnaissance de se muer silencieusement en influence de gouvernance.
      instructions:
        summary: Comment remplir cette section
        body: Indique ce qui est éligible, comment les reconnaissances sont enregistrées, qui valide, ce qu'elles débloquent (ou ne débloquent pas) et comment les membres contestent un enregistrement.
      m1:
        md: |-
          - **Ce qui est éligible :** _<quelles activités comptent, et sur déclaration de qui.>_
          - **Comment les contributions sont enregistrées :** _<canal structuré ; canal informel / auto-déclaré.>_
          - **Qui valide :** _<automatique / titulaire de rôle / processus de nomination.>_
          - **Effet sur l'accès/les privilèges :** _<la reconnaissance affecte uniquement le solde en unités internes ; elle n'accorde pas de droits de gouvernance supplémentaires au-delà de l'état d'adhésion.>_
          - **Contestation :** _<délai et processus pour contester un enregistrement.>_
  internal-units:
    title: Unités internes
    blocks:
      rationale:
        summary: Pourquoi définir les unités internes avec autant de précision ?
        body: Les unités internes tendent à acquérir des pouvoirs que personne n'a votés — dépréciation, plafonds, transférabilité, poids de gouvernance — à moins que chaque propriété ne soit consignée par écrit. Lister l'émission, les règles de transfert, la confidentialité et le statut explicitement non-gouvernemental fait de ces unités des outils de reconnaissance plutôt que de discrètes devises parallèles.
      instructions:
        summary: Comment remplir cette section
        body: Si ta communauté utilise des unités internes (XP, ECO, crédits, etc.), définis pour chaque unité son objectif, son émission, sa transférabilité, sa dépréciation, son plafond, la prévention de la fraude et la confidentialité. Indique explicitement que les unités n'accordent pas de droits de gouvernance au-delà de l'état d'adhésion.
      m1:
        md: |-
          | Propriété | _<Unité A>_ | _<Unité B>_ |
          |---|---|---|
          | **Objectif** | _<...>_ | _<...>_ |
          | **Émission** | _<...>_ | _<...>_ |
          | **Transférabilité** | _<...>_ | _<...>_ |
          | **Expiration / dépréciation** | _<...>_ | _<...>_ |
          | **Plafond** | _<...>_ | _<...>_ |
          | **Prévention de la fraude** | _<...>_ | _<...>_ |
          | **Confidentialité** | _<...>_ | _<...>_ |
      m2:
        md: '> Les unités internes n''accordent pas de droits de gouvernance au-delà de ce que l''état d''adhésion définit.'
  accumulation-constraints:
    title: Contraintes d'accumulation
    blocks:
      rationale:
        summary: Pourquoi contraindre l'accumulation ?
        body: Toute unité interne pouvant s'accumuler sans limite finit par devenir un levier — quelques membres avec des soldes élevés acquièrent une influence informelle que le système de gouvernance ne leur a jamais accordée. Énoncer les règles d'accumulation explicitement, même quand la règle actuelle est « aucune pour l'instant », maintient la question ouverte et impose une décision visible avant que la concentration ne devienne un problème structurel.
      instructions:
        summary: Comment remplir cette section
        body: Indique la règle d'accumulation actuelle (plafond, dépréciation, aucune) et la règle selon laquelle aucune unité interne NE PEUT être convertie en autorité de gouvernance.
      m1:
        md: |-
          - _<Plafond sur les unités internes, le cas échéant.>_
          - _<Règle de dépréciation, le cas échéant.>_
          - _<Les unités internes ne peuvent pas être converties en autorité de gouvernance ni utilisées pour contourner la matrice de décision.>_
  external-income-interfaces:
    title: Interfaces de revenus externes
    blocks:
      rationale:
        summary: Pourquoi exiger une approbation avant que l'argent n'arrive ?
        body: Une fois les fonds en main, la conversation passe de « devrions-nous accepter cela ? » à « qu'en fait-on ? » — et les conditions attachées au revenu (termes de subvention, obligations de partenariat, engagements de service) sont souvent déjà verrouillées. Exiger une décision Stratégique avant l'ouverture de tout nouveau canal de revenus permet à la communauté de garder le contrôle sur ce qu'elle prend en charge.
      instructions:
        summary: Comment remplir cette section
        body: Liste les canaux de revenus actuellement déclarés, nomme les canaux futurs potentiels et exige une approbation Stratégique avant l'ouverture de tout nouveau canal.
      m1:
        md: |-
          - _<Canaux de revenus actuels.>_
          - _<Canaux de revenus futurs potentiels.>_
          - _<Règle : toute nouvelle interface de revenus externes DOIT être déclarée et approuvée par une décision Stratégique avant que des fonds ne soient reçus ou des engagements pris.>_
  dispute-resolution-for-economic-records:
    title: Résolution des litiges concernant les registres économiques
    blocks:
      rationale:
        summary: Pourquoi encadrer les litiges économiques dans le temps ?
        body: Les registres de contributions et de soldes s'accumulent vite ; si les litiges pouvaient être soulevés indéfiniment, le registre ne se stabiliserait jamais et chaque crédit historique resterait contestable. Un délai défini avec un résolveur nommé et une voie de recours donne aux membres une vraie chance de corriger les erreurs sans laisser l'historique économique perpétuellement instable.
      instructions:
        summary: Comment remplir cette section
        body: Indique le délai de contestation, le résolveur nommé et la voie de recours. Réfère-toi au mécanisme de reconnaissance des contributions pour le processus complet.
      m1:
        md: _<Délai pour contester un enregistrement de contribution ou un solde ; résolveur nommé ; voie de recours auprès des membres actifs via le processus de gouvernance.>_
      m2:
        md: '---'
  ratification-record:
    title: Registre de ratification
    blocks:
      m1:
        md: |-
          - **Adopté :** <AAAA-MM-JJ>
          - **Type de décision :** Stratégique
          - **Version :** <version>
          - **Registre de décision :** <lien vers le registre de décision>
