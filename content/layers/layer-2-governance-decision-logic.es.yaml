lang: es
sourceHash: e17698ba
title: Capa 2 - Gobernanza y Lógica de Decisión
head: '**Cómo se toman, modifican y aplican las decisiones.**'
sections:
  decision-types:
    title: '**Tipos de decisión**'
    md: |-
      * **Operativa**
        Decisiones del día a día; reversibles; bajo riesgo.
      * **Estratégica**
        Dirección a mediano plazo; asignación de recursos; parcialmente reversible.
      * **Constitucional**
        Cambios en las reglas fundamentales, el propósito o los invariantes; umbral alto.
  mechanisms:
    title: '**Mecanismos**'
    md: |-
      Cómo se toma una decisión.
      **Propósito:** ajustar el método de decisión al riesgo de la decisión.

      * Consentimiento (sin objeción razonada)
      * Votación (mayoría / supermayoría)
      * Delegación (autoridad basada en roles)
      * Propuesta + revisión + adopción
  authority-boundaries:
    title: '**Límites de autoridad**'
    md: |-
      Quién puede decidir.
      **Propósito:** evitar la parálisis decisional y la dispersión del poder.

      * **Individual** – autonomía dentro del rol
      * **Rol** – responsabilidades definidas
      * **Círculo / Dominio** – autoridad acotada
      * **Comunidad entera** – asuntos constitucionales
  artifacts:
    title: '**Artefactos**'
    md: |-
      * Matriz de Decisiones
        * Previene discusiones sobre *cómo* decidir
        * Hace explícita la autoridad
        * Reduce la escalada emocional
      * Protocolo de Gobernanza (documento normativo breve)
        * Tipos de decisión y umbrales
        * Roles y dominios
        * Ciclo de vida de las propuestas
        * Vías de escalamiento y apelación
        * Poderes de emergencia (si los hay)
  layer-invariants:
    title: '**Invariantes de la Capa**'
    md: |-
      * **Invariante 2.1: El tipo de decisión precede al contenido de la decisión**
        Cómo se toma una decisión DEBE acordarse *antes* de lo que se decide.
      * **Invariante 2.2: La autoridad DEBE ser explícita**
        Nadie PUEDE ejercer poder de decisión sin un rol definido, un mandato o consentimiento.
      * **Invariante 2.3: Las reglas constitucionales prevalecen sobre todas las demás**
        Las decisiones operativas o estratégicas no PUEDEN anular los acuerdos constitucionales.
      * **Invariante 2.4: Las decisiones son revisables**
        Todas las decisiones DEBEN ser trazables hasta su autoridad, método y registro.
  explicitness-rules:
    title: '**Reglas de Explicitud**'
    md: |-
      #### **DEBE ser explícito**

      * Tipos de decisión (operativa / estratégica / constitucional)
      * Quién decide qué (límites de autoridad)
      * Mecanismos de decisión y umbrales
      * Vías de escalamiento

      **Por qué:** la ambigüedad en la gobernanza equivale a una jerarquía informal.

      #### **PUEDE ser explícito**

      * Estilo de facilitación de reuniones
      * Plantillas de propuestas
      * Procedimientos de emergencia

      #### **DEBE permanecer OPCIONAL**

      * Filosofía de gobernanza (consenso vs sociocracia, etc.)
      * Tono emocional de las reuniones
