  - id: artifacts
    title: '**Artifacts**'
    md: |-
      * Internal Economy Protocol (Defines how contributions are recognized and exchanged; non-monetary or token-based, but must be explicit)
        * What counts as contribution
        * How contributions are logged or acknowledged
        * Internal units (time credits, EcoTokens, points)
        * Commons vs private boundaries
        * Limits on accumulation
      * Treasury Ruleset (Defines how shared resources are held and spent; “community financial law”)
        * Income sources
        * Spending authority by amount
        * Transparency requirements
        * Reserve policies
        * Risk and debt limits
  - id: layer-invariants
    title: '**Layer Invariants**'
    md: |-
      * **Invariant 3.1: Economic transparency by default**
        Shared resources, flows, and obligations must be visible to the community (with limited, explicit exceptions).
      * **Invariant 3.2: Commons protection**
        Resources declared as commons cannot be privatized through informal or unilateral action.
      * **Invariant 3.3: Contribution recognition is explicit**
        Unpaid or invisible labor must not be structurally required for system survival.
      * **Invariant 3.4: No unbounded accumulation of internal power**
        Economic mechanisms must prevent indefinite concentration of internal influence.
  - id: explicitness-rules
    title: '**Explicitness Rules**'
    md: "#### **MUST be explicit**\n\n* What is common vs private\n* How shared resources are allocated\n* Spending authority limits\n* Transparency rules\n* External income interface\n\n**Why:**\_money + ambiguity destroys trust faster than conflict.\n\n#### **MAY be explicit**\n\n* Contribution valuation models\n* Internal units (tokens, hours, points)\n* Budget categories\n\n#### **MUST remain optional**\n\n* Attitudes toward wealth\n* Equal vs differentiated outcomes\n* Personal financial choices"
