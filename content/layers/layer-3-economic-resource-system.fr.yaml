title: Couche 3 – Système économique et de ressources
head: '**Comment la valeur circule au sein de la communauté.**'
sections:
  contribution-recognition:
    title: '**Reconnaissance des contributions**'
    md: |-
      * Travail
      * Soin
      * Savoir
      * Intendance
  resource-allocation:
    title: '**Allocation des ressources**'
    md: |-
      * Communs vs privé
      * Échange interne
      * Interface de revenus externes
  treasury-logic:
    title: '**Logique de trésorerie**'
    md: |-
      * Règles de transparence
      * Autorité de dépense
      * Réserves et risques
  artifacts:
    title: '**Artefacts**'
    md: |-
      * Protocole d'économie interne (Définit comment les contributions sont reconnues et échangées ; non monétaire ou basé sur des jetons, mais DOIT être explicite)
        * Ce qui compte comme contribution
        * Comment les contributions sont enregistrées ou reconnues
        * Unités internes (crédits-temps, EcoTokens, points)
        * Limites entre communs et privé
        * Limites d'accumulation
      * Règlement de trésorerie (Définit comment les ressources partagées sont détenues et dépensées ; « droit financier communautaire »)
        * Sources de revenus
        * Autorité de dépense par montant
        * Exigences de transparence
        * Politiques de réserve
        * Limites de risque et d'endettement
  layer-invariants:
    title: '**Invariants de la Couche**'
    md: |-
      * **Invariant 3.1 : Transparence économique par défaut**
        Les ressources partagées, les flux et les obligations DOIVENT être visibles par la communauté (avec des exceptions limitées et explicites).
      * **Invariant 3.2 : Protection des communs**
        Les ressources déclarées comme communs NE PEUVENT PAS être privatisées par une action informelle ou unilatérale.
      * **Invariant 3.3 : La reconnaissance des contributions est explicite**
        Le travail non rémunéré ou invisible NE DOIT PAS être structurellement requis pour la survie du système.
      * **Invariant 3.4 : Pas d'accumulation illimitée de pouvoir interne**
        Les mécanismes économiques DOIVENT empêcher la concentration indéfinie de l'influence interne.
  explicitness-rules:
    title: '**Règles d''explicitation**'
    md: |-
      #### **DOIT être explicite**

      * Ce qui est commun vs privé
      * Comment les ressources partagées sont allouées
      * Limites de l'autorité de dépense
      * Règles de transparence
      * Interface de revenus externes

      **Pourquoi :** argent + ambiguïté détruit la confiance plus vite que le conflit.

      #### **PEUT être explicite**

      * Modèles de valorisation des contributions
      * Unités internes (jetons, heures, points)
      * Catégories budgétaires

      #### **DOIT rester OPTIONNEL**

      * Attitudes envers la richesse
      * Résultats égaux vs différenciés
      * Choix financiers personnels
