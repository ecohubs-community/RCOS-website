lang: de
sourceHash: '7ea93e37'
title: Schicht 5 – Betrieb & Koordination
head: '**Wie Alltag und Arbeit tatsächlich funktionieren.**'
sections:
  meeting-system:
    title: '**Besprechungssystem**'
    md: |-
      * Typen
        * Operativ (Koordination)
        * Governance (Entscheidungen)
        * Reflexion / Retro
        * Konflikt / Mediation
      * Rhythmus
        * Wie oft jede Besprechung stattfindet
        * Zeitliche Begrenzungen
        * Wer ist erforderlich vs. optional
      * Dokumentationsregeln
        * Was festgehalten werden muss
        * Wo es gespeichert wird
        * Wer darauf zugreifen kann
        * Was privat vs. öffentlich ist
  roles-responsibilities:
    title: '**Rollen & Verantwortlichkeiten**'
    md: |-
      * Rollendefinition
      * Amtszeitbegrenzung
      * Rotationsregeln
  information-flow:
    title: '**Informationsfluss**'
    md: |-
      * Transparenz als Standard
      * Grenzen der Privatsphäre
  artifacts:
    title: '**Artefakte**'
    md: |-
      * Betriebshandbuch (wie der Alltag abläuft)
      * Rollenregister (wer welche Rolle innehat und wie lange)
      * Besprechungsvorlagen (Agenda, Protokoll, Entscheidungsdokumentation)
  layer-invariants:
    title: '**Layer-Invarianten**'
    md: |-
      * **Invariante 5.1: Rollen müssen definiert sein**
        Laufende Verantwortlichkeiten dürfen nicht ohne eine benannte Rolle existieren.
      * **Invariante 5.2: Betriebswissen ist dokumentiert**
        Kritische betriebliche Prozesse dürfen nicht nur in den Köpfen einzelner Personen existieren.
      * **Invariante 5.3: Zeit und Aufmerksamkeit sind endliche Ressourcen**
        Besprechungslast, Koordinationsaufwand und unbezahlte Arbeit müssen begrenzt sein.
      * **Invariante 5.4: Regeln zum Informationszugang sind explizit**
        Was transparent und was privat ist, muss klar definiert sein.
  explicitness-rules:
    title: '**Explizitätsregeln**'
    md: |-
      #### **MUSS explizit sein**

      * Rollen und Verantwortlichkeiten
      * Regeln zur Entscheidungsdokumentation
      * Regeln zum Informationszugang
      * Operative Entscheidungsbefugnis

      **Warum:** Undokumentierte Abläufe konzentrieren Macht unsichtbar.

      #### **KANN explizit sein**

      * Besprechungsrhythmus
      * Werkzeuge (Notion, Git, etc.)
      * Rotationspläne für Rollen

      #### **MUSS optional bleiben**

      * Arbeitsstile
      * Ästhetische Vorlieben
      * Informelle soziale Koordination
