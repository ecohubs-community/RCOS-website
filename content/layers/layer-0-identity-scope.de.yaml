lang: de
sourceHash: '2490bf16'
title: Schicht 0 – Identität & Geltungsbereich
head: '**Welches Problem existiert diese Gemeinschaft, um es zu lösen?**'
sections:
  purpose:
    title: '**Zweck**'
    md: |-
      * **Primärer Zweck (einzeln)**
      * **Sekundäre Zwecke (begrenzt)**
  scope:
    title: '**Geltungsbereich**'
    md: |-
      Definiert, was die Gemeinschaft regelt und wofür sie verantwortlich ist.
      Zweck: schleichende Ausweitung des Geltungsbereichs und Machtkonfusion verhindern.

      * **Physische Vermögenswerte (Land, Gebäude)**
      * **Gemeinsame Infrastruktur**
      * **Wirtschaftliche Aktivitäten**
      * **Juristische Personen**
      * **Geografische oder digitale Grenzen**
  invariants:
    title: '**Invarianten**'
    md: |-
      Explizit definierte Unverhandelbares.
      Zweck: harte Grenzen schaffen, die selbst ein Konsens nicht beiläufig außer Kraft setzen kann.

      * **Was *nicht* ohne Auflösung oder Neustart geändert werden kann**

      #### Beispiele

      * „Land darf nicht verkauft werden"
      * „Diese Gemeinschaft ist nicht-spekulativ"
      * „Kinderschutzregeln haben Vorrang vor allen anderen Entscheidungen"
  artifacts:
    title: '**Artefakte**'
    md: |-
      * Zweck-Charta
        * Primärer Zweck (1 Satz)
        * Sekundäre Zwecke (begrenzte Liste)
        * Bedingungen für eine Zweckänderung
      * Geltungsbereichs-Erklärung
        * Was innerhalb der Governance liegt
        * Was außerhalb der Governance liegt
        * Schnittstellen zur Außenwelt
  layer-invariants:
    title: '**Ebenen-Invarianten**'
    md: |-
      * **Invariante 0.1: Einzelner primärer Zweck**
        Eine Gemeinschaft muss zu jedem Zeitpunkt genau einen primären Zweck haben.
      * **Invariante 0.2: Expliziter Governance-Geltungsbereich**
        Alle Vermögenswerte, Bereiche und Verantwortlichkeiten unter der Governance der Gemeinschaft müssen explizit deklariert sein.
      * **Invariante 0.3: Deklarierter nicht-regulierter Raum**
        Alles, was nicht als „im Geltungsbereich" aufgeführt ist, liegt explizit *außerhalb des Geltungsbereichs* und unterliegt nicht der Autorität der Gemeinschaft.
      * **Invariante 0.4: Geschützte Invarianten**
        Deklarierte Invarianten können nicht geändert werden, ohne die höchste konstitutionelle Schwelle oder die Auflösung zu durchlaufen.

      ## Explizitätsregeln
  must-be-explicit:
    title: MUSS explizit sein
    md: |-
      * Primärer Zweck
      * Governance-Geltungsbereich (Vermögenswerte, Bereiche, Autorität)
      * Deklarierte Invarianten
      * Bedingungen für eine Zweckänderung

      **Warum:** Mehrdeutigkeit schafft hier schleichende Machtaneignung.
  may-be-explicit:
    title: KANN explizit sein
    md: |-
      * Sekundäre Zwecke
      * Externe Zugehörigkeiten
      * Langfristige Visionsaussagen
  must-remain-optional:
    title: MUSS optional bleiben
    md: |-
      * Ideologie
      * Spirituelle Rahmung
      * Kulturelle Narrative
