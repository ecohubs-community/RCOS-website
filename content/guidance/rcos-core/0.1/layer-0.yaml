# Guidance for Layer 0 of RCOS-Core 0.1. Non-normative: it explains the
# rules and never adds to them, so no RFC 2119 keywords in capitals here.
#
#   sections   per section of the standard: "In short" and common questions
#   templates  per template section: the plain-language question it answers,
#              what to cover (prompts) and examples (not recommendations).
#              Imported from RCOS-compass annotations.yaml (Compass is to read
#              them from the published standard data instead).
kind: guidance
layer: 0
sections:
  - ref: '2.1'
    inShort: Your community needs one reason to exist that every other decision can be checked against.
    questions:
      - id: more-than-one-purpose
        question: Can we have more than one purpose?
        answer: Yes, as secondary purposes. They just may not conflict with or override the primary one.
        ref: 2.1.4
      - id: change-purpose
        question: How do we change our purpose later?
        answer: Only through a constitutional decision (Layer 2), carried out with the change process in Layer 6. A purpose that changes often is a strategy, not a purpose.
        ref: 2.1.3
      - id: goal-as-purpose
        question: Can our purpose be a project, like building a house?
        answer: No. A project ends when it is done; the primary purpose describes why the community exists at all, and outlasts any single project.
        ref: 2.1.2
  - ref: '2.2'
    inShort: Write down what the community governs, and just as clearly what it does not. Whatever you leave unlisted stays outside your authority.
    questions:
      - id: forgot-something
        question: What if we forget to list something?
        answer: Then it is out of scope until you add it. The community has no authority over things it never declared.
        ref: 2.2.4
      - id: private-lives
        question: Does the community get a say in members' private lives?
        answer: Only where the scope declaration explicitly says so. Persons, assets and domains declared out of scope are beyond the community's authority.
        ref: 2.2.5
      - id: what-to-include
        question: What does a scope declaration have to cover?
        answer: At least the assets you govern, the domains you decide about, and the activities and responsibilities under collective control, plus an explicit out-of-scope list.
        ref: 2.2.2
  - ref: '2.3'
    inShort: Invariants are the few hard limits your community puts out of reach of everyday decisions. Not even a unanimous vote can casually override them.
    questions:
      - id: emergency
        question: Can an emergency justify breaking an invariant?
        answer: No. No decision, role, process, or emergency measure may override an invariant.
        ref: 2.3.4
      - id: change-invariant
        question: Can we ever change an invariant?
        answer: Yes, but only through a constitutional change process as defined in Layer 2 and Layer 6.
        ref: 2.3.6
      - id: invariant-vs-constraint
        question: How is an invariant different from an identity constraint?
        answer: An invariant is a hard limit on what must never happen, like selling the land. An identity constraint describes who the community is and what participation requires, like ecological or behavioural boundaries.
        ref: '2.4'
      - id: how-many
        question: How many invariants should we have?
        answer: RCOS doesn't set a number. Fewer, clearer invariants are easier to protect; each one is a promise that can never be broken casually.
  - ref: '2.4'
    inShort: If being part of this community comes with boundaries, such as how people behave or what they commit to, say so openly and say how it is checked.
    questions:
      - id: unwritten-norms
        question: We share values nobody has written down. Is that a problem?
        answer: It is if those values decide who can take part or how people are treated. Identity constraints that matter in practice have to be declared and enforced through defined processes, never informally.
        ref: 2.4.4
      - id: testable
        question: What makes an identity constraint testable?
        answer: Someone else could look at a situation and agree whether the constraint was kept or broken, and there is a defined process for what happens next.
        ref: 2.4.3
  - ref: '2.5'
    inShort: Layer 0 lives in four short documents. Every member can read them, every version is kept, and each was adopted through a formal ratification.
    questions:
      - id: which-documents
        question: Which documents does Layer 0 need?
        answer: A Purpose Charter, a Scope Declaration, an Invariants Register and an Identity Constraints Register.
        ref: 2.5.1
      - id: contradiction
        question: What if two of these documents contradict each other?
        answer: Then the community is not compliant with RCOS-Core until the contradiction is resolved.
        ref: 2.5.3
templates:
  - key: purpose-charter.primary-purpose
    question: Why does this community exist — in one sentence that will still be true in ten years?
    prompts:
      - If we could keep only one reason for existing, what would it be?
      - Would it still be true in ten years, after our current projects are finished or dropped?
      - Is it a lasting reason — not a project, a strategy or a goal we could one day tick off?
      - Is it clear enough that we could tell when a decision, or a way of spending our time or money, goes against it?
    examples:
      - We exist so that the people who live here can share land, homes and daily work in a way that leaves the soil, the water and our neighbours better off than we found them.
  - key: purpose-charter.secondary-purposes
    question: What secondary purposes do we pursue — without competing with why we exist?
    prompts:
      - Besides our primary purpose, what other concrete outcomes do we work towards — if any?
      - 'For each one: could it ever pull time, money or people away from our primary purpose — and if it could, is it really secondary?'
      - Do we say plainly that when a secondary purpose clashes with our primary purpose, the primary purpose wins?
    examples:
      - 'Alongside our primary purpose we pursue three secondary purposes: keeping homes affordable for members on modest incomes, running an open tool library for the neighbourhood, and sharing what we learn about living cooperatively at two open days a year. None of these may override our primary purpose; if one conflicts with it, the primary purpose takes precedence and the secondary purpose is scaled back or dropped.'
  - key: purpose-charter.non-goals-and-exclusions
    question: What are we deliberately not, however tempting it becomes?
    prompts:
      - What might outsiders or new members assume we are, that we are not — a political party, a business, a religious group, a charity?
      - Which tempting directions have come up before, or are likely to, that we want to rule out now?
      - 'For each one: is it worded clearly enough that anyone could point to an activity and say it crosses the line?'
    examples:
      - 'We are not a political party, and we do not endorse candidates or campaigns as a community. We are not an investment vehicle: no one joins to earn a return, and shared assets are never managed to make a profit for members. We are not a religious or spiritual group, and no belief or practice is expected of anyone who takes part.'
  - key: purpose-charter.conditions-for-purpose-change
    question: What would it take to change why we exist — and who would have to agree?
    prompts:
      - Do we treat changing our primary purpose as one of our highest-level (constitutional) decisions, rather than an ordinary one?
      - How many people have to agree, and who counts — all members, full members only, or those who vote?
      - How long must we wait between the decision and the change taking effect?
      - Where is the change recorded, so that the old and the new wording both stay visible?
      - Do our secondary purposes need the same bar to change, or a lower one?
    examples:
      - Changing the primary purpose is a constitutional decision. The proposal must be shared 30 days before the vote, and it passes only with at least two thirds of the votes cast by full members, with at least half of all full members voting. The change takes effect after a further 30 days and is recorded, together with the previous wording, in our version history. Secondary purposes can be changed by an ordinary community decision.
  - key: purpose-charter.ratification-record
    question: Who adopted this charter, when, and how was it decided?
  - key: scope-declaration.in-scope-assets
    question: What does the community own or steward together?
    prompts:
      - What do we own, hold or look after together — money, land, buildings, equipment, software, websites, accounts, our name and logo?
      - 'For each one: what exactly is it — which account, which plot, which domain — so no one can argue about what is meant?'
      - What do individuals hold on the community's behalf, such as an account or a domain in a member's name — and do we count it as ours?
      - Is anything shared in practice that we have never named? (Which decisions and which work are collective are their own questions.)
    examples:
      - 'The collective governs: the shared treasury held in our two-of-three multi-signature wallet; the project website and its domain; the code repositories under the collective''s organisation account; our chat server and social media accounts; and the collective''s name, logo and published guides. Any account a member registers on the collective''s behalf belongs to the collective.'
  - key: scope-declaration.in-scope-decision-domains
    question: Which decisions belong to the group rather than to individuals?
    prompts:
      - What kinds of questions do we decide together — for example how we decide, who can join, how shared money is spent, how shared spaces are used?
      - 'For each one: where does it stop — what stays with an individual, a household or an outside party?'
      - Are any decisions taken by one person today out of habit that we want to name as the group's — or say plainly are not? (How each kind of decision is made is its own question.)
    examples:
      - 'We decide together on: our governance rules and how decisions are made; who may join, and on what terms; how the shared budget and reserves are spent; the use and upkeep of the shared house, garden and guest rooms; and any agreement made in the community''s name with an outside party. Decisions about each household''s own flat stay with that household.'
  - key: scope-declaration.in-scope-activities-and-responsibilities
    question: Which work and responsibilities are collective?
    prompts:
      - What ongoing work are we responsible for as a community — upkeep, welcoming new members, keeping accounts, looking after our name, hosting visitors?
      - 'For each one: is it done regularly or only when needed, and what goes wrong if no one does it?'
      - Is anyone doing work today that nobody formally took on — and should it be collective, or should we say it is not? (Who does each piece of work is decided when roles are assigned.)
    examples:
      - 'As a community we are responsible for: maintaining the shared water supply, paths and solar system; running the vegetable garden and orchard; admitting and welcoming new members; keeping the accounts and reporting on them twice a year; and hosting visitors and volunteers. Work on private dwellings and personal gardens is not a collective responsibility.'
  - key: scope-declaration.explicitly-out-of-scope
    question: What is none of the community's business — and stays that way?
    prompts:
      - What might people assume the community has a say in, that it does not — members' money, relationships, jobs, beliefs, or other projects they belong to?
      - Which outside organisations, services or neighbours do we work with but have no authority over?
      - Do we say plainly that anything not named as in scope is out of scope, even if this list does not mention it?
      - What happens to a decision that reaches into something on this list — does it simply have no effect?
    examples:
      - 'The following are out of scope: members'' personal income, savings and private finances; their private relationships and how they arrange their own homes; their paid work and projects outside the community; and the hosting companies and software services we use, whose terms we accept but do not govern. Anything not declared in scope is out of scope, and a community decision that reaches into these areas has no effect.'
  - key: scope-declaration.ratification-record
    question: Who adopted this scope, when, and how was it decided?
  - key: invariants-register.active-invariants
    question: What must never happen here, whatever the circumstances or the majority?
    prompts:
      - What must never happen here, even in an emergency or after a popular vote? Write each as one clear sentence.
      - 'For each one: how would anyone know, without argument, that it has been broken?'
      - Does each one hold everywhere — in membership, money, roles, safety and how we decide — or have we worded it so it only covers one area?
      - When a decision, a role or any other rule clashes with one of these, do we say plainly that the invariant wins and the other gives way?
      - Is the list short enough that each one is truly absolute — and is anything on it really just a strong preference?
      - Do we agree these can only be changed through our highest-level (constitutional) change process, never by an ordinary decision?
    examples:
      - No one may be prevented from leaving the community, or punished for leaving. No person or role may use authority that is not written into our governance documents. The physical safety of any person, and above all of a child, comes before anyone's role, reputation or participation. These hold for every rule, role, decision and emergency measure we have; where anything conflicts with them, they prevail, and they change only through our constitutional change process.
  - key: invariants-register.ratification-record
    question: Who adopted these invariants, when, and how was it decided?
  - key: identity-constraints-register.active-identity-constraints
    question: Which non-negotiable rules follow from who we are as a community — about behaviour, joining, culture or land?
    prompts:
      - Which rules hold for everyone taking part, whatever a majority wants on a given day?
      - 'For each one: who does it apply to?'
      - What does it mean for them in practice — what may they not do, or what must be true before they can join?
      - Why is it needed — what would go wrong here without it?
    examples:
      - Only people aged 18 or over can become members.
      - No belief system, religion or political view may be required to join or take part.
      - Nothing the community does may cause lasting harm to the land it stewards; every land and building decision says how it was checked.
  - key: identity-constraints-register.enforcement-and-testability
    question: How would anyone check whether a constraint is being met — and what happens if it is not?
    prompts:
      - 'For each rule: how would anyone notice that it is not being kept?'
      - Which written process handles a breach, so it is not left to whoever objects loudest?
      - Who keeps an eye on it, and how often is that looked at again?
    examples:
      - 'Each constraint names how a breach would show up and who keeps an eye on it: the land group checks the ecological constraints on its quarterly walk, and anyone may report a breach of a behavioural constraint to the accountability coordinator. Every reported breach goes through our accountability process — never a private warning or quiet exclusion. We review the whole register at the yearly reflection meeting.'
  - key: identity-constraints-register.conditions-for-change
    question: How are our non-negotiables added, changed or removed — and who has to agree?
    prompts:
      - What kind of decision does it take to add, change or remove one of our non-negotiables — an ordinary one, or one of our highest-level (constitutional) decisions?
      - How many people have to agree, and who counts — everyone, full members only, or those present?
      - How long do we wait between agreeing a change and it taking effect, so anyone affected can raise concerns or prepare?
      - Does removing a non-negotiable need the same bar as adding or changing one?
    examples:
      - Adding, changing or removing an identity constraint is a constitutional decision. The proposal must be shared with all full members at least 21 days before the meeting that decides it, and it passes only if at least three quarters of all full members vote in favour. The change takes effect 30 days after the decision, and both the old and new wording stay in the register's history.
  - key: identity-constraints-register.ratification-record
    question: Who adopted these constraints, when, and how was it decided?
