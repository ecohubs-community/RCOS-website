sourceHash: '9b367ad0'
title: v0.1
intro: ''
sections:
  s1:
    title: Minimales Permakultur-Modul (nicht normativ)
    blocks:
      b1:
        md: Dieses Modul definiert die Mindeststruktur, die nötig ist, um ökologische Pflege und Nahrungsmittelproduktion in eine sehr kleine RCOS-konforme Gemeinschaft (typischerweise 3–15 Mitglieder) zu integrieren.
      b2:
        md: Sein Zweck ist es, Landpflege zu ermöglichen, **ohne verstecktes Eigentum, unsichtbare Arbeit oder informelle Macht zu erzeugen**.
      b3:
        md: Dieses Modul ist bewusst minimal gehalten.
      b4:
        md: '---'
  s2:
    title: Anwendbarkeit
    blocks:
      b1:
        md: |-
          Dieses Modul ist geeignet, wenn:
          - die Gemeinschaft weniger als ~15 Mitglieder hat,
          - ökologische Systeme kleinräumig sind,
          - Governance und Betriebsabläufe schlank gehalten werden,
          - formale Spezialisierung begrenzt ist.
      b2:
        md: Wenn ökologische Systeme systemkritisch werden oder erheblich skalieren, SOLLTE dieses Modul durch das vollständige Permakultur-Modul ersetzt werden.
      b3:
        md: '---'
  s3:
    title: Grundprinzipien
    blocks:
      b1:
        md: |-
          - Ökologie ist Infrastruktur, nicht Identität.
          - Pflege bedeutet nicht Kontrolle.
          - Kein Land oder System wird standardmäßig „jemandem gehörend".
          - Burnout-Prävention ist wichtiger als Optimierung.
      b2:
        md: '---'
  s4:
    title: Geregelter Geltungsbereich
    blocks:
      b1:
        md: |-
          Die Gemeinschaft MUSS ausdrücklich festlegen:
          - welches Land oder welche Systeme geregelt werden (z. B. Garten, Kompost, Wasser),
          - welche informell oder persönlich sind.
      b2:
        md: Alles, was nicht ausdrücklich geregelt ist, liegt außerhalb des Geltungsbereichs.
      b3:
        md: '---'
  s5:
    title: Zuweisung der Verantwortung
    blocks:
      b1:
        md: |-
          Ökologische Pflege KANN zugewiesen werden über:
          - eine einzelne rotierende Hüter*innen-Rolle, oder
          - eine gemeinsame Pflegevereinbarung.
      b2:
        md: |-
          Mindestens MUSS die Gemeinschaft festlegen:
          - wer aktuell verantwortlich ist,
          - wie lange die Verantwortung dauert,
          - wie die Verantwortung übergeben werden kann.
      b3:
        md: Keine ökologische Verantwortung darf unbefristet ohne Überprüfung bestehen.
      b4:
        md: '---'
  s6:
    title: Arbeit & Beitrag
    blocks:
      b1:
        md: |-
          Die Gemeinschaft MUSS explizit, aber einfach beantworten:
          - Wird ökologische Arbeit von allen Mitgliedern erwartet, ist sie freiwillig oder rollenbasiert?
          - Ist Substitution (Geld, Outsourcing) erlaubt?
      b2:
        md: |-
          Wenn Arbeit erwartet wird, MUSS Pflegearbeit:
          - sichtbar,
          - besprechbar,
          - neu verhandelbar sein.
      b3:
        md: Unsichtbare oder moralisch erzwungene Arbeit ist ein Verstoß.
      b4:
        md: '---'
  s7:
    title: Entscheidungsbefugnis
    blocks:
      b1:
        md: Alltägliche ökologische Entscheidungen KÖNNEN von den aktuellen Hüter*innen getroffen werden.
      b2:
        md: |-
          Strukturelle Entscheidungen (z. B. Gärten erweitern, Bäume entfernen, Landnutzung festschreiben) MÜSSEN:
          - den Entscheidungsregeln von RCOS Schicht 2 folgen,
          - überprüfbar sein,
          - wo möglich reversibel sein.
      b3:
        md: Fachwissen fließt in Entscheidungen ein, setzt aber den Prozess nicht außer Kraft.
      b4:
        md: '---'
  s8:
    title: Allmende-Schutz (minimal)
    blocks:
      b1:
        md: |-
          Land oder Systeme, die von der Gemeinschaft genutzt werden:
          - DÜRFEN NICHT durch Pflege oder Investition privatisiert werden,
          - MÜSSEN durch die Gemeinschaft rückholbar bleiben,
          - MÜSSEN einen Ausstiegspfad sowohl für Pflegende als auch für Nicht-Pflegende haben.
      b2:
        md: Wenn Eigentum besteht, MÜSSEN Nutzungsrechte explizit geregelt sein.
      b3:
        md: '---'
  s9:
    title: Auslöser für Überprüfung
    blocks:
      b1:
        md: |-
          Die folgenden Bedingungen REQUIRE eine Überprüfung oder Eskalation:
          - eine Person wird unentbehrlich für ökologische Systeme,
          - Pflegearbeit verursacht wiederkehrendes Burnout,
          - Landnutzungsentscheidungen werden emotional oder moralisch erzwingend,
          - ein Ausstieg aus der Verantwortung fühlt sich unsicher an oder wird bestraft.
      b2:
        md: '---'
  s10:
    title: Artefakte (minimal)
    blocks:
      b1:
        md: |-
          Folgendes KANN ausreichend sein:
          - eine kurze Ökologie-Umfangsnotiz,
          - ein Verantwortungs-Logbuch (auch informell),
          - eine einfache Arbeitsvereinbarung.
      b2:
        md: Übermäßige Dokumentation ist nicht erwünscht.
      b3:
        md: '---'
  s11:
    title: Kompatibilität
    blocks:
      b1:
        md: |-
          Dieses Modul DARF NICHT außer Kraft setzen:
          - RCOS Schicht 0-Invarianten,
          - Governance-Regeln,
          - Austrittsrechte.
      b2:
        md: |-
          Ökologie darf sich entwickeln.
          Macht darf es nicht.
