lang: pt-br
sourceHash: '1d8b3e41'
title: Núcleo do RCOS
intro: ''
sections:
  s1:
    title: O que é o RCOS
    blocks:
      b1:
        md: O **Sistema Operacional de Comunidades Regenerativas (RCOS)** é uma especificação formal e em camadas para projetar, operar e evoluir comunidades intencionais sem depender de carisma, ideologia ou poder informal.
      b2:
        md: 'O RCOS trata uma comunidade como um **sistema governado**, não como um experimento social. Ele define os requisitos estruturais mínimos necessários para que uma comunidade permaneça:'
      b3:
        md: |-
          - coerente sob estresse,
          - justa diante de assimetrias de poder,
          - adaptável sem colapsar,
          - e regenerativa ao longo do tempo.
      b4:
        md: 'O RCOS não é um estilo de vida, sistema de crenças ou identidade cultural. Ele é um **sistema operacional**: um conjunto de regras explícitas, interfaces, invariantes e casos de teste que tornam a vida comunitária legível, auditável e sustentável.'
      b5:
        md: '---'
  s2:
    title: Qual problema o RCOS resolve
    blocks:
      b1:
        md: A maioria das comunidades não fracassa por causa de más intenções. Elas fracassam por causa de **estrutura implícita**.
      b2:
        md: 'Padrões comuns de fracasso incluem:'
      b3:
        md: |-
          - líderes informais sobrepondo-se a processos formais,
          - normas não declaradas aplicadas como regras,
          - trabalho invisível levando ao esgotamento,
          - riqueza ou carisma se transformando em poder,
          - conflitos sendo evitados até se tornarem existenciais,
          - decisões de emergência se tornando exceções permanentes.
      b4:
        md: O RCOS existe para tornar esses modos de falha **estruturalmente impossíveis ou explicitamente tratáveis**.
      b5:
        md: '---'
  s3:
    title: O que o RCOS não é
    blocks:
      b1:
        md: 'O RCOS explicitamente **não** prescreve:'
      b2:
        md: |-
          - uma cultura, crença ou espiritualidade específica,
          - uma ideologia política ou econômica,
          - um método de governança (por exemplo, consenso vs sociocracia),
          - ou como as pessoas _deveriam_ viver juntas.
      b3:
        md: Em vez disso, o RCOS restringe _como as escolhas são feitas_, _como o poder é limitado_ e _como a mudança ocorre_, independentemente dos valores.
      b4:
        md: '---'
  s4:
    title: Princípios de Design (Inegociáveis)
    blocks:
      b1:
        md: '> **Nada essencial pode permanecer implícito.**'
      b2:
        md: |-
          - **Baseado em restrições, não em valores** — Define regras e limites em vez de prescrever crenças. Valores variam; restrições mantêm os sistemas funcionais sob estresse.
          - **Pré-compromisso em vez de improvisação** — Decisões críticas (conflito, poder, dinheiro) são acordadas antes que emoções, escassez ou disputas de poder surjam.
          - **Modular por padrão** — O núcleo permanece estável enquanto módulos de domínio opcionais podem ser adicionados, substituídos ou removidos sem quebrar o sistema.
          - **Escala humana (≈ 5–150 pessoas)** — Otimizado para grupos pequenos o suficiente para manter confiança, responsabilidade e contexto compartilhado sem burocracia.
          - **Tolerante a falhas, não cego a falhas** — Pressupõe que conflitos, esgotamento e erros acontecerão e fornece caminhos explícitos de recuperação.
      b3:
        md: 'Qualquer coisa que afete o seguinte DEVE ser explicitamente declarada, versionada e revisável:'
      b4:
        md: |-
          - autoridade
          - pertencimento
          - recursos
          - conflito
          - evolução do sistema
      b5:
        md: |-
          - Silêncio nunca é tratado como consentimento.
          - Tradição nunca é tratada como autoridade.
          - Urgência nunca é tratada como justificativa.
      b6:
        md: '---'
  s5:
    title: 'Sobre o tamanho do grupo: por que ~150?'
    blocks:
      b1:
        md: '**150** ≈ Número de Dunbar: limite cognitivo para relações sociais estáveis.'
      b2:
        md: |-
          - **Comunidade mínima viável (5–7 pessoas):**
            Abaixo disso, a separação de papéis e a resolução de conflitos entram em colapso.
          - **Faixa horizontal ótima (8–40 pessoas):**
            Alta confiança, baixa burocracia, participação direta possível.
          - **Tamanho máximo não segmentado (120–150 pessoas):**
            Acima disso, a governança informal falha.
      b3:
        md: O Núcleo do RCOS se aplica a qualquer tamanho, mas acima de ~150 pessoas, subestruturas obrigatórias (círculos, domínios, bairros) são necessárias.
      b4:
        md: '---'
  s6:
    title: Por que a estrutura do Núcleo do RCOS importa
    blocks:
      b1:
        md: |-
          - Previne a dominação por fundadores
          - Torna o poder explícito
          - Reduz normas ocultas
          - Sobrevive a conflitos
          - Permite replicação
          - Integra-se de forma limpa com ferramentas DAO, _sem depender delas_
      b2:
        md: '---'
  s7:
    title: O que está deliberadamente fora do Núcleo do RCOS
    blocks:
      b1:
        md: 'Estas coisas pertencem a **módulos opcionais**, não ao núcleo:'
      b2:
        md: |-
          - Design de permacultura
          - Filosofia educacional
          - Práticas espirituais ou culturais
          - Ideologia política
          - Escolhas estéticas ou de estilo de vida
      b3:
        md: O núcleo governa como as decisões são tomadas, não quais decisões devem ser tomadas.
      b4:
        md: '---'
  s8:
    title: Invariantes (Aplicam-se a Todas as Camadas)
    blocks:
      b1:
        md: '### Explícito Vence Implícito'
      b2:
        md: Se não está escrito, acordado e versionado, **não existe**.
      b3:
        md: '### Por que isso importa'
      b4:
        md: As Invariantes de Camada garantem que nenhuma quantidade de boa vontade, carisma, urgência ou consenso possa silenciosamente erodir o sistema.
      b5:
        md: '---'
  s9:
    title: A Regra de Explicitude do RCOS (Princípio Central)
    blocks:
      b1:
        md: '**Qualquer coisa que aloque poder, risco, responsabilidade ou condições de saída DEVE ser explícita.**'
      b2:
        md: Qualquer coisa que expresse preferência, estilo ou otimização local PODE ser opcional.
      b3:
        md: '### Explícito vs Opcional por Camada'
      b4:
        md: 'Usamos três categorias:'
      b5:
        md: |-
          - **DEVE ser explícito** → exigido para conformidade com o RCOS
          - **PODE ser explícito** → recomendado, mas depende do contexto
          - **DEVE permanecer opcional** → nunca imposto pelo núcleo
      b6:
        md: '### Invariante de Explicitude entre Camadas'
      b7:
        md: '**Se algo pode:**'
      b8:
        md: |-
          - Remover os direitos de alguém
          - Comprometer o tempo ou trabalho de alguém
          - Controlar recursos compartilhados
          - Silenciar discordância
          - Impedir a saída
      b9:
        md: '**Então DEVE ser explícito, documentado e revisável.**'
      b10:
        md: Sem exceções.
      b11:
        md: 'Essa abordagem garante:'
      b12:
        md: |-
          - O RCOS **não** se torna burocrático
          - As comunidades mantêm liberdade cultural
          - Apenas o _risco estrutural_ é regulado
          - Módulos opcionais permanecem poderosos, não restritos
      b13:
        md: '---'
  s10:
    title: Design Orientado por Testes de Estresse
    blocks:
      b1:
        md: O RCOS é validado não pela intenção, mas pela **resistência a falhas**.
      b2:
        md: 'A especificação inclui um conjunto crescente de **testes de estresse** derivados de colapsos reais de comunidades, tais como:'
      b3:
        md: |-
          - dominação em reuniões
          - poder de veto do fundador
          - privatização dos bens comuns
          - culturas de evitação de conflito
          - autoridade espiritual carismática
          - contornos de regras em emergências
      b4:
        md: Uma comunidade só é considerada alinhada ao RCOS se puder **resistir a esses cenários sem soluções informais**.
      b5:
        md: 'Quase todo fracasso acontece porque:'
      b6:
        md: '**Algo poderoso foi deixado implícito.**'
      b7:
        md: 'O RCOS transforma:'
      b8:
        md: |-
          - Poder implícito → papéis explícitos
          - Valores implícitos → regras delimitadas
          - Punição implícita → devido processo
          - Propriedade implícita → direitos declarados
      b9:
        md: '### Modos de Falha Conhecidos que o RCOS foi Projetado para Prevenir'
      b10:
        md: Veja [Testes de Estresse do RCOS](/stress-tests)
  s11:
    title: Implementações de Referência
    blocks:
      b1:
        md: 'O RCOS incentiva pequenas **comunidades de referência** do mundo real que:'
      b2:
        md: |-
          - implementem as camadas centrais explicitamente,
          - documentem desvios e falhas,
          - e publiquem os aprendizados de volta no padrão.
      b3:
        md: O objetivo não é a perfeição, mas a **evolução por meio da transparência**.
      b4:
        md: '---'
  s12:
    title: Por que "Regenerativo"
    blocks:
      b1:
        md: O RCOS usa o termo _regenerativo_ deliberadamente.
      b2:
        md: 'Um sistema regenerativo:'
      b3:
        md: |-
          - não depende de crescimento constante,
          - não esgota seus membros,
          - repara danos em vez de escondê-los,
          - e se fortalece ao integrar falhas.
      b4:
        md: O RCOS é projetado para que **o estresse produza aprendizado**, não colapso.
      b5:
        md: '---'
  s13:
    title: Para quem é o RCOS
    blocks:
      b1:
        md: 'O RCOS é destinado a:'
      b2:
        md: |-
          - comunidades intencionais,
          - ecovilas e projetos de cohousing,
          - cooperativas e organizações baseadas em bens comuns,
          - experimentos de vida coletiva de longo prazo,
          - e qualquer grupo que queira sobreviver ao próprio sucesso.
      b3:
        md: O RCOS é especialmente útil para grupos que já compartilham valores fortes — e querem garantir que esses valores não se tornem ferramentas de coerção.
      b4:
        md: '---'
  s14:
    title: Como usar o RCOS
    blocks:
      b1:
        md: 'O RCOS pode ser usado como:'
      b2:
        md: |-
          - um **modelo de design** antes de fundar uma comunidade,
          - um **framework de auditoria** para grupos existentes,
          - uma **ferramenta de teste de estresse** durante conflitos,
          - ou uma **linguagem compartilhada** para conversas estruturais difíceis.
      b3:
        md: A adoção pode ser incremental. A conformidade pode ser parcial. O que importa é a **explicitude, não a pureza**.
      b4:
        md: '---'
  s15:
    title: A Afirmação Central
    blocks:
      b1:
        md: |-
          > Comunidades não fracassam porque as pessoas são falhas.  
          > Elas fracassam porque os sistemas são vagos.
      b2:
        md: |-
          O RCOS existe para substituir a vagueza pela estrutura —  
          para que cuidado, autonomia e regeneração tenham algo sólido sobre o qual se apoiar.
      b3:
        md: '---'
  s16:
    title: Registro de Mudanças
    blocks:
