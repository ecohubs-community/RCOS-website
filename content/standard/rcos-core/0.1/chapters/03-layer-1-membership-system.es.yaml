lang: es
sourceHash: 4f41980e
title: 3. Capa 1 — Sistema de Membresía
intro: La Capa 1 define cómo las personas ingresan, participan y salen de la comunidad. Establece la relación explícita entre el individuo y el colectivo, incluyendo derechos, obligaciones y el debido proceso. Ninguna persona puede ser tratada como miembro sin haber pasado por los mecanismos definidos en esta capa.
sections:
  '3.1':
    title: Estados de Membresía
    blocks:
      3.1.1:
        text: La comunidad DEBE definir estados de membresía explícitos.
      3.1.2:
        text: 'Como mínimo, DEBEN existir los siguientes estados de membresía:'
        items:
          - Solicitante
          - Miembro en Prueba / Periodo Probatorio
          - Miembro Pleno
          - Miembro Retirado
      3.1.3:
        text: Cada estado de membresía DEBE tener derechos, obligaciones y limitaciones claramente definidos.
      3.1.4:
        text: Ningún individuo PUEDE ostentar múltiples estados de membresía simultáneamente.
      3.1.5:
        text: No se PUEDE asumir ningún derecho u obligación fuera del estado de membresía actual del individuo.
  '3.2':
    title: Ingreso e Incorporación
    blocks:
      3.2.1:
        text: El ingreso a la comunidad DEBE seguir un proceso de incorporación explícito.
      3.2.2:
        text: 'El proceso de incorporación DEBE incluir:'
        items:
          - Revisión de todos los artefactos de RCOS-Core
          - Consentimiento explícito a las reglas de la Capa 0 y la Capa 1
          - Declaración del estado de membresía inicial
      3.2.3:
        text: Los criterios de admisión DEBEN ser explícitos y estar documentados.
      3.2.4:
        text: La membresía informal, implícita o retroactiva NO DEBE ser permitida.
  '3.3':
    title: Periodo de Prueba y Evaluación
    blocks:
      3.3.1:
        text: La comunidad DEBE definir un periodo probatorio para los nuevos miembros.
      3.3.2:
        text: 'El periodo probatorio DEBE tener:'
        items:
          - Una duración definida
          - Criterios de evaluación explícitos
          - Un proceso de decisión de transición claro
      3.3.3:
        text: Durante el periodo de prueba, los derechos PUEDEN ser limitados, pero las obligaciones DEBEN ser explícitas.
      3.3.4:
        text: La falta de transición desde el periodo de prueba DEBE activar un proceso definido de salida o extensión.
  '3.4':
    title: Derechos y Obligaciones
    blocks:
      3.4.1:
        text: La comunidad DEBE definir explícitamente los derechos de los miembros.
      3.4.2:
        text: La comunidad DEBE definir explícitamente las obligaciones de los miembros.
      3.4.3:
        text: Los derechos y obligaciones DEBEN ser simétricos y proporcionales al estado de membresía.
      3.4.4:
        text: Ninguna obligación PUEDE ser exigida sin un derecho correspondiente y documentado.
      3.4.5:
        text: Las obligaciones NO DEBEN ser indefinidas o carecer de definición.
  '3.5':
    title: Participación y Contribución
    blocks:
      3.5.1:
        text: Las expectativas de participación DEBEN estar definidas explícitamente.
      3.5.2:
        text: Las formas aceptables de contribución DEBEN estar enumeradas.
      3.5.3:
        text: La sustitución de participación (p. ej., externalización de trabajo) DEBE estar gobernada explícitamente.
      3.5.4:
        text: La falta persistente de participación DEBE activar un proceso de rendición de cuentas según lo definido en la Capa 4.
  '3.6':
    title: Salida y Separación
    blocks:
      3.6.1:
        text: La salida voluntaria DEBE ser posible en todo momento.
      3.6.2:
        text: Los procedimientos de salida DEBEN ser explícitos, documentados y no punitivos.
      3.6.3:
        text: La salida forzosa DEBE seguir el debido proceso y gestionarse a través de los mecanismos de la Capa 4.
      3.6.4:
        text: La salida NO DEBE resultar en la pérdida de derechos más allá de aquellos explícitamente vinculados a la membresía.
      3.6.5:
        text: La separación de activos, roles y responsabilidades DEBE estar definida antes de la salida.
  '3.7':
    title: Suspensión y Estado Temporal
    blocks:
      3.7.1:
        text: La comunidad PUEDE definir estados de suspensión temporal.
      3.7.2:
        text: Las condiciones de suspensión DEBEN ser explícitas, limitadas en el tiempo y revisables.
      3.7.3:
        text: La suspensión NO DEBE utilizarse como sustituto indefinido o punitivo de la salida.
  '3.8':
    title: Artefactos
    blocks:
      3.8.1:
        text: 'Los siguientes artefactos son obligatorios para el cumplimiento de la Capa 1:'
        items:
          - Acuerdo de Membresía
          - Protocolo de Incorporación
          - Protocolo de Salida y Separación
          - Registro de Estados de Membresía
      3.8.2:
        text: 'Los artefactos de la Capa 1 DEBEN ser:'
        items:
          - Explícitos e inequívocos
          - Versionados
          - Accesibles para todos los miembros
      3.8.3:
        text: La ausencia, ambigüedad o violación sistemática de los artefactos de la Capa 1 DEBE resultar en la pérdida del cumplimiento con RCOS-Core.
