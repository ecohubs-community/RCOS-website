lang: fr
sourceHash: fff21d92
title: 2. Couche 0 — Identité & Périmètre
intro: La Couche 0 définit l'identité constitutionnelle de la communauté. Elle établit ce que la communauté *est*, ce qu'elle *n'est pas*, et les contraintes non négociables sous lesquelles toutes les autres couches opèrent. Aucune règle, décision ou pratique des couches supérieures ne PEUT contredire la Couche 0.
sections:
  '2.1':
    title: Définition de la raison d'être
    blocks:
      2.1.1:
        text: Une communauté DOIT définir exactement une raison d'être principale.
      2.1.2:
        text: La raison d'être principale DOIT décrire la raison durable de l'existence de la communauté et NE DOIT PAS être un objectif à court terme, un projet ou une stratégie.
      2.1.3:
        text: La raison d'être principale DOIT être stable dans le temps et NE DOIT être modifiée que par une décision constitutionnelle telle que définie dans la Couche 2 et exécutée via le processus de modification défini dans la Couche 6.
      2.1.4:
        text: Des raisons d'être secondaires PEUVENT être définies, mais NE DOIVENT PAS entrer en conflit avec la raison d'être principale ni la supplanter.
      2.1.5:
        text: Aucune action, décision ou allocation de ressources NE PEUT contredire matériellement la raison d'être principale déclarée.
  '2.2':
    title: Déclaration de périmètre
    blocks:
      2.2.1:
        text: La communauté DOIT déclarer explicitement le périmètre de ce qu'elle gouverne.
      2.2.2:
        text: 'La déclaration de périmètre DOIT inclure, au minimum :'
        items:
          - Les actifs gouvernés par la communauté
          - Les domaines d'autorité décisionnelle
          - Les activités et responsabilités sous contrôle collectif
      2.2.3:
        text: La déclaration de périmètre DOIT lister explicitement ce qui est hors périmètre.
      2.2.4:
        text: Tout ce qui n'est pas explicitement déclaré comme étant dans le périmètre DOIT être considéré comme hors périmètre.
      2.2.5:
        text: La communauté NE DOIT PAS exercer d'autorité sur des personnes, des actifs ou des domaines déclarés hors périmètre.
  '2.3':
    title: Invariants
    blocks:
      2.3.1:
        text: Les invariants sont des contraintes qui définissent ce qui NE DOIT PAS être violé tant qu'ils sont en vigueur.
      2.3.2:
        text: Les invariants DOIVENT être explicitement listés et documentés.
      2.3.3:
        text: Les invariants DOIVENT s'appliquer à travers toutes les couches du RCOS.
      2.3.4:
        text: Aucune décision, rôle, processus ou mesure d'urgence NE PEUT outrepasser un invariant.
      2.3.5:
        text: Si un conflit survient entre un invariant et toute autre règle, l'invariant DOIT prévaloir.
      2.3.6:
        text: Les invariants NE PEUVENT être modifiés ou supprimés que par un processus de modification constitutionnelle tel que défini dans la Couche 2 et la Couche 6.
  '2.4':
    title: Contraintes d'identité
    blocks:
      2.4.1:
        text: La communauté DOIT déclarer toute contrainte d'identité qui affecte matériellement la participation, le comportement ou la gouvernance.
      2.4.2:
        text: 'Les contraintes d''identité PEUVENT inclure, sans s''y limiter :'
        items:
          - Les limites éthiques ou comportementales
          - Les prérequis de participation
          - Les contraintes culturelles ou écologiques non négociables
      2.4.3:
        text: Les contraintes d'identité DOIVENT être vérifiables et applicables à travers des processus définis.
      2.4.4:
        text: Les contraintes d'identité NE DOIVENT PAS être appliquées de manière implicite ou informelle.
  '2.5':
    title: Artefacts
    blocks:
      2.5.1:
        text: 'Les artefacts suivants sont obligatoires pour la conformité à la Couche 0 :'
        items:
          - Charte de raison d'être
          - Déclaration de périmètre
          - Registre des invariants
          - Registre des contraintes d'identité
      2.5.2:
        text: 'Les artefacts de la Couche 0 DOIVENT être :'
        items:
          - Accessibles publiquement à tous les membres
          - Versionnés
          - Adoptés par un processus formel de ratification
      2.5.3:
        text: Si les artefacts de la Couche 0 sont manquants, ambigus ou en contradiction interne, la communauté DOIT être considérée comme non conforme au RCOS-Core.
