lang: fr
sourceHash: 2ebe4abe
title: 6. Couche 4 — Conflit, réparation et responsabilité
intro: |-
  La Couche 4 définit comment la communauté réagit lorsque la confiance, la coordination ou la sécurité se détériore.
  Son objectif est de garantir que les conflits soient traités de manière explicite, équitable et sûre, tout en empêchant les abus de pouvoir, la normalisation des préjudices ou l'exclusion silencieuse.
sections:
  '6.1':
    title: Classification des conflits
    blocks:
      6.1.1:
        text: La communauté DOIT définir un système explicite de classification des conflits qui soit connu, accessible et utilisable par tous les membres.
      6.1.2:
        text: 'Au minimum, le système de classification DOIT inclure les classes suivantes :'
        items:
          - Conflits interpersonnels (entre individus)
          - Conflits liés aux rôles (autorité, responsabilité ou litiges de mandat)
          - Conflits structurels (incitations systémiques, règles ou problèmes d'allocation des ressources)
          - Violations éthiques ou de limites (violations des normes déclarées, du périmètre ou des limites de sécurité)
      6.1.3:
        text: 'Chaque classe de conflit DOIT définir explicitement :'
        items:
          - Les critères d'entrée (comment une situation est classée dans cette classe)
          - La priorité de réponse attendue et les délais (le cas échéant)
          - Les voies de résolution autorisées et requises
          - Les exigences de documentation et les limites de confidentialité
      6.1.4:
        text: Les conflits impliquant des risques crédibles pour la sécurité, de la coercition, des abus ou des menaces DOIVENT être classés comme **critiques pour la sécurité** et DOIVENT déclencher des mesures de protection renforcées telles que définies à la Section 6.3.
      6.1.5:
        text: La classification erronée ou l'évitement de la classification DOIT être traité comme une défaillance de processus soumise à examen.
  '6.2':
    title: Voies de résolution
    blocks:
      6.2.1:
        text: La communauté DOIT définir un processus minimum de résolution des conflits applicable à toutes les classes de conflits.
      6.2.2:
        text: Le processus de résolution DOIT inclure une **échelle de résolution** clairement définie avec des étapes d'escalade explicites.
      6.2.3:
        text: 'L''échelle de résolution DOIT définir, au minimum :'
        items:
          - Comment un conflit est signalé, enregistré et accusé de réception
          - Comment les parties impliquées sont notifiées et invitées à participer
          - Comment le refus, l'absence de réponse ou le retrait est géré
          - Comment les médiateurs ou facilitateurs sont sélectionnés, remplacés ou récusés
          - Les attentes temporelles pour chaque étape (le cas échéant)
          - Les exigences de documentation et les règles d'accès
          - Un processus d'examen des défaillances procédurales ou des blocages
      6.2.4:
        text: Le processus de résolution DOIT être accessible sans exiger de statut social, d'ancienneté, de charisme ou de proximité informelle avec les décideurs.
      6.2.5:
        text: Les conflits non résolus DOIVENT être escaladés par les voies de gouvernance définies sans contourner la Matrice de Décision définie à la Couche 2.
  '6.3':
    title: Mesures de protection
    blocks:
      6.3.1:
        text: La communauté DOIT définir des mesures de protection explicites pour les conflits impliquant des asymétries de pouvoir, des relations de dépendance ou des risques pour la sécurité.
      6.3.2:
        text: 'Les mesures de protection DOIVENT inclure des protections contre les représailles pour :'
        items:
          - Le signalement d'une préoccupation
          - La demande de médiation
          - La fourniture de témoignages ou de preuves
          - La participation à un examen ou un appel
      6.3.3:
        text: 'Lorsqu''un différentiel de pouvoir existe entre les parties, des mesures de protection renforcées DOIVENT être appliquées, ce qui PEUT inclure :'
        items:
          - Une facilitation indépendante ou externe
          - Des canaux séparés de collecte, de documentation ou de communication
          - La suspension ou la limitation temporaire de l'autorité liée au rôle
          - Des seuils supplémentaires de preuves et d'examen avant les sanctions
      6.3.4:
        text: 'Pour les conflits critiques pour la sécurité, la communauté DOIT définir des actions de protection immédiates pouvant être prises avant l''achèvement complet du processus, ce qui PEUT inclure :'
        items:
          - Des mesures de séparation temporaire
          - Un accès restreint aux espaces ou ressources partagés
          - La suspension temporaire de rôle
          - Des délais d'escalade d'urgence
      6.3.5:
        text: Les mesures de protection liées à la sécurité DOIVENT prévaloir sur les droits de participation, la continuité des rôles et la commodité opérationnelle.
  '6.4':
    title: Sanctions, réparation et séparation
    blocks:
      6.4.1:
        text: La communauté DOIT définir un cadre explicite de sanctions et de réparation.
      6.4.2:
        text: 'Les sanctions et les actions de réparation DOIVENT être :'
        items:
          - Proportionnelles à la violation
          - Explicitement documentées
          - Limitées dans le temps le cas échéant
          - Révisables et susceptibles d'appel
      6.4.3:
        text: 'Le cadre DOIT définir, au minimum :'
        items:
          - Les types de sanctions et de réparations disponibles
          - Les conditions préalables et les normes de preuve
          - Les rôles ou organes autorisés pour leur application
          - Les mécanismes d'examen et d'appel
          - Les conditions de rétablissement des droits, rôles ou participation
      6.4.4:
        text: Les actions de séparation, de suspension ou d'exclusion DOIVENT suivre une procédure régulière et DOIVENT être conformes aux règles de sortie et de séparation définies à la Couche 1.
      6.4.5:
        text: Les sanctions NE DOIVENT PAS être appliquées par exclusion informelle, pression sociale, silence ou retrait implicite de droits.
      6.4.6:
        text: Les actions orientées vers la réparation DOIVENT être prioritaires par rapport aux actions punitives, sauf dans les cas critiques pour la sécurité.
  '6.5':
    title: Artefacts
    blocks:
      6.5.1:
        text: 'Les artefacts suivants sont obligatoires pour la conformité à la Couche 4 :'
        items:
          - Échelle de résolution des conflits
          - Protocole de responsabilité
      6.5.2:
        text: 'Les artefacts de la Couche 4 DOIVENT être :'
        items:
          - Explicites et sans ambiguïté
          - Versionnés
          - Accessibles à tous les membres, avec des protections de confidentialité clairement délimitées
          - Adoptés par un processus de gouvernance autorisé
      6.5.3:
        text: 'L''Échelle de résolution des conflits DOIT définir, au minimum :'
        items:
          - Les entrées de classification des conflits et les seuils d'escalade
          - Les étapes de résolution et les règles de sélection des facilitateurs
          - Les limites de documentation et d'accès à l'information
          - Les exceptions critiques pour la sécurité et les mesures de protection immédiates
      6.5.4:
        text: 'Le Protocole de responsabilité DOIT définir, au minimum :'
        items:
          - Les mécanismes d'investigation, d'examen et de décision
          - Les garanties de procédure régulière et les protections contre les représailles
          - Les options de sanctions et de réparation avec des règles de proportionnalité
          - Les voies d'appel, de supervision et d'escalade
          - La coordination avec les processus de sortie et de séparation de la Couche 1
  '6.6':
    title: Invariants de la couche
    blocks:
      6.6.1:
        text: Le conflit DOIT être traité comme une condition gérée avec des voies définies ; ignorer, supprimer ou normaliser un conflit non résolu DOIT être considéré comme une violation du système.
      6.6.2:
        text: Les conflits impliquant des asymétries de pouvoir DOIVENT déclencher des mesures de protection renforcées.
      6.6.3:
        text: La réparation et la restauration DOIVENT précéder la punition, sauf lorsque la sécurité immédiate est en jeu.
      6.6.4:
        text: La sécurité physique, psychologique et celle des enfants DOIT prévaloir sur les droits de participation, la continuité des rôles et les préoccupations de réputation.
  '6.7':
    title: Règles d'explicitation
    blocks:
      6.7.1:
        text: 'Les éléments suivants DOIVENT être explicites :'
        items:
          - Le système de classification des conflits
          - Le processus minimum de résolution et d'escalade
          - Les mesures de protection et les protections contre les représailles
          - Les seuils de sanctions, de réparation et de séparation
      6.7.2:
        text: 'Les éléments suivants PEUVENT être explicites :'
        items:
          - Les styles ou méthodologies de médiation
          - Les préférences de sélection des facilitateurs au-delà des mesures de protection minimales
          - Les pratiques restauratives ou réparatrices
      6.7.3:
        text: 'Les éléments suivants DOIVENT rester optionnels et hors périmètre :'
        items:
          - Les normes d'expression émotionnelle
          - Le cadrage thérapeutique, spirituel ou idéologique du conflit
