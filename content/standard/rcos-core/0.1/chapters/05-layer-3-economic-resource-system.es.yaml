lang: es
sourceHash: 'fe29e2f5'
title: 5. Capa 3 — Sistema Económico y de Recursos
intro: |-
  La Capa 3 define cómo fluyen el valor, los recursos y las obligaciones dentro de la comunidad.
  Su propósito es hacer que el poder económico sea explícito, acotado, auditable y subordinado a la gobernanza, previniendo la acumulación oculta, la dependencia o la coerción.
sections:
  '5.1':
    title: Recursos comunes vs privados
    blocks:
      5.1.1:
        text: Todos los recursos dentro del ámbito gobernado declarado DEBEN clasificarse explícitamente como **comunes** o **privados**.
      5.1.2:
        text: 'La comunidad DEBE mantener un registro único, explícito y versionado de los recursos gobernados, que incluya como mínimo:'
        items:
          - Nombre o identificador único del recurso
          - Clasificación (comunes o privados)
          - Administrador/a o propietario/a (según corresponda)
          - Reglas de acceso y uso
          - Restricciones de transferencia, venta o privatización (si las hay)
      5.1.3:
        text: Cualquier recurso no clasificado explícitamente DEBE tratarse como **sin clasificar**, y la comunidad NO DEBE asignarlo, gravarlo, monetizarlo ni transferirlo hasta que la clasificación se complete mediante una decisión autorizada.
      5.1.4:
        text: 'Para los recursos comunes, la comunidad DEBE definir explícitamente:'
        items:
          - Responsabilidades de administración
          - El órgano o rol autorizado para la toma de decisiones
          - Obligaciones de mantenimiento
          - Mecanismos de financiación o contribución (si los hay)
      5.1.5:
        text: Para los recursos privados, la comunidad NO DEBE ejercer autoridad más allá de lo explícitamente declarado en el ámbito, los acuerdos de membresía u otros artefactos gobernados.
  '5.2':
    title: Reconocimiento de contribuciones
    blocks:
      5.2.1:
        text: 'La comunidad DEBE definir explícitamente qué categorías de contribución se reconocen. Estas PUEDEN incluir, entre otras:'
        items:
          - Trabajo
          - Cuidados y trabajo emocional
          - Conocimiento y educación
          - Administración y mantenimiento
          - Trabajo administrativo o de coordinación
      5.2.2:
        text: 'La comunidad DEBE definir un mecanismo de reconocimiento de contribuciones que especifique:'
        items:
          - Qué califica como contribución
          - Cómo se registran o reconocen las contribuciones
          - Quién puede registrar, validar o impugnar contribuciones
          - Si el reconocimiento de contribuciones afecta al acceso a recursos, privilegios u obligaciones, y de qué manera
      5.2.3:
        text: La comunidad NO DEBE depender estructuralmente de trabajo no remunerado, invisible o informal para la supervivencia del sistema sin definir explícitamente las obligaciones, el reconocimiento o los mecanismos de compensación correspondientes.
      5.2.4:
        text: 'Si se utilizan unidades económicas internas (p. ej., créditos de tiempo, puntos, tokens), el Protocolo de Economía Interna DEBE definir:'
        items:
          - Reglas de emisión
          - Reglas de transferibilidad
          - Mecanismos de expiración, decaimiento o límite máximo (si los hay)
          - Mecanismos de prevención de fraude, resolución de disputas y corrección
          - Reglas de privacidad y transparencia para saldos y transacciones
      5.2.5:
        text: El reconocimiento de contribuciones NO DEBE crear autoridad implícita de decisión, poder de veto o influencia en la gobernanza más allá de lo definido en la Capa 2.
  '5.3':
    title: Gestión de tesorería
    blocks:
      5.3.1:
        text: La comunidad DEBE definir explícitamente qué recursos se mantienen en la tesorería compartida y cómo se articulan los límites de la tesorería con los recursos privados.
      5.3.2:
        text: Las fuentes de ingresos y cualquier interfaz de ingresos externos DEBEN definirse explícitamente.
      5.3.3:
        text: 'La autoridad de gasto DEBE estar explícitamente acotada mediante:'
        items:
          - Asignaciones claras de autoridad
          - Umbrales por monto y/o categoría
          - Vías de aprobación y escalamiento
          - Requisitos obligatorios de registro
      5.3.4:
        text: La transparencia DEBE ser la norma por defecto para los saldos de tesorería, los ingresos, los egresos, las obligaciones y los compromisos.
      5.3.5:
        text: Cualquier excepción a la transparencia DEBE estar explícitamente definida, justificada, acotada en el tiempo y NO DEBE impedir que los miembros auditen el cumplimiento.
      5.3.6:
        text: 'La comunidad DEBE definir políticas de reservas, riesgos y responsabilidades, que incluyan:'
        items:
          - Límites de endeudamiento
          - Obligaciones a largo plazo
          - Reservas de contingencia (si las hay)
  '5.4':
    title: Restricciones de acumulación
    blocks:
      5.4.1:
        text: Los sistemas económicos internos DEBEN prevenir la concentración ilimitada de influencia o control interno a través de recursos, créditos u obligaciones financieras.
      5.4.2:
        text: 'Si existen unidades internas, la comunidad DEBE definir uno o más mecanismos de limitación de acumulación, que PUEDEN incluir:'
        items:
          - Límites máximos
          - Decaimiento o expiración
          - No transferibilidad
          - Mecanismos de redistribución o tributación
          - Validez acotada en el tiempo
      5.4.3:
        text: Los mecanismos económicos NO DEBEN permitir que los miembros eludan los límites de autoridad de gobernanza definidos en la Capa 2, incluyendo mediante la compra de influencia, la creación de dependencia o la conversión de poder económico en autoridad informal de decisión.
      5.4.4:
        text: La comunidad DEBE definir indicadores auditables de riesgo de concentración económica y un mecanismo explícito para ajustar las restricciones cuando se detecten dichos riesgos.
  '5.5':
    title: Artefactos
    blocks:
      5.5.1:
        text: 'Los siguientes artefactos son obligatorios para el cumplimiento de la Capa 3:'
        items:
          - Protocolo de Economía Interna
          - Reglamento de Tesorería
      5.5.2:
        text: 'Los artefactos de la Capa 3 DEBEN ser:'
        items:
          - Explícitos e inequívocos
          - Versionados
          - Accesibles para todos los miembros (con excepciones explícitas y acotadas)
          - Adoptados mediante un proceso de gobernanza autorizado
      5.5.3:
        text: 'El Protocolo de Economía Interna DEBE definir, como mínimo:'
        items:
          - Categorías de contribución y mecanismos de reconocimiento
          - Límites y reglas de asignación entre recursos comunes y privados
          - Unidades internas (si las hay) y restricciones de acumulación
          - Interfaces de ingresos externos (si las hay)
          - Mecanismos de resolución de disputas y corrección de registros económicos
      5.5.4:
        text: 'El Reglamento de Tesorería DEBE definir, como mínimo:'
        items:
          - Fuentes de ingresos
          - Umbrales de autoridad de gasto y vías de aprobación
          - Requisitos de transparencia y rendición de cuentas (incluyendo excepciones acotadas)
          - Restricciones de reservas, riesgos y endeudamiento
          - Reglas de conflicto de intereses para gastos y adquisiciones
  '5.6':
    title: Invariantes de capa
    blocks:
      5.6.1:
        text: Los recursos compartidos, los flujos y las obligaciones DEBEN ser visibles para la comunidad por defecto, con excepciones únicamente limitadas y explícitas.
      5.6.2:
        text: Los recursos declarados como comunes NO DEBEN privatizarse mediante acciones informales, implícitas o unilaterales.
      5.6.3:
        text: El reconocimiento de contribuciones DEBE ser explícito, de modo que el trabajo no remunerado o invisible no sea estructuralmente necesario para la supervivencia del sistema.
      5.6.4:
        text: Los mecanismos económicos DEBEN prevenir la concentración indefinida de influencia interna.
  '5.7':
    title: Reglas de explicitud
    blocks:
      5.7.1:
        text: 'Lo siguiente DEBE ser explícito:'
        items:
          - Clasificaciones de recursos comunes vs privados
          - Reglas de asignación y acceso para recursos compartidos
          - Límites de autoridad de gasto
          - Reglas de transparencia
          - Interfaces de ingresos externos
      5.7.2:
        text: 'Lo siguiente PUEDE ser explícito:'
        items:
          - Modelos de valoración de contribuciones
          - Unidades internas (tokens, horas, puntos)
          - Categorías presupuestarias y estructuras de contabilidad interna
      5.7.3:
        text: 'Lo siguiente DEBE permanecer opcional y fuera del ámbito:'
        items:
          - Actitudes hacia la riqueza
          - Resultados igualitarios vs diferenciados
          - Decisiones financieras personales
