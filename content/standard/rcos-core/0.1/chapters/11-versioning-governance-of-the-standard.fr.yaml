lang: fr
sourceHash: '4111bb21'
title: 11. Versionnement et gouvernance du standard
intro: Ce chapitre définit comment le RCOS lui-même évolue en tant que standard.
sections:
  '11.1':
    title: Intendance du standard
    blocks:
      11.1.1:
        text: Le RCOS DOIT avoir un organisme ou un processus d'intendance identifiable.
      11.1.2:
        text: 'Les responsabilités de l''intendant DOIVENT inclure :'
        items:
          - 'Maintenir la spécification canonique  '
          - 'Gérer les publications de versions  '
          - 'Organiser les matériaux de référence et d''apprentissage  '
          - 'Protéger les invariants de la Couche 0 du standard lui-même  '
      11.1.3:
        text: L'intendant NE DOIT PAS agir comme une autorité d'application auprès des communautés.
      11.1.4:
        text: L'intendance du RCOS DOIT privilégier la clarté, la stabilité et les apprentissages issus du terrain plutôt que la pureté idéologique.
  '11.2':
    title: Processus de modification
    blocks:
      11.2.1:
        text: Les modifications apportées au RCOS-Core DOIVENT suivre un processus de modification défini.
      11.2.2:
        text: 'Le processus de modification DOIT inclure :'
        items:
          - 'Soumission de proposition  '
          - 'Période de revue publique et de retours  '
          - 'Mécanisme de décision et autorité décisionnelle  '
          - 'Versionnement et publication  '
      11.2.3:
        text: La compatibilité ascendante DEVRAIT être préservée dans la mesure du possible.
      11.2.4:
        text: Les changements non rétrocompatibles DOIVENT être clairement signalés et justifiés.
      11.2.5:
        text: Les versions remplacées du RCOS DOIVENT rester accessibles publiquement.
      11.2.6:
        text: 'Le RCOS lui-même DOIT incarner les mêmes principes qu''il exige des communautés : explicité, autorité délimitée, réversibilité et apprentissage.'
