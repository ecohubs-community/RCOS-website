lang: pt-br
sourceHash: 'b0e42d26'
title: 0. Introdução
intro: ''
sections:
  '0.1':
    title: Propósito do RCOS
    blocks:
      b1:
        md: Define um sistema operacional padronizado e modular para comunidades pequenas e intencionais, focado em resiliência, justiça e regeneração.
  '0.2':
    title: Escopo do Core
    blocks:
      b1:
        md: Esta especificação define as **camadas centrais obrigatórias** necessárias para a conformidade com o RCOS. Práticas específicas de domínio são excluídas e tratadas por meio de módulos opcionais.
  '0.3':
    title: Princípios de Design
    blocks:
      b1:
        md: |-
          - Baseado em restrições, não em valores
          - Pré-compromisso em vez de improvisação
          - Modular por padrão
          - Em escala humana
          - Tolerante a falhas
  '0.4':
    title: Definições e Terminologia
    blocks:
      b1:
        md: |-
          - Comunidade
          - Membro
          - Papel
          - Domínio
          - Bens Comuns
          - Invariante
          - Tipo de Decisão
          - Conformidade
