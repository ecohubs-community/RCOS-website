lang: fr
sourceHash: '94159d63'
title: 3. Couche 1 — Système d'adhésion
intro: La Couche 1 définit comment les individus entrent dans la communauté, y participent et la quittent. Elle établit la relation explicite entre l'individu et le collectif, y compris les droits, les obligations et les procédures régulières. Aucune personne ne PEUT être traitée comme membre sans avoir passé par les mécanismes définis dans cette couche.
sections:
  '3.1':
    title: États d'adhésion
    blocks:
      3.1.1:
        text: La communauté DOIT définir des états d'adhésion explicites.
      3.1.2:
        text: 'Au minimum, les états d''adhésion suivants DOIVENT exister :'
        items:
          - Candidat
          - Membre en période d'essai / probatoire
          - Membre à part entière
          - Membre sorti
      3.1.3:
        text: Chaque état d'adhésion DOIT avoir des droits, des obligations et des limitations clairement définis.
      3.1.4:
        text: Aucun individu NE PEUT détenir plusieurs états d'adhésion simultanément.
      3.1.5:
        text: Aucun droit ni aucune obligation NE PEUT être présumé en dehors de l'état d'adhésion actuel de l'individu.
  '3.2':
    title: Entrée et intégration
    blocks:
      3.2.1:
        text: L'entrée dans la communauté DOIT suivre un processus d'intégration explicite.
      3.2.2:
        text: 'Le processus d''intégration DOIT inclure :'
        items:
          - L'examen de tous les artefacts RCOS-Core
          - Le consentement explicite aux règles de la Couche 0 et de la Couche 1
          - La déclaration de l'état d'adhésion initial
      3.2.3:
        text: Les critères d'admission DOIVENT être explicites et documentés.
      3.2.4:
        text: L'adhésion informelle, implicite ou rétroactive NE DOIT PAS être autorisée.
  '3.3':
    title: Période d'essai et évaluation
    blocks:
      3.3.1:
        text: La communauté DOIT définir une période probatoire pour les nouveaux membres.
      3.3.2:
        text: 'La période probatoire DOIT comporter :'
        items:
          - Une durée définie
          - Des critères d'évaluation explicites
          - Un processus de décision de transition clair
      3.3.3:
        text: Pendant la période probatoire, les droits PEUVENT être limités mais les obligations DOIVENT être explicites.
      3.3.4:
        text: L'absence de transition à l'issue de la période probatoire DOIT déclencher un processus de sortie ou de prolongation défini.
  '3.4':
    title: Droits et obligations
    blocks:
      3.4.1:
        text: La communauté DOIT définir explicitement les droits des membres.
      3.4.2:
        text: La communauté DOIT définir explicitement les obligations des membres.
      3.4.3:
        text: Les droits et obligations DOIVENT être symétriques et proportionnels à l'état d'adhésion.
      3.4.4:
        text: Aucune obligation NE PEUT être imposée sans un droit correspondant et documenté.
      3.4.5:
        text: Les obligations NE DOIVENT PAS être ouvertes ou indéfinies.
  '3.5':
    title: Participation et contribution
    blocks:
      3.5.1:
        text: Les attentes en matière de participation DOIVENT être explicitement définies.
      3.5.2:
        text: Les formes acceptables de contribution DOIVENT être énumérées.
      3.5.3:
        text: La substitution de participation (par exemple, l'externalisation du travail) DOIT être explicitement encadrée.
      3.5.4:
        text: La non-participation persistante DOIT déclencher un processus de responsabilisation tel que défini dans la Couche 4.
  '3.6':
    title: Sortie et séparation
    blocks:
      3.6.1:
        text: La sortie volontaire DOIT être possible à tout moment.
      3.6.2:
        text: Les procédures de sortie DOIVENT être explicites, documentées et non punitives.
      3.6.3:
        text: La sortie forcée DOIT suivre une procédure régulière et être traitée par les mécanismes de la Couche 4.
      3.6.4:
        text: La sortie NE DOIT PAS entraîner la perte de droits au-delà de ceux explicitement liés à l'adhésion.
      3.6.5:
        text: La séparation des actifs, des rôles et des responsabilités DOIT être définie avant la sortie.
  '3.7':
    title: Suspension et statut temporaire
    blocks:
      3.7.1:
        text: La communauté PEUT définir des états de suspension temporaire.
      3.7.2:
        text: Les conditions de suspension DOIVENT être explicites, limitées dans le temps et révisables.
      3.7.3:
        text: La suspension NE DOIT PAS être utilisée comme substitut indéfini ou punitif à la sortie.
  '3.8':
    title: Artefacts
    blocks:
      3.8.1:
        text: 'Les artefacts suivants sont obligatoires pour la conformité à la Couche 1 :'
        items:
          - Accord d'adhésion
          - Protocole d'intégration
          - Protocole de sortie et de séparation
          - Registre des états d'adhésion
      3.8.2:
        text: 'Les artefacts de la Couche 1 DOIVENT être :'
        items:
          - Explicites et non ambigus
          - Versionnés
          - Accessibles à tous les membres
      3.8.3:
        text: L'absence, l'ambiguïté ou la violation systématique des artefacts de la Couche 1 DOIT entraîner la perte de la conformité RCOS-Core.
