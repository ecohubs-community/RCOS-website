title: 7. Capa 5 — Operaciones y Coordinación
intro: |-
  La Capa 5 define cómo funcionan en la práctica el trabajo diario, la coordinación y el flujo de información.
  Su propósito es asegurar que las operaciones se mantengan legibles, sostenibles y transferibles, y que no colapsen en jerarquías informales, dependencia o agotamiento.
sections:
  '7.1':
    title: Roles y Responsabilidades
    blocks:
      7.1.1:
        text: Todas las responsabilidades continuas DEBEN asignarse a roles explícitos y con nombre, en lugar de expectativas implícitas o acuerdos informales.
      7.1.2:
        text: 'La comunidad DEBE mantener un **Registro de Roles** que incluya, como mínimo:'
        items:
          - Nombre y propósito del rol
          - Alcance de la responsabilidad y autoridad de decisión
          - Límites explícitos e interfaces con otros roles, círculos o dominios
          - Criterios de elegibilidad (si los hay)
          - Duración del mandato, rotación o condiciones de revisión (si las hay)
          - Proceso de designación, revisión y remoción
      7.1.3:
        text: 'Cada rol DEBE incluir un mecanismo explícito de rendición de cuentas que defina:'
        items:
          - Cómo se revisa el desempeño del rol
          - Cómo se gestiona el bajo rendimiento, la sobrecarga o el fallo del rol
          - Cómo se realizan los traspasos y la transferencia de conocimiento
      7.1.4:
        text: Ninguna responsabilidad continua PUEDE existir sin un rol explícito, y ninguna persona PUEDE ser responsabilizada por obligaciones que no estén formalmente asignadas a un rol.
      7.1.5:
        text: Las responsabilidades temporales o ad-hoc DEBEN estar explícitamente acotadas en el tiempo y NO DEBEN convertirse en continuas sin una definición formal de rol.
  '7.2':
    title: Sistema de Reuniones
    blocks:
      7.2.1:
        text: 'La comunidad DEBE definir tipos de reuniones explícitos suficientes para dar soporte a:'
        items:
          - Operaciones
          - Gobernanza
          - Coordinación y alineación
          - Reflexión y aprendizaje
          - Gestión de conflictos (según lo requerido por la Capa 4)
      7.2.2:
        text: 'Cada tipo de reunión DEBE definir, como mínimo:'
        items:
          - Propósito y alcance de decisión
          - Participantes obligatorios vs opcionales
          - Cadencia y límites de duración
          - Rol de facilitación y proceso de selección o rotación
          - Estructura de la agenda
          - Requisitos de documentación y publicación
          - Requisitos de captura de decisiones cuando se toman decisiones
      7.2.3:
        text: Las reuniones NO DEBEN exceder su alcance de decisión declarado ni eludir los límites de autoridad definidos en la Capa 2.
      7.2.4:
        text: La carga de reuniones DEBE estar acotada, monitoreada y ser revisable según lo definido en la Sección 7.4.
  '7.3':
    title: Documentación y Flujo de Información
    blocks:
      7.3.1:
        text: La comunidad DEBE definir reglas explícitas de documentación para decisiones, roles, operaciones y obligaciones compartidas.
      7.3.2:
        text: 'Las reglas de documentación DEBEN especificar, como mínimo:'
        items:
          - Qué información DEBE registrarse
          - Dónde se almacenan los registros
          - Quién tiene acceso a qué registros
          - Plazos de publicación o notificación (si los hay)
          - Límites de privacidad y condiciones para el acceso restringido
      7.3.3:
        text: 'Todas las decisiones DEBEN ser trazables hasta:'
        items:
          - Tipo y dominio de la decisión
          - Rol o cuerpo autorizado
          - Mecanismo de decisión y umbral
          - Resultado registrado y fecha de entrada en vigor
      7.3.4:
        text: Los procesos operativos críticos DEBEN estar documentados de modo que la continuidad no dependa de conocimiento tácito de personas específicas.
      7.3.5:
        text: El flujo de información DEBE diseñarse para prevenir el control de acceso indebido, los cuellos de botella o la dependencia de intermediarios informales.
  '7.4':
    title: Límites de Carga de Trabajo y Capacidad
    blocks:
      7.4.1:
        text: El tiempo, la atención, la capacidad de coordinación y el trabajo emocional DEBEN tratarse como recursos finitos y limitados.
      7.4.2:
        text: 'La comunidad DEBE definir límites explícitos de carga de trabajo, incluyendo:'
        items:
          - Límites a la carga de reuniones (frecuencia, duración o tiempo total)
          - Límites a la carga de roles (número de roles, alcance u horas esperadas)
          - Expectativas de tiempos de respuesta y disponibilidad (si las hay)
          - Mecanismos de renegociación, alivio, sustitución o redistribución
      7.4.3:
        text: Los límites de carga de trabajo DEBEN ser revisables y ajustables mediante un proceso de gobernanza autorizado.
      7.4.4:
        text: La sobrecarga persistente, el riesgo de agotamiento, la no-participación crónica o la dependencia de personas que funcionan en exceso DEBEN activar procesos de revisión o reparación según lo definido en la Capa 4.
  '7.5':
    title: Continuidad Operativa
    blocks:
      7.5.1:
        text: La comunidad DEBE asegurar que ningún individuo sea un punto único de fallo crítico para las operaciones esenciales.
      7.5.2:
        text: 'Los roles y procesos operativos esenciales DEBEN incluir:'
        items:
          - Procedimientos documentados
          - Mecanismos claros de traspaso
          - Acuerdos de respaldo o redundancia cuando sea factible
      7.5.3:
        text: La planificación de continuidad operativa DEBE revisarse periódicamente.
  '7.6':
    title: Artefactos
    blocks:
      7.6.1:
        text: 'Los siguientes artefactos son obligatorios para el cumplimiento de la Capa 5:'
        items:
          - Manual de Operaciones
          - Registro de Roles
          - Plantillas de Reuniones
      7.6.2:
        text: 'Los artefactos de la Capa 5 DEBEN ser:'
        items:
          - Explícitos e inequívocos
          - Versionados
          - Accesibles para todos los miembros, con protecciones de privacidad claramente delimitadas
          - Mantenidos como documentos vivos con propiedad definida y ciclos de revisión
      7.6.3:
        text: 'El Manual de Operaciones DEBE definir, como mínimo:'
        items:
          - Procesos operativos esenciales de los que depende la comunidad
          - Interfaces entre roles, dominios y tipos de reuniones
          - Ubicaciones de la documentación y procedimientos de actualización
      7.6.4:
        text: 'Las Plantillas de Reuniones DEBEN definir, como mínimo:'
        items:
          - Estructura de la agenda
          - Formato de notas y actas
          - Formato de captura de decisiones cuando corresponda
  '7.7':
    title: Invariantes de Capa
    blocks:
      7.7.1:
        text: Las responsabilidades continuas NO DEBEN existir sin un rol explícito.
      7.7.2:
        text: Los procesos operativos críticos NO DEBEN depender exclusivamente de la memoria individual, la buena voluntad o la transmisión informal.
      7.7.3:
        text: La carga de reuniones, la carga de coordinación y el trabajo no remunerado o invisible DEBEN estar acotados y ser revisables.
      7.7.4:
        text: Las reglas de acceso a la información DEBEN ser explícitas y aplicables.
  '7.8':
    title: Reglas de Explicitud
    blocks:
      7.8.1:
        text: 'Lo siguiente DEBE ser explícito:'
        items:
          - Roles y responsabilidades
          - Límites e interfaces de autoridad operativa
          - Tipos y alcances de reuniones
          - Reglas de documentación de decisiones
          - Límites de acceso a la información y privacidad
      7.8.2:
        text: 'Lo siguiente PUEDE ser explícito:'
        items:
          - Cadencia detallada de reuniones más allá de las restricciones mínimas
          - Elección de herramientas para documentación y coordinación
          - Calendarios de rotación o sucesión de roles
      7.8.3:
        text: 'Lo siguiente DEBE permanecer opcional y fuera de alcance:'
        items:
          - Estilos de trabajo personales
          - Preferencias estéticas o culturales
          - Coordinación social informal
