lang: fr
sourceHash: 83b0e832
title: 5. Couche 3 — Système économique et de ressources
intro: |-
  La Couche 3 définit comment la valeur, les ressources et les obligations circulent au sein de la communauté.  
  Son objectif est de rendre le pouvoir économique explicite, encadré, vérifiable et subordonné à la gouvernance, en empêchant l'accumulation cachée, la dépendance ou la coercition.
sections:
  '5.1':
    title: Ressources communes vs privées
    blocks:
      5.1.1:
        text: Toutes les ressources comprises dans le périmètre gouverné déclaré DOIVENT être explicitement classifiées comme **communes** ou **privées**.
      5.1.2:
        text: 'La communauté DOIT maintenir un registre unique, explicite et versionné des ressources gouvernées, incluant au minimum :'
        items:
          - 'Nom ou identifiant unique de la ressource  '
          - 'Classification (commune ou privée)  '
          - 'Intendant ou propriétaire (selon le cas)  '
          - 'Règles d''accès et d''utilisation  '
          - Contraintes de transfert, de vente ou de privatisation (le cas échéant)
      5.1.3:
        text: Toute ressource non explicitement classifiée DOIT être traitée comme **non classifiée**, et la communauté NE DOIT PAS l'allouer, la grever, la monétiser ou la transférer tant que la classification n'a pas été effectuée par une décision autorisée.
      5.1.4:
        text: 'Pour les ressources communes, la communauté DOIT définir explicitement :'
        items:
          - 'Les responsabilités d''intendance  '
          - 'L''organe ou le rôle décisionnel autorisé  '
          - 'Les obligations de maintenance  '
          - Les mécanismes de financement ou de contribution (le cas échéant)
      5.1.5:
        text: Pour les ressources privées, la communauté NE DOIT PAS exercer d'autorité au-delà de ce qui est explicitement déclaré dans le périmètre, les accords d'adhésion ou les autres artefacts gouvernés.
  '5.2':
    title: Reconnaissance des contributions
    blocks:
      5.2.1:
        text: 'La communauté DOIT définir explicitement quelles catégories de contributions sont reconnues. Celles-ci PEUVENT inclure, sans s''y limiter :'
        items:
          - 'Le travail  '
          - 'Le soin et le travail émotionnel  '
          - 'Le savoir et l''éducation  '
          - 'L''intendance et la maintenance  '
          - 'Le travail administratif ou de coordination  '
      5.2.2:
        text: 'La communauté DOIT définir un mécanisme de reconnaissance des contributions spécifiant :'
        items:
          - 'Ce qui constitue une contribution  '
          - 'Comment les contributions sont enregistrées ou reconnues  '
          - 'Qui peut enregistrer, valider ou contester des contributions  '
          - 'Si et comment la reconnaissance des contributions affecte l''accès aux ressources, privilèges ou obligations  '
      5.2.3:
        text: La communauté NE DOIT PAS dépendre structurellement d'un travail non rémunéré, invisible ou informel pour la survie du système sans définir explicitement les obligations, la reconnaissance ou les mécanismes de compensation correspondants.
      5.2.4:
        text: 'Si des unités économiques internes sont utilisées (par ex. crédits-temps, points, jetons), le Protocole d''Économie Interne DOIT définir :'
        items:
          - 'Les règles d''émission  '
          - 'Les règles de transférabilité  '
          - 'Les mécanismes d''expiration, de décroissance ou de plafonnement (le cas échéant)  '
          - 'Les mécanismes de prévention de la fraude, de traitement des litiges et de correction  '
          - 'Les règles de confidentialité et de transparence pour les soldes et les transactions  '
      5.2.5:
        text: La reconnaissance des contributions NE DOIT PAS créer d'autorité décisionnelle implicite, de droit de veto ou d'influence sur la gouvernance au-delà de ce qui est défini dans la Couche 2.
  '5.3':
    title: Gestion de la trésorerie
    blocks:
      5.3.1:
        text: La communauté DOIT définir explicitement quelles ressources sont détenues dans la trésorerie partagée et comment les frontières de la trésorerie s'articulent avec les ressources privées.
      5.3.2:
        text: Les sources de revenus et toute interface de revenus externes DOIVENT être explicitement définies.
      5.3.3:
        text: 'L''autorité de dépense DOIT être explicitement encadrée par :'
        items:
          - 'Des attributions d''autorité claires  '
          - 'Des seuils par montant et/ou catégorie  '
          - 'Des parcours d''approbation et d''escalade  '
          - 'Des exigences obligatoires de tenue de registres  '
      5.3.4:
        text: La transparence DOIT être la règle par défaut pour les soldes de trésorerie, les entrées, les sorties, les obligations et les engagements.
      5.3.5:
        text: Toute exception à la transparence DOIT être explicitement définie, justifiée, limitée dans le temps, et NE DOIT PAS empêcher les membres de vérifier la conformité.
      5.3.6:
        text: 'La communauté DOIT définir des politiques de réserve, de risque et de responsabilité, incluant :'
        items:
          - 'Les limites d''endettement  '
          - 'Les obligations à long terme  '
          - Les réserves de contingence (le cas échéant)
  '5.4':
    title: Contraintes d'accumulation
    blocks:
      5.4.1:
        text: Les systèmes économiques internes DOIVENT empêcher la concentration illimitée d'influence ou de contrôle interne par le biais de ressources, de crédits ou d'obligations financières.
      5.4.2:
        text: 'Si des unités internes existent, la communauté DOIT définir un ou plusieurs mécanismes de limitation de l''accumulation, qui PEUVENT inclure :'
        items:
          - 'Des plafonds  '
          - 'La décroissance ou l''expiration  '
          - 'La non-transférabilité  '
          - 'Des mécanismes de redistribution ou de taxation  '
          - 'Une validité limitée dans le temps  '
      5.4.3:
        text: Les mécanismes économiques NE DOIVENT PAS permettre aux membres de contourner les limites d'autorité de gouvernance définies dans la Couche 2, y compris par l'achat d'influence, la création de dépendance ou la conversion du pouvoir économique en autorité décisionnelle informelle.
      5.4.4:
        text: La communauté DOIT définir des indicateurs vérifiables de risque de concentration économique et un mécanisme explicite pour ajuster les contraintes lorsque de tels risques sont détectés.
  '5.5':
    title: Artefacts
    blocks:
      5.5.1:
        text: 'Les artefacts suivants sont obligatoires pour la conformité à la Couche 3 :'
        items:
          - 'Protocole d''Économie Interne  '
          - 'Règlement de Trésorerie  '
      5.5.2:
        text: 'Les artefacts de la Couche 3 DOIVENT être :'
        items:
          - 'Explicites et sans ambiguïté  '
          - 'Versionnés  '
          - 'Accessibles à tous les membres (avec des exceptions explicites et encadrées)  '
          - 'Adoptés par un processus de gouvernance autorisé  '
      5.5.3:
        text: 'Le Protocole d''Économie Interne DOIT définir, au minimum :'
        items:
          - 'Les catégories de contributions et les mécanismes de reconnaissance  '
          - 'Les frontières entre commun et privé et les règles d''allocation  '
          - 'Les unités internes (le cas échéant) et les contraintes d''accumulation  '
          - 'Les interfaces de revenus externes (le cas échéant)  '
          - 'Les mécanismes de résolution des litiges et de correction des registres économiques  '
      5.5.4:
        text: 'Le Règlement de Trésorerie DOIT définir, au minimum :'
        items:
          - 'Les sources de revenus  '
          - 'Les seuils d''autorité de dépense et les parcours d''approbation  '
          - 'Les exigences de transparence et de reporting (y compris les exceptions encadrées)  '
          - 'Les contraintes de réserve, de risque et d''endettement  '
          - 'Les règles relatives aux conflits d''intérêts pour les dépenses et les approvisionnements  '
  '5.6':
    title: Invariants de couche
    blocks:
      5.6.1:
        text: Les ressources partagées, les flux et les obligations DOIVENT être visibles par la communauté par défaut, avec uniquement des exceptions limitées et explicites.
      5.6.2:
        text: Les ressources déclarées comme communes NE DOIVENT PAS être privatisées par une action informelle, implicite ou unilatérale.
      5.6.3:
        text: La reconnaissance des contributions DOIT être explicite de sorte que le travail non rémunéré ou invisible ne soit pas structurellement requis pour la survie du système.
      5.6.4:
        text: Les mécanismes économiques DOIVENT empêcher la concentration indéfinie d'influence interne.
  '5.7':
    title: Règles d'explicitation
    blocks:
      5.7.1:
        text: 'Les éléments suivants DOIVENT être explicites :'
        items:
          - 'Les classifications commun vs privé  '
          - 'Les règles d''allocation et d''accès aux ressources partagées  '
          - 'Les limites d''autorité de dépense  '
          - 'Les règles de transparence  '
          - 'Les interfaces de revenus externes  '
      5.7.2:
        text: 'Les éléments suivants PEUVENT être explicites :'
        items:
          - 'Les modèles de valorisation des contributions  '
          - 'Les unités internes (jetons, heures, points)  '
          - 'Les catégories budgétaires et les structures comptables internes  '
      5.7.3:
        text: 'Les éléments suivants DOIVENT rester optionnels et hors périmètre :'
        items:
          - 'Les attitudes envers la richesse  '
          - 'Les résultats égalitaires vs différenciés  '
          - Les choix financiers personnels
