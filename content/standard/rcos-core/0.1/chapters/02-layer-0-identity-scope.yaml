kind: chapter
legacyPath: rcos-core/v0-1/02-layer-0-identity-scope
id: 9bef9a3f
title: 2. Layer 0 — Identity & Scope
parentId: e6de7a5d
order: 20
intro: Layer 0 defines the constitutional identity of the community. It establishes what the community *is*, what it *is not*, and the non-negotiable constraints under which all other layers operate. No rule, decision, or practice in higher layers may contradict Layer 0.
sections:
  - id: '2.1'
    ref: '2.1'
    title: Purpose Definition
    blocks:
      - id: 2.1.1
        kind: clause
        ref: 2.1.1
        text: A community MUST define exactly one primary purpose.
      - id: 2.1.2
        kind: clause
        ref: 2.1.2
        text: The primary purpose MUST describe the enduring reason for the community’s existence and MUST NOT be a short-term goal, project, or strategy.
      - id: 2.1.3
        kind: clause
        ref: 2.1.3
        text: The primary purpose MUST be stable across time and MUST only be changed through a constitutional decision as defined in Layer 2 and executed via the change process defined in Layer 6.
      - id: 2.1.4
        kind: clause
        ref: 2.1.4
        text: Secondary purposes MAY be defined, but MUST NOT conflict with or override the primary purpose.
      - id: 2.1.5
        kind: clause
        ref: 2.1.5
        text: No action, decision, or allocation of resources MAY materially contradict the stated primary purpose.
  - id: '2.2'
    ref: '2.2'
    title: Scope Declaration
    blocks:
      - id: 2.2.1
        kind: clause
        ref: 2.2.1
        text: The community MUST explicitly declare the scope of what it governs.
      - id: 2.2.2
        kind: clause
        ref: 2.2.2
        text: 'The scope declaration MUST include, at minimum:'
        items:
          - Assets governed by the community
          - Domains of decision-making authority
          - Activities and responsibilities under collective control
      - id: 2.2.3
        kind: clause
        ref: 2.2.3
        text: The scope declaration MUST explicitly list what is out of scope.
      - id: 2.2.4
        kind: clause
        ref: 2.2.4
        text: Anything not explicitly declared as in scope MUST be treated as out of scope.
      - id: 2.2.5
        kind: clause
        ref: 2.2.5
        text: The community MUST NOT exercise authority over persons, assets, or domains that are declared out of scope.
  - id: '2.3'
    ref: '2.3'
    title: Invariants
    blocks:
      - id: 2.3.1
        kind: clause
        ref: 2.3.1
        text: Invariants are constraints that define what MUST NOT be violated while they are in force.
      - id: 2.3.2
        kind: clause
        ref: 2.3.2
        text: Invariants MUST be explicitly listed and documented.
      - id: 2.3.3
        kind: clause
        ref: 2.3.3
        text: Invariants MUST apply across all layers of RCOS.
      - id: 2.3.4
        kind: clause
        ref: 2.3.4
        text: No decision, role, process, or emergency measure MAY override an invariant.
      - id: 2.3.5
        kind: clause
        ref: 2.3.5
        text: If a conflict arises between an invariant and any other rule, the invariant MUST prevail.
      - id: 2.3.6
        kind: clause
        ref: 2.3.6
        text: Invariants MAY only be changed or removed through a constitutional change process as defined in Layer 2 and Layer 6.
  - id: '2.4'
    ref: '2.4'
    title: Identity Constraints
    blocks:
      - id: 2.4.1
        kind: clause
        ref: 2.4.1
        text: The community MUST declare any identity-level constraints that materially affect participation, behavior, or governance.
      - id: 2.4.2
        kind: clause
        ref: 2.4.2
        text: 'Identity constraints MAY include, but are not limited to:'
        items:
          - Ethical or behavioral boundaries
          - Participation prerequisites
          - Non-negotiable cultural or ecological constraints
      - id: 2.4.3
        kind: clause
        ref: 2.4.3
        text: Identity constraints MUST be testable and enforceable through defined processes.
      - id: 2.4.4
        kind: clause
        ref: 2.4.4
        text: Identity constraints MUST NOT be enforced implicitly or informally.
  - id: '2.5'
    ref: '2.5'
    title: Artifacts
    blocks:
      - id: 2.5.1
        kind: clause
        ref: 2.5.1
        text: 'The following artifacts are mandatory for Layer 0 compliance:'
        items:
          - Purpose Charter
          - Scope Declaration
          - Invariants Register
          - Identity Constraints Register
      - id: 2.5.2
        kind: clause
        ref: 2.5.2
        text: 'Layer 0 artifacts MUST be:'
        items:
          - Publicly accessible to all members
          - Versioned
          - Adopted through a formal ratification process
      - id: 2.5.3
        kind: clause
        ref: 2.5.3
        text: If Layer 0 artifacts are missing, ambiguous, or internally contradictory, the community MUST be considered non-compliant with RCOS-Core.
