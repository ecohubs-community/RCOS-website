lang: pt-br
sourceHash: 'eb931554'
title: 2. Camada 0 — Identidade e Escopo
intro: A Camada 0 define a identidade constitucional da comunidade. Ela estabelece o que a comunidade *é*, o que *não é* e as restrições inegociáveis sob as quais todas as outras camadas operam. Nenhuma regra, decisão ou prática nas camadas superiores pode contradizer a Camada 0.
sections:
  '2.1':
    title: Definição de Propósito
    blocks:
      2.1.1:
        text: Uma comunidade DEVE definir exatamente um propósito primário.
      2.1.2:
        text: O propósito primário DEVE descrever a razão duradoura da existência da comunidade e NÃO DEVE ser uma meta, projeto ou estratégia de curto prazo.
      2.1.3:
        text: O propósito primário DEVE ser estável ao longo do tempo e só DEVE ser alterado por meio de uma decisão constitucional conforme definido na Camada 2 e executada pelo processo de mudança definido na Camada 6.
      2.1.4:
        text: Propósitos secundários PODEM ser definidos, mas NÃO DEVEM conflitar com nem sobrepor-se ao propósito primário.
      2.1.5:
        text: Nenhuma ação, decisão ou alocação de recursos PODE contradizer materialmente o propósito primário declarado.
  '2.2':
    title: Declaração de Escopo
    blocks:
      2.2.1:
        text: A comunidade DEVE declarar explicitamente o escopo daquilo que governa.
      2.2.2:
        text: 'A declaração de escopo DEVE incluir, no mínimo:'
        items:
          - Ativos governados pela comunidade
          - Domínios de autoridade decisória
          - Atividades e responsabilidades sob controle coletivo
      2.2.3:
        text: A declaração de escopo DEVE listar explicitamente o que está fora do escopo.
      2.2.4:
        text: Qualquer coisa que não seja explicitamente declarada como dentro do escopo DEVE ser tratada como fora do escopo.
      2.2.5:
        text: A comunidade NÃO DEVE exercer autoridade sobre pessoas, ativos ou domínios declarados como fora do escopo.
  '2.3':
    title: Invariantes
    blocks:
      2.3.1:
        text: Invariantes são restrições que definem o que NÃO DEVE ser violado enquanto estiverem em vigor.
      2.3.2:
        text: Invariantes DEVEM ser listadas e documentadas explicitamente.
      2.3.3:
        text: Invariantes DEVEM se aplicar a todas as camadas do RCOS.
      2.3.4:
        text: Nenhuma decisão, papel, processo ou medida de emergência PODE sobrepor-se a uma invariante.
      2.3.5:
        text: Se surgir um conflito entre uma invariante e qualquer outra regra, a invariante DEVE prevalecer.
      2.3.6:
        text: Invariantes só PODEM ser alteradas ou removidas por meio de um processo de mudança constitucional conforme definido na Camada 2 e na Camada 6.
  '2.4':
    title: Restrições de Identidade
    blocks:
      2.4.1:
        text: A comunidade DEVE declarar quaisquer restrições no nível da identidade que afetem materialmente a participação, o comportamento ou a governança.
      2.4.2:
        text: 'Restrições de identidade PODEM incluir, entre outras:'
        items:
          - Limites éticos ou comportamentais
          - Pré-requisitos para participação
          - Restrições culturais ou ecológicas inegociáveis
      2.4.3:
        text: Restrições de identidade DEVEM ser testáveis e aplicáveis por meio de processos definidos.
      2.4.4:
        text: Restrições de identidade NÃO DEVEM ser aplicadas de forma implícita ou informal.
  '2.5':
    title: Artefatos
    blocks:
      2.5.1:
        text: 'Os seguintes artefatos são obrigatórios para conformidade com a Camada 0:'
        items:
          - Carta de Propósito
          - Declaração de Escopo
          - Registro de Invariantes
          - Registro de Restrições de Identidade
      2.5.2:
        text: 'Os artefatos da Camada 0 DEVEM ser:'
        items:
          - Publicamente acessíveis a todos os membros
          - Versionados
          - Adotados por meio de um processo formal de ratificação
      2.5.3:
        text: Se os artefatos da Camada 0 estiverem ausentes, ambíguos ou internamente contraditórios, a comunidade DEVE ser considerada não conforme com o RCOS-Core.
