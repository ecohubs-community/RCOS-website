lang: de
sourceHash: 'f191e042'
title: 10. Compliance & Auditing
intro: Dieses Kapitel definiert, wie RCOS-Core-Compliance bewertet und aufrechterhalten wird.
sections:
  '10.1':
    title: Compliance-Checkliste
    blocks:
      10.1.1:
        text: 'RCOS-Core-Compliance ist binär: Eine Gemeinschaft ist entweder compliant oder non-compliant.'
      10.1.2:
        text: Compliance MUSS pro Layer (Schicht 0–6) bewertet werden.
      10.1.3:
        text: 'Für jeden Layer MUSS die Compliance-Checkliste überprüfen:'
        items:
          - 'Vorhandensein verbindlicher Artefakte  '
          - 'Explizitheit und Zugänglichkeit der erforderlichen Regeln  '
          - 'Verabschiedung durch autorisierte Governance-Prozesse  '
      10.1.4:
        text: Teilweise Compliance oder „Absicht zur Compliance" DARF NICHT als compliant betrachtet werden.
      10.1.5:
        text: Optionale Module DARF NICHT in die RCOS-Core-Compliance-Bewertung einbezogen werden.
  '10.2':
    title: Testfälle
    blocks:
      10.2.1:
        text: Testfälle sind strukturierte Szenarien, mit denen überprüft wird, ob RCOS-Mechanismen wie beabsichtigt funktionieren.
      10.2.2:
        text: 'Testfälle KANN sein:'
        items:
          - 'Hypothetische Szenarien  '
          - 'Historische Gemeinschafts-Fehlschläge  '
          - 'Simulierte Stresstests  '
      10.2.3:
        text: 'Testfälle SOLLTE mindestens abdecken:'
        items:
          - 'Versuche der Machtkonzentration  '
          - 'Austritts- und Trennungsszenarien  '
          - 'Governance-Deadlock  '
          - 'Versuche wirtschaftlicher Vereinnahmung  '
          - 'Sicherheitskritische Konflikte  '
      10.2.4:
        text: Testfälle sind informativ, SOLLTE aber bei Audits, Onboarding und regelmäßigen Überprüfungen eingesetzt werden.
  '10.3':
    title: Non-Compliance
    blocks:
      10.3.1:
        text: 'Eine Gemeinschaft MUSS als non-compliant betrachtet werden, wenn:'
        items:
          - 'Ein verbindliches Artefakt fehlt  '
          - 'Layer-0-Invarianten verletzt werden  '
          - 'Entscheidungen wiederholt außerhalb autorisierter Governance-Strukturen getroffen werden  '
          - 'Der Austritt blockiert oder informell eingeschränkt wird  '
      10.3.2:
        text: Non-Compliance MUSS nach Feststellung ausdrücklich anerkannt werden.
      10.3.3:
        text: 'Eine Gemeinschaft KANN Compliance nur wiedererlangen durch:'
        items:
          - 'Korrekturmaßnahmen  '
          - 'Formale Verabschiedung fehlender oder korrigierter Artefakte  '
          - 'Dokumentation der Behebung  '
      10.3.4:
        text: Ansprüche auf RCOS-Compliance MUSS während Zeiträumen bekannter Non-Compliance zurückgezogen werden.
