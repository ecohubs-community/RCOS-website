lang: de
sourceHash: '6e9b980e'
title: 7. Schicht 5 — Betrieb & Koordination
intro: |-
  Schicht 5 definiert, wie tägliche Arbeit, Koordination und Informationsfluss in der Praxis funktionieren.  
  Sein Zweck ist sicherzustellen, dass der Betrieb nachvollziehbar, nachhaltig und übertragbar bleibt und nicht in informelle Hierarchie, Abhängigkeit oder Burnout abgleitet.
sections:
  '7.1':
    title: Rollen und Verantwortlichkeiten
    blocks:
      7.1.1:
        text: Alle laufenden Verantwortlichkeiten MUSS expliziten, benannten Rollen zugewiesen werden — nicht impliziten Erwartungen oder informellen Absprachen.
      7.1.2:
        text: 'Die Gemeinschaft MUSS ein **Rollenregister** führen, das mindestens Folgendes enthält:'
        items:
          - 'Rollenname und Zweck  '
          - 'Umfang der Verantwortung und Entscheidungsbefugnis  '
          - 'Explizite Abgrenzungen und Schnittstellen zu anderen Rollen, Kreisen oder Bereichen  '
          - 'Eignungskriterien (falls vorhanden)  '
          - 'Amtszeit, Rotation oder Überprüfungsbedingungen (falls vorhanden)  '
          - 'Ernennungs-, Überprüfungs- und Abberufungsverfahren  '
      7.1.3:
        text: 'Jede Rolle MUSS einen expliziten Rechenschaftsmechanismus beinhalten, der Folgendes definiert:'
        items:
          - 'Wie die Rollenerfüllung überprüft wird  '
          - 'Wie mit mangelhafter Leistung, Überlastung oder Rollenversagen umgegangen wird  '
          - 'Wie Übergabe und Wissenstransfer erfolgen  '
      7.1.4:
        text: Keine laufende Verantwortlichkeit KANN ohne eine explizite Rolle bestehen, und keine Person KANN für Verantwortlichkeiten zur Rechenschaft gezogen werden, die nicht formal einer Rolle zugewiesen sind.
      7.1.5:
        text: Temporäre oder Ad-hoc-Verantwortlichkeiten MUSS explizit zeitlich begrenzt sein und DARF NICHT ohne formale Rollendefinition dauerhaft werden.
  '7.2':
    title: Sitzungssystem
    blocks:
      7.2.1:
        text: 'Die Gemeinschaft MUSS explizite Sitzungstypen definieren, die ausreichen, um Folgendes zu unterstützen:'
        items:
          - 'Betrieb  '
          - 'Governance  '
          - 'Koordination und Abstimmung  '
          - 'Reflexion und Lernen  '
          - Konfliktbearbeitung (wie von Schicht 4 gefordert)
      7.2.2:
        text: 'Jeder Sitzungstyp MUSS mindestens Folgendes definieren:'
        items:
          - 'Zweck und Entscheidungsumfang  '
          - 'Erforderliche vs. optionale Teilnehmende  '
          - 'Kadenz und zeitliche Begrenzungen  '
          - 'Moderationsrolle und Auswahl- oder Rotationsverfahren  '
          - 'Tagesordnungsstruktur  '
          - 'Dokumentations- und Veröffentlichungsanforderungen  '
          - 'Anforderungen an die Entscheidungserfassung, wo Entscheidungen getroffen werden  '
      7.2.3:
        text: Sitzungen DARF NICHT ihren erklärten Entscheidungsumfang überschreiten oder die in Schicht 2 definierten Autoritätsgrenzen umgehen.
      7.2.4:
        text: Die Sitzungsbelastung MUSS begrenzt, überwacht und überprüfbar sein, wie in Abschnitt 7.4 definiert.
  '7.3':
    title: Dokumentation und Informationsfluss
    blocks:
      7.3.1:
        text: Die Gemeinschaft MUSS explizite Dokumentationsregeln für Entscheidungen, Rollen, Betriebsabläufe und gemeinsame Pflichten definieren.
      7.3.2:
        text: 'Dokumentationsregeln MUSS mindestens Folgendes festlegen:'
        items:
          - 'Welche Informationen aufgezeichnet werden MUSS  '
          - 'Wo Aufzeichnungen gespeichert werden  '
          - 'Wer Zugang zu welchen Aufzeichnungen hat  '
          - 'Veröffentlichungs- oder Benachrichtigungsfristen (falls vorhanden)  '
          - 'Datenschutzgrenzen und Bedingungen für eingeschränkten Zugang  '
      7.3.3:
        text: 'Alle Entscheidungen MUSS rückverfolgbar sein auf:'
        items:
          - 'Entscheidungstyp und Bereich  '
          - 'Autorisierte Rolle oder Gremium  '
          - 'Entscheidungsmechanismus und Schwellenwert  '
          - 'Erfasstes Ergebnis und Inkrafttreten  '
      7.3.4:
        text: Kritische Betriebsprozesse MUSS so dokumentiert sein, dass die Kontinuität nicht von implizitem Wissen einzelner Personen abhängt.
      7.3.5:
        text: Der Informationsfluss MUSS so gestaltet sein, dass Gatekeeping, Engpässe oder Abhängigkeit von informellen Vermittlern verhindert werden.
  '7.4':
    title: Arbeitsbelastung und Kapazitätsgrenzen
    blocks:
      7.4.1:
        text: Zeit, Aufmerksamkeit, Koordinationskapazität und emotionale Arbeit MUSS als endliche und begrenzte Ressourcen behandelt werden.
      7.4.2:
        text: 'Die Gemeinschaft MUSS explizite Belastungsgrenzen definieren, darunter:'
        items:
          - 'Begrenzungen der Sitzungsbelastung (Häufigkeit, Dauer oder Gesamtzeit)  '
          - 'Begrenzungen der Rollenbelastung (Anzahl der Rollen, Umfang oder erwartete Stunden)  '
          - 'Erwartungen an Reaktionszeiten und Verfügbarkeit (falls vorhanden)  '
          - 'Mechanismen für Neuverhandlung, Entlastung, Vertretung oder Umverteilung  '
      7.4.3:
        text: Belastungsgrenzen MUSS durch einen autorisierten Governance-Prozess überprüfbar und anpassbar sein.
      7.4.4:
        text: Anhaltende Überlastung, Burnout-Risiko, chronische Nicht-Teilnahme oder Abhängigkeit von übermäßig engagierten Einzelpersonen MUSS Überprüfungs- oder Reparaturprozesse auslösen, wie in Schicht 4 definiert.
  '7.5':
    title: Betriebskontinuität
    blocks:
      7.5.1:
        text: Die Gemeinschaft MUSS sicherstellen, dass keine einzelne Person ein kritischer Single Point of Failure für den Kernbetrieb ist.
      7.5.2:
        text: 'Zentrale Betriebsrollen und -prozesse MUSS Folgendes beinhalten:'
        items:
          - 'Dokumentierte Verfahren  '
          - 'Klare Übergabemechanismen  '
          - 'Backup- oder Redundanzregelungen, wo machbar  '
      7.5.3:
        text: Die Planung der Betriebskontinuität MUSS regelmäßig überprüft werden.
  '7.6':
    title: Artefakte
    blocks:
      7.6.1:
        text: 'Die folgenden Artefakte sind für die Konformität mit Schicht 5 verpflichtend:'
        items:
          - 'Betriebshandbuch  '
          - 'Rollenregister  '
          - 'Sitzungsvorlagen  '
      7.6.2:
        text: 'Artefakte von Schicht 5 MUSS:'
        items:
          - 'Explizit und eindeutig sein  '
          - 'Versioniert sein  '
          - 'Für alle Mitglieder zugänglich sein, mit klar begrenztem Datenschutz  '
          - 'Als lebende Dokumente mit definierter Zuständigkeit und Überprüfungszyklen gepflegt werden  '
      7.6.3:
        text: 'Das Betriebshandbuch MUSS mindestens Folgendes definieren:'
        items:
          - 'Zentrale Betriebsprozesse, auf die sich die Gemeinschaft stützt  '
          - 'Schnittstellen zwischen Rollen, Bereichen und Sitzungstypen  '
          - 'Dokumentationsstandorte und Aktualisierungsverfahren  '
      7.6.4:
        text: 'Sitzungsvorlagen MUSS mindestens Folgendes definieren:'
        items:
          - 'Tagesordnungsstruktur  '
          - 'Protokoll- und Aufzeichnungsformat  '
          - 'Entscheidungserfassungsformat, wo zutreffend  '
  '7.7':
    title: Layer-Invarianten
    blocks:
      7.7.1:
        text: Laufende Verantwortlichkeiten DARF NICHT ohne eine explizite Rolle bestehen.
      7.7.2:
        text: Kritische Betriebsprozesse DARF NICHT ausschließlich auf individuellem Gedächtnis, gutem Willen oder informeller Weitergabe beruhen.
      7.7.3:
        text: Sitzungsbelastung, Koordinationsaufwand und unbezahlte oder unsichtbare Arbeit MUSS begrenzt und überprüfbar sein.
      7.7.4:
        text: Regeln für den Informationszugang MUSS explizit und durchsetzbar sein.
  '7.8':
    title: Explizierungsregeln
    blocks:
      7.8.1:
        text: 'Folgendes MUSS explizit sein:'
        items:
          - 'Rollen und Verantwortlichkeiten  '
          - 'Betriebliche Autoritätsgrenzen und Schnittstellen  '
          - 'Sitzungstypen und -umfänge  '
          - 'Regeln zur Entscheidungsdokumentation  '
          - 'Informationszugang und Datenschutzgrenzen  '
      7.8.2:
        text: 'Folgendes KANN explizit sein:'
        items:
          - 'Detaillierte Sitzungskadenz über die Mindestanforderungen hinaus  '
          - 'Tooling-Entscheidungen für Dokumentation und Koordination  '
          - 'Rotations- oder Nachfolgepläne für Rollen  '
      7.8.3:
        text: 'Folgendes MUSS optional und außerhalb des Geltungsbereichs bleiben:'
        items:
          - 'Persönliche Arbeitsstile  '
          - 'Ästhetische oder kulturelle Präferenzen  '
          - Informelle soziale Koordination
