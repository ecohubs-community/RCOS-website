lang: de
sourceHash: 7958d064
title: 11. Versionierung & Governance des Standards
intro: Dieses Kapitel definiert, wie sich RCOS selbst als Standard weiterentwickelt.
sections:
  '11.1':
    title: Standardverwaltung
    blocks:
      11.1.1:
        text: RCOS MUSS über eine identifizierbare verwaltende Stelle oder einen verwaltenden Prozess verfügen.
      11.1.2:
        text: 'Die Verantwortlichkeiten der Verwaltung MUSS umfassen:'
        items:
          - 'Pflege der kanonischen Spezifikation  '
          - 'Verwaltung von Versionsfreigaben  '
          - 'Kuratierung von Referenzmaterialien und Lernressourcen  '
          - 'Schutz der Layer-0-Invarianten des Standards selbst  '
      11.1.3:
        text: Die Verwaltung DARF NICHT als Durchsetzungsinstanz gegenüber Gemeinschaften agieren.
      11.1.4:
        text: Die RCOS-Verwaltung MUSS Klarheit, Stabilität und Erkenntnisse aus der Praxis über ideologische Reinheit stellen.
  '11.2':
    title: Änderungsprozess
    blocks:
      11.2.1:
        text: Änderungen an RCOS-Core MUSS einem definierten Änderungsprozess folgen.
      11.2.2:
        text: 'Der Änderungsprozess MUSS umfassen:'
        items:
          - 'Einreichung von Vorschlägen  '
          - 'Öffentliche Prüfungs- und Feedbackphase  '
          - 'Entscheidungsmechanismus und -befugnis  '
          - 'Versionierung und Veröffentlichung  '
      11.2.3:
        text: Abwärtskompatibilität SOLLTE nach Möglichkeit gewahrt werden.
      11.2.4:
        text: Nicht abwärtskompatible Änderungen MUSS klar gekennzeichnet und begründet werden.
      11.2.5:
        text: Abgelöste Versionen von RCOS MUSS öffentlich zugänglich bleiben.
      11.2.6:
        text: 'RCOS selbst MUSS dieselben Prinzipien vorleben, die es von Gemeinschaften verlangt: Explizitheit, begrenzte Befugnisse, Umkehrbarkeit und Lernbereitschaft.'
