lang: de
sourceHash: 'eb931554'
title: 2. Schicht 0 — Identität & Geltungsbereich
intro: Schicht 0 definiert die konstitutionelle Identität der Gemeinschaft. Er legt fest, was die Gemeinschaft *ist*, was sie *nicht ist*, und die nicht verhandelbaren Einschränkungen, unter denen alle anderen Layer operieren. Keine Regel, Entscheidung oder Praxis in höheren Layern darf Schicht 0 widersprechen.
sections:
  '2.1':
    title: Zweckdefinition
    blocks:
      2.1.1:
        text: Eine Gemeinschaft MUSS genau einen primären Zweck definieren.
      2.1.2:
        text: Der primäre Zweck MUSS den dauerhaften Grund für die Existenz der Gemeinschaft beschreiben und DARF NICHT ein kurzfristiges Ziel, Projekt oder eine Strategie sein.
      2.1.3:
        text: Der primäre Zweck MUSS über die Zeit stabil sein und MUSS nur durch eine konstitutionelle Entscheidung gemäß Schicht 2 und über den in Schicht 6 definierten Änderungsprozess geändert werden.
      2.1.4:
        text: Sekundäre Zwecke KANN definiert werden, DARF NICHT jedoch dem primären Zweck widersprechen oder ihn außer Kraft setzen.
      2.1.5:
        text: Keine Handlung, Entscheidung oder Ressourcenzuweisung KANN dem erklärten primären Zweck materiell widersprechen.
  '2.2':
    title: Geltungsbereichserklärung
    blocks:
      2.2.1:
        text: Die Gemeinschaft MUSS den Geltungsbereich dessen, was sie regiert, explizit erklären.
      2.2.2:
        text: 'Die Geltungsbereichserklärung MUSS mindestens Folgendes umfassen:'
        items:
          - Von der Gemeinschaft verwaltete Vermögenswerte
          - Bereiche der Entscheidungsbefugnis
          - Aktivitäten und Verantwortlichkeiten unter kollektiver Kontrolle
      2.2.3:
        text: Die Geltungsbereichserklärung MUSS explizit auflisten, was außerhalb des Geltungsbereichs liegt.
      2.2.4:
        text: Alles, was nicht explizit als innerhalb des Geltungsbereichs erklärt ist, MUSS als außerhalb des Geltungsbereichs behandelt werden.
      2.2.5:
        text: Die Gemeinschaft DARF NICHT Autorität über Personen, Vermögenswerte oder Bereiche ausüben, die als außerhalb des Geltungsbereichs erklärt sind.
  '2.3':
    title: Invarianten
    blocks:
      2.3.1:
        text: Invarianten sind Einschränkungen, die definieren, was DARF NICHT verletzt werden darf, solange sie in Kraft sind.
      2.3.2:
        text: Invarianten MUSS explizit aufgelistet und dokumentiert sein.
      2.3.3:
        text: Invarianten MUSS über alle Layer von RCOS hinweg gelten.
      2.3.4:
        text: Keine Entscheidung, Rolle, kein Prozess und keine Notfallmaßnahme KANN eine Invariante außer Kraft setzen.
      2.3.5:
        text: Wenn ein Konflikt zwischen einer Invariante und einer anderen Regel entsteht, MUSS die Invariante Vorrang haben.
      2.3.6:
        text: Invarianten KANN nur durch einen konstitutionellen Änderungsprozess gemäß Schicht 2 und Schicht 6 geändert oder entfernt werden.
  '2.4':
    title: Identitätseinschränkungen
    blocks:
      2.4.1:
        text: Die Gemeinschaft MUSS alle Einschränkungen auf Identitätsebene erklären, die Teilnahme, Verhalten oder Governance wesentlich beeinflussen.
      2.4.2:
        text: 'Identitätseinschränkungen KANN unter anderem Folgendes umfassen:'
        items:
          - Ethische oder verhaltensbezogene Grenzen
          - Teilnahmevoraussetzungen
          - Nicht verhandelbare kulturelle oder ökologische Einschränkungen
      2.4.3:
        text: Identitätseinschränkungen MUSS überprüfbar und durch definierte Prozesse durchsetzbar sein.
      2.4.4:
        text: Identitätseinschränkungen DARF NICHT implizit oder informell durchgesetzt werden.
  '2.5':
    title: Artefakte
    blocks:
      2.5.1:
        text: 'Die folgenden Artefakte sind für die Konformität mit Schicht 0 verpflichtend:'
        items:
          - Zweck-Charta
          - Geltungsbereichserklärung
          - Invarianten-Register
          - Register der Identitätseinschränkungen
      2.5.2:
        text: 'Artefakte von Schicht 0 MUSS:'
        items:
          - Für alle Mitglieder öffentlich zugänglich sein
          - Versioniert sein
          - Durch einen formalen Ratifizierungsprozess angenommen werden
      2.5.3:
        text: Wenn Artefakte von Schicht 0 fehlen, mehrdeutig oder in sich widersprüchlich sind, MUSS die Gemeinschaft als nicht konform mit RCOS-Core betrachtet werden.
