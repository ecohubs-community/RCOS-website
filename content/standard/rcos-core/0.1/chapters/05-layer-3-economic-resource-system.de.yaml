lang: de
sourceHash: 'fe29e2f5'
title: 5. Schicht 3 — Wirtschafts- & Ressourcensystem
intro: |-
  Schicht 3 definiert, wie Wert, Ressourcen und Verpflichtungen innerhalb der Gemeinschaft fließen.  
  Sein Zweck ist es, wirtschaftliche Macht explizit, begrenzt, überprüfbar und der Governance untergeordnet zu machen — um versteckte Anhäufung, Abhängigkeit oder Zwang zu verhindern.
sections:
  '5.1':
    title: Gemeingüter vs. Privatressourcen
    blocks:
      5.1.1:
        text: Alle Ressourcen innerhalb des deklarierten Governance-Geltungsbereichs MÜSSEN explizit entweder als **Gemeingüter** oder als **privat** klassifiziert werden.
      5.1.2:
        text: 'Die Gemeinschaft MUSS ein einziges, explizites und versioniertes Register der verwalteten Ressourcen führen, das mindestens Folgendes enthält:'
        items:
          - 'Ressourcenname oder eindeutiger Bezeichner  '
          - 'Klassifikation (Gemeingut oder privat)  '
          - 'Verwalter:in oder Eigentümer:in (je nach Zutreffendem)  '
          - 'Zugangs- und Nutzungsregeln  '
          - Übertragungs-, Verkaufs- oder Privatisierungsbeschränkungen (falls vorhanden)
      5.1.3:
        text: Jede nicht explizit klassifizierte Ressource MUSS als **unklassifiziert** behandelt werden, und die Gemeinschaft DARF sie NICHT zuweisen, belasten, monetarisieren oder übertragen, bis die Klassifizierung durch eine autorisierte Entscheidung abgeschlossen ist.
      5.1.4:
        text: 'Für Gemeingüter MUSS die Gemeinschaft explizit Folgendes definieren:'
        items:
          - 'Verwaltungspflichten  '
          - 'Das autorisierte Entscheidungsgremium oder die zuständige Rolle  '
          - 'Instandhaltungspflichten  '
          - Finanzierungs- oder Beitragsmechanismen (falls vorhanden)
      5.1.5:
        text: Für Privatressourcen DARF die Gemeinschaft KEINE Autorität über das hinaus ausüben, was explizit im Geltungsbereich, in Mitgliedschaftsvereinbarungen oder anderen verwalteten Artefakten deklariert ist.
  '5.2':
    title: Beitragsanerkennung
    blocks:
      5.2.1:
        text: 'Die Gemeinschaft MUSS explizit definieren, welche Beitragskategorien anerkannt werden. Diese KÖNNEN unter anderem umfassen:'
        items:
          - 'Arbeit  '
          - 'Fürsorge- und emotionale Arbeit  '
          - 'Wissen und Bildung  '
          - 'Verwaltung und Instandhaltung  '
          - 'Administrative oder koordinierende Arbeit  '
      5.2.2:
        text: 'Die Gemeinschaft MUSS einen Mechanismus zur Beitragsanerkennung definieren, der festlegt:'
        items:
          - 'Was als Beitrag gilt  '
          - 'Wie Beiträge erfasst oder anerkannt werden  '
          - 'Wer Beiträge erfassen, validieren oder anfechten darf  '
          - 'Ob und wie die Beitragsanerkennung den Zugang zu Ressourcen, Privilegien oder Verpflichtungen beeinflusst  '
      5.2.3:
        text: Die Gemeinschaft DARF NICHT strukturell auf unbezahlte, unsichtbare oder informelle Arbeit für das Überleben des Systems angewiesen sein, ohne entsprechende Verpflichtungen, Anerkennung oder Kompensationsmechanismen explizit zu definieren.
      5.2.4:
        text: 'Falls interne Wirtschaftseinheiten verwendet werden (z. B. Zeitguthaben, Punkte, Token), MUSS das Interne Wirtschaftsprotokoll Folgendes definieren:'
        items:
          - 'Ausgaberegeln  '
          - 'Übertragbarkeitsregeln  '
          - 'Ablauf-, Verfall- oder Obergrenzen-Mechanismen (falls vorhanden)  '
          - 'Mechanismen zur Betrugsprävention, Streitbeilegung und Korrektur  '
          - 'Datenschutz- und Transparenzregeln für Kontostände und Transaktionen  '
      5.2.5:
        text: Beitragsanerkennung DARF KEINE implizite Entscheidungsbefugnis, kein Vetorecht oder keinen Governance-Einfluss schaffen, der über das in Schicht 2 Definierte hinausgeht.
  '5.3':
    title: Gemeinschaftskasse
    blocks:
      5.3.1:
        text: Die Gemeinschaft MUSS explizit definieren, welche Ressourcen in der gemeinsamen Kasse gehalten werden und wie die Grenzen der Kasse mit Privatressourcen zusammenwirken.
      5.3.2:
        text: Einkommensquellen und alle externen Einkommensschnittstellen MÜSSEN explizit definiert sein.
      5.3.3:
        text: 'Ausgabenbefugnis MUSS explizit begrenzt werden durch:'
        items:
          - 'Klare Zuständigkeitszuweisungen  '
          - 'Schwellenwerte nach Betrag und/oder Kategorie  '
          - 'Genehmigungs- und Eskalationswege  '
          - 'Verpflichtende Aufzeichnungspflichten  '
      5.3.4:
        text: Transparenz MUSS der Standard sein für Kassenstände, Einnahmen, Ausgaben, Verpflichtungen und Zusagen.
      5.3.5:
        text: Alle Ausnahmen von der Transparenz MÜSSEN explizit definiert, begründet und zeitlich begrenzt sein und DÜRFEN Mitglieder NICHT daran hindern, die Einhaltung der Regeln zu prüfen.
      5.3.6:
        text: 'Die Gemeinschaft MUSS Richtlinien für Rücklagen, Risiken und Haftung definieren, einschließlich:'
        items:
          - 'Verschuldungsgrenzen  '
          - 'Langfristige Verpflichtungen  '
          - Notfallrücklagen (falls vorhanden)
  '5.4':
    title: Akkumulationsbeschränkungen
    blocks:
      5.4.1:
        text: Interne Wirtschaftssysteme MÜSSEN eine unbegrenzte Konzentration von internem Einfluss oder Kontrolle durch Ressourcen, Guthaben oder finanzielle Verpflichtungen verhindern.
      5.4.2:
        text: 'Falls interne Einheiten existieren, MUSS die Gemeinschaft einen oder mehrere akkumulationsbegrenzende Mechanismen definieren, die Folgendes umfassen KÖNNEN:'
        items:
          - 'Obergrenzen  '
          - 'Verfall oder Ablauf  '
          - 'Nicht-Übertragbarkeit  '
          - 'Umverteilungs- oder Besteuerungsmechanismen  '
          - 'Zeitlich begrenzte Gültigkeit  '
      5.4.3:
        text: Wirtschaftsmechanismen DÜRFEN es Mitgliedern NICHT ermöglichen, die in Schicht 2 definierten Governance-Befugnisgrenzen zu umgehen — auch nicht durch den Kauf von Einfluss, das Schaffen von Abhängigkeiten oder die Umwandlung von wirtschaftlicher Macht in informelle Entscheidungsbefugnis.
      5.4.4:
        text: Die Gemeinschaft MUSS überprüfbare Indikatoren für das Risiko wirtschaftlicher Konzentration definieren sowie einen expliziten Mechanismus, um Beschränkungen anzupassen, wenn solche Risiken erkannt werden.
  '5.5':
    title: Artefakte
    blocks:
      5.5.1:
        text: 'Die folgenden Artefakte sind für die Konformität mit Schicht 3 verpflichtend:'
        items:
          - 'Internes Wirtschaftsprotokoll  '
          - 'Kassenregelwerk  '
      5.5.2:
        text: 'Artefakte von Schicht 3 MÜSSEN:'
        items:
          - 'Explizit und eindeutig sein  '
          - 'Versioniert sein  '
          - 'Für alle Mitglieder zugänglich sein (mit expliziten, begrenzten Ausnahmen)  '
          - 'Durch einen autorisierten Governance-Prozess verabschiedet werden  '
      5.5.3:
        text: 'Das Interne Wirtschaftsprotokoll MUSS mindestens Folgendes definieren:'
        items:
          - 'Beitragskategorien und Anerkennungsmechanismen  '
          - 'Grenzen zwischen Gemeingütern und Privatbesitz sowie Zuweisungsregeln  '
          - 'Interne Einheiten (falls vorhanden) und Akkumulationsbeschränkungen  '
          - 'Externe Einkommensschnittstellen (falls vorhanden)  '
          - 'Streitbeilegungs- und Korrekturmechanismen für wirtschaftliche Aufzeichnungen  '
      5.5.4:
        text: 'Das Kassenregelwerk MUSS mindestens Folgendes definieren:'
        items:
          - 'Einkommensquellen  '
          - 'Schwellenwerte und Genehmigungswege für Ausgabenbefugnis  '
          - 'Transparenz- und Berichtspflichten (einschließlich etwaiger begrenzter Ausnahmen)  '
          - 'Rücklagen-, Risiko- und Verschuldungsbeschränkungen  '
          - 'Interessenkonfliktregeln für Ausgaben und Beschaffung  '
  '5.6':
    title: Layer-Invarianten
    blocks:
      5.6.1:
        text: Geteilte Ressourcen, Flüsse und Verpflichtungen MÜSSEN standardmäßig für die Gemeinschaft sichtbar sein, mit nur begrenzten und expliziten Ausnahmen.
      5.6.2:
        text: Als Gemeingüter deklarierte Ressourcen DÜRFEN NICHT durch informelles, implizites oder einseitiges Handeln privatisiert werden.
      5.6.3:
        text: Beitragsanerkennung MUSS explizit sein, sodass unbezahlte oder unsichtbare Arbeit nicht strukturell für das Überleben des Systems erforderlich ist.
      5.6.4:
        text: Wirtschaftsmechanismen MÜSSEN eine unbegrenzte Konzentration von internem Einfluss verhindern.
  '5.7':
    title: Explizitätsregeln
    blocks:
      5.7.1:
        text: 'Folgendes MUSS explizit sein:'
        items:
          - 'Klassifikation als Gemeingut oder privat  '
          - 'Zuweisungs- und Zugangsregeln für geteilte Ressourcen  '
          - 'Grenzen der Ausgabenbefugnis  '
          - 'Transparenzregeln  '
          - 'Externe Einkommensschnittstellen  '
      5.7.2:
        text: 'Folgendes KANN explizit sein:'
        items:
          - 'Modelle zur Beitragsbewertung  '
          - 'Interne Einheiten (Token, Stunden, Punkte)  '
          - 'Budgetkategorien und interne Buchhaltungsstrukturen  '
      5.7.3:
        text: 'Folgendes MUSS optional und außerhalb des Geltungsbereichs bleiben:'
        items:
          - 'Einstellungen gegenüber Wohlstand  '
          - 'Gleiche vs. differenzierte Ergebnisse  '
          - Persönliche finanzielle Entscheidungen
