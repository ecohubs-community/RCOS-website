lang: es
sourceHash: '4111bb21'
title: 11. Versionado y gobernanza del estándar
intro: Este capítulo define cómo RCOS evoluciona como estándar.
sections:
  '11.1':
    title: Custodia del estándar
    blocks:
      11.1.1:
        text: RCOS DEBE tener un órgano o proceso de custodia identificable.
      11.1.2:
        text: 'Las responsabilidades del custodio DEBEN incluir:'
        items:
          - 'Mantener la especificación canónica  '
          - 'Gestionar las publicaciones de versiones  '
          - 'Curar materiales de referencia y aprendizaje  '
          - 'Proteger los invariantes de Capa 0 del propio estándar  '
      11.1.3:
        text: El custodio NO DEBE actuar como autoridad de cumplimiento sobre las comunidades.
      11.1.4:
        text: La custodia de RCOS DEBE priorizar la claridad, la estabilidad y los aprendizajes del mundo real por encima de la pureza ideológica.
  '11.2':
    title: Proceso de cambio
    blocks:
      11.2.1:
        text: Los cambios a RCOS-Core DEBEN seguir un proceso de cambio definido.
      11.2.2:
        text: 'El proceso de cambio DEBE incluir:'
        items:
          - 'Presentación de propuestas  '
          - 'Período público de revisión y comentarios  '
          - 'Mecanismo y autoridad de decisión  '
          - 'Versionado y publicación  '
      11.2.3:
        text: La compatibilidad hacia atrás DEBERÍA preservarse cuando sea posible.
      11.2.4:
        text: Los cambios incompatibles DEBEN estar claramente señalados y justificados.
      11.2.5:
        text: Las versiones reemplazadas de RCOS DEBEN permanecer accesibles públicamente.
      11.2.6:
        text: 'RCOS DEBE modelar los mismos principios que exige a las comunidades: explicitud, autoridad acotada, reversibilidad y aprendizaje.'
