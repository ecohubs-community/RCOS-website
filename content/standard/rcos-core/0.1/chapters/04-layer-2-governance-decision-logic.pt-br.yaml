lang: pt-br
sourceHash: '21857953'
title: 4. Camada 2 — Governança e Lógica de Decisão
intro: A Camada 2 define como as decisões coletivas são tomadas, quem está autorizado a tomá-las e como a autoridade é restringida. A governança no RCOS é projetada para tornar o poder explícito, delimitado, revisável e reversível.
sections:
  '4.1':
    title: Tipos de Decisão
    blocks:
      4.1.1:
        text: 'Todas as decisões coletivas DEVEM ser classificadas em exatamente um dos seguintes tipos de decisão:'
        items:
          - Decisões Operacionais
          - Decisões Estratégicas
          - Decisões Constitucionais
      4.1.2:
        text: Decisões Operacionais dizem respeito ao funcionamento e à execução do dia a dia dentro das regras existentes.
      4.1.3:
        text: Decisões Estratégicas dizem respeito à direção de longo prazo, à alocação de recursos significativos ou à criação/remoção de grandes estruturas.
      4.1.4:
        text: Decisões Constitucionais dizem respeito a mudanças nos invariantes da Camada 0, no propósito, no escopo ou no próprio sistema de governança.
      4.1.5:
        text: Se uma decisão não puder ser classificada com clareza, ela DEVE recair, por padrão, no tipo de decisão de maior impacto.
  '4.2':
    title: Mecanismos de Decisão
    blocks:
      4.2.1:
        text: Cada tipo de decisão DEVE ter um mecanismo de tomada de decisão explicitamente definido.
      4.2.2:
        text: 'Os mecanismos de decisão PODEM incluir, entre outros:'
        items:
          - Tomada de decisão por consentimento
          - Votação por maioria simples
          - Votação por maioria qualificada
          - Autoridade delegada
          - Atribuição aleatória ou rotativa
      4.2.3:
        text: 'Os mecanismos de decisão DEVEM especificar:'
        items:
          - Participantes elegíveis
          - Limiares de decisão
          - Condições de bloqueio ou veto, se houver
          - Restrições de tempo
      4.2.4:
        text: Nenhum mecanismo de decisão informal ou ad hoc PODE ser usado para decisões coletivas.
  '4.3':
    title: Limites de Autoridade
    blocks:
      4.3.1:
        text: Toda autoridade DEVE ser atribuída a papéis, círculos ou órgãos explicitamente definidos.
      4.3.2:
        text: 'As atribuições de autoridade DEVEM incluir:'
        items:
          - Escopo da autoridade
          - Limites da autoridade
          - Duração ou mandato, quando aplicável
      4.3.3:
        text: Nenhum indivíduo ou órgão PODE exercer autoridade fora do seu escopo explicitamente atribuído.
      4.3.4:
        text: A autoridade NÃO DEVE derivar de carisma, antiguidade, propriedade ou influência informal.
      4.3.5:
        text: A autoridade temporária ou de emergência DEVE ser explicitamente definida, limitada no tempo e sujeita a revisão.
  '4.4':
    title: Matriz de Decisão
    blocks:
      4.4.1:
        text: A comunidade DEVE manter uma Matriz de Decisão como artefato central de governança.
      4.4.2:
        text: 'A Matriz de Decisão DEVE mapear, no mínimo:'
        items:
          - Tipo de decisão
          - Domínio da decisão
          - Papel ou órgão autorizado
          - Mecanismo de decisão
          - Limiar de aprovação
          - Caminho de escalonamento
      4.4.3:
        text: A Matriz de Decisão DEVE estar publicamente acessível a todos os membros.
      4.4.4:
        text: Decisões tomadas fora da Matriz de Decisão DEVEM ser consideradas inválidas.
  '4.5':
    title: Protocolo de Governança
    blocks:
      4.5.1:
        text: A comunidade DEVE definir um Protocolo de Governança que descreva o ciclo de vida completo de uma decisão.
      4.5.2:
        text: 'O Protocolo de Governança DEVE incluir:'
        items:
          - Requisitos para submissão de propostas
          - Processo de análise e deliberação
          - Execução da decisão
          - Documentação e publicação
          - Mecanismos de recurso e revisão
      4.5.3:
        text: O Protocolo de Governança DEVE definir como os conflitos entre decisões são resolvidos.
      4.5.4:
        text: Todas as ações de governança DEVEM ser documentadas de acordo com as regras de documentação da Camada 5.
  '4.6':
    title: Salvaguardas e Modos de Falha
    blocks:
      4.6.1:
        text: 'O sistema de governança DEVE incluir salvaguardas contra:'
        items:
          - Concentração de poder de decisão
          - Vetos informais
          - Captura de decisões por subgrupos
          - Entrincheiramento de fundadores ou de papéis
      4.6.2:
        text: Os mecanismos de governança DEVEM permitir contestação e revisão sem retaliação.
      4.6.3:
        text: Falhas persistentes de governança DEVEM acionar uma revisão formal ou um processo constitucional.
  '4.7':
    title: Artefatos
    blocks:
      4.7.1:
        text: 'Os seguintes artefatos são obrigatórios para conformidade com a Camada 2:'
        items:
          - Matriz de Decisão
          - Protocolo de Governança
          - Registro de Autoridade
      4.7.2:
        text: 'Os artefatos da Camada 2 DEVEM ser:'
        items:
          - Explícitos e inequívocos
          - Versionados
          - Acessíveis a todos os membros
      4.7.3:
        text: A ausência, ambiguidade ou violação sistemática dos artefatos da Camada 2 DEVE resultar na perda da conformidade com o RCOS-Core.
