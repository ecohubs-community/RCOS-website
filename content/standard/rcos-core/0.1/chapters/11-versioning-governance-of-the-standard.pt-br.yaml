lang: pt-br
sourceHash: '4111bb21'
title: 11. Versionamento e Governança do Padrão
intro: Este capítulo define como o próprio RCOS evolui como padrão.
sections:
  '11.1':
    title: Curadoria do Padrão
    blocks:
      11.1.1:
        text: O RCOS DEVE ter um órgão ou processo de curadoria identificável.
      11.1.2:
        text: 'As responsabilidades do curador DEVEM incluir:'
        items:
          - Manter a especificação canônica
          - Gerenciar lançamentos de versões
          - Curar materiais de referência e aprendizagem
          - Proteger os invariantes da Camada 0 do próprio padrão
      11.1.3:
        text: O curador NÃO DEVE atuar como autoridade de fiscalização sobre as comunidades.
      11.1.4:
        text: A curadoria do RCOS DEVE priorizar clareza, estabilidade e aprendizados do mundo real em vez de pureza ideológica.
  '11.2':
    title: Processo de Mudança
    blocks:
      11.2.1:
        text: As mudanças no RCOS-Core DEVEM seguir um processo de mudança definido.
      11.2.2:
        text: 'O processo de mudança DEVE incluir:'
        items:
          - Submissão de propostas
          - Período público de revisão e feedback
          - Mecanismo e autoridade de decisão
          - Versionamento e publicação
      11.2.3:
        text: A compatibilidade retroativa DEVERIA ser preservada sempre que possível.
      11.2.4:
        text: Mudanças incompatíveis DEVEM ser claramente marcadas e justificadas.
      11.2.5:
        text: Versões substituídas do RCOS DEVEM permanecer publicamente acessíveis.
      11.2.6:
        text: 'O próprio RCOS DEVE modelar os mesmos princípios que exige das comunidades: explicitude, autoridade limitada, reversibilidade e aprendizagem.'
