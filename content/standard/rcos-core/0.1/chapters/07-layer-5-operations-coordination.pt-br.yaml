lang: pt-br
sourceHash: acbb2df6
title: 7. Camada 5 — Operações e Coordenação
intro: |-
  A Camada 5 define como o trabalho diário, a coordenação e o fluxo de informações funcionam na prática.  
  Seu propósito é garantir que as operações permaneçam legíveis, sustentáveis e transferíveis, e não desmoronem em hierarquia informal, dependência ou esgotamento.
sections:
  '7.1':
    title: Papéis e Responsabilidades
    blocks:
      7.1.1:
        text: Todas as responsabilidades contínuas DEVEM ser atribuídas a papéis explícitos e nomeados, em vez de expectativas implícitas ou acordos informais.
      7.1.2:
        text: 'A comunidade DEVE manter um **Registro de Papéis** que inclua, no mínimo:'
        items:
          - 'Nome e propósito do papel  '
          - 'Escopo de responsabilidade e autoridade decisória  '
          - 'Limites explícitos e interfaces com outros papéis, círculos ou domínios  '
          - 'Critérios de elegibilidade (se houver)  '
          - 'Duração do mandato, rotação ou condições de revisão (se houver)  '
          - 'Processo de nomeação, revisão e remoção  '
      7.1.3:
        text: 'Cada papel DEVE incluir um mecanismo explícito de prestação de contas que defina:'
        items:
          - 'Como o desempenho no papel é avaliado  '
          - 'Como o baixo desempenho, sobrecarga ou falha no papel é tratado  '
          - 'Como ocorrem a transição e a transferência de conhecimento  '
      7.1.4:
        text: Nenhuma responsabilidade contínua PODE existir sem um papel explícito, e nenhuma pessoa PODE ser responsabilizada por responsabilidades que não foram formalmente atribuídas a um papel.
      7.1.5:
        text: Responsabilidades temporárias ou pontuais DEVEM ter um prazo explícito e NÃO DEVEM se tornar contínuas sem a definição formal de um papel.
  '7.2':
    title: Sistema de Reuniões
    blocks:
      7.2.1:
        text: 'A comunidade DEVE definir tipos de reunião explícitos, suficientes para apoiar:'
        items:
          - 'Operações  '
          - 'Governança  '
          - 'Coordenação e alinhamento  '
          - 'Reflexão e aprendizado  '
          - Tratamento de conflitos (conforme exigido pela Camada 4)
      7.2.2:
        text: 'Cada tipo de reunião DEVE definir, no mínimo:'
        items:
          - 'Propósito e escopo decisório  '
          - 'Participantes obrigatórios versus opcionais  '
          - 'Limites de cadência e duração  '
          - 'Papel de facilitação e processo de seleção ou rotação  '
          - 'Estrutura da pauta  '
          - 'Requisitos de documentação e publicação  '
          - 'Requisitos de registro de decisões quando decisões são tomadas  '
      7.2.3:
        text: As reuniões NÃO DEVEM exceder seu escopo decisório declarado nem contornar os limites de autoridade definidos na Camada 2.
      7.2.4:
        text: A carga de reuniões DEVE ser limitada, monitorada e revisável, conforme definido na Seção 7.4.
  '7.3':
    title: Documentação e Fluxo de Informação
    blocks:
      7.3.1:
        text: A comunidade DEVE definir regras explícitas de documentação para decisões, papéis, operações e obrigações compartilhadas.
      7.3.2:
        text: 'As regras de documentação DEVEM especificar, no mínimo:'
        items:
          - 'Quais informações DEVEM ser registradas  '
          - 'Onde os registros são armazenados  '
          - 'Quem tem acesso a quais registros  '
          - 'Prazos de publicação ou notificação (se houver)  '
          - 'Limites de privacidade e condições para acesso restrito  '
      7.3.3:
        text: 'Todas as decisões DEVEM ser rastreáveis quanto a:'
        items:
          - 'Tipo de decisão e domínio  '
          - 'Papel ou órgão autorizado  '
          - 'Mecanismo decisório e limiar (threshold)  '
          - 'Resultado registrado e data de vigência  '
      7.3.4:
        text: Processos operacionais críticos DEVEM ser documentados de tal forma que a continuidade não dependa de conhecimento tácito mantido por indivíduos específicos.
      7.3.5:
        text: O fluxo de informação DEVE ser desenhado para evitar o controle de acesso (gatekeeping), gargalos ou dependência de intermediários informais.
  '7.4':
    title: Limites de Carga de Trabalho e Capacidade
    blocks:
      7.4.1:
        text: Tempo, atenção, capacidade de coordenação e trabalho emocional DEVEM ser tratados como recursos finitos e limitados.
      7.4.2:
        text: 'A comunidade DEVE definir limites explícitos de carga de trabalho, incluindo:'
        items:
          - 'Limites de carga de reuniões (frequência, duração ou tempo total)  '
          - 'Limites de carga de papéis (número de papéis, escopo ou horas esperadas)  '
          - 'Expectativas de tempo de resposta e disponibilidade (se houver)  '
          - 'Mecanismos de renegociação, alívio, substituição ou redistribuição  '
      7.4.3:
        text: Os limites de carga de trabalho DEVEM ser revisáveis e ajustáveis por meio de um processo de governança autorizado.
      7.4.4:
        text: Sobrecarga persistente, risco de esgotamento, não participação crônica ou dependência de indivíduos que assumem funções em excesso DEVEM acionar processos de revisão ou reparo, conforme definido na Camada 4.
  '7.5':
    title: Continuidade Operacional
    blocks:
      7.5.1:
        text: A comunidade DEVE garantir que nenhum indivíduo seja um ponto único de falha crítico para as operações centrais.
      7.5.2:
        text: 'Papéis e processos operacionais centrais DEVEM incluir:'
        items:
          - 'Procedimentos documentados  '
          - 'Mecanismos claros de transição  '
          - 'Arranjos de backup ou redundância sempre que viável  '
      7.5.3:
        text: O planejamento de continuidade operacional DEVE ser revisado periodicamente.
  '7.6':
    title: Artefatos
    blocks:
      7.6.1:
        text: 'Os seguintes artefatos são obrigatórios para a conformidade com a Camada 5:'
        items:
          - 'Manual de Operações  '
          - 'Registro de Papéis  '
          - 'Modelos de Reunião  '
      7.6.2:
        text: 'Os artefatos da Camada 5 DEVEM ser:'
        items:
          - 'Explícitos e inequívocos  '
          - 'Versionados  '
          - 'Acessíveis a todos os membros, com proteções de privacidade claramente delimitadas  '
          - 'Mantidos como documentos vivos, com responsabilidade e ciclos de revisão definidos  '
      7.6.3:
        text: 'O Manual de Operações DEVE definir, no mínimo:'
        items:
          - 'Os processos operacionais centrais dos quais a comunidade depende  '
          - 'Interfaces entre papéis, domínios e tipos de reunião  '
          - 'Locais de documentação e procedimentos de atualização  '
      7.6.4:
        text: 'Os Modelos de Reunião DEVEM definir, no mínimo:'
        items:
          - 'Estrutura da pauta  '
          - 'Formato das notas e dos registros  '
          - 'Formato de registro de decisões, quando aplicável  '
  '7.7':
    title: Invariantes da Camada
    blocks:
      7.7.1:
        text: Responsabilidades contínuas NÃO DEVEM existir sem um papel explícito.
      7.7.2:
        text: Processos operacionais críticos NÃO DEVEM depender exclusivamente da memória individual, da boa vontade ou da transmissão informal.
      7.7.3:
        text: A carga de reuniões, o ônus de coordenação e o trabalho não remunerado ou invisível DEVEM ser limitados e revisáveis.
      7.7.4:
        text: As regras de acesso à informação DEVEM ser explícitas e exequíveis.
  '7.8':
    title: Regras de Explicitude
    blocks:
      7.8.1:
        text: 'Os seguintes itens DEVEM ser explícitos:'
        items:
          - 'Papéis e responsabilidades  '
          - 'Limites e interfaces de autoridade operacional  '
          - 'Tipos de reunião e seus escopos  '
          - 'Regras de documentação de decisões  '
          - 'Limites de acesso à informação e de privacidade  '
      7.8.2:
        text: 'Os seguintes itens PODEM ser explícitos:'
        items:
          - 'Cadência detalhada de reuniões além das restrições mínimas  '
          - 'Escolhas de ferramentas para documentação e coordenação  '
          - 'Cronogramas de rotação ou sucessão de papéis  '
      7.8.3:
        text: 'Os seguintes itens DEVEM permanecer opcionais e fora do escopo:'
        items:
          - 'Estilos pessoais de trabalho  '
          - 'Preferências estéticas ou culturais  '
          - Coordenação social informal
