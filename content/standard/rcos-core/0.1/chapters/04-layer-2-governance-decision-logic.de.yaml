lang: de
sourceHash: 1d9dfee7
title: 4. Schicht 2 — Governance & Entscheidungslogik
intro: Schicht 2 definiert, wie kollektive Entscheidungen getroffen werden, wer befugt ist, sie zu treffen, und wie Autorität begrenzt wird. Governance unter RCOS ist so gestaltet, dass Macht explizit, begrenzt, überprüfbar und reversibel ist.
sections:
  '4.1':
    title: Entscheidungstypen
    blocks:
      4.1.1:
        text: 'Alle kollektiven Entscheidungen MUSS in genau einen der folgenden Entscheidungstypen eingeordnet werden:'
        items:
          - Operative Entscheidungen
          - Strategische Entscheidungen
          - Konstitutionelle Entscheidungen
      4.1.2:
        text: Operative Entscheidungen betreffen den täglichen Betrieb und die Ausführung innerhalb bestehender Regeln.
      4.1.3:
        text: Strategische Entscheidungen betreffen die langfristige Ausrichtung, die Zuweisung bedeutender Ressourcen oder die Schaffung/Abschaffung wesentlicher Strukturen.
      4.1.4:
        text: Konstitutionelle Entscheidungen betreffen Änderungen an den Invarianten von Schicht 0, dem Zweck, dem Geltungsbereich oder dem Governance-System selbst.
      4.1.5:
        text: Wenn eine Entscheidung nicht eindeutig zugeordnet werden kann, MUSS sie standardmäßig dem Entscheidungstyp mit höherer Auswirkung zugeordnet werden.
  '4.2':
    title: Entscheidungsmechanismen
    blocks:
      4.2.1:
        text: Für jeden Entscheidungstyp MUSS ein explizit definierter Entscheidungsmechanismus festgelegt sein.
      4.2.2:
        text: 'Entscheidungsmechanismen KANN unter anderem folgende umfassen:'
        items:
          - Konsent-basierte Entscheidungsfindung
          - Mehrheitsentscheid
          - Qualifizierte Mehrheit
          - Delegierte Autorität
          - Zufällige oder rotierende Zuweisung
      4.2.3:
        text: 'Entscheidungsmechanismen MUSS festlegen:'
        items:
          - Teilnahmeberechtigte Personen
          - Entscheidungsschwellen
          - Blockade- oder Vetobedingungen, falls vorhanden
          - Zeitliche Beschränkungen
      4.2.4:
        text: Kein informeller oder ad-hoc-Entscheidungsmechanismus KANN für kollektive Entscheidungen verwendet werden.
  '4.3':
    title: Autoritätsgrenzen
    blocks:
      4.3.1:
        text: Alle Autorität MUSS explizit definierten Rollen, Kreisen oder Gremien zugewiesen werden.
      4.3.2:
        text: 'Autoritätszuweisungen MUSS beinhalten:'
        items:
          - Umfang der Autorität
          - Grenzen der Autorität
          - Dauer oder Amtszeit, falls zutreffend
      4.3.3:
        text: Keine Person oder kein Gremium KANN Autorität außerhalb des explizit zugewiesenen Bereichs ausüben.
      4.3.4:
        text: Autorität DARF NICHT aus Charisma, Dienstalter, Eigentum oder informellem Einfluss abgeleitet werden.
      4.3.5:
        text: Temporäre oder Notfall-Autorität MUSS explizit definiert, zeitlich begrenzt und einer Überprüfung unterzogen werden.
  '4.4':
    title: Entscheidungsmatrix
    blocks:
      4.4.1:
        text: Die Gemeinschaft MUSS eine Entscheidungsmatrix als zentrales Governance-Artefakt pflegen.
      4.4.2:
        text: 'Die Entscheidungsmatrix MUSS mindestens folgendes abbilden:'
        items:
          - Entscheidungstyp
          - Entscheidungsdomäne
          - Autorisierte Rolle oder Gremium
          - Entscheidungsmechanismus
          - Zustimmungsschwelle
          - Eskalationspfad
      4.4.3:
        text: Die Entscheidungsmatrix MUSS für alle Mitglieder öffentlich zugänglich sein.
      4.4.4:
        text: Entscheidungen, die außerhalb der Entscheidungsmatrix getroffen werden, MUSS als ungültig betrachtet werden.
  '4.5':
    title: Governance-Protokoll
    blocks:
      4.5.1:
        text: Die Gemeinschaft MUSS ein Governance-Protokoll definieren, das den vollständigen Lebenszyklus einer Entscheidung beschreibt.
      4.5.2:
        text: 'Das Governance-Protokoll MUSS beinhalten:'
        items:
          - Anforderungen an die Einreichung von Vorschlägen
          - Prüfungs- und Beratungsprozess
          - Umsetzung der Entscheidung
          - Dokumentation und Veröffentlichung
          - Einspruchs- und Überprüfungsmechanismen
      4.5.3:
        text: Das Governance-Protokoll MUSS festlegen, wie Konflikte zwischen Entscheidungen gelöst werden.
      4.5.4:
        text: Alle Governance-Handlungen MUSS gemäß den Dokumentationsregeln von Schicht 5 dokumentiert werden.
  '4.6':
    title: Sicherungsmechanismen und Fehlermodi
    blocks:
      4.6.1:
        text: 'Das Governance-System MUSS Sicherungsmechanismen gegen folgendes enthalten:'
        items:
          - Konzentration von Entscheidungsmacht
          - Informelle Vetos
          - Vereinnahmung von Entscheidungen durch Untergruppen
          - Verfestigung von Gründer- oder Rollenpositionen
      4.6.2:
        text: Governance-Mechanismen MUSS Anfechtung und Überprüfung ohne Vergeltungsmaßnahmen ermöglichen.
      4.6.3:
        text: Anhaltende Governance-Versagen MUSS eine formelle Überprüfung oder einen konstitutionellen Prozess auslösen.
  '4.7':
    title: Artefakte
    blocks:
      4.7.1:
        text: 'Die folgenden Artefakte sind für die Layer-2-Konformität verpflichtend:'
        items:
          - Entscheidungsmatrix
          - Governance-Protokoll
          - Autoritätsregister
      4.7.2:
        text: 'Layer-2-Artefakte MUSS:'
        items:
          - Explizit und eindeutig sein
          - Versioniert sein
          - Für alle Mitglieder zugänglich sein
      4.7.3:
        text: Das Fehlen, die Mehrdeutigkeit oder die systematische Verletzung von Layer-2-Artefakten MUSS zum Verlust der RCOS-Core-Konformität führen.
