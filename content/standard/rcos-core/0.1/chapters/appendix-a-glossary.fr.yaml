lang: fr
sourceHash: '6fc3cf8c'
title: Annexe A — Glossaire
intro: |-
  Ce glossaire fournit des **définitions informatives** pour les termes clés utilisés dans l'ensemble de la spécification RCOS.  
  Les entrées du glossaire n'introduisent pas de nouvelles exigences et ne remplacent pas les sections normatives.
terms:
  accountability:
    term: Redevabilité (Accountability)
    definition: L'attente que les rôles et les membres puissent être invités à expliquer leurs actions, résultats et conformité aux règles convenues, avec des mécanismes définis de revue et de correction.
  accountability-protocol:
    term: Protocole de redevabilité
    definition: Un artéfact définissant comment les violations, préjudices ou manquements répétés sont examinés, documentés et traités, y compris la procédure régulière, les garanties et les voies d'escalade.
  artifact:
    term: Artéfact
    definition: Un objet documenté et versionné (par ex. protocole, registre, charte) adopté par un processus autorisé et utilisé pour opérationnaliser les couches RCOS.
    aliases:
      - artéfacts
  authority-boundary:
    term: Limite d'autorité
    definition: Les limites explicites dans lesquelles un rôle, un cercle ou un organe peut prendre des décisions ou agir.
    aliases:
      - limites d'autorité
  change-protocol:
    term: Protocole de changement
    definition: Un artéfact définissant comment les changements sont proposés, examinés, adoptés, publiés et annulés, y compris la classification des types de décision et les dispositions d'urgence.
  commons:
    term: Communs
    definition: Ressources gouvernées collectivement selon des règles explicites d'intendance, d'accès et de décision.
  community:
    term: Communauté
    definition: Un groupe de personnes qui se coordonnent volontairement autour d'un objectif partagé, dans un périmètre défini et un système de gouvernance.
  compliance:
    term: Conformité
    definition: L'état de satisfaction de toutes les exigences obligatoires de RCOS-Core à travers les Couches 0 à 6.
  conflict-resolution-ladder:
    term: Échelle de résolution des conflits
    definition: Un processus de conflit par étapes définissant les étapes minimales de résolution et les seuils d'escalade, allant de la réparation de faible intensité à la revue de gouvernance et, si nécessaire, à la séparation.
  constitutional-decision:
    term: Décision constitutionnelle
    definition: Une décision qui modifie l'objectif, le périmètre, les invariants ou les contraintes d'identité de la Couche 0, ou le système de gouvernance lui-même.
    aliases:
      - décisions constitutionnelles
  decision-matrix:
    term: Matrice de décision
    definition: Un artéfact de gouvernance associant les types et domaines de décision aux rôles autorisés, mécanismes, seuils et voies d'escalade.
  decision-type:
    term: Type de décision
    definition: Une classification des décisions (opérationnelle, stratégique, constitutionnelle) utilisée pour déterminer l'autorité et le processus.
    aliases:
      - types de décision
  due-process:
    term: Procédure régulière (Due Process)
    definition: Les garanties minimales d'équité requises avant de restreindre des droits, d'appliquer des sanctions ou de déclencher une séparation, y compris les voies de notification, de revue et d'appel telles que définies.
  emergency-change:
    term: Changement d'urgence
    definition: Un changement limité dans le temps, adopté dans des conditions d'urgence explicitement définies, nécessitant une revue a posteriori et une ratification ou une annulation.
    aliases:
      - changements d'urgence
  explicit:
    term: Explicite
    definition: |-
      Écrit, adopté, accessible et vérifiable.  
      Tout ce qui n'est pas explicite est considéré comme inexistant sous RCOS.
  explicitness-rule:
    term: Règle d'explicité
    definition: Le principe selon lequel les mécanismes attribuant le pouvoir, le risque, la responsabilité ou les conditions de sortie DOIVENT être écrits, adoptés et vérifiables.
  experiment:
    term: Expérimentation
    definition: Un changement limité dans le temps, réversible, adopté à des fins d'apprentissage et d'évaluation.
    aliases:
      - expérimentations
  exit-separation-protocol:
    term: Protocole de sortie et de séparation
    definition: Un artéfact définissant la sortie volontaire, la procédure régulière de sortie forcée, et la séparation des actifs, rôles, accès et obligations.
  governance-protocol:
    term: Protocole de gouvernance
    definition: Un artéfact définissant le cycle de vie des décisions (proposition, délibération, adoption, documentation, revue) et la manière dont les conflits de gouvernance sont résolus.
  in-scope-out-of-scope:
    term: Dans le périmètre / Hors périmètre
    definition: Dans le périmètre désigne les personnes, actifs, domaines et activités explicitement gouvernés par la communauté. Hors périmètre désigne tout ce qui est explicitement exclu ou non déclaré dans le périmètre.
  internal-economy-protocol:
    term: Protocole d'économie interne
    definition: Un artéfact définissant la reconnaissance des contributions et tout mécanisme d'échange interne, y compris les contraintes d'accumulation et la correction des litiges.
  invariant:
    term: Invariant
    definition: Une contrainte non négociable qui ne PEUT pas être outrepassée tant qu'elle est en vigueur.
    aliases:
      - invariants
  layer:
    term: Couche
    definition: Un domaine fonctionnel de RCOS qui définit un aspect spécifique du fonctionnement de la communauté.
  learning-log:
    term: Journal d'apprentissage
    definition: Un artéfact consignant les échecs majeurs, adaptations, retours en arrière et leçons tirées, y compris les déclencheurs, les artéfacts affectés et les résultats.
  member:
    term: Membre
    definition: Une personne qui a explicitement intégré la communauté par le processus d'adhésion défini.
  optional-module:
    term: Module optionnel
    definition: Une extension spécifique à un domaine qui s'appuie sur RCOS-Core sans modifier ses couches obligatoires.
    aliases:
      - modules optionnels
  registry:
    term: Registre
    definition: Un artéfact qui enregistre un ensemble d'entrées faisant autorité (par ex. rôles, ressources, statuts d'adhésion) avec une propriété claire, des règles de mise à jour et un historique de versions.
    aliases:
      - registres
  reference-implementation:
    term: Implémentation de référence
    definition: Une communauté réelle qui documente publiquement son application de RCOS-Core.
    aliases:
      - implémentations de référence
  role:
    term: Rôle
    definition: Un ensemble explicitement défini de responsabilités, d'autorité et de redevabilité, indépendant de la personne qui l'occupe.
  safety-critical:
    term: Critique pour la sécurité
    definition: Une situation dans laquelle la sécurité physique, psychologique ou celle des enfants est en danger, nécessitant des garanties renforcées et potentiellement une action protectrice immédiate.
    aliases:
      - critiques pour la sécurité
  sanction:
    term: Sanction
    definition: Une restriction ou action corrective définie et documentée, appliquée par un processus autorisé, proportionnée à une violation et soumise à revue.
    aliases:
      - sanctions
  scope:
    term: Périmètre
    definition: Les domaines, actifs et activités explicitement déclarés sur lesquels la communauté exerce son autorité.
    aliases:
      - périmètres
  stewardship:
    term: Intendance
    definition: La responsabilité du soin, de la maintenance et de la gouvernance d'une ressource dans des limites définies.
  treasury:
    term: Trésorerie
    definition: L'ensemble des ressources partagées, soldes, obligations et engagements détenus selon des règles collectives.
  treasury-ruleset:
    term: Règles de trésorerie
    definition: Un artéfact définissant comment les ressources de la trésorerie sont détenues, dépensées, rapportées, auditées et encadrées, y compris les seuils et les règles de conflit d'intérêts.
  transparency-exception:
    term: Exception de transparence
    definition: Une limitation explicitement définie, justifiée et limitée dans le temps de l'accès à l'information, qui permet néanmoins l'audit de conformité.
    aliases:
      - exceptions de transparence
  version-history:
    term: Historique de versions
    definition: Un artéfact enregistrant quelle version est en vigueur et documentant les changements adoptés, les dates d'entrée en vigueur et les références de décision.
