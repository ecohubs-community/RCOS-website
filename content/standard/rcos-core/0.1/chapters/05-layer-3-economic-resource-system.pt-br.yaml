lang: pt-br
sourceHash: 83b0e832
title: 5. Camada 3 — Sistema Econômico e de Recursos
intro: |-
  A Camada 3 define como valor, recursos e obrigações fluem dentro da comunidade.  
  Seu propósito é tornar o poder econômico explícito, limitado, revisável e subordinado à governança, prevenindo acumulação oculta, dependência ou coerção.
sections:
  '5.1':
    title: Recursos Comuns vs Privados
    blocks:
      5.1.1:
        text: Todos os recursos dentro do escopo governado declarado DEVEM ser explicitamente classificados como **comuns** ou **privados**.
      5.1.2:
        text: 'A comunidade DEVE manter um registro único, explícito e versionado dos recursos governados, incluindo no mínimo:'
        items:
          - 'Nome do recurso ou identificador único  '
          - 'Classificação (comum ou privado)  '
          - 'Administrador ou proprietário (conforme aplicável)  '
          - 'Regras de acesso e uso  '
          - Restrições de transferência, venda ou privatização (se houver)
      5.1.3:
        text: Qualquer recurso não classificado explicitamente DEVE ser tratado como **não classificado**, e a comunidade NÃO DEVE alocá-lo, onerá-lo, monetizá-lo ou transferi-lo até que a classificação seja concluída por meio de uma decisão autorizada.
      5.1.4:
        text: 'Para recursos comuns, a comunidade DEVE definir explicitamente:'
        items:
          - 'Responsabilidades de administração  '
          - 'O órgão ou papel de tomada de decisão autorizado  '
          - 'Obrigações de manutenção  '
          - Mecanismos de financiamento ou contribuição (se houver)
      5.1.5:
        text: Para recursos privados, a comunidade NÃO DEVE exercer autoridade além do que está explicitamente declarado no escopo, nos acordos de associação ou em outros artefatos governados.
  '5.2':
    title: Reconhecimento de Contribuições
    blocks:
      5.2.1:
        text: 'A comunidade DEVE definir explicitamente quais categorias de contribuição são reconhecidas. Estas PODEM incluir, mas não se limitam a:'
        items:
          - 'Trabalho  '
          - 'Cuidado e trabalho emocional  '
          - 'Conhecimento e educação  '
          - 'Administração e manutenção  '
          - 'Trabalho administrativo ou de coordenação  '
      5.2.2:
        text: 'A comunidade DEVE definir um mecanismo de reconhecimento de contribuições especificando:'
        items:
          - 'O que se qualifica como contribuição  '
          - 'Como as contribuições são registradas ou reconhecidas  '
          - 'Quem PODE registrar, validar ou contestar contribuições  '
          - 'Se e como o reconhecimento de contribuições afeta o acesso a recursos, privilégios ou obrigações  '
      5.2.3:
        text: A comunidade NÃO DEVE depender estruturalmente de trabalho não pago, invisível ou informal para a sobrevivência do sistema sem definir explicitamente as obrigações correspondentes, o reconhecimento ou os mecanismos de compensação.
      5.2.4:
        text: 'Se forem usadas unidades econômicas internas (ex.: créditos de tempo, pontos, tokens), o Protocolo de Economia Interna DEVE definir:'
        items:
          - 'Regras de emissão  '
          - 'Regras de transferibilidade  '
          - 'Mecanismos de expiração, decaimento ou limite máximo (se houver)  '
          - 'Prevenção de fraude, tratamento de disputas e mecanismos de correção  '
          - 'Regras de privacidade e transparência para saldos e transações  '
      5.2.5:
        text: O reconhecimento de contribuições NÃO DEVE criar autoridade decisória implícita, poder de veto ou influência sobre a governança além do que está definido na Camada 2.
  '5.3':
    title: Gestão da Tesouraria
    blocks:
      5.3.1:
        text: A comunidade DEVE definir explicitamente quais recursos são mantidos na tesouraria compartilhada e como as fronteiras da tesouraria se conectam com os recursos privados.
      5.3.2:
        text: As fontes de receita e quaisquer interfaces externas de receita DEVEM ser explicitamente definidas.
      5.3.3:
        text: 'A autoridade de gastos DEVE ser explicitamente limitada por meio de:'
        items:
          - 'Atribuições claras de autoridade  '
          - 'Limites por valor e/ou categoria  '
          - 'Caminhos de aprovação e escalonamento  '
          - 'Requisitos obrigatórios de registro  '
      5.3.4:
        text: A transparência DEVE ser o padrão para saldos da tesouraria, entradas, saídas, obrigações e compromissos.
      5.3.5:
        text: Quaisquer exceções à transparência DEVEM ser explicitamente definidas, justificadas, limitadas no tempo, e NÃO DEVEM impedir que membros auditem a conformidade.
      5.3.6:
        text: 'A comunidade DEVE definir políticas de reserva, risco e responsabilidade, incluindo:'
        items:
          - 'Limites de endividamento  '
          - 'Obrigações de longo prazo  '
          - Reservas de contingência (se houver)
  '5.4':
    title: Restrições de Acumulação
    blocks:
      5.4.1:
        text: Sistemas econômicos internos DEVEM impedir a concentração ilimitada de influência ou controle interno por meio de recursos, créditos ou obrigações financeiras.
      5.4.2:
        text: 'Se existirem unidades internas, a comunidade DEVE definir um ou mais mecanismos limitadores de acumulação, que PODEM incluir:'
        items:
          - 'Limites máximos  '
          - 'Decaimento ou expiração  '
          - 'Não transferibilidade  '
          - 'Mecanismos de redistribuição ou taxação  '
          - 'Validade limitada no tempo  '
      5.4.3:
        text: Mecanismos econômicos NÃO DEVEM permitir que membros contornem as fronteiras de autoridade de governança definidas na Camada 2, inclusive por meio da compra de influência, da criação de dependência ou da conversão de poder econômico em autoridade decisória informal.
      5.4.4:
        text: A comunidade DEVE definir indicadores revisáveis de risco de concentração econômica e um mecanismo explícito para ajustar as restrições quando tais riscos forem detectados.
  '5.5':
    title: Artefatos
    blocks:
      5.5.1:
        text: 'Os seguintes artefatos são obrigatórios para a conformidade com a Camada 3:'
        items:
          - 'Protocolo de Economia Interna  '
          - 'Conjunto de Regras da Tesouraria  '
      5.5.2:
        text: 'Os artefatos da Camada 3 DEVEM ser:'
        items:
          - 'Explícitos e inequívocos  '
          - 'Versionados  '
          - 'Acessíveis a todos os membros (com exceções explícitas e limitadas)  '
          - 'Adotados por meio de um processo de governança autorizado  '
      5.5.3:
        text: 'O Protocolo de Economia Interna DEVE definir, no mínimo:'
        items:
          - 'Categorias de contribuição e mecanismos de reconhecimento  '
          - 'Fronteiras entre comuns e privados e regras de alocação  '
          - 'Unidades internas (se houver) e restrições de acumulação  '
          - 'Interfaces externas de receita (se houver)  '
          - 'Resolução de disputas e mecanismos de correção para registros econômicos  '
      5.5.4:
        text: 'O Conjunto de Regras da Tesouraria DEVE definir, no mínimo:'
        items:
          - 'Fontes de receita  '
          - 'Limites de autoridade de gastos e caminhos de aprovação  '
          - 'Requisitos de transparência e prestação de contas (incluindo quaisquer exceções limitadas)  '
          - 'Restrições de reserva, risco e endividamento  '
          - 'Regras de conflito de interesse para gastos e aquisições  '
  '5.6':
    title: Invariantes da Camada
    blocks:
      5.6.1:
        text: Recursos compartilhados, fluxos e obrigações DEVEM ser visíveis para a comunidade por padrão, com apenas exceções limitadas e explícitas.
      5.6.2:
        text: Recursos declarados como comuns NÃO DEVEM ser privatizados por meio de ação informal, implícita ou unilateral.
      5.6.3:
        text: O reconhecimento de contribuições DEVE ser explícito, de modo que o trabalho não pago ou invisível não seja estruturalmente exigido para a sobrevivência do sistema.
      5.6.4:
        text: Mecanismos econômicos DEVEM impedir a concentração indefinida de influência interna.
  '5.7':
    title: Regras de Explicitude
    blocks:
      5.7.1:
        text: 'O seguinte DEVE ser explícito:'
        items:
          - 'Classificações entre comuns e privados  '
          - 'Regras de alocação e acesso para recursos compartilhados  '
          - 'Limites de autoridade de gastos  '
          - 'Regras de transparência  '
          - 'Interfaces externas de receita  '
      5.7.2:
        text: 'O seguinte PODE ser explícito:'
        items:
          - 'Modelos de valoração de contribuições  '
          - 'Unidades internas (tokens, horas, pontos)  '
          - 'Categorias orçamentárias e estruturas internas de contabilidade  '
      5.7.3:
        text: 'O seguinte DEVE permanecer opcional e fora do escopo:'
        items:
          - 'Atitudes em relação à riqueza  '
          - 'Resultados iguais vs diferenciados  '
          - Escolhas financeiras pessoais
